function startJob(vw, vh) {
  updateBasis();
  const terrain = isTerrain(), plane = isPlane();
  job.active = true; job.terrain = terrain; job.plane = plane; job.ms = 0;
  job.flat = plane;
  // An IFS whose dimension is close to 3 has to be drawn as a solid or it integrates to a
  // block: every ray through it meets material, so an emissive sum over the whole cut hides
  // the holes that are the object. The depth prepass keeps the front layer only; see `prepass`
  // in finishJob. Opt in per object, because a thin attractor wants the sum.
  job.solid = !!PRESETS[cfg.preset].solid;
  // How much of one turn of the colour ramp a plane cell may span before it is worth
  // splitting. Under this, splitting cannot change a pixel's colour.
  job.spanTol = 0.05;
  job.msCap = 1e9;
  job.wSurf = 6.0;
  job.vw = vw; job.vh = vh;
  job.R.set(basis.R);
  // BUILD FOR WHERE THE CAMERA WILL BE, not for where it is.
  //
  // A cut takes `buildLead` seconds of 5 ms slices to finish, and the camera does not wait.
  // On the way down that makes the cut land slightly too coarse, which is invisible: measured
  // 0.08 e-folds of drift on the plane objects, an 8 percent scale error. On the way OUT it is
  // not invisible at all, because a stale cut UNDER covers the frame instead of over covering
  // it: at two and a half times the descent rate the frame grew 7 times linearly while a cut
  // was being built, the reprojection shrank the cut to two percent of the frame area, and 126
  // of 900 frames came back dark with every splat still being drawn. Predicting the distance
  // costs nothing and fixes both directions at once.
  //
  // The predicted frame is recorded in job.out as well, so `reprojection` corrects from IT to
  // the true camera and what is drawn is exactly right. Only the refinement decisions and the
  // culling see the future. The camera position for a different distance needs no new
  // geometry: it is on the ray from the aim through the eye, so it is a lerp from the target.
  const dP = cam.dist * Math.exp(zoomRate * buildLead);
  const kP = dP / cam.dist;
  job.dist = dP; job.invD = 1 / dP;
  job.pos[0] = cam.target[0] + (basis.pos[0] - cam.target[0]) * kP;
  job.pos[1] = cam.target[1] + (basis.pos[1] - cam.target[1]) * kP;
  job.pos[2] = cam.target[2] + (basis.pos[2] - cam.target[2]) * kP;
  job.focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  lastFocal = job.focal;
  // Cull against a slightly wider frustum than we draw, so a cut that is a few
  // frames old still covers the edges of the frame.
  job.tanY = Math.tan(0.5 * cam.fov) * 1.12;
  job.tanX = job.tanY * vw / vh;
  job.nrmX = 1 / Math.sqrt(1 + job.tanX * job.tanX);
  job.nrmY = 1 / Math.sqrt(1 + job.tanY * job.tanY);
  job.K = suppR;
  // Depth of field, in units of the camera distance. Beyond this the fog term in
  // the shader has attenuated a splat to under a thousandth, so refining it is
  // wasted budget. Deep inside a dense attractor this is what keeps the descent
  // alive: the camera is surrounded by the whole coarse structure, which resolves
  // to tens of thousands of small splats and would otherwise consume the entire
  // budget while the corridor under the camera never descends at all.
  job.zFar = 1 + ZF_MUL * 8 / Math.max(cfg.fog, 0.02);
  job.fogK = cfg.fog;            // the shader's own attenuation rate, see `place`
  job.f32 = cfg.precision === 'f32';
  // The tier's share of the preset's budget, not the preset's budget. See perfBudget: the
  // preset says what the object wants and the governor says what the machine can hold, and
  // keeping the two separate is what lets the slider go on reading the object's own number.
  job.cap = Math.min(perfBudget(), MAXBUDGET);
  // THE SPLIT THRESHOLD SHARPENS WHEN THE CAMERA STOPS, which the plane objects have had through
  // their latency ceiling since the tenth pass and the three dimensional ones had not at all.
  //
  // The review of the flat objects was "when I stop it is still not sharp", and the answer there
  // was that the ceiling on how long a cut may take is only there to bound how long the camera
  // waits, so a camera that is not moving should not be paying it. The same argument applies word
  // for word to the split threshold, which is the OTHER thing a moving camera cannot afford: a
  // finer threshold is more splats, more splats is a longer rebuild, and a longer rebuild during
  // a descent means the cut on screen is always the stale one. Standing still, none of that is
  // true and the budget is the only thing that should bind.
  //
  // Halved over the stillness ramp, which is a factor of four in cell count, and the budget
  // threshold rations whatever is left over with its own dissolve, so an object that cannot
  // afford the finer threshold degrades into the same smooth level set it already degrades into
  // and never into a hard cutoff. A descent is untouched: stillCuts is zero the moment anything
  // moves. Not applied to the plane objects, whose refinement is bounded by the ramp on the
  // LATENCY ceiling instead, and moving both at once would just double count.
  const stillPx = (isPlane() || stillCuts <= 0) ? 1
    : 1 - 0.5 * Math.min(1, stillCuts / 4);
  // And the Gaussian view coarsens outright, which overrides the sharpening: the point of it is
  // splats you can see. See GAUSS_PX.
  // The plane objects get their own absolute size in this mode, and their split test becomes a
  // size test; see GAUSS_PX_PLANE in src/40_state.js for the measurement and the reason.
  job.splitPx = cfg.gauss ? (plane ? GAUSS_PX_PLANE : GAUSS_PX)
    : cfg.splitPx * stillPx;
  job.sig = cfg.sigma;
  // No splat may stay large on screen, however little light reaches it.
  //
  // Splitting on visible error alone, which is footprint times attenuation, correctly
  // stops refining a node the fog has already thrown away. The side effect was
  // measured and it is severe: on a descended folded dragon ELEVEN splats owned 44
  // percent of the drawn screen area while carrying 0.1 percent of the light, the
  // largest 167 px across. Each is a huge faint wash over the background, and when one
  // splits or leaves the frustum, half the background changes at once. That is the
  // "flickering in the background, black and back" from the review, and the flicker is
  // invisible in the whole frame mean because the light involved is negligible: only
  // the AREA is large.
  //
  // So floor the attenuation at splitPx/SIZE_CAP. Priority then never falls below
  // fp*splitPx/SIZE_CAP, which passes splitPx exactly when fp passes SIZE_CAP, so an
  // oversized node always splits and the ordering among visible nodes is untouched.
  // It is self limiting: each split halves the footprint, so a giant costs about
  // SIZE_CAP^2/splitPx^2 extra splats once and then sits at the threshold.
  job.attFloor = job.splitPx / (cfg.gauss ? GAUSS_CAP : SIZE_CAP);
  // The cut wide priority floor. Keyed on everything that changes what a full budget MEANS, so a
  // change of object, window or tier starts the controller again instead of inheriting a number
  // that was about a different question.
  bFloorReset(cfg.preset + '|' + job.cap + '|' + vw + 'x' + vh + '|' + (cfg.gauss ? 'g' : '-'));
  job.bFloor = bFloor; job.bRaw = 0;
  // The exposure the weights are scaled by. A branch weight at depth 45 of an
  // eight map IFS is 8^-45, which is under the smallest normal Float32, so the
  // instance buffer cannot carry a raw weight and a separate gain. Baking a
  // reference exposure keeps what is uploaded order one; `reprojection` then
  // corrects only the ratio to the current camera, which is near one always.
  job.norm = measureNormAt(dP);
  job.nf = 0; job.nn = 0; job.q = 0; job.cutSize = 1; job.np = 1; job.nEmit = 0;
  job.dmin = 1 << 30; job.dmax = 0; job.visited = 0; job.culled = 0;
  job.sumW = 0; job.sumWvis = 0; job.evals = 0; job.iters = 0;
  job.hCount = 0; job.over = false;
  // Every plane splat is at y = 0, so this is the y they all share once the position is made
  // camera relative and scaled. Computed here, once, instead of stored 500 000 times.
  job.planeY = (0 - job.pos[1]) * job.invD;
  job.out.pos.set(job.pos); job.out.R.set(basis.R); job.out.dist = dP;
  job.out.Rq.set([1, 0, 0, 0, 1, 0, 0, 0, 1]); job.out.sSince = 1;
  if (terrain) hHist.fill(0);
  job.levelReady = false;
  if (instances.length < job.cap * FLOATS) instances = new Float32Array(job.cap * FLOATS);
  if (plane) planeRoot(vw, vh); else if (terrain) terrRoot(vw, vh); else ifsRoot(vw, vh);
}

/* --------------------------- shared projection --------------------------- */
// Project a node centre that is already camera relative and scaled, cull it
// against the frustum and the depth of field, and record its footprint. Returns
// false when the node is out of the frame. Written once and called from both
// kernels; the IFS kernel keeps its own inlined copy in the inner loop because
// it runs a hundred times more often.
function place(n, dx, dy, dz, rad) {
  const R = job.R;
  const ex = R[0] * dx + R[1] * dy + R[2] * dz;
  const ey = R[3] * dx + R[4] * dy + R[5] * dz;
  const ez = -(R[6] * dx + R[7] * dy + R[8] * dz);
  const rr = job.K * rad;
  if (ez + rr < 1e-4 || ez - rr > job.zFar ||
      (Math.abs(ex) - ez * job.tanX) * job.nrmX > rr ||
      (Math.abs(ey) - ez * job.tanY) * job.nrmY > rr) return false;
  const z = ez > 1e-4 ? ez : 1e-4;
  const iz = 1 / z;                     // one reciprocal, not three divisions
  pool.sx[n] = job.vw * 0.5 + job.focal * ex * iz;
  pool.sy[n] = job.vh * 0.5 - job.focal * ey * iz;
  const fp = job.focal * rad * iz;
  pool.fp[n] = fp;
  // Visible error: footprint weighted by the light that actually reaches the eye.
  // This is the quantity refinement is driven by, and it is evaluated at the
  // NEAREST point of the node's support, ez - rr, not at its centre. A coarse node
  // has a support many camera distances across: the walk root's centre can sit 60
  // distances away while its near face is at the camera, and attenuating it by its
  // centre made the root itself fail the split test. The whole tree then collapsed
  // to a single splat, which measured as 96 genuinely black frames out of 480. The
  // bound tightens by itself as the cut refines, because rr shrinks with the node.
  // And the attenuation is clamped from below, which is the whole screen size cap in
  // one Math.max. With the floor at splitPx/sizeCap, priority never falls under
  // fp*splitPx/sizeCap, so the split test fires on size alone once fp passes sizeCap
  // however dim the splat is. See `job.attFloor`.
  const zn = ez - rr;
  const att = attOf(job.fogK * (zn - 1));
  pool.prio[n] = fp * (att > job.attFloor ? att : job.attFloor);
  const o3 = n * 3;
  pool.rel[o3] = dx; pool.rel[o3 + 1] = dy; pool.rel[o3 + 2] = dz;
  return true;
}

function ifsRoot(vw, vh) {
  const P = PRESETS[cfg.preset];
  job.nmaps = maps.length;
  // The hue the anchor's swallowed letters are worth. Everything below this walk root
  // accumulates its own local sum starting from zero, so the drawn hue is
  // frac(huBase + local): see `anchor.hue` and buildMapHue in src/40_state.js. Captured
  // here rather than read in the kernel, because a rebase during a rebuild must not move
  // the colours of the cut being built.
  // HUE_OFF is zero in every shipped frame; see its note in src/40_state.js. It rides here rather
  // than in the shader because the hue is summed on the CPU during the walk.
  job.huBase = anchor.hue + HUE_OFF - Math.floor(anchor.hue + HUE_OFF);
  // Width of the cross fade band, as a ratio of priority above the split threshold.
  job.fadeK = 1 / (FADE_BAND - 1);
  job.budK = 1 / (BUD_BAND - 1);
  job.usePrio = false;
  const PM = pool.M, Pmu = pool.mu, Pcov = pool.cov;
  const rmu = root.mu, rcov = root.cov;
  PM[0] = 1; PM[1] = 0; PM[2] = 0; PM[3] = 0; PM[4] = 1; PM[5] = 0; PM[6] = 0; PM[7] = 0; PM[8] = 1;
  Pmu[0] = rmu[0]; Pmu[1] = rmu[1]; Pmu[2] = rmu[2];
  for (let i = 0; i < 6; i++) Pcov[i] = rcov[i];
  pool.w[0] = 1; pool.depth[0] = 0; pool.cc[0] = 0;
  pool.ls[0] = 0; pool.bl[0] = 1;
  pool.par[0] = -1; pool.mi[0] = -1;
  let mx = rmu[0], my = rmu[1], mz = rmu[2];
  if (job.f32) { mx = Math.fround(mx); my = Math.fround(my); mz = Math.fround(mz); }
  const rad = Math.sqrt(rcov[0] + rcov[3] + rcov[5]) * job.invD * job.sig;
  if (!place(0, (mx - job.pos[0]) * job.invD, (my - job.pos[1]) * job.invD,
             (mz - job.pos[2]) * job.invD, rad)) return;
  frontier[0] = 0;
  job.nf = 1;
}

/* ------------------------------- terrain -------------------------------- */
function terrRoot(vw, vh) {
  const P = PRESETS[cfg.preset];
  job.nmaps = 4;
  job.usePrio = true;
  job.relief = cfg.relief;
  job.hmode = cfg.height;
  job.contour = cfg.contour;
  // Peak optical depth of one surfel. High enough that the absorption model
  // saturates across the whole footprint, or the kernel's own falloff shows as a
  // ripple at the cell spacing and the terrain reads as a dot screen.
  job.wSurf = 6.0;
  job.hc = PRESETS[cfg.preset].radius * 0.9;
  // Iterations have to grow with depth, because the escape count of a point at
  // distance d from the set grows like log(1/d). The growth is logarithmic, which
  // is the only reason a deep zoom is affordable at all.
  const lz = Math.max(0, logZoom());
  // Quantized to steps of 1.3, so the field cache survives a descent instead of being
  // invalidated every frame by a cap that creeps. See mandelFieldCached.
  const want = Math.max(80, Math.min(60000, cfg.iters * (1 + 0.42 * lz)));
  const mstep = Math.max(0, Math.round(Math.log(want / 80) / Math.log(1.3)));
  job.maxIter = Math.round(Math.min(60000, 80 * Math.pow(1.3, mstep)));
  stats.maxIter = job.maxIter;
  // The hypsometric span. Only a FALLBACK now, for the first rebuild of an object, before
  // the height histogram exists, and for the potential height mode which has its own
  // analytic span. The distance mode equalizes in log height instead: see `job.eq` below
  // and terrLo in src/40_state.js. Relief is proportional to the camera distance once the
  // camera is down among it, and bounded by the object's measured height when the whole
  // object is in frame, so the smaller of the two is right in both regimes.
  if (job.hmode === 0) {
    job.hBase = 0;
    job.hSpan = Math.min(terrHMax,
      (terrSpanRel > 0 ? terrSpanRel : 1.4 * cfg.relief) * job.dist);
  }
  else {
    const nuT = 6 + 3.3219 * lz;
    job.hBase = 0.11 * cfg.relief * nuT;
    job.hSpan = 0.11 * cfg.relief * 14;
  }
  if (job.hSpan <= 0) job.hSpan = 1e-30;
  job.eq = (job.hmode === 0) && terrEq;
  job.hLo = terrLo;
  job.hInv = 1 / Math.max(terrHi - terrLo, 1e-6);
  job.fcOn = terrItEma > FC_MIN_ITERS;
  fcCur = fcStamp(mstep, job.relief, job.hmode, job.hc);
  fcHits = 0; fcMiss = 0; fcSaved = 0;
  if (!terrCell(0, P.center[0], P.center[1], P.radius, 0)) return;
  frontier[0] = 0;
  job.nf = 1;
}

// Build one surfel from one field evaluation. The cell is a square of half size
// r in the c plane; the surfel is the moment matched Gaussian of the tangent
// patch over it, so covariance (1/3)(u u^T + v v^T) with u and v the tangent
// vectors of the height field across the cell, plus a thin term along the normal
// so the ellipsoid is not exactly degenerate.
function terrCell(n, cx, cz, r, depth) {
  if (job.fcOn) mandelFieldCached(cx, cz, job.maxIter, r * 0.5, job.relief, job.hmode, job.hc);
  else mandelField(cx, cz, job.maxIter, r * 0.5, job.relief, job.hmode, job.hc);
  job.evals++; job.iters += fld.iters;
  const h = fld.h, gx = fld.gx, gz = fld.gz;
  const nx = fld.nx, ny = fld.ny, nz = fld.nz;
  const r2 = r * r / 3, th = 0.2 * r, t2 = th * th;
  const o6 = n * 6, o9 = n * 9, o3 = n * 3;
  pool.cov[o6]     = r2 + t2 * nx * nx;
  pool.cov[o6 + 1] = r2 * gx + t2 * nx * ny;
  pool.cov[o6 + 2] = t2 * nx * nz;
  pool.cov[o6 + 3] = r2 * (gx * gx + gz * gz) + t2 * ny * ny;
  pool.cov[o6 + 4] = r2 * gz + t2 * ny * nz;
  pool.cov[o6 + 5] = r2 + t2 * nz * nz;
  pool.mu[o3] = cx; pool.mu[o3 + 1] = h; pool.mu[o3 + 2] = cz;
  pool.M[o9] = cx; pool.M[o9 + 1] = cz; pool.M[o9 + 2] = r;
  pool.M[o9 + 3] = fld.de; pool.M[o9 + 4] = fld.nu;
  pool.M[o9 + 5] = fld.inside ? 1 : (fld.edge ? 2 : 0);
  pool.M[o9 + 6] = nx; pool.M[o9 + 7] = ny; pool.M[o9 + 8] = nz;
  pool.w[n] = job.wSurf;
  pool.depth[n] = depth;
  let px = cx, py = h, pz = cz;
  if (job.f32) { px = Math.fround(px); py = Math.fround(py); pz = Math.fround(pz); }
  const rad = Math.sqrt(pool.cov[o6] + pool.cov[o6 + 3] + pool.cov[o6 + 5]) * job.invD * job.sig;
  if (!place(n, (px - job.pos[0]) * job.invD, (py - job.pos[1]) * job.invD,
             (pz - job.pos[2]) * job.invD, rad)) return false;
  // `place` has already set the priority to the visible error, footprint times
  // aerial attenuation. That is what the split test wants, so keep a copy of it,
  // then boost the priority where the cell is close to the boundary relative to its
  // own size, because that is where the height field is not yet resolved. The
  // boost decides ORDER under budget pressure and must not enter the test, or a
  // boost of four would drive the near boundary cells five times past the
  // threshold and cost twenty five times the cells for detail nobody asked for.
  // The flat lake gets no boost at all.
  pool.cc[n] = pool.prio[n];
  const de = fld.de;
  const boost = fld.inside ? 0 : Math.min(4, 0.5 * r / Math.max(de, r * 1e-6));
  pool.prio[n] *= 1 + boost;
  return true;
}

// Same time budget as the IFS kernel. A terrain cell is two orders of magnitude
// dearer than an IFS node, so the chunk between clock reads is smaller.
const TCHUNK = 64;
function stepTerr(budgetMs) {
  const t0 = performance.now();
  const tEnd = t0 + budgetMs;
  let chunk = TCHUNK;
  const cap = job.cap, splitPx = job.splitPx;
  let np = job.np, nEmit = job.nEmit, cutSize = job.cutSize;
  let dmin = job.dmin, dmax = job.dmax, visited = job.visited, culled = job.culled;
  let bAllow = job.bAllow;
  let bLow = job.bLow, bHi = bLow * 1.19;
  let done = false;

  outer:
  for (;;) {
    if (job.nf === 0) { done = true; break; }
    if (!job.levelReady) {
      prepareLevel();
      bAllow = job.bAllow; bLow = job.bLow; bHi = bLow * 1.19;
    }
    let q = job.q, nn = job.nn;

  job.dmin = dmin; job.dmax = dmax; job.visited = visited; job.culled = culled;
  job.bAllow = bAllow;

}

// Shade one surfel. A terrain wants light, not emission: the normal is known
// analytically, so a lambert term plus a hemispheric sky term costs one dot
// product and is what makes the relief read as relief. Colour is hypsometric in
// height relative to the current view, which keeps it invariant under zoom, and
// the darkened bands are the true equipotentials of the set, faded out where a
// cell is too close to the boundary to resolve them.

  let cr, cg, cb;
  if (kind === 1) {
    // The interior of the set is genuinely featureless: the distance estimate and the
    // potential are both zero there, so there is nothing to colour it BY. Drawn as a
    // flat unlit constant it came out at about 0.001 in linear light against a 0.0002
    // background, which is a hole rather than a surface, and a view where the interior
    // fills the frame was a black frame with a quarter million splats in the buffer.
    // The Feigenbaum point is 100 percent interior at every zoom past 1e7.
    //
    // But it IS a surface, flat and level, and a flat body of water is not featureless
    // at all: what it shows is the sky, by Fresnel, plus the sun. Schlick against the
    // level normal, so grazing lake reflects the sky and lake underfoot stays deep.
    // That is both the honest physics of a flat surface and the thing that makes the
    // interior read as a lake instead of as nothing.
    const vx = pool.rel[o3], vy = pool.rel[o3 + 1], vz = pool.rel[o3 + 2];
    const vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
    const ct = Math.abs(vy) / vl;                       // |cos| against world up
    const om = 1 - ct;
    const F = 0.02 + 0.98 * om * om * om * om * om;
    // Sun on water: mirror the view about the level surface and aim at the light.
    const gr = (vx / vl) * LX - (vy / vl) * LY + (vz / vl) * LZ;
    const g = gr > 0 ? Math.pow(gr, 260) * 1.7 : 0;
    cr = lakeCol[0] + (sheenCol[0] - lakeCol[0]) * F + g;
    cg = lakeCol[1] + (sheenCol[1] - lakeCol[1]) * F + g * 0.97;
    cb = lakeCol[2] + (sheenCol[2] - lakeCol[2]) * F + g * 0.88;
  }
  else {
    // Square root of the normalized height. Deep in a valley most of the visible
    // area genuinely is shore, so a linear ramp puts the majority of the frame in
    // the bottom eighth of the palette and the image reads as a dark wash. The
    // square root spreads that majority across the ramp without moving the top.
    // Hypsometric, equalized in log height between two measured percentiles of the
    // cut's own height distribution. The old form was a square root of height over a
    // span anchored at zero, and it left 16 to 43 percent of the land in the darkest
    // tenth of the ramp, which is what made a deep view read as a flat dark wash.

      const hr = pool.mu[o3 + 1] * job.invD;

    } else {
      t = (pool.mu[o3 + 1] - job.hBase) / job.hSpan;
      t = t > 0 ? Math.sqrt(t) : 0;

    if (pi < 0) pi = 0; else if (pi > PAL - 1) pi = PAL - 1;

      const st = 1 - 2.5 * r / (de > 0 ? de : 1e-300);
      if (st > 0) {

        if (f > 0.5) f = 1 - f;

  instances[o + 3] = pool.cov[o6] * d2; instances[o + 4] = pool.cov[o6 + 1] * d2;
  instances[o + 5] = pool.cov[o6 + 2] * d2; instances[o + 6] = pool.cov[o6 + 3] * d2;
  instances[o + 7] = pool.cov[o6 + 4] * d2; instances[o + 8] = pool.cov[o6 + 5] * d2;
  instances[o + 9] = cr; instances[o + 10] = cg; instances[o + 11] = cb;

    // tailed, so a mean is dragged around by a handful of far cells.
    const hr = pool.mu[o3 + 1] * job.invD;

}

/* ------------------------- level priority threshold --------------------- */
// Which nodes of the current level may split, when the budget cannot take them
// all. A histogram over log2(priority) finds the threshold in one pass; sorting
// the level costs more than the refinement itself.
// The priority is now written where the node is created, by `place` and by the IFS
// kernel, so there is nothing to compute here beyond the threshold itself.
// The precision cost of the position subtraction in the kernel, in pixels, for the
// camera as it is RIGHT NOW. With rebasing on, every coordinate is of order one no
// matter how deep the zoom, so this stops growing: that is the whole point.
//
// It has to be live rather than a by-product of finishing a rebuild. The terrain's
// rebuild cost grows with depth, and past about 1e6 it takes tens of frames, so a value
// recorded at the last finish is tens of frames stale. The descent's park reads this,
// and reading a stale one let the camera fall from 1e14 to 1e29 with the readout and the
// frame both sitting frozen at 1e14. Measured against the true spacing of float64 near
// the aim, this over-reports by about 4.5x, so the park fires slightly early, which is
// the right direction.

  // orbit runs in double single, and what that delivers is a property of the DRIVER rather than of the
  // format: measured on the GPU itself by dsgl.html, with the orbit compared against the same orbit in
  // doubles, 38 to 43 bits over the first thousand iterations. Take 40, so 9.1e-13 of relative
  // rounding against a double's 1.1e-16, and the descent turns around a little past ten to the nine
  // where the CPU path reaches ten to the thirteen.
  //
  // The representation alone would do better. dsprec.mjs measures the PAIR as standing for a number to
  // 2^-49.6, which would reach ten to the eleven; the shipped figure is the ARITHMETIC, nine bits
  // worse because every add and multiply renormalizes through exactAdd and every renormalization
  // rounds. Using the representation figure would fly the camera two decades into a frame that has
  // broken up into per pixel noise.
  const eps = isDirect() ? 9.1e-13 : (cfg.precision === 'f32' ? 6e-8 : 1.1e-16);
  // What magnitude of world coordinate the rounding applies to. For an IFS the anchor holds
  // everything at order one and the framing distance is the honest scale. For a flat field
  // there is no anchor, and the number that gets rounded is the plane coordinate itself: the
  // cells near the aim have the aim's magnitude, so that is the scale, not the framing
  // distance. Using the framing distance for a field overstated the error by the ratio of the
  // two, which for the Mandelbrot is fifteen times, and cost about 1.2 decades of the descent.
  const worldScale = isField()
    ? Math.max(Math.hypot(cam.target[0], cam.target[2]), 1e-4)
    : Math.max(Math.hypot(cam.target[0], cam.target[1], cam.target[2]) + cam.startDist, 1e-30);

const SUBH = 32;                       // sub-buckets inside the edge bucket
const subHist = new Int32Array(SUBH);

  const nf = job.nf, cap = job.cap, nmaps = job.nmaps;
  const Ppr = pool.prio;
  job.bLow = -Infinity;
  // A CUT WIDE THRESHOLD UNDER THE PER LEVEL ONE, and it is the fix for an object that shimmers
  // while the camera moves smoothly. See bFloor below for the controller.
  //
  // The threshold this function derives is a property of ONE LEVEL: it rations the frontier
  // against whatever budget the levels above happened to leave. That is correct per level and it
  // compounds. A cut that passes through three levels has three chances to differ from the
  // previous frame's cut; the Pythagoras tree passes through twenty five, because its two ratios
  // are 0.809 and 0.588 and a level synchronous frontier therefore holds pieces whose sizes differ
  // by 1.38 to the twenty fifth. A small camera change shifts the budget consumed at level nine,
  // which shifts the ration at level ten, which shifts it at eleven, and by the bottom of the tree
  // an arbitrary set of nodes has swapped sides. Neither cross fade band helps: they dissolve a
  // node that crosses ITS OWN threshold smoothly, and this is the threshold itself jumping.
  //
  // The floor is carried BETWEEN cuts and moved by at most a few percent per cut, so consecutive
  // cuts of the same object agree by construction. The per level threshold stays as the hard
  // backstop, because one level really can blow the budget on its own and nothing else stops it.
  if (job.bFloor > 0) job.bLow = job.bFloor;

  // band is drawn alongside its children. Budgeting it at nmaps - 1 let cutSize overshoot
  // the cap, and then the per node backstop `cutSize + nmaps <= cap` did the rationing
  // instead of this threshold. That backstop is FRONTIER ORDER dependent: whichever nodes
  // the walk happens to reach first get to split, the order shifts between rebuilds, and so
  // an arbitrary subset of the same level flips between split and unsplit every frame. On
  // the folded dragon, the one object that stays budget limited, that was the largest
  // remaining source of colour shimmer, since a flipped node swaps its own hue for its
  // children's.
  // nmaps + 1, not nmaps: a split inside either cross fade band draws the parent as well as
  // its children, so it costs one more slot than the children alone. Reserving that slot is
  // what keeps the HARD per node backstop, `cutSize + nmaps <= cap`, from ever firing. That
  // backstop has no dissolve at all and no threshold behind it: whichever nodes the walk
  // happens to reach once the cut is exactly full are emitted whole, however large they are.
  // Measured on the icosahedral flake, it was leaving 3 821 splats over 3 px at full weight.
  //

  // splats a cut may DRAW; MAXCAP bounds the nodes it may allocate, and the two are not the same
  // number of levels apart for every object. The walk is level synchronous and nothing is ever
  // reclaimed, so a cut allocates the sum of its frontier over every level it passes through,
  // which for a deep object is several times the cut it ends up drawing. The Pythagoras tree is
  // the extreme case: its long branch contracts by 0.848, so reaching a pixel takes about forty
  // levels against the folded dragon's twenty four, and with the frontier at its cap for the last
  // twenty of them the pool is exhausted several times over.
  //
  // What happened then was `np >= MAXCAP` inside the kernel, which breaks out of the child loop
  // mid-node: the node gets some of its children and not the rest, weight is not conserved, and
  // WHICH node it happens to is whatever the walk reached last. That is a cliff with no dissolve
  // behind it and no threshold, it moves every frame, and it is exactly the shimmer the budget
  // threshold below exists to prevent. Bounding the splits by the pool as well puts both ceilings
  // through the same rationing, so running out of nodes now looks like running out of budget: a
  // level set of priority that sweeps the object smoothly. The kernel's own test stays as a
  // backstop and should never be reached.

      if (b < 0) b = 0; else if (b >= HB) b = HB - 1;
      hist[b]++;

    for (let b = HB - 1; b >= 0; b--) {

      edge = b; break;
    }
    // Refine WITHIN the edge bucket, so the threshold is a number every node can be
    // compared against rather than a count handed out in walk order. One more pass over
    // just the nodes in that bucket, a factor 2^(1/4) wide, split 32 ways. The result is
    // deterministic and spatially coherent: the boundary is a level set of priority, and it
    // sweeps the object smoothly as the camera moves instead of dissolving into noise.
    const lo = Math.pow(2, (edge - 96) / 4);
    const sc = SUBH / (Math.LN2 * 0.25);
    subHist.fill(0);

      const pr = Ppr[frontier[q]];

    // of this cut asked for. The controller below tracks this and it must not track the floored
    // value: `bLow` is at least `bFloor` by construction, so a floor smoothed toward it could only
    // ever rise, which is a positive feedback loop and runs away.
    if (lvl > job.bRaw) job.bRaw = lvl;
    if (lvl > job.bLow) job.bLow = lvl;         // whichever ceiling is tighter decides
  }

}

/* --------------------- the cut wide priority floor ---------------------- */
// One number, carried between cuts, that says how small a splat this object is allowed to make at

//
// A FIRST ORDER FILTER AND NOT A BANG BANG CONTROLLER, and the difference is the whole of whether
// this works. The first version steered the FILL FRACTION: raise the floor five percent whenever
// the cut came out over 94 percent of its budget, lower it four percent under 80. That is a relay
// controller in front of a plant with dead time, because a cut takes several frames to arrive and
// the fill it reports is about the floor from several frames ago, and a relay with dead time
// oscillates. It did, immediately and visibly. Measured on the Pythagoras tree over a descent, the
// splat count per cut went 89k, 83k, 110k, 103k, 136k, 127k, 168k, 157k, 208k, 194k: a clean two
// cycle hunt, six to ten percent every cut, which is a level of detail transition every cut and is
// worse than the shimmer it was written to fix. The review that found it was precise about where
// it showed, near the centre of the spiral being descended into, which is exactly where the
// marginal splats are.
//

// cut derived on its own, which is the ration the object genuinely wanted; the floor is an

// under one, and its fixed point is the natural threshold rather than a fill fraction it has to

// away. See prepareLevel, where the two are recorded separately for this reason.

// Advance the current job by at most `budgetMs` of real work. Returns true when

/* ================= refinement: the escape time field, in plane ============ */
// A quadtree over the plane, one flat Gaussian per cell, coloured by the smooth escape

// visible error the IFS objects use, applied to colour instead of to geometry:
//
//     ramp span = |grad nu| * cell diameter / nuCycle

// which is the fraction of one full turn of the colour ramp that the cell covers. A cell
// that covers less than a small fraction of a ramp step is finished, however large it is on
// screen, because splitting it cannot change a single pixel. A cell that covers more is
// unresolved, and emitPlane draws it as the exact box filtered average of the ramp over its
// own span, which is what a supersampled renderer would converge to. So being unresolved
// costs saturation, never correctness, and the split threshold can sit where the cost is
// rather than where the eye would like it: measured, dropping it to 0.55 px bought nothing
// visible and cost a factor of five in build time, which is what made the descent stall.
//

// review's 1377x1592 window, tiling the frame at the cap costs 61 000 cells, the cut spent
// its entire 90 ms latency budget reaching a UNIFORM level eleven, and 94 percent of the
// drawn area came out at 5.7 px with sigma 2.5 px of Gaussian blur over it. The boundary,
// which is the only part of the object anyone is looking at, never got refined at all.
//
// The cap is there to stop the quadtree itself becoming visible as soft banding in the smooth
// far field, and that is a property of how many cells cross the frame, not of a pixel count:
// 1/48 of the frame height is 33 px at 1592 and 13 at 621, and either way it is about 48 by 55
// cells to cover the frame. What bounds the colour step between two neighbouring large cells
// is `spanTol`, and that is unchanged.

// against the objects that already feel right: an IFS cut costs 19 to 22 ms, so a field cut

// is 0.07 e-folds of camera motion. Under that, nothing is visibly out of scale.

function planeRoot(vw, vh) {

  // now OCTAVES of escape count per full turn of the ramp. This is the one change that makes
  // one setting work at every depth. Linear in nu, a cycle wide enough to give the opening
  // view a couple of bands gives a deep view two hundred, and a cycle wide enough for the deep
  // view gives the opening view a single soft glow with no bands in it at all: measured, at
  // nuCycle 22 the whole exterior of the opening frame was under two turns. In log the escape
  // count spans about four octaves at the opening view and about two at ten to the five, so the
  // band count is stable within a factor of two over the whole descent.

  // situation: |grad u| = |grad nu| / (ln2 * nuCycle * nu), so the same geometry needs fewer
  // cells to resolve once nu is large.

  // dips of a quadtree of BOX like profiles: at beta 9 the profiles tile rather than blend, so
  // at every cell corner four of them each contributed about a quarter and the background
  // showed through as a grid of dots. Saturating hid the dots and left the tiling, and the
  // tiling is what made the object read as a pixel render rather than as splats.

  // cache keys on the quantized iteration cap, so every change of the cap invalidates every
  // stored cell. Ramping both together meant each step of the ramp paid cold, and the ramp
  // therefore never accumulated: measured, five cuts over 2.9 seconds of CPU ended at 43 000
  // splats with not one cell under 3 px, against 275 000 for a single converged cut. So the
  // cap moves once, on the first stationary cut, and then holds while the ceiling ramps and
  // the cache fills.

  // set grows like log(1/d). Quantized the same way the terrain's is, so that a field cache
  // would survive a descent, and so the cost per frame is stable rather than creeping.
  // THE SAME BOOST APPLIES TO THE ITERATION CAP, and the reason is that the cap and the
  // latency ceiling are two statements about the same thing: how much arithmetic this cut may
  // spend. They pull in opposite directions and the measurement is unambiguous. At ten to the
  // six on a 1377x1592 window, with the 90 ms ceiling in force, raising the base cap from 500
  // to 4000 took the cut from 45 000 cells to 17 000 and the unresolved cell width from 4.5 px
  // to 9.3: strictly worse. Allowed to converge, the same rise took the flat region, where
  // every cell has run out of iterations and they therefore all share one colour, from 63.3
  // percent of the frame to 13.0.

// One cell, one field evaluation. `r` is the half size. The splat's variance is r^2/3, the
// second moment of the cell itself, and the preset's sigma then scales it: at sigma sqrt(3)
// one standard deviation is exactly the cell's half size, so cells whose centres are 2r apart
// overlap at one sigma and the sum of the profiles is flat to under a percent. That is the
// condition for the accumulation to be a RECONSTRUCTION of the field rather than a mosaic of
// it, and it is the whole difference between this looking like splats and looking like pixels.
// A thin term across the plane keeps the ellipsoid non-degenerate so the covariance inverts.
// The field is sampled at the cell's CENTRE, and a verdict about the centre is not a verdict
// about the cell. That distinction is not academic: the Mandelbrot's root cell is centred

// from the ramp span standing in for it. `de` is a lower bound on the distance from the centre to
// the set, so an escaped cell with de >= r sqrt(2) cannot contain any of it; a condemned or
// exhausted cell is one the orbit could not settle, which is the same statement with no number
// attached. A proven interior cell is all set and nothing about it is unresolved.

// THE GEOMETRY HALF OF A CELL: everything that does not need the field. Split out because the

//

// THE FIELD HALF: one verdict about the cell's centre, plus whether the corner guard agreed,

// GPU path in planeFlush, and they differ in nothing but where the numbers came from.

  const o9 = n * 9, r = pool.M[o9 + 2];

  // this cell cover", which is what the box filter in planeSample wants, and "must this cell be
  // split", which the quadtree wants. A cell whose distance estimate says the set is inside it
  // must always split, so the span was set to 1e6 to force it, and emitPlane then read that back
  // as the filter width and filtered the ramp over its whole cap.

  // is 0.30 of a turn. Against a ramp whose lightness runs twice per turn that is more than half a
  // lightness cycle averaged away, on every cell that touches the set, whatever its escape count
  // actually did. Measured against a per pixel render of the same view, the four pixel band around
  // the set came back at 0.71 of the reference's saturation, and the reference was applying the
  // same law with the same cap to far fewer of its samples.

  // and that number is the honest filter width. The split is decided from the kind and the

  // usable escape count at all, keeps the cap, and there the cap is the honest answer.

  // cycle or by the analytic body test. 2 condemned: the boundary is somewhere inside this
  // cell, nu is the interpolated iteration the orbit was abandoned at and de is not a distance
  // at all. 3 exhausted: neither escaped nor closed, which is much stronger evidence of being
  // in the set than 2 is. Collapsing 2 and 3 into 1 is what painted unrefined exterior as set.

  // goes where the colour is both large on screen and actually changing. A cell the set runs
  // through takes the maximum whatever its span says, because there the thing that is not
  // resolved is the geometry and the span is not measuring it.

function planeCell(n, cx, cz, r, depth) {
  if (!planeCellGeom(n, cx, cz, r, depth)) return false;
  planeCellField(n, cx, cz, r);
  return true;
}

// The field, the corner guard and the finish, on the CPU, for a cell whose geometry is already

    // stops the interior costing one cell per pixel: without it every interior cell reports
    // itself unresolved and refines to the pixel.
    //

    // go. Measured at the opening view: 466 129 field evaluations for 155 465 cells, of which
    // 310 664 were corner tests, and 98 percent of the interior centres had been proven
    // interior by `inMainBody` rather than by an orbit. The cardioid and the period two bulb

    // do leave the analytic bodies.

    // code gave it |grad nu| = 1e30, which says "this cell spans the whole ramp, split it",
    // and it says that no matter how large a region of the plane is in the same state.
    // Measured at ten to the six on a 1377x1592 window: 237 358 of 333 000 cells came back
    // exhausted, 71 percent, and every one of them demanded refinement. So the budget was
    // spent tiling the one part of the frame that is UNIFORM, the deep boundary layer that
    // renders as a single flat colour, and the boundary itself, which is the only part
    // anybody is looking at, got what was left. That is precisely backwards.
    //
    // The fix is the guard the interior case has always had, applied to the same question.
    // The verdict "no escape within maxIter" is a statement about the centre; test the four
    // corners too, and only call the cell uniform if they all agree. A corner that ESCAPED
    // or was CONDEMNED means real structure crosses this cell, so it splits as before. The
    // corners are shared with the four neighbouring cells and the field cache keys on the

    // it buys the end of an unbounded split cascade.

      planeFieldCached(cx + ox, cz + oz, job.power, job.c0x, job.c0y, job.julia, job.maxIter, r);
      job.evals++; job.iters += pfl.iters;

  // lower bound on the distance from this point to the set, so a cell whose half diagonal fits

  // estimate can be trusted. A cell that does not clear that test may straddle anything, so it

/* ---------------- the same field, in batches, on the GPU ------------------ */
// THE ANSWER TO "CAN ONE COMBINE PIXEL AND GAUSSIAN METHODS", and it is the largest single thing
// in this object's cost. The quadtree stays on the CPU, where it belongs, and only the ARITHMETIC
// moves, which is what the measurement says to do. Timed on an RTX 4090 at 1100x1280, on the real
// query set of a converged cut, with the synchronous readback included:
//
//   view      cells    cap      GPU batch    the same points on one CPU thread
//   10^0     213 666   25 695     13.8 ms      166 ms      12x
//   10^2.2   177 059   43 424     13.7 ms      637 ms      47x
//   10^4     224 994   73 387     14.0 ms      137 ms      10x
//   10^6     320 484   95 403     19.6 ms     2447 ms     125x

// numbers come from, and knowledge/plane_lod.md for what it did to the build.
//
// The shape is set by stepPlane being LEVEL SYNCHRONOUS. Within one level every cell is
// independent, so a level's children are one batch: walk the frontier and decide the splits,
// which needs nothing but what is already known; write the children's GEOMETRY and cull them,
// which needs no field either; then one draw and one readback answers all of them at once.
// Cells whose centre comes back interior or exhausted need the corner guard, so those go in a
