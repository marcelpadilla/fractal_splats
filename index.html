const TONE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uOptical;
uniform float uGlow;
uniform float uWhite;
uniform vec3 uBg0;
uniform vec3 uBg1;
out vec4 outColor;
void main() {
  vec4 acc = texture(uTex, vUv);
  float T = max(acc.a, 0.0) * uOptical;
  vec3 mean = acc.rgb / max(acc.a, 1e-12);
  float a = 1.0 - exp(-T);
  float g = min(log(1.0 + T) / log(1.0 + uWhite), 6.0);
  float b = mix(a, g, uGlow);
  vec3 c = mean * b;
  c += mix(uBg0, uBg1, vUv.y) * (1.0 - clamp(a, 0.0, 1.0));
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = max(mix(vec3(l), c, 1.14), vec3(0.0));      // hold saturation in the cores
  outColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
}`;

let gl, canvas, progSplat, progTone, progFlat, progRect, vao, vaoFlat, instBuf, fbo, fboTex, fboDepth;
let fboW = 0, fboH = 0, fboInternal = 0;
const uni = {};

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* ------------------------- linking without stalling ---------------------- */
// The batched escape time field program and the per pixel one carry the whole double single orbit
// and take about a second each to link, on the main thread: `linkProgram` returns at once but the
// first query of its result blocks. KHR_parallel_shader_compile replaces that query with a pollable
// flag, and until it is true nothing may touch the program, not LINK_STATUS, not
// getUniformLocation, not useProgram, or the extension has bought nothing. Without the extension
// this degrades to a blocking link.
let parExt;
function linkAsync(vs, fs) {
  if (parExt === undefined) parExt = gl.getExtension('KHR_parallel_shader_compile') || null;
  const p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  return { p, ext: parExt };
}
// True once the program may be used. Costs one non blocking query a frame while it is false.
function linkReady(h) {
  if (!h) return false;
  if (h.done) return true;
  if (h.ext && !gl.getProgramParameter(h.p, h.ext.COMPLETION_STATUS_KHR)) return false;
  if (!gl.getProgramParameter(h.p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(h.p));
  h.done = true;
  return true;
}

// Solid rectangles in pixel coordinates, for the frames around the magnifier squares and around
// the regions they show. Four vertices from gl_VertexID, no buffer. Origin bottom left.
const RECT_VS = `#version 300 es
precision highp float;
uniform vec4 uRect;                  // x0, y0, x1, y1 in pixels
uniform vec2 uVp;
void main() {
  vec2 c = vec2((gl_VertexID == 1 || gl_VertexID == 3) ? uRect.z : uRect.x,
                (gl_VertexID >= 2) ? uRect.w : uRect.y);
  gl_Position = vec4(c / uVp * 2.0 - 1.0, 0.0, 1.0);
}`;

const RECT_FS = `#version 300 es
precision highp float;
uniform vec4 uCol;
out vec4 outColor;
void main() { outColor = uCol; }`;

const SPLAT_UNI = ['uR', 'uRc', 'uFocal', 'uVp', 'uGain', 'uFilter', 'uFog', 'uFogCol', 'uK', 'uO',
  'uSig2', 'uKnorm', 'uExtent', 'uEnergy', 'uSlab', 'uDepth', 'uShape', 'uBeta2', 'uCore', 'uFadePx',
  'uZFar', 'uRing', 'uRingCol', 'uShift'];
// The flat program's own set. No uGain, uKnorm, uEnergy or uSlab: a plane cut always takes the
// surface model with no prepass, so those are constants in FLAT_VS. Fragment uniforms added below.
const FLAT_UNI = ['uR', 'uRc', 'uFocal', 'uVp', 'uFilter', 'uFog', 'uFogCol', 'uK', 'uO', 'uSig2',
  'uExtent', 'uDepth', 'uZFar', 'uPlaneY', 'uShift'];
const flatUni = {};
const rectUni = {};

function initGL(cv) {
  canvas = cv;
  gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
  if (!gl) return false;
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  stats.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'not reported';
  progSplat = link(VS, FS);
  progFlat = link(FLAT_VS, FS);            // same fragment shader: the footprint is unchanged
  progTone = link(TONE_VS, TONE_FS);
  progRect = link(RECT_VS, RECT_FS);
  for (const k of ['uRect', 'uVp', 'uCol']) rectUni[k] = gl.getUniformLocation(progRect, k);
  for (const k of SPLAT_UNI) uni[k] = gl.getUniformLocation(progSplat, k);
  for (const k of FLAT_UNI) flatUni[k] = gl.getUniformLocation(progFlat, k);
  for (const k of ['uShape', 'uBeta2', 'uCore', 'uRing', 'uRingCol']) {
    flatUni[k] = gl.getUniformLocation(progFlat, k);
  }
  for (const k of ['uTex', 'uOptical', 'uGlow', 'uWhite', 'uBg0', 'uBg1']) {
    uni[k] = gl.getUniformLocation(progTone, k);
  }

  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  instBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAXBUDGET * FLOATS * 4, gl.DYNAMIC_DRAW);
  const stride = FLOATS * 4;
  for (const [loc, size, off] of [[1, 3, 0], [2, 3, 12], [3, 3, 24], [4, 3, 36], [5, 1, 48]]) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, off);
    gl.vertexAttribDivisor(loc, 1);
  }
  gl.bindVertexArray(null);

  // A second VAO over the same instance buffer with the compact layout. The buffer is sized for the
  // 13 float format, so a flat cut uses less of it and nothing is reallocated on an object change.
  vaoFlat = gl.createVertexArray();
  gl.bindVertexArray(vaoFlat);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  {
    const fs = FLAT_FLOATS * 4;
    for (const [loc, size, off] of [[1, 2, 0], [2, 1, 8], [3, 3, 12], [4, 1, 24]]) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, fs, off);
      gl.vertexAttribDivisor(loc, 1);
    }
  }
  gl.bindVertexArray(null);

  // Accumulation needs range far past 1.0, so a float target if one is available.
  if (gl.getExtension('EXT_color_buffer_float')) { fboInternal = gl.RGBA16F; stats.format = 'RGBA16F'; }
  else if (gl.getExtension('EXT_color_buffer_half_float')) { fboInternal = gl.RGBA16F; stats.format = 'RGBA16F'; }
  else { fboInternal = gl.RGBA8; stats.format = 'RGBA8, clamped'; }
  fbo = gl.createFramebuffer();
  fboTex = gl.createTexture();
  fboDepth = gl.createRenderbuffer();
  return true;
}

function resizeTargets(w, h) {
  if (w === fboW && h === fboH) return;
  fboW = w; fboH = h;
  for (let attempt = 0; attempt < 2; attempt++) {
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fboInternal, w, h, 0, gl.RGBA,
      fboInternal === gl.RGBA8 ? gl.UNSIGNED_BYTE : gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindRenderbuffer(gl.RENDERBUFFER, fboDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fboDepth);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (ok) return;
    fboInternal = gl.RGBA8;                    // fall back and try once more
    stats.format = 'RGBA8, clamped';
  }
}

// One splat pass into the accumulation buffer. A surface needs the front layer only, or a hill
// behind a ridge blends into it: the prepass writes the front surface pushed back by its own
// thickness and the colour pass accepts what is inside that slab. Order independent either way, no
// sort, and the accumulation stays additive.
//
// `mag` is null for a normal frame. For a magnifier square it is {m, x, y}: scale the focal length
// by m, which magnifies about the eye axis and carries the projected covariance with it, then shift
// by (x, y) pixels to centre the chosen point. The square redraws the splats, it does not resample.
function splatPass(vw, vh, count, mag) {
  const m = mag ? mag.m : 1, shx = mag ? mag.x : 0, shy = mag ? mag.y : 0;
  const focal = m * 0.5 * vh / Math.tan(0.5 * cam.fov);
  // A width in pixels, which the shader measures with a screen space derivative, so a magnifier
  // square gets the same line as the frame without being scaled by m.
  const ring = ringWidth();
  const surface = built.surface, prepass = built.prepass;
  const zf = Math.max(2, 1 + ZF_MUL * 8 / Math.max(cfg.fog, 0.02));
  const zn = 1e-4;
  if (count > 0 && built.flat) {
    // The flat path: seven floats an instance, no prepass, surface model. Kept separate from the
    // general path below because the two disagree about the vertex layout.
    gl.useProgram(progFlat);
    gl.uniformMatrix3fv(flatUni.uR, false, basis.Rgl);
    gl.uniformMatrix3fv(flatUni.uRc, false, repro.Rc);
    gl.uniform2f(flatUni.uFocal, focal, focal);
    gl.uniform2f(flatUni.uVp, vw, vh);
    gl.uniform1f(flatUni.uFilter, 0.5);
    gl.uniform1f(flatUni.uFog, cfg.fog);
    gl.uniform3f(flatUni.uFogCol, bg1[0], bg1[1], bg1[2]);
    gl.uniform1f(flatUni.uK, repro.k);
    gl.uniform3fv(flatUni.uO, repro.o);
    gl.uniform1f(flatUni.uSig2, cfg.sigma * cfg.sigma);
    gl.uniform1f(flatUni.uExtent, kern.extent * FLAT_EXT);
    gl.uniform1f(flatUni.uZFar, zf);
    gl.uniform2f(flatUni.uDepth, 1 / Math.log(zf / zn), Math.log(zn));
    gl.uniform1f(flatUni.uPlaneY, built.planeY);
    gl.uniform1f(flatUni.uShape, kern.shape);
    gl.uniform1f(flatUni.uBeta2, kern.beta * 0.5);
    gl.uniform1f(flatUni.uCore, 0.0);
    gl.uniform1f(flatUni.uRing, ring);
    gl.uniform3f(flatUni.uRingCol, RING_COL[0], RING_COL[1], RING_COL[2]);
    gl.uniform2f(flatUni.uShift, shx, shy);
    gl.bindVertexArray(vaoFlat);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendEquation(gl.FUNC_ADD);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(null);
  } else if (count > 0) {
    gl.useProgram(progSplat);
    gl.uniformMatrix3fv(uni.uR, false, basis.Rgl);
    gl.uniformMatrix3fv(uni.uRc, false, repro.Rc);
    gl.uniform2f(uni.uFocal, focal, focal);
    gl.uniform2f(uni.uVp, vw, vh);
    // A magnified measure spreads its weight over m^2 more pixels and the vertex shader divides by
    // the root of the projected determinant, so its peak falls by m^2. Put it back: the square is a
    // diagram of the primitives and has to be as legible as the frame.
    gl.uniform1f(uni.uGain, surface ? 1 : vw * vh * repro.gain * m * m);
    gl.uniform1f(uni.uFilter, 0.5);
    gl.uniform1f(uni.uFog, cfg.fog);
    gl.uniform3f(uni.uFogCol, bg1[0], bg1[1], bg1[2]);
    gl.uniform1f(uni.uK, repro.k);
    gl.uniform3fv(uni.uO, repro.o);
    gl.uniform1f(uni.uSig2, cfg.sigma * cfg.sigma);
    gl.uniform1f(uni.uKnorm, kern.knorm);
    gl.uniform1f(uni.uExtent, kern.extent);
    gl.uniform1f(uni.uEnergy, surface ? 0 : 1);
    // A measure's splat fades out above this screen size, an oversized splat standing in for
    // structure that is not drawn. Every splat in the Gaussian view is oversized on purpose, so the
    // cap rises with the split threshold.
    gl.uniform1f(uni.uFadePx, (cfg.gauss ? GAUSS_CAP : SIZE_CAP) * m);
    gl.uniform1f(uni.uZFar, zf);
    gl.uniform1f(uni.uShape, kern.shape);
    gl.uniform1f(uni.uBeta2, kern.beta * 0.5);
    gl.uniform1f(uni.uRing, ring);
    gl.uniform3f(uni.uRingCol, RING_COL[0], RING_COL[1], RING_COL[2]);
    gl.uniform2f(uni.uShift, shx, shy);
    gl.uniform2f(uni.uDepth, 1 / Math.log(zf / zn), Math.log(zn));
    gl.bindVertexArray(vao);
    if (prepass) {
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.colorMask(false, false, false, false);
      gl.uniform1f(uni.uSlab, 4.0);
      gl.uniform1f(uni.uCore, 0.22);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
      gl.colorMask(true, true, true, true);
      gl.depthMask(false);
      gl.uniform1f(uni.uSlab, 0.0);
      gl.uniform1f(uni.uCore, 0.0);
    } else {
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.uniform1f(uni.uSlab, 0.0);
      gl.uniform1f(uni.uCore, 0.0);
    }
    gl.enable(gl.BLEND);
    gl.blendEquation(gl.FUNC_ADD);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.bindVertexArray(null);
  }
}

// The tone map, from the accumulation buffer to the screen.
function tonePass(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.useProgram(progTone);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(uni.uTex, 0);
  gl.uniform1f(uni.uOptical, cfg.density);
  gl.uniform1f(uni.uGlow, cfg.glow);
  gl.uniform1f(uni.uWhite, 12);
  gl.uniform3f(uni.uBg0, bg0[0], bg0[1], bg0[2]);
  gl.uniform3f(uni.uBg1, bg1[0], bg1[1], bg1[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// The i-th magnifier square, top down the right hand edge, in device pixels, origin bottom left.
// Null when there is no room; the frame then shows fewer squares rather than cramped ones, and null
// on the second is the ordinary case on a short window.
function loupeRect(vw, vh, i) {
  const short = Math.min(vw, vh);
  const s = Math.round(Math.max(LOUPE_MIN, Math.min(LOUPE_MAX, LOUPE_FRAC * short)));
  const pad = Math.round(LOUPE_PAD * short);
  const gap = Math.round(LOUPE_GAP * short);
  // Enough ellipses across to read as a field rather than as two blobs. See LOUPE_ROOM.
  if (s < LOUPE_ROOM * LOUPE_MAG[i] * GAUSS_PX) return null;
  // LOUPE_MIN is a floor in absolute pixels, so past this the square is refused rather than shrunk
  // below it. The smallest frame that gets one is about 263 px; the project page never gives the
  // iframe less than 296.
  if (s > short * 0.38) return null;
  // Clear of the panel, tested in CSS pixels because the panel is laid out by the stylesheet. The
  // capture harness has no layout, so a missing clientWidth means the frame's own width.
  if (((canvas && canvas.clientWidth) || vw) < LOUPE_CLEAR) return null;
  // Room for the whole column, and never more than 0.72 of the frame's height in squares.
  if ((i + 1) * s + i * gap + 2 * pad > vh * 0.72) return null;
  return { x: vw - pad - s, y: vh - pad - s - i * (s + gap), s };
}

// One solid rectangle in pixel coordinates, colour premultiplied, so the blend is
// ONE, ONE_MINUS_SRC_ALPHA. `ring` is a rectangular outline of thickness t just inside the given
// box: four rects, the left and right shortened so the corners are not drawn twice, since at alpha
// below one a doubled corner is a visibly brighter dot.
function rectCol(x0, y0, x1, y1, c, a) {
  gl.uniform4f(rectUni.uRect, x0, y0, x1, y1);
  gl.uniform4f(rectUni.uCol, c[0] * a, c[1] * a, c[2] * a, a);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function ring(x0, y0, x1, y1, t, c, a) {
  rectCol(x0, y0, x1, y0 + t, c, a);
  rectCol(x0, y1 - t, x1, y1, c, a);
  rectCol(x0, y0 + t, x0 + t, y1 - t, c, a);
  rectCol(x1 - t, y0 + t, x1, y1 - t, c, a);
}

// The aim point projected to a pixel offset from the middle of the frame, the vertex shader's
// projection on one point in world coordinates rather than the cut's: `cam.goal` and `basis.pos`
// are both in the current frame, so no reprojection is involved. Clamped to keep the marked box
// inside the frame, `pad` being its half side plus a margin, because early in a descent the aim can
// be well outside.
function loupeAim(vw, vh, pad) {
  const out = [0, 0];
  const R = basis.R, p = basis.pos, g = cam.goal;
  const d0 = g[0] - p[0], d1 = g[1] - p[1], d2 = g[2] - p[2];
  const z = -(R[6] * d0 + R[7] * d1 + R[8] * d2);          // see updateBasis: row 2 is -forward
  if (!(z > 1e-9)) return out;
  const focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  const x = focal * (R[0] * d0 + R[1] * d1 + R[2] * d2) / z;
  const y = focal * (R[3] * d0 + R[4] * d1 + R[5] * d2) / z;
  if (!isFinite(x) || !isFinite(y)) return out;
  const lx = Math.max(0, vw * 0.5 - pad), ly = Math.max(0, vh * 0.5 - pad);
  out[0] = Math.max(-lx, Math.min(lx, x));
  out[1] = Math.max(-ly, Math.min(ly, y));
  return out;
}

function drawInset(vw, vh, count) {
  const rects = [];
  for (let i = 0; i < LOUPE_MAG.length; i++) {
    const r = loupeRect(vw, vh, i);
    if (!r) break;
    rects.push(r);
  }
  if (!rects.length) return;
  // The magnified point, as a pixel offset from the middle of the frame. Both squares show the same
  // point; the clamp is against the largest marked region, the weakest magnification's.
  const aim = loupeAim(vw, vh, rects[0].s / (2 * LOUPE_MAG[0]) + 8);
  const px = aim[0], py = aim[1];

  gl.enable(gl.SCISSOR_TEST);
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i], m = LOUPE_MAG[i];
    // The projection scales about the eye axis, so the aim lands at m*(px, py) and the shift is
    // whatever moves that to the middle of the square.
    const cx = r.x + r.s * 0.5 - vw * 0.5, cy = r.y + r.s * 0.5 - vh * 0.5;
    const mag = { m, x: cx - m * px, y: cy - m * py };
    gl.scissor(r.x, r.y, r.s, r.s);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, vw, vh);
    gl.clearColor(0, 0, 0, 0);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    splatPass(vw, vh, count, mag);
    tonePass(vw, vh);                 // still scissored, so it writes the square and nothing else
  }
  gl.disable(gl.SCISSOR_TEST);

  // The marks: a frame around each square, then the region it came from, both a light line between
  // two dark ones, since a single translucent mark at 0.42 alpha vanished on a saturated escape
  // time field. All three rings sit outside the square, clear of the splats it exists to show.
  gl.useProgram(progRect);
  gl.uniform2f(rectUni.uVp, vw, vh);
  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const w = Math.max(1, Math.round(vh / 720));
  for (const r of rects) {
    const x1 = r.x + r.s, y1 = r.y + r.s;
    ring(r.x - 3 * w, r.y - 3 * w, x1 + 3 * w, y1 + 3 * w, w, BLACK_COL, 0.85);
    ring(r.x - 2 * w, r.y - 2 * w, x1 + 2 * w, y1 + 2 * w, w, MARK_COL, 1.0);
    ring(r.x - w, r.y - w, x1 + w, y1 + w, w, BLACK_COL, 0.85);
  }
  // One region box per square, drawn the same way. The second magnification is the square of the
  // first, so the boxes nest in that proportion and the three views read as one continued zoom.
  const mx = vw * 0.5 + px, my = vh * 0.5 + py;
  for (let i = 0; i < rects.length; i++) {
    const h = rects[i].s / (2 * LOUPE_MAG[i]);   // half the side of the region that square shows
    ring(mx - h - 2 * w, my - h - 2 * w, mx + h + 2 * w, my + h + 2 * w, w, BLACK_COL, 0.85);
    ring(mx - h - w, my - h - w, mx + h + w, my + h + w, w, MARK_COL, 1.0);
    ring(mx - h, my - h, mx + h, my + h, w, BLACK_COL, 0.85);
  }
  gl.disable(gl.BLEND);
}

// The captions are HTML, positioned over the canvas from the rectangles the squares are drawn in.
// Those are device pixels and a CSS position is in CSS pixels, differing by the resource tier's
// pixel ratio, so both are scaled by clientWidth/vw and clientHeight/vh. The sentence says the mode
// coarsens the cut on purpose, which is why its splat count is an order of magnitude below normal.
let noteKey = '';
function loupeNote(vw, vh, count) {
  const box = el('loupe-note');
  if (!box) return;                                  // canvas only page, e.g. the capture harness
  const on = !!cfg.gauss && !isDirect() && count > 0 && !!loupeRect(vw, vh, 0);
  const key = on ? vw + 'x' + vh + '/' + canvas.clientWidth + 'x' + canvas.clientHeight : '';
  if (key === noteKey) return;                       // only on a resize, not every frame
  noteKey = key;
  box.hidden = !on;
  if (!on) return;
  const sx = canvas.clientWidth / Math.max(vw, 1);
  const sy = canvas.clientHeight / Math.max(vh, 1);
  let last = null;
  for (let i = 0; i < LOUPE_MAG.length; i++) {
    const lab = el('lz' + i);
    if (!lab) continue;
    const r = loupeRect(vw, vh, i);
    lab.hidden = !r;
    if (!r) continue;
    const m = LOUPE_MAG[i];
    lab.textContent = MULT + (m < 10 ? m.toFixed(1) : String(Math.round(m)));
    lab.style.left = (r.x * sx + 4) + 'px';
    lab.style.top = ((vh - r.y - r.s) * sy + 4) + 'px';
    last = r;
  }
  // Set to the square's own width and dropped below 150 CSS pixels, where at 120 it wraps to seven
  // lines of three words. The squares still carry their magnification.
  const cap = el('lcap');
  if (cap) {
    const wide = last && last.s * sx >= 150;
    cap.hidden = !wide;
    if (wide) {
      cap.style.left = (last.x * sx) + 'px';
      cap.style.top = ((vh - last.y) * sy + 5) + 'px';
      cap.style.width = (last.s * sx) + 'px';
    }
  }
}

function draw(vw, vh, count) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, vw, vh);
  gl.clearColor(0, 0, 0, 0);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  splatPass(vw, vh, count);
  tonePass(vw, vh);
  if (cfg.gauss && count > 0) drawInset(vw, vh, count);
  loupeNote(vw, vh, count);
}

/* ==== src/61_pert.js ================================================== */
/* =========== the escape time field on the GPU, in double single =========== */
// WebGL 2 has no fp64 and a deep zoom needs fourteen digits of the plane coordinate, so a real is a
// pair of floats: about 43 bits on this driver against a double's 53, reaching zoom 1e9 against the
// CPU path's 1e13, at 87 to 95 G iterations a second against 310 M on one CPU thread. Used by
// src/62_direct.js and src/63_gfield.js; the fields returned match planeField in src/32_plane.js,
// so a GPU verdict and a CPU verdict are interchangeable. Perturbation is rejected on measurement:
// the escape count comes out wrong by a mean of 397 iterations and log2|dz| drifts 1.2 to 1.8 high
// whatever the storage, because these frames are mostly far field and a far field point rebases
// within a few dozen iterations. See knowledge/mandelbrot_speed.md. Read exactAdd first.

const PERT_GLSL = `
uniform vec2 uCtrX, uCtrY;   // the plane coordinate the query offsets are measured from, ds
uniform vec2 uCX, uCY;       // the family parameter, ds
uniform int uJulia;
uniform int uPower;
uniform int uMaxIter;

const float PB2 = 1e12;
const float LPB = 13.8155106;            // log(1e6)
const float NU_MIN = 1.5;
// |dz| passes ten to the twelve at a deep bailout and its square overflows fp32, so the derivative is
// carried as a mantissa and a separate binary exponent. Rescaling by a power of two is exact, and the
// bailout test then runs in log space, where it is also cheaper.
//
// This replaced a CAP on |dz|^2 at 1e24, which was written as an overflow guard and used as a bailout.
// The real condemnation fires at |dz| = 2|z|log|z|/rTol, which at ten to the six and a half is 2.2e12,
// so |dz|^2 is 4.8e24 and the guard fired FIRST, on most of the frame, in a branch that never assigned
// nu. Two thirds of a deep frame came out one flat colour.
const float DM_SCALE = 1e18, DM_DOWN = 2.3283064e-10, DM_DOWN2 = 5.4210109e-20;

// ---- double single ---------------------------------------------------------
// A value is a vec2 (hi, lo) standing for hi + lo.
//
// EVERY TEXTBOOK EXACT ADDITION FAILS ON THIS DRIVER, and it fails silently. The classical two sum
// recovers the rounding error after the fact:
//
//     s = a + b;  v = s - a;  e = (b - v) + (a - (s - v));
//
// which is exact in IEEE arithmetic and is ALGEBRAICALLY ZERO. A compiler that assumes addition is
// associative folds it to nothing, and then the shader keeps running and quietly delivers fp32: a
// correct looking image that has gone blocky, with no error anywhere. Measured on ANGLE over D3D11,
// with every operand arriving through a uniform so nothing could be constant folded, three
// formulations return exactly zero: the plain two sum, Dekker's magnitude ordered version, and the
// same with every intermediate forced through uintBitsToFloat(floatBitsToUint(x)), which the HLSL
// compiler sees straight through.
//
// What survives is not recovering the error at all. Split the addends by MASKING mantissa bits so the
// high halves add with nothing to lose and the remainder is exactly the masked off tail: an exponent
// compare, a shift, a mask, and subtractions of exactly representable numbers. No cancelling
// expression anywhere in it, so nothing to reassociate.
float dsSplitHi(float a) { return uintBitsToFloat(floatBitsToUint(a) & 0xfffff000u); }

// s + e = a + b, exactly. Both addends are truncated so their sum lands on a grid coarse enough that a
// carry into the next exponent cannot round it: the larger loses its lowest mantissa bit and the
// smaller is masked down to a multiple of twice the larger's ulp.
//
// The guard is 24 and NOT 25, and that off by one was worth eighteen bits. An fp32 mantissa is bits 0
// to 22, so the mask only touches mantissa bits while sh is at most 23; at sh = 24 it clears the low
// bit of the EXPONENT, which does not lose precision, it changes the value by a factor of two. sh = 24
// is the case where the small addend sits exactly at the ulp of the large one, which happens
// constantly. Measured on the GPU, the orbit carried 22 bits at sixteen iterations and nothing at all
// by a thousand; with the guard at 24, 43.2 bits at sixteen and 33.9 at a thousand.
void exactAdd(float a, float b, out float s, out float e) {
  bool aBig = abs(a) >= abs(b);
  float x = aBig ? a : b;
  float y = aBig ? b : a;
  int ex = (floatBitsToInt(x) >> 23) & 0xff;
  int ey = (floatBitsToInt(y) >> 23) & 0xff;
  int sh = ex - ey + 1;
  if (sh >= 24 || ey == 0 || ex == 0) { s = x; e = y; return; }
  float yh = uintBitsToFloat(floatBitsToUint(y) & (0xffffffffu << uint(sh)));
  float xh = uintBitsToFloat(floatBitsToUint(x) & 0xfffffffeu);
  s = xh + yh;
  e = (x - xh) + (y - yh);
}
vec2 dsAdd(vec2 a, vec2 b) {
  float s, e;
  exactAdd(a.x, b.x, s, e);
  // e, a.y and b.y all sit at or below the ulp of s, so an ordinary sum of them rounds at the 2^-48
  // level, which is this representation's own floor. One more exact addition then moves whatever
  // belongs in the high word up into it.
  float lo = e + (a.y + b.y);
  float s2, e2;
  exactAdd(s, lo, s2, e2);
  return vec2(s2, e2);
}
vec2 dsSub(vec2 a, vec2 b) { return dsAdd(a, vec2(-b.x, -b.y)); }
vec2 dsMul(vec2 a, vec2 b) {
  float ah = dsSplitHi(a.x), al = a.x - ah;      // exact, both halves
  float bh = dsSplitHi(b.x), bl = b.x - bh;
  float p = a.x * b.x;                            // rounded product
  // ... and its exact error, from the four cross terms. ah*bh, ah*bl, al*bh, al*bl each fit in 24
  // bits, so every one is exact, and ah*bh - p is exact by Sterbenz. This one DOES survive: the
  // compiler cannot prove ah*bh equals a.x*b.x, because ah came out of a bit mask, so there is no
  // algebraic identity for it to cancel.
  float e = ((ah * bh - p) + ah * bl + al * bh) + al * bl;
  e += a.x * b.y + a.y * b.x;
  float s, r;
  exactAdd(p, e, s, r);
  return vec2(s, r);
}
// Multiplying by two is exact in binary, so it needs no renormalization at all.
vec2 dsTwice(vec2 a) { return vec2(a.x + a.x, a.y + a.y); }

// The result. why uses the same numbering as pfl in src/32_plane.js: 4 escaped, 2 an attracting cycle,
// 1 condemned by the derivative, 3 out of iterations.
struct Fld { float nu; float de; float gnu; int why; int iters; };

// THE ANALYTIC INTERIOR TEST, IN DOUBLE SINGLE, and it used to be a uniform computed on the CPU at
// the frame's centre and four corners because "it needs the coordinate to full precision, and the
// shader has only an fp32 offset". That was true before this file existed. The shader has the
// coordinate to full precision now: px and py below ARE the point, as a pair, to about 43 bits, so
// the same two lines of algebra run here and answer per pixel.
//
// Not an optimization. Measured at ten to the two and a bit on a 1100x1280 frame of the seahorse
// valley, with the frame straddling the cardioid's boundary so the five point CPU test returned
// "mixed" and switched itself off: a band 25 px wide along the inside of the cardioid, and a ring
// round every bulb in the frame, came back OUT OF ITERATIONS and was painted the flat light grey
// that verdict gets. That band is the "weird thick gray bands especially around the black blobs".
// It is not a colour bug and it is not a cap that is too low: an interior point is proven interior
// only when its orbit closes, the multiplier of a component goes to one at that component's own
// boundary, so the number of iterations needed goes to infinity there no matter what the cap is.
// The cardioid and the period two bulb are the two cases where no orbit is needed at all.
//
//   cardioid:  q = (x - 1/4)^2 + y^2,  inside iff q (q + x - 1/4) < y^2 / 4
//   period 2:  (x + 1)^2 + y^2 < 1/16
//
// Both comparisons are made by subtracting in double single and testing the sign of the HIGH word,
// which is the whole point: near the boundary the two sides cancel to many digits, and in fp32 the
// difference would be noise.
bool dsInMainBody(vec2 x, vec2 y) {
  vec2 y2 = dsMul(y, y);
  vec2 xm = dsSub(x, vec2(0.25, 0.0));
  vec2 q = dsAdd(dsMul(xm, xm), y2);
  // 0.25 * y2 is exact: a power of two scales both words with no rounding.
  if (dsSub(dsMul(q, dsAdd(q, xm)), vec2(0.25 * y2.x, 0.25 * y2.y)).x < 0.0) return true;
  vec2 xp = dsAdd(x, vec2(1.0, 0.0));
  return dsSub(dsAdd(dsMul(xp, xp), y2), vec2(0.0625, 0.0)).x < 0.0;
}

// dc is the offset of this point from uCtr, in plane units, added in double single so the sum keeps
// its digits. rTol is the half size of the cell or half a pixel, whichever the caller means; it drives
// the derivative bailout.
Fld pertField(vec2 dc, float rTol) {
  Fld o;
  o.nu = 0.0; o.de = 0.0; o.gnu = 1e30; o.why = 3; o.iters = 0;
  vec2 px = dsAdd(uCtrX, vec2(dc.x, 0.0));
  vec2 py = dsAdd(uCtrY, vec2(dc.y, 0.0));
  // Proven interior, exactly, in about sixty flops instead of an orbit. See dsInMainBody.
  if (uJulia == 0 && uPower == 2 && dsInMainBody(px, py)) { o.why = 2; return o; }
  vec2 zx, zy, cx, cy;
  float dzx, dzy;
  if (uJulia == 1) { zx = px; zy = py; cx = uCX; cy = uCY; dzx = 1.0; dzy = 0.0; }
  else { zx = vec2(0.0); zy = vec2(0.0); cx = px; cy = py; dzx = 0.0; dzy = 0.0; }

  float lrt2 = 2.0 * log2(max(rTol, 1e-38));
  float one = (uJulia == 1) ? 0.0 : 1.0;
  float fp = float(uPower);
  float lnp = log(fp);
  float m2 = 0.0, dlog2 = 0.0, ltPrev = -1e30;
  int n = 0;
  int per = 8, chk = 8;
  // Brent's reference point, kept as the FULL double single pair rather than as the high words.
  // See the cycle test below; this is the difference between an interior that is proven and an
  // interior that comes back as the out-of-iterations colour over half a deep frame.
  vec2 rrx = vec2(0.0), rry = vec2(0.0);

  for (int it = 0; it < 1000000; it++) {
    if (it >= uMaxIter) break;
    // z^(p-1), with a separate branch for the square. The same split the CPU kernel makes and for the
    // same reason: this loop IS the object. The general form costs four double single multiplies on
    // the p = 2 case that the square needs three of in total. uPower is a uniform, so the branch is
    // coherent across the whole draw and costs nothing in divergence.
    vec2 wx, wy;
    if (uPower == 2) { wx = zx; wy = zy; }
    else {
      wx = vec2(1.0, 0.0); wy = vec2(0.0);
      for (int k = 1; k < 8; k++) {
        if (k >= uPower) break;
        vec2 t = dsSub(dsMul(wx, zx), dsMul(wy, zy));
        wy = dsAdd(dsMul(wx, zy), dsMul(wy, zx));
        wx = t;
      }
    }
    // dz' = p z^(p-1) dz + 1. The derivative is fp32: it only ever feeds a distance estimate and a
    // bailout test, both of which want three digits, not fourteen.
    float mxr = fp * wx.x, myr = fp * wy.x;
    float ndzx = mxr * dzx - myr * dzy + one;
    float ndzy = mxr * dzy + myr * dzx;
    dzx = ndzx; dzy = ndzy;
    vec2 nzx, nzy;
    if (uPower == 2) {
      nzx = dsAdd(dsSub(dsMul(zx, zx), dsMul(zy, zy)), cx);
      nzy = dsAdd(dsTwice(dsMul(zx, zy)), cy);
    } else {
      nzx = dsAdd(dsSub(dsMul(wx, zx), dsMul(wy, zy)), cx);
      nzy = dsAdd(dsAdd(dsMul(wx, zy), dsMul(wy, zx)), cy);
    }
    zx = nzx; zy = nzy;
    n = it + 1;
    m2 = zx.x * zx.x + zy.x * zy.x;
    if (m2 > PB2) { o.why = 4; break; }
    float dm = dzx * dzx + dzy * dzy;
    if (dm > DM_SCALE) { dzx *= DM_DOWN; dzy *= DM_DOWN; dm *= DM_DOWN2; dlog2 += 32.0; }
    if ((it & 7) == 7) {
      // Condemned: the running distance estimate has dropped below rTol, so the boundary is inside
      // this cell or pixel and no further iteration can change the verdict. Written exactly, as
      // m log(m)^2 < rTol^2 |dz|^2, in log2 because the ratio itself passes ten to the twenty five.
      if (m2 > 1.0) {
        float lm = log(m2);
        float lt = log2(dm / (m2 * lm * lm)) + 2.0 * dlog2 + lrt2;
        if (lt > 0.0) {
          // Interpolate the crossing between the last two checks, so the escape count is continuous
          // in the point instead of jumping by eight. In log space that is a division, not two logs.
          float fr = 1.0;
          if (ltPrev > -1e29 && lt > ltPrev) fr = clamp(-ltPrev / (lt - ltPrev), 0.0, 1.0);
          o.nu = float(n) - 8.0 + 8.0 * fr;
          o.why = 1; break;
        }
        ltPrev = lt;
      }
      // BRENT'S CYCLE TEST, ON THE PAIR AND NOT ON THE HIGH WORD, and this one line was most of
      // what looked like a tone bug in this path.
      //
      // An interior point's orbit converges to an attracting cycle, and that convergence is the
      // only thing that ever PROVES interior; running out of iterations proves nothing and is drawn
      // as its own flat colour, which is light. The test used to compare high words with a
      // tolerance of 1e-10, and the note beside it argued that this was the conservative direction
      // because at |z| of order one an fp32 ulp is 1.2e-7, so only bitwise equality could meet it.
      // That is true and it is exactly the problem: a cycle whose multiplier is near one converges
      // geometrically and reaches 1.2e-7 in a few hundred iterations and bitwise equality never,
      // because the low word keeps moving. So at depth NOTHING was ever proven interior. Measured
      // at ten to the six on a 1377x1592 frame, against the CPU path which proves it in doubles:
      // whole interior regions came back as the out-of-iterations grey, about 40 percent of the
      // frame, and the mean displayed luminance was 0.33 against the splat path's 0.26.
      //
      // The pair carries about 43 bits, so the same 1e-10 IS reachable against the pair. The
      // difference of the high words is exact by Sterbenz once they are within a factor of two of
      // each other, which they are long before this fires, so adding the difference of the low
      // words recovers the full precision residual. Same tolerance, same conservatism, and it now
      // fires when the orbit really has closed.
      if (n > 24) {
        float ex = (zx.x - rrx.x) + (zx.y - rrx.y);
        float ey = (zy.x - rry.x) + (zy.y - rry.y);
        if (abs(ex) + abs(ey) < 1e-10) { o.why = 2; break; }
        chk -= 8;
        if (chk <= 0) { rrx = zx; rry = zy; per += per; chk = per; }
      }
    }
  }
  o.iters = n;
  if (o.why == 4) {
    float az = sqrt(m2);
    float lr = 0.5 * log(m2);
    // Smooth escape count: n minus log_p of log|z| over log B, which removes the integer banding and
    // makes nu a continuous function of the point. That continuity is the whole reason the colour can
    // be gradual.
    o.nu = float(n) - log(lr / LPB) / lnp;
    // de = 2|z|log|z| / |dz|, with |dz| carried as a mantissa and an exponent, so recovered through
    // exp2. A point whose derivative has run away underflows to zero, which is the right answer for a
    // point that is on the boundary as far as this cell can tell.
    float ldz = 0.5 * log2(dzx * dzx + dzy * dzy) + dlog2;
    float num = 2.0 * az * lr;
    o.de = num > 0.0 ? exp2(log2(num) - ldz) : 0.0;
    // |grad nu| = |dz| / (|z| log|z| ln p), which the quadtree's split criterion needs.
    o.gnu = exp2(min(ldz - log2(az * max(lr, 1e-12) * lnp), 100.0));
  }
  return o;
}
`;

// A double as the pair of floats the uniforms above take: the nearest fp32 and the residual, itself
// rounded to fp32, so the pair carries about 48 bits.
function splitDS(x) {
  const hi = Math.fround(x);
  return [hi, Math.fround(x - hi)];
}

/* ==== src/62_direct.js ================================================ */
/* ================== the escape time field, per pixel, on the GPU ========== */
// The same field as src/32_plane.js, evaluated once per pixel in a fragment shader rather than once
// per quadtree cell on the CPU: no splats, no refinement, no budget. It is the comparison object
// for the splat path, so everything that can be shared stays shared. Per frame it does 7 to 11
// times more arithmetic and is still faster on wall clock: 310 M iterations a second on one CPU
// thread against 87 to 95 G here (knowledge/mandelbrot_speed.md). Precision is double single, from
// src/61_pert.js: the wall is near 1e9 zoom against the splat path's 1e13, and errPxNow turns the
// descent around at it.
const DIRECT_VS = `#version 300 es
precision highp float;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const DIRECT_FS = `#version 300 es
precision highp float;
precision highp int;
` + PERT_GLSL + `
// ---- geometry --------------------------------------------------------------
uniform vec2 uVp;            // viewport, pixels
uniform float uFocal;
uniform vec2 uA, uB;         // the homography's two numerators, see directMap
uniform vec3 uWrow;          // and its denominator
uniform float uPosY;         // camera height above the plane
uniform float uPix;          // one pixel, in plane units, at the centre of the frame
// ---- appearance ------------------------------------------------------------
uniform float uNuInv;        // 1 / nuCycle
uniform sampler2D uPalTex;   // the colour ramp: PAL x 1, linear light, a closed loop
uniform sampler2D uPalIntTex;// and its integral, (PAL+1) x 1. See rampBox
uniform vec3 uPalMean;
uniform vec3 uLake;
uniform int uSS;             // supersampling grid, uSS by uSS, and 1 is off. See shadePixel
uniform int uDbg;            // 1: draw the recovered pixel coordinate instead of the fractal

out vec4 outColor;

const float TANGLE_SET = 0.45;           // see emitPlane in src/52_cut_plane.js
const float DEEP_SET = 0.60;
const float FILT_MAX = 0.30;
const int PAL_I = ` + PAL + `;           // the palette table's length, shared with src/40_state.js
const float PAL_F = float(PAL_I);

// THE SAME TABLE THE SPLATS USE, THROUGH THE SAME LAW, and both halves of that sentence were
// false until this was written.
//
// This path used to carry the preset's NINE STOPS as a uniform array and interpolate between them
// in linear light. The splat path builds a 256 entry table by interpolating the same stops in
// DISPLAY space and linearizing afterwards. Those are different curves: a lerp between two stops
// lands at the same triple either way, but read as display that triple is darker than read as
// linear light, so the two renderers disagreed about every colour that was not a stop.
//
// MEASURED, over the whole of the old nine stop ramp, and the number is worth writing down
// because the guess was wrong. This path came out 1.4 percent lighter in Oklab L and 2.7 percent
// LESS colourful, with a worst case gap of 0.021 in L, about two percent of the ramp's range. So
// the disagreement was real and it was small, and it is not what the two objects looked different
// by. The answer to that was the anti-aliasing, in planeNeedsAA over in src/52_cut_plane.js, which
// was averaging shaded colours and cost eleven points of saturation and half the detail.
//
// It is fixed anyway, and the reason is not the size of the error. The whole point of having both
// objects in the menu is that the button between them changes the REPRESENTATION and nothing else;
// a difference of any size that comes from the palette rather than from the representation makes
// the comparison say something it does not mean.
//
// So the table crosses as a texture and there are no stops here at all. texelFetch and an explicit
// mix rather than hardware LINEAR filtering, because the integral below needs fp32 and filtering a
// float texture needs an extension this does not otherwise want. No back quotes anywhere in this
// comment, either: it lives inside a JavaScript template literal, and one closed the shader.
vec3 palAt(int i) { return texelFetch(uPalTex, ivec2(i, 0), 0).rgb; }
vec3 ramp(float t) {
  float x = fract(t) * PAL_F;
  int i = int(x);
  return mix(palAt(i), palAt(i + 1 == PAL_I ? 0 : i + 1), x - float(i));
}
// F(v), the integral of the ramp from 0 to v, extended past one period by adding whole period
// integrals: that is exactly palMean per turn. b < 2 always here, so one wrap is enough.
vec3 palIntAt(float t) {
  vec3 add = vec3(0.0);
  if (t >= 1.0) { t -= 1.0; add = uPalMean; }
  float x = t * PAL_F;
  int i = int(x);
  if (i > PAL_I) i = PAL_I;
  vec3 a = texelFetch(uPalIntTex, ivec2(i, 0), 0).rgb;
  vec3 b = texelFetch(uPalIntTex, ivec2(i + 1, 0), 0).rgb;
  return mix(a, b, x - float(i)) + add;
}
// The exact average of the periodic ramp over an interval of width s turns centred on t. Two
// lookups and a subtraction, and it is the SAME arithmetic as rampBox in src/40_state.js, line for
// line. What was here before was twelve stratified samples of the nine stop ramp, which was an
// approximation to a different function.
vec3 rampBox(float t, float s) {
  if (s < 1e-4) return ramp(t);
  if (s >= 1.0) return uPalMean;
  float a = t - 0.5 * s;
  a -= floor(a);
  return (palIntAt(a + s) - palIntAt(a)) * (1.0 / s);
}

// ONE SAMPLE, in linear light, and the whole colour law lives here now.
//
// It used to be inline in main() and it had to move for anti-aliasing, but the move fixed two
// things on its own. The ramp's box filter width came from fwidth(t), the screen space derivative
// of the ramp coordinate, and that is the one place the two paths could not agree because the
// splat path computes the same width analytically from |grad nu|. Worse, fwidth is a difference
// against the NEIGHBOURING FRAGMENT, so at the boundary, where the neighbour is interior and its
// t is a constant standing in for nothing, the width was the difference between a real ramp
// coordinate and a placeholder: garbage exactly where the filter matters. It is now
//
//     span = |grad nu| * (one sample's width) * d t / d nu
//
// which is a property of the point, is what the quadtree already computes per cell, and needs no
// neighbour. And a sample whose distance estimate says the boundary is inside its own footprint
// gets the full width, the same rule and the same cap planeCell uses.
vec3 shadeAt(vec2 dc, float rTol) {
  Fld f = pertField(dc, rTol);
  if (f.why == 2) return uLake;                                   // proven interior
  if (f.why == 3) return mix(uPalMean, uLake, DEEP_SET);          // out of iterations
  float nc = max(f.nu, NU_MIN);
  float t = 3.0 * pow(nc, 1.0 / 3.0) * uNuInv;
  float span = FILT_MAX;
  if (f.why == 4 && f.de >= 1.41421356 * rTol) {
    span = min(f.gnu * 2.0 * rTol * uNuInv / pow(nc, 2.0 / 3.0), FILT_MAX);
  }
  vec3 col = rampBox(t, span);
  // How much of the sample the set fills. de is a lower bound on the distance to the set, so a
  // sample with de >= rTol sqrt(2) cannot contain any of it and gets no darkening at all.
  float k = (f.why == 4) ? 1.0 - f.de / (1.41421356 * rTol) : TANGLE_SET;
  if (k > 0.0) {
    k = min(k, 1.0);
    k = k * k * (3.0 - 2.0 * k);
    col = mix(col, uLake, k);
  }
  float rel = f.de > 0.0 ? clamp(log2(f.de / rTol) * (1.0 / 6.0), 0.0, 1.0) : 0.0;
  return col * (0.88 + 0.22 * rel);
}

// ADAPTIVE SUPERSAMPLING, and adaptive is what makes it affordable.
//
// The escape time field is analytic in the exterior and the ramp is box filtered over the exact
// span the sample covers, so out there one sample is not an approximation, it is the answer: extra
// samples of a linear field average to the same number. Every jagged edge in this render is within
// one distance estimate of the set, and the distance estimate is already in hand from the first
// sample. So: shade the centre, and if it escaped with the boundary more than its own footprint
// away, stop. Otherwise lay down an uSS by uSS grid over the pixel, each sample carrying the
// SUB pixel footprint as its own rTol, and average in linear light.
//
// That last point is what makes it a real supersample rather than a blur: rTol drives the
// derivative bailout and the set fill, so a sub sample is asked the question at its own scale and
// resolves structure the whole pixel cannot. Cost is measured, not assumed; see the note in
// knowledge/plane_lod.md. Only the boundary pixels pay, but the boundary pixels are also the
// expensive ones, so this is switched off entirely while the camera moves.
vec3 shadePixel(vec2 dc, float pix) {
  float rTol = pix * 0.5;
  Fld f = pertField(dc, rTol);
  if (uSS < 2 || (f.why == 4 && f.de >= 2.0 * rTol)) return shadeAt(dc, rTol);
  int n = uSS;
  float inv = 1.0 / float(n);
  float sub = rTol * inv;
  vec3 acc = vec3(0.0);
  for (int j = 0; j < 4; j++) {
    if (j >= n) break;
    for (int i = 0; i < 4; i++) {
      if (i >= n) break;
      vec2 o = pix * vec2((float(i) + 0.5) * inv - 0.5, (float(j) + 0.5) * inv - 0.5);
      acc += shadeAt(dc + o, sub);
    }
  }
  return acc / float(n * n);
}

void main() {
  // Which point of the plane is this pixel: exactly the inverse of place() in src/50_cut.js, as a
  // homography, expressed as an OFFSET from the centre of the frame. The offset is of order the
  // frame width, so fp32 carries it to a ten thousandth of a pixel, and it is ALSO exactly the dc
  // that perturbation wants. That coincidence is the whole reason this path needs no extended
  // precision anywhere: the only quantity that ever needs fourteen digits is the reference point,
  // and that one lives on the CPU.
  float u = (gl_FragCoord.x - 0.5 * uVp.x) / uFocal;
  float v = (gl_FragCoord.y - 0.5 * uVp.y) / uFocal;
  float W = uWrow.x * u + uWrow.y * v + uWrow.z;
  vec2 dc = uPosY * (uA * u + uB * v) / W;
  vec2 off = dc;

  // A diagnostic that earned its place. When the deep frame came back quantized into blocks exactly
  // one fp32 ulp of the frame centre across, there were two candidates, the coordinate and the
  // orbit, and no way to tell them apart from a picture of a fractal. This draws the coordinate
  // alone, as a four pixel sawtooth. Reached with dbg=1, and free when off.
  if (uDbg == 1) {
    float qx = off.x / uPix, qy = off.y / uPix;
    outColor = vec4(fract(qx * 0.25), fract(qy * 0.25), 0.5 * fract(qx * 0.03125), 1.0);
    return;
  }

  // Evaluation only: draw the VERDICT rather than the colour, at one sample. Two of the four
  // verdicts are dark and two are mid, so a frame cannot be read for which one it is, and the one
  // bug this path has had twice is a verdict that is right on the CPU and wrong here. dbg=2.
  //   red escaped, blue proven interior, green condemned, white out of iterations.
  if (uDbg == 2) {
    Fld f = pertField(dc, uPix * 0.5);
    vec3 c2 = vec3(1.0);
    if (f.why == 2) c2 = vec3(0.1, 0.3, 1.0);
    else if (f.why == 4) c2 = vec3(1.0, 0.2, 0.1);
    else if (f.why == 1) c2 = vec3(0.1, 0.8, 0.2);
    outColor = vec4(c2, 1.0);
    return;
  }
  // ---- colour, the same law the splats use ---------------------------------
  // Same ramp coordinate, same box filter, same set fill guesses, same proximity shading, and now
  // the same ANALYTIC filter width as well. The point of this object is a comparison, so anything
  // different here would make it useless. See shadeAt and shadePixel.
  vec3 col = shadePixel(dc, uPix);
  // The same tail as TONE_FS in src/60_gl.js: hold saturation, then encode.
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = max(mix(vec3(l), col, 1.14), vec3(0.0));
  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

// Present an already shaded RGBA8 texture. A still pass fills one a band at a time and shows it.
const BLIT_FS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uVp;
out vec4 outColor;
void main() { outColor = texelFetch(uTex, ivec2(gl_FragCoord.xy), 0); }`;

const DIRECT_UNI = ['uVp', 'uFocal', 'uA', 'uB', 'uWrow', 'uPosY', 'uPix', 'uNuInv',
  'uPalTex', 'uPalIntTex', 'uPalMean', 'uLake', 'uSS', 'uDbg',
  'uCtrX', 'uCtrY', 'uCX', 'uCY', 'uJulia', 'uPower', 'uMaxIter'];
let progDirect = null, progBlit = null, blitUni = {};
const dirUni = {};
// The progressive target and where the pass has got to. See drawDirect.
let dirFbo = null, dirTex = null, dirTW = 0, dirTH = 0;
let dirBand = 0, dirBands = 1, dirPassCap = 0, dirHave = false, dirDone = false;
// The cap the shader runs at and the one it climbs towards, as in the splat path's stationary ramp.
let dirCap = 800, dirWant = 800, dirIters = 0, dirMs = 0, dirSS = 1;
// Strips per frame. A single draw call running a second or more trips the Windows display driver
// reset, which kills the context; eight strips bound one command without changing the frame.
const DIR_STRIPS = 8;
// The ceiling on pixels times iterations in one frame. dsrate.html times this kernel on an off
// screen 1377x1592 target with a pipeline flush around it, RTX 4090 through ANGLE and D3D11: 87 to
// 95 G iterations a second in double single, against 1900 to 2190 G for plain fp32 and 310 M for
// one CPU thread. Every constant below follows from the 95 G figure. Two ceilings, as planeRoot has
// two: a moving camera is paying latency and a still one is not, so moving gets 2e9 pixel
// iterations, a 21 ms frame.
let DIR_WORK_MOVE = 2.0e9;
// The still ceiling, twenty times the moving one, because a still frame is a pass rather than a
// frame. At zoom 1e6 the view needs a cap near 95 000; a ceiling of 2e10 over a two megapixel frame
// allowed 9 000, leaving 40 percent of the frame at the flat out-of-iterations colour, mean
// displayed luminance 0.33 against the splat path's 0.26. But 95 000 over two megapixels is 2.1e11
// iterations, 2.2 s at 95 G, too long for one draw, so the pass is split into bands of
// DIR_BAND_WORK, one per frame: a shallow view converges in one band and a deep one takes as many
// as it needs.
let DIR_WORK = 4.0e11;
// About 65 ms of GPU at the measured double single rate. Evaluation only, settable by `bw=`: a
// headless page renders about four frames before its time budget expires, so a banded pass never
// finishes there and a capture needs `bw=1e12`, which puts the whole pass in one band.
let DIR_BAND_WORK = 6.0e9;
const DIR_BAND_MAX = 96;
// Evaluation only: draw the recovered pixel coordinate instead of the fractal. See uDbg.
let DIR_DBG = 0;
// The supersampling grid for a still frame, uSS by uSS inside each pixel of the boundary layer; 1
// is off. Two rather than three by default, from knowledge/plane_lod.md: the third sample changes
// the frame by under a percent of full range for another factor of two in cost. A moving frame
// never supersamples, because under DIR_WORK_MOVE that factor would come out of the iteration cap
// instead.
let DIR_SS = 2;

function isDirect() { return !!PRESETS[cfg.preset].direct; }

// Linked asynchronously: the double single orbit takes about a second through the HLSL compiler.
let dirLink = null;
function initDirect() {
  if (!dirLink) dirLink = linkAsync(DIRECT_VS, DIRECT_FS);
  if (!linkReady(dirLink)) return false;
  progDirect = dirLink.p;
  for (const k of DIRECT_UNI) dirUni[k] = gl.getUniformLocation(progDirect, k);
  progBlit = link(DIRECT_VS, BLIT_FS);
  blitUni.uTex = gl.getUniformLocation(progBlit, 'uTex');
  dirTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  dirFbo = gl.createFramebuffer();
  return true;
}

// The palette and its integral, as two one row RGBA32F textures. fp32 and not fp16: rampBox reads
// the integral as a difference of two nearby values, so over a span of a thousandth of a turn a
// half float's eleven bit mantissa leaves about one bit of answer. The 257 texel table is three
// kilobytes.
let palTex = null, palIntTex = null, palTexGen = -1;
const palBuf = new Float32Array(PAL * 4), palIntBuf = new Float32Array((PAL + 1) * 4);
function palUpload() {
  if (palTexGen === palGen) return;
  palTexGen = palGen;
  if (!palTex) {
    palTex = gl.createTexture(); palIntTex = gl.createTexture();
    for (const t of [palTex, palIntTex]) {
      gl.bindTexture(gl.TEXTURE_2D, t);
      // NEAREST throughout: every lookup in the shader is a texelFetch with the interpolation
      // written out, so no sampler state is consulted and no float filtering extension is needed.
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }
  }
  for (let i = 0; i < PAL; i++) {
    palBuf[i * 4] = palette[i * 3]; palBuf[i * 4 + 1] = palette[i * 3 + 1];
    palBuf[i * 4 + 2] = palette[i * 3 + 2]; palBuf[i * 4 + 3] = 1;
  }
  for (let i = 0; i <= PAL; i++) {
    palIntBuf[i * 4] = palInt[i * 3]; palIntBuf[i * 4 + 1] = palInt[i * 3 + 1];
    palIntBuf[i * 4 + 2] = palInt[i * 3 + 2]; palIntBuf[i * 4 + 3] = 1;
  }
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PAL, 1, 0, gl.RGBA, gl.FLOAT, palBuf);
  gl.bindTexture(gl.TEXTURE_2D, palIntTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PAL + 1, 1, 0, gl.RGBA, gl.FLOAT, palIntBuf);
}

// The progressive target, at the size of the frame. RGBA8 suffices: the shader writes the finished
// pixel, gamma encoded, so there is nothing to accumulate and nothing that needs range.
function dirResize(vw, vh) {
  if (vw === dirTW && vh === dirTH) return true;
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, vw, vh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dirFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, dirTex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  dirTW = ok ? vw : 0; dirTH = ok ? vh : 0;
  dirHave = false; dirBand = 0;
  return ok;
}

// The image to plane map, in closed form. A pixel's ray is d = u*right + v*up + fwd and the plane
// is y = 0, so the hit is pos - pos_y * d / d_y, a homography. As an offset from the frame centre
// it loses the large common part exactly:
//
//   hit_x - ctr_x = pos_y (u ax + v bx) / W,   ax = fwd_x r_y / fwd_y - r_x
//   W = u r_y + v up_y + fwd_y
//
// so everything the shader touches per pixel is of order one except pos_y, and the centre, the only
// quantity needing more than fp32, is the perturbation reference point and stays on the CPU. Kept a
// separate function so the headless suite can compose it with place() and demand the identity: a
// slightly wrong hand derived inverse renders a correct looking image of the wrong region.
function directMap(vw, vh) {
  updateBasis();
  const focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  const r = basis.right, up = basis.up, f = basis.fwd, pos = basis.pos;
  const fy = f[1];
  if (!(Math.abs(fy) > 1e-9)) return null;       // looking along the plane, nothing to draw
  const t0 = -pos[1] / fy;
  const m = {
    focal, vw, vh, posY: pos[1],
    ctrX: pos[0] + t0 * f[0],
    ctrZ: pos[2] + t0 * f[2],
    ax: f[0] * r[1] / fy - r[0], bx: f[0] * up[1] / fy - up[0],
    az: f[2] * r[1] / fy - r[2], bz: f[2] * up[1] / fy - up[2],
    wr: r[1], wu: up[1], wf: fy,
  };
  // One pixel, in plane units, at the centre of the frame. This is the rTol every bailout in the
  // shader is measured against, exactly as a cell's half size is on the CPU.
  m.pix = Math.abs(m.posY) * Math.hypot(m.ax, m.az) / (focal * Math.abs(fy));
  return m;
}

// The same map the shader applies, in doubles, for a pixel in the renderer's own screen
// coordinates: x right, y down from the top, which is what place() writes into pool.sx and pool.sy.
// The shader flips y because gl_FragCoord counts from the bottom.
function directPlaneAt(m, sx, sy) {
  const u = (sx - 0.5 * m.vw) / m.focal, v = (0.5 * m.vh - sy) / m.focal;
  const W = m.wr * u + m.wu * v + m.wf;
  return [m.ctrX + m.posY * (m.ax * u + m.bx * v) / W,
          m.ctrZ + m.posY * (m.az * u + m.bz * v) / W];
}

// The analytic interior test is per pixel, in double single, inside pertField; see dsInMainBody
// in src/61_pert.js. It needs the plane coordinate to full precision, which a per frame CPU verdict
// over the frame corners cannot supply.

// The iteration cap for the next frame, in the same two regimes as planeRoot. Moving, the cap is
// hill climbed against measured frame time, because EXT_disjoint_timer_query is off in Chrome by
// default; under vsync the frame time is pinned at 16.7 ms and says nothing, so the climb is one
// sided: raise until the frame time comes off the vsync floor, then back off. Still, it goes to the
// target.
function directCap(moving, lastMs, ss) {
  const lz = Math.max(0, logZoom());
  const want = Math.max(80, Math.min(200000, cfg.iters * (1 + 0.45 * lz) * 16));
  // The work ceiling bounds orbits, and a supersampled pixel runs ss*ss of them, so the ceiling on
  // the iteration cap comes down by the same factor.
  const ceil = (moving ? DIR_WORK_MOVE : DIR_WORK)
    / Math.max(fboW * fboH * ss * ss, 1);
  dirWant = Math.min(want, ceil);
  if (moving) {
    if (lastMs > 26) dirCap = Math.max(200, dirCap * 0.72);
    else if (dirCap < dirWant) dirCap = Math.min(dirWant, dirCap * 1.3);
    else dirCap = dirWant;
  } else {
    // Taken outright rather than climbed to: a still frame is a pass of as many bands as the work
    // needs, so the frame rate is bounded by the band and not by the cap.
    dirCap = dirWant;
  }
  return Math.round(dirCap);
}

function drawDirect(vw, vh, moving, lastMs) {
  // Not linked yet: clear to the background and let the frame loop keep running.
  if (!progDirect && !initDirect()) { dirClear(vw, vh); return; }
  const P = PRESETS[cfg.preset];
  const m = directMap(vw, vh);
  if (!m) return;
  const off = dirResize(vw, vh);
  // The pass. Moving, the frame is one draw at whatever cap fits inside a vsync. Still, it is a
  // pass at the converged cap, one horizontal band per frame into the off screen target, which is
  // presented every frame; a new pass starts when the camera moves or the target cap changes. Bands
  // go into the texture the screen is reading, so a frame in flight is part old pass and part new
  // and the seam is a step in how far the boundary layer has resolved. Supersampling is a property
  // of the pass, so it is fixed here and used for the cap, the band count and the shader alike.
  const ss = moving ? 1 : Math.max(1, Math.min(4, Math.round(DIR_SS)));
  dirSS = ss;
  const cap = directCap(moving, lastMs, ss);
  // The cap a whole frame in one draw can afford. Used while moving, and for the first still frame
  // after a move so the screen is not empty while the pass runs: at zoom 1e6 the pass cap of 88 800
  // as one draw is over two seconds, which is a display driver reset.
  const cheap = Math.max(200, Math.round(DIR_WORK_MOVE / Math.max(vw * vh, 1)));
  // Orbits per frame, for the band arithmetic. ss*ss is the worst case rather than the mean, since
  // only the boundary layer supersamples: too many bands costs frames, too few costs a driver
  // reset.
  const work = vw * vh * ss * ss;
  let whole, passCap;
  if (moving || !off) {
    whole = true; passCap = moving ? cap : cheap;
    dirBand = 0; dirDone = false; dirPassCap = 0;
  } else if (!dirHave) {
    // Nothing on the target yet: lay down a whole frame before banding, or the screen shows one
    // band of an undefined texture. At the cheap cap, unless the whole pass already fits in one
    // band.
    whole = true;
    dirPassCap = cap;
    dirBands = Math.max(1, Math.min(DIR_BAND_MAX, Math.ceil(work * cap / DIR_BAND_WORK)));
    passCap = dirBands === 1 ? cap : cheap;
    dirDone = dirBands === 1;
  } else {
    whole = false;
    if (dirBand === 0 && (!dirDone || cap !== dirPassCap)) {
      dirPassCap = cap;
      dirBands = Math.max(1, Math.min(DIR_BAND_MAX,
        Math.ceil(work * dirPassCap / DIR_BAND_WORK)));
      dirDone = false;
    }
    passCap = dirPassCap;
    // Converged and unchanged: present what is there and do no work.
    if (dirDone) { dirIters = passCap; dirPresent(vw, vh); return; }
  }
  dirIters = passCap;
  const pw = Math.max(2, Math.min(8, Math.round(cfg.power)));
  const julia = P.julia ? 1 : 0;
  const cX = splitDS(m.ctrX), cZ = splitDS(m.ctrZ);
  const jx = splitDS(cfg.cx), jy = splitDS(cfg.cy);

  // Always into the off screen target when there is one, and present from it: a read back from the
  // default framebuffer is the one blit whose source format this file does not control.
  gl.bindFramebuffer(gl.FRAMEBUFFER, off ? dirFbo : null);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progDirect);
  gl.uniform2f(dirUni.uCtrX, cX[0], cX[1]);
  gl.uniform2f(dirUni.uCtrY, cZ[0], cZ[1]);
  gl.uniform2f(dirUni.uCX, jx[0], jx[1]);
  gl.uniform2f(dirUni.uCY, jy[0], jy[1]);
  gl.uniform2f(dirUni.uVp, vw, vh);
  gl.uniform1f(dirUni.uFocal, m.focal);
  gl.uniform2f(dirUni.uA, m.ax, m.az);
  gl.uniform2f(dirUni.uB, m.bx, m.bz);
  gl.uniform3f(dirUni.uWrow, m.wr, m.wu, m.wf);
  gl.uniform1f(dirUni.uPosY, m.posY);
  gl.uniform1f(dirUni.uPix, m.pix);
  gl.uniform1i(dirUni.uJulia, julia);
  gl.uniform1i(dirUni.uPower, pw);
  gl.uniform1i(dirUni.uMaxIter, passCap);
  gl.uniform1i(dirUni.uSS, ss);
  gl.uniform1i(dirUni.uDbg, DIR_DBG);
  gl.uniform1f(dirUni.uNuInv, 1 / (P.nuCycle || 4.5));
  palUpload();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.uniform1i(dirUni.uPalTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palIntTex);
  gl.uniform1i(dirUni.uPalIntTex, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform3f(dirUni.uPalMean, palMean[0], palMean[1], palMean[2]);
  gl.uniform3f(dirUni.uLake, lakeCol[0], lakeCol[1], lakeCol[2]);
  // Rows this call owns: the whole frame while moving or before the target is filled, else a band.
  const b0 = whole ? 0 : Math.floor(vh * dirBand / dirBands);
  const b1 = whole ? vh : Math.floor(vh * (dirBand + 1) / dirBands);
  gl.enable(gl.SCISSOR_TEST);
  const t1 = performance.now();
  for (let s = 0; s < DIR_STRIPS; s++) {
    const y0 = b0 + Math.floor((b1 - b0) * s / DIR_STRIPS);
    const y1 = b0 + Math.floor((b1 - b0) * (s + 1) / DIR_STRIPS);
    if (y1 <= y0) continue;
    gl.viewport(0, 0, vw, vh);
    gl.scissor(0, y0, vw, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.flush();
  }
  gl.disable(gl.SCISSOR_TEST);
  // Wall time of the submission, not of the work: the only signal available without a timer query,
  // and a submission that blocks has filled the driver's queue.
  dirMs = performance.now() - t1;
  if (!off) return;                      // no target: that draw went straight to the screen
  if (whole) { dirHave = true; dirBand = 0; }
  else if (dirBand + 1 < dirBands) dirBand++;
  else { dirBand = 0; dirDone = true; }
  dirPresent(vw, vh);
}

// The background alone, for the frames before the orbit shader has finished linking.
function dirClear(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(Math.pow(bg0[0], 1 / 2.2), Math.pow(bg0[1], 1 / 2.2), Math.pow(bg0[2], 1 / 2.2), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

// The only path to the default framebuffer while the camera holds still.
function dirPresent(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(progBlit);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.uniform1i(blitUni.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Click to dive is gone from every path; see the pointerup handler in src/70_ui.js.

/* ==== src/63_gfield.js ================================================ */
/* ============ the escape time field, in batches, on the GPU =============== */
// Batched evaluation of the escape time field. Only the arithmetic moves to the GPU: the walk that
// decides which cells exist costs under 1 us of the 25 us a cell takes. stepPlane is level
// synchronous and cells within a level are independent, so one level of children is one batch; see
// planeFlush in 52_cut_plane.js. Levels grow about 4x, so the last four hold 99 percent of the
// cells and the top ten are cheaper on the CPU than a batch costs. The readback is synchronous by
// necessity: level n+1's queries need level n's answers, so a fence has nothing to overlap; cost
// per round trip is in knowledge/mandelbrot_speed.md.

// Queries are (dcx, dcy, rTol) and answers are (nu, de, gnu, kind + 8*iters), both RGBA32F, both
// indexed by a linear slot. GF_W is a power of two so the shader forms the slot by shift and or.
const GF_W = 1024, GF_WSHIFT = 10, GF_WMASK = GF_W - 1;
// Largest batch: 512k covers one whole level of a 500 000 splat cut. Anything larger is chunked.
const GF_CAP = 1 << 19;
// Below this the fixed cost of a batch, upload plus draw setup plus flush, exceeds what it saves.
let GF_MIN = 4096;
let gfOn = true;                    // master switch, so `gf=0` measures without it

const GF_VS = `#version 300 es
precision highp float;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const GF_FS = `#version 300 es
precision highp float;
precision highp int;
` + PERT_GLSL + `
uniform sampler2D uQ;        // the queries: dcx, dcy, rTol
uniform int uCount;
out vec4 outColor;
void main() {
  ivec2 t = ivec2(gl_FragCoord.xy);
  int slot = (t.y << ${GF_WSHIFT}) | t.x;
  if (slot >= uCount) { outColor = vec4(0.0); return; }
  vec3 q = texelFetch(uQ, t, 0).xyz;
  Fld f = pertField(q.xy, q.z);
  // kind, packed as a float, with the same numbering planeCell uses so the CPU side needs no
  // translation: 0 escaped, 1 proven interior, 2 condemned, 3 exhausted. See planeCell.
  float kind = f.why == 2 ? 1.0 : (f.why == 4 ? 0.0 : (f.why == 1 ? 2.0 : 3.0));
  outColor = vec4(f.nu, f.de, f.gnu, kind + 8.0 * float(f.iters));
}`;

let progGF = null, gfQTex = null, gfFbo = null, gfOutTex = null, gfH = 0;
const gfUni = {};
// Query and answer staging, one slot per query, four floats each.
let gfQ = new Float32Array(GF_W * 4 * 4);
let gfA = new Float32Array(GF_W * 4 * 4);
let gfBatches = 0, gfQueries = 0, gfMs = 0;

// Room for `n` queries, the same rectangle gfEvaluate uploads, so the caller can fill gfQ first.
// Grown on demand and never shrunk: a cut asks for the same order of magnitude every frame.
function gfReserve(n) {
  const need = GF_W * Math.max(1, Math.ceil(Math.min(n, GF_CAP) / GF_W)) * 4;
  if (gfQ.length < need) gfQ = new Float32Array(need);
}

// Started, not finished: reading the program before it reports complete is what blocks, so
// initGField polls linkReady and leaves progGF null until then.
let gfLink = null;
function initGField() {
  if (!gfLink) gfLink = linkAsync(GF_VS, GF_FS);
  if (!linkReady(gfLink)) return;
  progGF = gfLink.p;
  for (const k of ['uQ', 'uCount', 'uCtrX', 'uCtrY', 'uCX', 'uCY', 'uJulia', 'uPower',
                   'uMaxIter']) {
    gfUni[k] = gl.getUniformLocation(progGF, k);
  }
  gfQTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gfOutTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gfOutTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gfFbo = gl.createFramebuffer();
}

// Grow only, to a power of two: reallocating the 1024 by h RGBA32F pair on every call cost over a
// second of the opening build, because respecifying a texture the previous draw still references
// flushes the driver pipeline. Over allocating is free, the draw and the readback both use `h`.
function gfResize(h) {
  if (h <= gfH) return true;
  h = 1 << Math.ceil(Math.log2(h));
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, GF_W, h, 0, gl.RGBA, gl.FLOAT, null);
  gl.bindTexture(gl.TEXTURE_2D, gfOutTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, GF_W, h, 0, gl.RGBA, gl.FLOAT, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gfFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gfOutTex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gfH = ok ? h : 0;
  return ok;
}

// True when the batch path is enabled and GL is up. fboInternal is nonzero whatever format initGL
// picked, so this does not prove a float render target; gfResize is what proves that.
function gfReady() {
  return gfOn && typeof gl !== 'undefined' && gl && fboInternal !== 0;
}

// Evaluate `n` queries. gfQ holds (dcx, dcy, rTol, unused) per slot, gfA receives
// (nu, de, gnu, kind + 8*iters). One upload, one draw, one synchronous readback. iters rides in the
// fourth channel rather than a fifth: kind is 0 to 3 and iters an integer, so kind + 8*iters is
// exact in fp32 to 2 097 152 iterations, ten times job.maxIter's 200 000 ceiling.
function gfEvaluate(n, maxIter, ctrX, ctrZ) {
  if (!progGF) initGField();
  if (n > GF_CAP) return false;
  const h = Math.max(1, Math.ceil(n / GF_W));
  if (!gfResize(h)) return false;
  if (gfA.length < GF_W * h * 4) gfA = new Float32Array(GF_W * h * 4);
  if (gfQ.length < GF_W * h * 4) return false;      // caller skipped gfReserve
  const t0 = performance.now();
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GF_W, h, gl.RGBA, gl.FLOAT,
                   gfQ.subarray(0, GF_W * h * 4));
  gl.bindFramebuffer(gl.FRAMEBUFFER, gfFbo);
  gl.viewport(0, 0, GF_W, h);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(progGF);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.uniform1i(gfUni.uQ, 0);
  // Origin the query offsets are measured from, as a double single pair. The caller supplies it
  // with the offsets so the two cannot disagree; ctrZ is the world axis that is the plane's y.
  const cX = splitDS(ctrX), cZ = splitDS(ctrZ);
  const jx = splitDS(job.c0x), jy = splitDS(job.c0y);
  gl.uniform2f(gfUni.uCtrX, cX[0], cX[1]);
  gl.uniform2f(gfUni.uCtrY, cZ[0], cZ[1]);
  gl.uniform2f(gfUni.uCX, jx[0], jx[1]);
  gl.uniform2f(gfUni.uCY, jy[0], jy[1]);
  gl.uniform1i(gfUni.uJulia, job.julia);
  gl.uniform1i(gfUni.uPower, job.power);
  gl.uniform1i(gfUni.uMaxIter, maxIter);
  gl.uniform1i(gfUni.uCount, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, GF_W, h, gl.RGBA, gl.FLOAT, gfA);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
  gfMs += performance.now() - t0;
  gfBatches++; gfQueries += n;
  return true;
}

/* ==== src/70_ui.js ==================================================== */
// 70_ui.js is the front end: pointer and keyboard input, the control panel, the deep link query
// parser, the HUD, and the requestAnimationFrame loop that advances the camera and steps the cut.
// Nothing here computes geometry; it drives the pieces in 40_state.js, 50_cut.js and 60_gl.js.
// The camera state lives in the current anchor's frame rather than in world coordinates, so
// anything that writes cam.target or cam.goal runs after the anchor word has been replayed.
// Query parameters are parsed in applyURL; the ones marked evaluation only exist for the capture
// harnesses in workbench and are not part of the demo.

/* ============================== interaction ============================= */
let drag = null, moved = 0;

// Drag rotates a 3D object and is ignored for a 2D one. There is no pan and no click to re-aim:
// the aim point is the only thing holding the camera near the object. Pinch replaces the wheel on
// touch, and the pointer map is kept rather than a start span so a paused pinch does not jump.
const touches = new Map();
let pinch = 0;
function pinchSpan() {
  const p = [...touches.values()];
  if (p.length < 2) return 0;
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

function attachInput(cv) {
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) { pinch = pinchSpan(); drag = null; return; }
    drag = { x: e.clientX, y: e.clientY };
    moved = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size >= 2) {
      const s = pinchSpan();
      if (pinch > 4 && s > 4) {
        // Spreading the fingers means closer, so the camera distance falls by the span ratio.
        cam.dist = Math.min(cam.dist * (pinch / s), cam.startDist * 40);
        rebaseAll();
        dirty = true;
      }
      pinch = s;
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (is2D(PRESETS[cfg.preset])) return;
    // Rotation about the eye's own axes; pi radians across the canvas width.
    const k = Math.PI / Math.max(cv.clientWidth || 1, 1);
    turnCamera(-dx * k, -dy * k);
    dirty = true;
  });
  cv.addEventListener('pointerup', e => {
    const wasPinch = touches.size >= 2;
    touches.delete(e.pointerId);
    pinch = pinchSpan();
    const wasDrag = moved > 6;
    drag = null;
    // No tap to re-aim. Wheel and pinch move along the existing aim, which cannot leave the object.
  });
  cv.addEventListener('pointercancel', e => {
    touches.delete(e.pointerId); pinch = pinchSpan(); drag = null;
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const step = Math.sign(e.deltaY) * Math.min(1, Math.abs(e.deltaY) / 320) * 0.3;
    cam.dist = Math.min(cam.dist * Math.exp(step), cam.startDist * 40);
    rebaseAll();
    dirty = true;
  }, { passive: false });
  window.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.target && e.target.isContentEditable) return;   // the typed speed, see #v-rate
    if (e.key === ' ') { cfg.autopilot = !cfg.autopilot; syncUI(); e.preventDefault(); }
    else if (e.key === 'x' || e.key === 'X') swapRepresentation();
    else if (e.key === 'g' || e.key === 'G') toggleGauss();
    else if (e.key === 'r' || e.key === 'R') resetView();
    // Only when there is something to restore, so Escape never HIDES anything and never fights
    // the browser's own use of it for leaving full screen.
    else if (e.key === 'Escape' && uiHidden) setUIHidden(false);
  });
}

/* ================================= UI =================================== */
const el = id => (typeof document === 'undefined' ? null : document.getElementById(id));

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'G';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

// Slider position in [0, 1] to speed and back. Linear on [0, SPD_KNEE_X] from SPD_MIN to
// SPD_KNEE, geometric above it up to SPD_MAX, so the two pieces agree at the knee. spdToPos
// saturates at 1, so a typed speed above SPD_MAX parks the handle at the right hand stop.
function spdFromPos(x) {
  x = Math.max(0, Math.min(1, x));
  if (x <= SPD_KNEE_X) return SPD_MIN + (SPD_KNEE - SPD_MIN) * (x / SPD_KNEE_X);
  return SPD_KNEE * Math.pow(SPD_MAX / SPD_KNEE, (x - SPD_KNEE_X) / (1 - SPD_KNEE_X));
}
function spdToPos(v) {
  if (!(v > SPD_MIN)) return 0;
  if (v <= SPD_KNEE) return SPD_KNEE_X * (v - SPD_MIN) / (SPD_KNEE - SPD_MIN);
  return Math.min(1, SPD_KNEE_X + (1 - SPD_KNEE_X) *
    Math.log(v / SPD_KNEE) / Math.log(SPD_MAX / SPD_KNEE));
}
// Three significant figures at every magnitude in a fixed width, so the panel does not reflow.
function fmtSpeed(v) { return v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0); }

const SLIDERS = [
  // Speed is shown as a multiple of RATE1, not in e-folds a second.
  ['s-rate', 'rate', v => spdFromPos(v) * RATE1, () => fmtSpeed(cfg.rate / RATE1)],
  ['s-cx', 'cx', v => v, () => cfg.cx.toFixed(3)],
  ['s-cy', 'cy', v => v, () => cfg.cy.toFixed(3)],
  ['s-power', 'power', v => Math.round(v), () => 'z^' + Math.round(cfg.power)],
];
const SLIDER_INV = {};
// State back to slider units, so a rate from the query string or a preset positions the handle.
SLIDER_INV.rate = r => spdToPos(r / RATE1);

function syncUI() {
  if (!el('s-rate')) return;
  const set = (id, v) => { const s = el(id); if (s && document.activeElement !== s) s.value = v; };
  for (const [id, key, , show] of SLIDERS) {
    const inv = SLIDER_INV[key];
    set(id, inv ? inv(cfg[key]) : cfg[key]);
    const v = el('v-' + id.slice(2));
    // Never while focused: #v-rate is contenteditable, and rewriting its textContent under a
    // caret moves the caret to the start.
    if (v && document.activeElement !== v) v.textContent = show();
  }
  const sel = el('preset');
  if (sel && sel.value !== menuValue()) sel.value = menuValue();   // a URL may override the default
  // The run control shows the action rather than the state, the media control convention.
  const b = el('btn-run');
  if (b) {
