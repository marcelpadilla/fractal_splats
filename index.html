  for (const w of aimWords(P)) {
    for (let i = 0; i < targets.length; i++) {
      if (targets[i].word && targets[i].word.join('.') === w) { aimList.push(i); break; }
    }
  }
  if (aimList.length) aimIdx = aimList[0];

  if (!keepView) {
    // Only the escape time fields open still. Their cut costs hundreds of milliseconds and goes on
    // sharpening for seconds while the camera holds, so an opening frame in flight is the coarse
    // one. On the kind and not on is2D, which is true of a flat IFS too, and set before the view
    // so a preset can still say otherwise.
    cfg.autopilot = P.kind !== 'plane';
    const v = P.view;
    if (v) for (const k in v) if (k in cfg) cfg[k] = v[k];
    const terr = P.kind === 'terrain';
    const yaw = (v && v.yaw !== undefined) ? v.yaw : (terr ? 0.22 : 0.6);
    // The terrain wants a steep view: a distance field terrain is locally a smooth cone flank, so
    // a low raking angle shows one featureless slope, while its fractal character is in the plan
    // of the ridge network, which only reads from above.
    const pitch = (v && v.pitch !== undefined) ? v.pitch : (terr ? -0.98 : -0.24);
    if (!v || v.budget === undefined) cfg.budget = 250000;
    kern = kernelConst(cfg.kernel);
    // Frame the measured extent, not a guess in sigmas: a sphere of radius suppE exactly fills the
    // vertical field, and 0.98 leaves a hair of margin. The field of view is vertical, so a
    // portrait window sees less of the object across than down and cropped the Pythagoras tree in
    // half; frameAspect() pulls back by the ratio. On the plane presets the field is 15 degrees,
    // where the distance varies by 0.9 percent from frame centre to corner, so it is orthographic.
    cam.dist = 0.98 * suppE / Math.sin(0.5 * cam.fov) * frameAspect();
    cam.startDist = cam.dist;
    if (P.kind === 'terrain') {
      cam.target[0] = P.center[0];
      cam.target[1] = terrHMax * 0.22;
      cam.target[2] = P.center[1];
      camFromAngles(yaw, pitch);
    } else if (P.kind === 'plane') {
      cam.target.set([P.center[0], 0, P.center[1]]);
      // Straight at the plane, from -y, and a hair off the pole: 1.5703 is pi/2 - 5e-4, which
      // keeps orthoBasis's level branch above its 1e-6 degeneracy floor. The plane's coordinates
      // are the real and imaginary parts of a complex number, drawn real to the right and
      // imaginary up. With a right handed basis, forward = -y and up = +z force right = -x, so
      // looking down at the card draws the set rotated by half a turn against a per pixel
      // reference. From -y, right = +x and up = +z, and a Gaussian looks the same from either side.
      camFromAngles(Math.PI, 1.5703);
    } else {
      cam.target.set(root.mu);
      camFromAngles(yaw, pitch);
    }
    setGoal(aimIdx);
  }
  orthoBasis();
  dirty = true;
  syncUI();
}

// What a preset names as its descent aims. `aims` is the measured list, interior first; `aim` is
// the older single word form. Both are strings of map indices joined by dots.
function aimWords(P) {
  if (Array.isArray(P.aims)) return P.aims;
  return P.aim !== undefined ? [P.aim] : [];
}

function setGoal(i) {
  if (!targets.length) { cam.goal.set(cam.target); return; }
  targetIdx = ((i % targets.length) + targets.length) % targets.length;
  const t = targets[targetIdx];
  if (isPlane()) {
    cam.goal[0] = t[0]; cam.goal[1] = 0; cam.goal[2] = t[1];
    cam.goalWord = []; cam.goalPhase = 0;
  } else if (isTerrain()) {
    cam.goal[0] = t[0]; cam.goal[2] = t[1];
    cam.goal[1] = terrainAimHeight();
    cam.goalWord = []; cam.goalPhase = 0;
  } else {
    cam.goalWord = t.word.slice(); cam.goalPhase = 0;
    refreshGoal();
  }
}

// How high above the boundary point to aim, as a fraction of the camera distance so the clearance
// is the same at every depth. The relief is proportional to the camera distance once the camera is
// down among it, and the tallest ridge inside the depth of field reaches about 2.1 * relief camera
// distances, so 1.1 * relief * dist puts the eye at about 1.7 and clears it. Bounded by the
// object's own height so the opening view still aims at the object.
function terrainAimHeight() {
  return Math.min(terrHMax * 0.22, 1.1 * cfg.relief * cam.dist);
}

// Recompute the aim point from its word at the current phase. Exact at any depth.
function refreshGoal() {
  if (!maps || !cam.goalWord.length) return;
  const x = fixWord(maps, rotateWord(cam.goalWord, cam.goalPhase));
  if (x && isFinite(x[0] + x[1] + x[2])) cam.goal.set(x);
}

function pickTarget(i, snapOut) {
  if (!targets.length) return;
  if (snapOut) {
    loadPreset(cfg.preset, false);
    setGoal(i);
  } else setGoal(i);
  dirty = true;
}

/* ============================== rebasing ================================ */
// Why there is no zoom limit for a self similar object.
//
// A node's piece is an exact affine copy of the whole attractor, P_u = F_u(A), so the scene can be
// re-expressed in that node's own coordinates at any moment by applying F_u^-1 to the object and
// to the camera together: the object comes back identical, the camera at a distance of order one,
// and the tree walk starts from the root again. The descent is then a loop rather than a ramp, one
// rebase per factor of 1/s of zoom, with every coordinate permanently of order one. The zoom lives
// in `anchor.logScale`, a sum of logarithms, so there is no precision wall because there is no
// large number anywhere.
//
// Two conditions have to hold. Every map must be conformal, A = s R, or it would shear the camera
// as well as the object. And the walk root has to stay above the camera's own scale, since content
// outside it is dropped: REBASE_MARGIN keeps the walk root's piece four times larger than the
// depth of field the shader already fades to nothing, so a rebase discards exactly what the depth
// of field cull was discarding anyway, which is why it does not pop.
const REBASE_MARGIN = 4;

function rebaseNeeded() {
  if (!cfg.rebase || !conformal || isTerrain()) return false;
  const zFar = 1 + 8 / Math.max(cfg.fog, 0.02);
  return cam.dist * zFar * REBASE_MARGIN < suppE;
}

function rebaseStep() {
  // Which child piece holds the aim point. A worded aim says so exactly: its address is that word
  // repeated, so the first letter names the child. The geometric fallback is for a wordless aim.
  if (cam.goalWord.length) {
    return rebaseInto(cam.goalWord[cam.goalPhase % cam.goalWord.length]);
  }
  const inv6 = sym3Inv(root.cov);
  let best = -1, bestQ = Infinity;
  const x = new Float64Array(3);
  for (let i = 0; i < maps.length; i++) {
    const m = maps[i];
    if (!m.inv) continue;
    const g0 = cam.goal[0] - m.b[0], g1 = cam.goal[1] - m.b[1], g2 = cam.goal[2] - m.b[2];
    mat3Vec(m.inv, [g0, g1, g2], x);
    const dx = x[0] - root.mu[0], dy = x[1] - root.mu[1], dz = x[2] - root.mu[2];
    const q = inv6
      ? dx * (inv6[0] * dx + inv6[1] * dy + inv6[2] * dz) +
        dy * (inv6[1] * dx + inv6[3] * dy + inv6[4] * dz) +
        dz * (inv6[2] * dx + inv6[4] * dy + inv6[5] * dz)
      : dx * dx + dy * dy + dz * dz;
    if (q < bestQ) { bestQ = q; best = i; }
  }
  if (best < 0 || bestQ > suppR * suppR * 1.5) return false;
  return rebaseInto(best);
}

// Transport one cut's frame record into the new coordinates. `pos`, `R` and `dist` describe where
// the camera was when the cut was built, expressed in the current frame, so they move exactly as
// the camera just did. `Rq` and `sSince` accumulate the residual rotation and scale that the cut's
// own splat coordinates still carry and that `reprojection` has to undo.
function rebaseRecord(rec, m, s, iv) {
  const p = new Float64Array(3);
  mat3Vec(iv, [rec.pos[0] - m.b[0], rec.pos[1] - m.b[1], rec.pos[2] - m.b[2]], p);
  rec.pos.set(p);
  rec.dist /= s;
  const Rb = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    let acc = 0;
    for (let k = 0; k < 3; k++) acc += rec.R[r * 3 + k] * m.A[k * 3 + c];
    Rb[r * 3 + c] = acc / s;
  }
  rec.R.set(Rb);
  const As = new Float64Array(9);
  for (let i = 0; i < 9; i++) As[i] = m.A[i] / s;        // the map's rotation
  rec.Rq.set(mat3Mul(rec.Rq, As));
  rec.sSince *= s;
}

// Re-express the whole scene in child `best`'s own coordinates.
function rebaseInto(best) {
  const m = maps[best], s = m.scale, iv = m.inv;
  if (!iv) return false;
  // The zoom and the colour accumulators are sums over the letters the anchor has swallowed, each
  // exactly compensated by every local value below restarting one letter shorter.

  // The aim point is recomputed from its word, never transported: the inverse map expands, so
  // transporting multiplies its error by 1/s every step. The camera target is transported, which
  // is safe because the aim invariant holds it within 0.4 camera distances of the aim and the map
  // scales both sides by 1/s, so the invariant survives exactly.
  const t = new Float64Array(3);
  mat3Vec(iv, [cam.target[0] - m.b[0], cam.target[1] - m.b[1], cam.target[2] - m.b[2]], t);
  cam.target.set(t);
  if (cam.goalWord.length) {
    cam.goalPhase = (cam.goalPhase + 1) % cam.goalWord.length;
    refreshGoal();
  } else {
    const g = new Float64Array(3);
    mat3Vec(iv, [cam.goal[0] - m.b[0], cam.goal[1] - m.b[1], cam.goal[2] - m.b[2]], g);
    cam.goal.set(g);
  }
  cam.dist /= s;

  // The camera has to absorb the same map. A world vector v becomes
  // v' = A^-1 v, so the eye basis becomes R' = R A / s for R' v' = R v.
  const Rn = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    let acc = 0;
    for (let k = 0; k < 3; k++) acc += cam.R[r * 3 + k] * m.A[k * 3 + c];
    Rn[r * 3 + c] = acc / s;
  }
  cam.R.set(Rn);
  orthoBasis();

  // Both cuts come along, for the same reason: each was built in the frame just superseded and
  // stays valid there, since the maps and the walk root are identical in every anchor frame.
  //
  //  - `built`, the cut on screen, keeps being drawn for the few frames the next rebuild takes.
  //    Untransported it drew at scale s with the new frame's exposure: a measured 63 percent whole
  //    frame flash on the folded dragon, once every 0.35 decades of descent.
  //  - the record the job in flight hands over. Its node data stays in the old frame by design,
  //    but labelling the result current-frame in `finishJob` moves the flash one rebuild later:
  //    measured 53 percent over eight frames, with k wrong by exactly s.
  if (built.valid) rebaseRecord(built, m, s, iv);
  if (job.active) rebaseRecord(job.out, m, s, iv);

  // Bookkeeping back to the original frame, for naming a view. anchor <- anchor o w.
  const t2 = new Float64Array(3);
  mat3Vec(anchor.M, m.b, t2);
  anchor.t[0] += t2[0]; anchor.t[1] += t2[1]; anchor.t[2] += t2[2];
  anchor.M.set(mat3Mul(anchor.M, m.A));
  anchor.logScale += Math.log10(s);
  anchor.hue += mapHue[best];
  anchor.depth++;
  anchor.word.push(best);
  stats.rebases++;
  return true;
}

// At most 64 contractions in one frame, which bounds the work one frame can be asked to do. More
// than that is a teleport rather than a descent.
function rebaseAll() {
  let n = 0;
  while (n < 64 && rebaseNeeded() && rebaseStep()) n++;
  if (n) dirty = true;
  return n;
}

// Total zoom, as log10. anchor.logScale is negative and unbounded below, so the
// readout keeps climbing long after a float would have run out of exponent.
function logZoom() {
  return Math.log10(cam.startDist / Math.max(cam.dist, 1e-300)) - anchor.logScale;
}

// Measure in a ball of radius r about a point of the attractor scales as r^D with D the
// information dimension, so the light landing in the frame scales as dist^D and the gain is its
// inverse. In closed form it depends on the camera distance and nothing else, so rotation cannot
// change the exposure; normalizing against the weight actually in view does, and the image
// visibly breathed. Passed a distance rather than reading the camera, so a cut is exposed at draw
// time instead of carrying a two frame old exposure baked into its weights.
//
// The crossover is suppE, the object's own radius, and not the framing distance: above it the
// whole attractor is in frame and closing in only magnifies, so the gain stays flat. Measuring
// from startDist brightened the first e-fold of a descent by (startDist/suppE)^D, a factor of 6.5
// on these objects, which the saturating opacity mostly hid.
function measureNormAt(dist) {
  if (isField()) return 1;
  const z = Math.max(1, suppE / Math.max(dist, 1e-300));
  return Math.pow(z, mDim);
}
function measureNorm() { return measureNormAt(cam.dist); }

/* ==== src/50_cut.js =================================================== */
/* ========================= refinement: the cut ========================== */
// Resumable refinement. A rebuild is a job spread over several frames against a per frame work
// budget, so the frame rate belongs to the renderer and not to the tree walk. The last finished
// cut keeps being drawn meanwhile, corrected exactly for the camera drift since, so staleness
// costs accuracy in the choice of splats and never in where they are drawn.
// Order: startJob, then stepJob until it returns true, then finishJob, which publishes `built`.

const FLOATS = 13;                    // pos3 cov6 col3 w1
// A plane cut needs seven floats, not thirteen: every cell sits at y = 0 and is a disc, so pos.y is
// the shared job.planeY and cov is diag(r^2/3, (0.06 r)^2, r^2/3), a function of r alone, rebuilt
// in the vertex shader; the 0.06 must match 52_cut_plane.js:202 and 60_gl.js:186. 28 bytes an
// instance against 52. Colour, weight and position all stay fp32: JS has no cheap half conversion,
// two million per cut, and a half's three decimal digits cannot place a splat inside a pixel.
const FLAT_FLOATS = 7;                // pos2 rad1 col3 w1
let instances = new Float32Array(65536 * FLOATS);
// Floats per splat in the current cut, in one place because the emit kernels, the allocation and
// the upload must agree. Reads the cut on screen, so it is valid only after finishJob.
function cutFloats() { return built.flat ? FLAT_FLOATS : FLOATS; }
// The cut on screen, in the frame it was built in. `Rq` and `sSince` relate that frame to the
// camera's current one: a rebase re-expresses the scene in a child piece's coordinates and an
// older cut knows nothing about it. Without them the rebase frame drew the old cut at the wrong
// scale and exposure, a 63 percent frame flash every 0.35 decades of descent. See `reprojection`.
const built = {
  pos: new Float64Array(3), R: new Float64Array(9), dist: 1,
  Rq: new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]),
  sSince: 1, norm: 1,
  valid: false, count: 0, surface: false, prepass: false,
  // A flat cut: seven floats an instance, its own vertex shader, `planeY` the y they all share.
  flat: false, planeY: 0,
};
const HB = 192;                       // histogram buckets, 4 per octave
const hist = new Int32Array(HB);
const hHist = new Int32Array(256);      // log2 histogram of terrain height
const LX = -0.4243, LY = 0.7071, LZ = 0.5657;    // terrain light, world fixed

const job = {
  active: false, terrain: false, vw: 0, vh: 0, ms: 0,
  R: new Float64Array(9), pos: new Float64Array(3), dist: 1, invD: 1, focal: 1,
  tanX: 0, tanY: 0, nrmX: 0, nrmY: 0, K: 4, zFar: 15, fogK: 0.5, f32: false,
  cap: 0, nmaps: 0, splitPx: 2, sig: 1, norm: 1, attFloor: 0,
  huBase: 0, fadeK: 0, budK: 0,
  nf: 0, nn: 0, q: 0, cutSize: 0, np: 0, nEmit: 0,
  dmin: 0, dmax: 0, visited: 0, culled: 0, sumW: 0, sumWvis: 0,
  bLow: -Infinity, bAllow: 0, levelReady: false, usePrio: false, bFloor: 0, bRaw: 0,
  // The frame record handed to `built` at finish. Transported by every rebase that lands mid job,
  // unlike the job's own camera fields, because the kernel must project every node with one camera
  // or the cut is internally inconsistent. See `rebaseRecord`.
  out: {
    pos: new Float64Array(3), R: new Float64Array(9), dist: 1,
    Rq: new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]), sSince: 1,
  },
  // terrain kernel:
  maxIter: 400, relief: 1, hBase: 0, hSpan: 1, contour: 0, wSurf: 6, hmode: 0, hc: 1,
  eq: false, hLo: 0, hInv: 1, fcOn: false,
  // plane kernel:
  plane: false, julia: 0, power: 2, c0x: 0, c0y: 0, nuCyc: 24, nuInv: 1, spanTol: 0.18,
  flat: false, planeY: 0,     // see FLAT_FLOATS: a plane cut's compact instance format
  maxPx: 24,        // plane: the coverage cap, a fraction of the frame height, see planeRoot
  pfcOn: false,     // plane: is the field cache worth its own cost at this depth
  // Ceiling on the CPU one cut may spend, in ms: a latency budget, distinct from the splat budget.
  // Past it the walk stops splitting and drains to leaves, so the cut arrives coarser but on time.
  // The slowest five percent of Mandelbrot cuts took 104 frames, 1.4 e-folds of camera motion.
  msCap: 1e9, over: false,
  hCount: 0,
  evals: 0, iters: 0,
};

function startJob(vw, vh) {
  updateBasis();
  const terrain = isTerrain(), plane = isPlane();
  job.active = true; job.terrain = terrain; job.plane = plane; job.ms = 0;
  job.flat = plane;
  // How much of one turn of the colour ramp a plane cell may span before it is worth splitting.
  // Under this, splitting cannot change a pixel's colour.
  job.spanTol = 0.05;
  job.msCap = 1e9;
  job.wSurf = 6.0;
  job.vw = vw; job.vh = vh;
  job.R.set(basis.R);
  // Build for where the camera will be, `buildLead` seconds ahead, since a cut takes that long and
  // the camera does not wait. Downward the drift is 0.08 e-folds and invisible; outward a stale cut
  // under covers the frame: at 2.5 times the descent rate the frame grew 7x during one build, the
  // cut shrank to two percent of the frame area and 126 of 900 frames came back dark. job.out holds
  // the prediction, so `reprojection` corrects to the true camera and only refinement looks ahead.
  const dP = cam.dist * Math.exp(zoomRate * buildLead);
  const kP = dP / cam.dist;
  job.dist = dP; job.invD = 1 / dP;
  job.pos[0] = cam.target[0] + (basis.pos[0] - cam.target[0]) * kP;
  job.pos[1] = cam.target[1] + (basis.pos[1] - cam.target[1]) * kP;
  job.pos[2] = cam.target[2] + (basis.pos[2] - cam.target[2]) * kP;
  job.focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  lastFocal = job.focal;
  // Cull against a frustum 1.12 times wider than the drawn one, so a cut that is a few frames old
  // still covers the edges of the frame.
  job.tanY = Math.tan(0.5 * cam.fov) * 1.12;
  job.tanX = job.tanY * vw / vh;
  job.nrmX = 1 / Math.sqrt(1 + job.tanX * job.tanX);
  job.nrmY = 1 / Math.sqrt(1 + job.tanY * job.tanY);
  job.K = suppR;
  // Depth of field in units of camera distance: past it the shader's fog has attenuated a splat
  // below a thousandth, so refining is wasted. The 8 is the ATT table's argument range in
  // src/40_state.js. Without it the coarse structure around the camera eats the whole budget.
  job.zFar = 1 + ZF_MUL * 8 / Math.max(cfg.fog, 0.02);
  job.fogK = cfg.fog;            // the shader's own attenuation rate, see `place`
  job.f32 = cfg.precision === 'f32';
  // The tier's share of the preset's budget: the preset says what the object wants, perfBudget what
  // the machine holds, and separating them lets the slider keep reading the object's own number.
  job.cap = Math.min(perfBudget(), MAXBUDGET);
  // Halve the split threshold over the stillness ramp, a factor of four in cell count. A finer
  // threshold is a longer rebuild, so during a descent the cut on screen is always the stale one;
  // stillCuts is zero the moment anything moves. Plane objects ramp their latency ceiling instead.
  const stillPx = (isPlane() || stillCuts <= 0) ? 1
    : 1 - 0.5 * Math.min(1, stillCuts / 4);
  // The Gaussian view coarsens outright and overrides the sharpening; the plane objects get their
  // own absolute size, and their split test becomes a size test. See GAUSS_PX and GAUSS_PX_PLANE.
  job.splitPx = cfg.gauss ? (plane ? GAUSS_PX_PLANE : GAUSS_PX)
    : cfg.splitPx * stillPx;
  job.sig = cfg.sigma;
  // No splat may stay large on screen however little light reaches it: splitting on visible error
  // alone left eleven splats owning 44 percent of the drawn screen area on a descended folded
  // dragon while carrying 0.1 percent of the light, the largest 167 px across. The floor
  // splitPx/SIZE_CAP makes priority pass splitPx exactly when fp passes SIZE_CAP, so an oversized
  // node always splits, the order among visible nodes is unchanged, and it costs about
  // SIZE_CAP^2/splitPx^2 extra splats once.
  job.attFloor = job.splitPx / (cfg.gauss ? GAUSS_CAP : SIZE_CAP);
  // The cut wide priority floor, keyed on everything that changes what a full budget means, so a
  // new object, window or tier restarts the controller rather than inheriting a stale number.
  bFloorReset(cfg.preset + '|' + job.cap + '|' + vw + 'x' + vh + '|' + (cfg.gauss ? 'g' : '-'));
  job.bFloor = bFloor; job.bRaw = 0;
  // The exposure baked into the weights. A branch weight at depth 45 of an eight map IFS is 8^-45,
  // under the smallest normal Float32, so the buffer cannot carry a raw weight and a separate gain;
  // `reprojection` then corrects only the ratio to the current camera, which is near one.
  job.norm = measureNormAt(dP);
  job.nf = 0; job.nn = 0; job.q = 0; job.cutSize = 1; job.np = 1; job.nEmit = 0;
  job.dmin = 1 << 30; job.dmax = 0; job.visited = 0; job.culled = 0;
  job.sumW = 0; job.sumWvis = 0; job.evals = 0; job.iters = 0;
  job.hCount = 0; job.over = false;
  // Every plane splat is at y = 0, so this is the y they all share once the position is camera
  // relative and scaled. Computed here once instead of stored 500 000 times.
  job.planeY = (0 - job.pos[1]) * job.invD;
  job.out.pos.set(job.pos); job.out.R.set(basis.R); job.out.dist = dP;
  job.out.Rq.set([1, 0, 0, 0, 1, 0, 0, 0, 1]); job.out.sSince = 1;
  if (terrain) hHist.fill(0);
  job.levelReady = false;
  if (instances.length < job.cap * FLOATS) instances = new Float32Array(job.cap * FLOATS);
  if (plane) planeRoot(vw, vh); else if (terrain) terrRoot(vw, vh); else ifsRoot(vw, vh);
}

/* --------------------------- shared projection --------------------------- */
// Project a node centre that is already camera relative and scaled, cull it against the frustum and
// the depth of field, and write pool.sx, pool.sy, pool.fp, pool.prio and pool.rel[3n..3n+2]. False
// when the node is out of frame. The IFS kernel inlines its own copy in the inner loop.
function place(n, dx, dy, dz, rad) {
  const R = job.R;
  const ex = R[0] * dx + R[1] * dy + R[2] * dz;
  const ey = R[3] * dx + R[4] * dy + R[5] * dz;
  const ez = -(R[6] * dx + R[7] * dy + R[8] * dz);
  const rr = job.K * rad;
  if (ez + rr < 1e-4 || ez - rr > job.zFar ||
      (Math.abs(ex) - ez * job.tanX) * job.nrmX > rr ||
      (Math.abs(ey) - ez * job.tanY) * job.nrmY > rr) return false;
  const z = ez > 1e-4 ? ez : 1e-4;
  const iz = 1 / z;                     // one reciprocal, not three divisions
  pool.sx[n] = job.vw * 0.5 + job.focal * ex * iz;
  pool.sy[n] = job.vh * 0.5 - job.focal * ey * iz;
  const fp = job.focal * rad * iz;
  pool.fp[n] = fp;
  // Visible error, footprint times the light that reaches the eye, evaluated at the nearest point
  // of the node's support, ez - rr, not at its centre: a walk root's centre can sit 60 camera
  // distances away while its near face is at the camera, and attenuating by the centre made the
  // root fail its own split test, collapsing the tree to one splat and 96 black frames in 480. The
  // floor is the screen size cap, so the test fires on size alone past sizeCap. See `job.attFloor`.
  const zn = ez - rr;
  const att = attOf(job.fogK * (zn - 1));
  pool.prio[n] = fp * (att > job.attFloor ? att : job.attFloor);
  const o3 = n * 3;
  pool.rel[o3] = dx; pool.rel[o3 + 1] = dy; pool.rel[o3 + 2] = dz;
  return true;
}

function ifsRoot(vw, vh) {
  const P = PRESETS[cfg.preset];
  job.nmaps = maps.length;
  // The hue the anchor's swallowed letters are worth: everything below this walk root sums its own
  // local hue from zero, so the drawn hue is frac(huBase + local). See `anchor.hue` and buildMapHue
  // in src/40_state.js. Captured here so a rebase during a rebuild cannot move the colours of the
  // cut being built. HUE_OFF is zero in every shipped frame.
  job.huBase = anchor.hue + HUE_OFF - Math.floor(anchor.hue + HUE_OFF);
  // Width of the cross fade band, as a ratio of priority above the split threshold.
  job.fadeK = 1 / (FADE_BAND - 1);
  job.budK = 1 / (BUD_BAND - 1);
  job.usePrio = false;
  const PM = pool.M, Pmu = pool.mu, Pcov = pool.cov;
  const rmu = root.mu, rcov = root.cov;
  PM[0] = 1; PM[1] = 0; PM[2] = 0; PM[3] = 0; PM[4] = 1; PM[5] = 0; PM[6] = 0; PM[7] = 0; PM[8] = 1;
  Pmu[0] = rmu[0]; Pmu[1] = rmu[1]; Pmu[2] = rmu[2];
  for (let i = 0; i < 6; i++) Pcov[i] = rcov[i];
  pool.w[0] = 1; pool.depth[0] = 0; pool.cc[0] = 0;
  pool.ls[0] = 0; pool.bl[0] = 1;
  pool.par[0] = -1; pool.mi[0] = -1;
  let mx = rmu[0], my = rmu[1], mz = rmu[2];
  if (job.f32) { mx = Math.fround(mx); my = Math.fround(my); mz = Math.fround(mz); }
  const rad = Math.sqrt(rcov[0] + rcov[3] + rcov[5]) * job.invD * job.sig;
  if (!place(0, (mx - job.pos[0]) * job.invD, (my - job.pos[1]) * job.invD,
             (mz - job.pos[2]) * job.invD, rad)) return;
  frontier[0] = 0;
  job.nf = 1;
}

/* ------------------------------- terrain -------------------------------- */
function terrRoot(vw, vh) {
  const P = PRESETS[cfg.preset];
  job.nmaps = 4;
  job.usePrio = true;
  job.relief = cfg.relief;
  job.hmode = cfg.height;
  job.contour = cfg.contour;
  // Peak optical depth of one surfel, high enough that the absorption model saturates across the
  // footprint; lower and the kernel's own falloff shows at the cell spacing as a dot screen.
  job.wSurf = 6.0;
  job.hc = PRESETS[cfg.preset].radius * 0.9;
  // The escape count of a point at distance d from the set grows like log(1/d), so the iteration
  // cap grows logarithmically with depth, which is the only reason a deep zoom is affordable.
  const lz = Math.max(0, logZoom());
  // Quantized to steps of 1.3 so the field cache survives a descent instead of being invalidated
  // every frame by a cap that creeps. See mandelFieldCached.
  const want = Math.max(80, Math.min(60000, cfg.iters * (1 + 0.42 * lz)));
  const mstep = Math.max(0, Math.round(Math.log(want / 80) / Math.log(1.3)));
  job.maxIter = Math.round(Math.min(60000, 80 * Math.pow(1.3, mstep)));
  stats.maxIter = job.maxIter;
  // The hypsometric span, a fallback: the first rebuild of an object, before the height histogram
  // exists, and the potential mode, which has its own analytic span. The distance mode equalizes in
  // log height instead, see terrLo in src/40_state.js. Relief scales with camera distance once the
  // camera is among it and is bounded by the measured height when the object is in frame.
  if (job.hmode === 0) {
    job.hBase = 0;
    job.hSpan = Math.min(terrHMax,
      (terrSpanRel > 0 ? terrSpanRel : 1.4 * cfg.relief) * job.dist);
  }
  else {
    const nuT = 6 + 3.3219 * lz;
    job.hBase = 0.11 * cfg.relief * nuT;
    job.hSpan = 0.11 * cfg.relief * 14;
  }
  if (job.hSpan <= 0) job.hSpan = 1e-30;
  job.eq = (job.hmode === 0) && terrEq;
  job.hLo = terrLo;
  job.hInv = 1 / Math.max(terrHi - terrLo, 1e-6);
  job.fcOn = terrItEma > FC_MIN_ITERS;
  fcCur = fcStamp(mstep, job.relief, job.hmode, job.hc);
  fcHits = 0; fcMiss = 0; fcSaved = 0;
  if (!terrCell(0, P.center[0], P.center[1], P.radius, 0)) return;
  frontier[0] = 0;
  job.nf = 1;
}

// Build one surfel from one field evaluation. The cell is a square of half size r in the c plane;
// the surfel is the moment matched Gaussian of the tangent patch over it, so covariance
// (1/3)(u u^T + v v^T) with u and v the tangent vectors of the height field across the cell, plus a
// thin term along the normal so the ellipsoid is not exactly degenerate.
function terrCell(n, cx, cz, r, depth) {
  if (job.fcOn) mandelFieldCached(cx, cz, job.maxIter, r * 0.5, job.relief, job.hmode, job.hc);
  else mandelField(cx, cz, job.maxIter, r * 0.5, job.relief, job.hmode, job.hc);
  job.evals++; job.iters += fld.iters;
  const h = fld.h, gx = fld.gx, gz = fld.gz;
  const nx = fld.nx, ny = fld.ny, nz = fld.nz;
  const r2 = r * r / 3, th = 0.2 * r, t2 = th * th;
  const o6 = n * 6, o9 = n * 9, o3 = n * 3;
  pool.cov[o6]     = r2 + t2 * nx * nx;
  pool.cov[o6 + 1] = r2 * gx + t2 * nx * ny;
  pool.cov[o6 + 2] = t2 * nx * nz;
  pool.cov[o6 + 3] = r2 * (gx * gx + gz * gz) + t2 * ny * ny;
  pool.cov[o6 + 4] = r2 * gz + t2 * ny * nz;
  pool.cov[o6 + 5] = r2 + t2 * nz * nz;
  pool.mu[o3] = cx; pool.mu[o3 + 1] = h; pool.mu[o3 + 2] = cz;
  pool.M[o9] = cx; pool.M[o9 + 1] = cz; pool.M[o9 + 2] = r;
  pool.M[o9 + 3] = fld.de; pool.M[o9 + 4] = fld.nu;
  pool.M[o9 + 5] = fld.inside ? 1 : (fld.edge ? 2 : 0);
  pool.M[o9 + 6] = nx; pool.M[o9 + 7] = ny; pool.M[o9 + 8] = nz;
  pool.w[n] = job.wSurf;
  pool.depth[n] = depth;
  let px = cx, py = h, pz = cz;
  if (job.f32) { px = Math.fround(px); py = Math.fround(py); pz = Math.fround(pz); }
  const rad = Math.sqrt(pool.cov[o6] + pool.cov[o6 + 3] + pool.cov[o6 + 5]) * job.invD * job.sig;
  if (!place(n, (px - job.pos[0]) * job.invD, (py - job.pos[1]) * job.invD,
             (pz - job.pos[2]) * job.invD, rad)) return false;
  // `place` has set prio to the visible error, which the split test wants, so keep a copy in
  // pool.cc: the unboosted priority for the terrain, the colour coordinate for the IFS kernel. The
  // boost raises cells close to the boundary relative to their own size, where the height field is
  // not yet resolved. It sets order under budget pressure only and must not enter the test: a boost
  // of four would push those cells five times past it and cost twenty five times the cells.
  pool.cc[n] = pool.prio[n];
  const de = fld.de;
  const boost = fld.inside ? 0 : Math.min(4, 0.5 * r / Math.max(de, r * 1e-6));
  pool.prio[n] *= 1 + boost;
  return true;
}

// Same time budget as the IFS kernel, with a smaller chunk between clock reads: a terrain cell is
// two orders of magnitude dearer than an IFS node.
const TCHUNK = 64;
function stepTerr(budgetMs) {
  const t0 = performance.now();
  const tEnd = t0 + budgetMs;
  let chunk = TCHUNK;
  const cap = job.cap, splitPx = job.splitPx;
  let np = job.np, nEmit = job.nEmit, cutSize = job.cutSize;
  let dmin = job.dmin, dmax = job.dmax, visited = job.visited, culled = job.culled;
  let bAllow = job.bAllow;
  let bLow = job.bLow, bHi = bLow * 1.19;
  let done = false;

  outer:
  for (;;) {
    if (job.nf === 0) { done = true; break; }
    if (!job.levelReady) {
      prepareLevel();
      bAllow = job.bAllow; bLow = job.bLow; bHi = bLow * 1.19;
    }
    let q = job.q, nn = job.nn;
    while (q < job.nf) {
      if (--chunk <= 0) {
        chunk = TCHUNK;
        if (performance.now() >= tEnd) { job.q = q; job.nn = nn; break outer; }
      }
      visited++;
      const i = frontier[q++];
      // Split on the visible error without the boundary boost, see terrCell. 200 is the depth
      // ceiling and 4 the child arity.
      let split = pool.cc[i] > splitPx && pool.depth[i] < 200 && cutSize + 4 <= cap;
      if (split && bLow !== -Infinity && pool.prio[i] < bLow) split = false;
      let made = 0, full = false;
      if (split) {
        const o9 = i * 9;
        const cx = pool.M[o9], cz = pool.M[o9 + 1], r = pool.M[o9 + 2] * 0.5;
        const d = pool.depth[i] + 1;
        for (let k = 0; k < 4; k++) {
          if (np >= MAXCAP) { full = true; break; }
          const ox = (k & 1) ? r : -r, oz = (k & 2) ? r : -r;
          // A culled child leaves its pool slot free for the next one.
          if (terrCell(np, cx + ox, cz + oz, r, d)) { nextF[nn++] = np; np++; made++; }
          else culled++;
        }
      }
      if (made > 0) cutSize += made - 1;
      else if (split && !full) { cutSize--; culled++; }
      else if (nEmit < cap) { emitTerr(i, nEmit++); if (pool.depth[i] < dmin) dmin = pool.depth[i]; if (pool.depth[i] > dmax) dmax = pool.depth[i]; }
    }
    const t = frontier; frontier = nextF; nextF = t;
    job.nf = nn; job.levelReady = false; job.q = 0; job.nn = 0;
  }

  job.np = np; job.nEmit = nEmit; job.cutSize = cutSize;
  job.dmin = dmin; job.dmax = dmax; job.visited = visited; job.culled = culled;
  job.bAllow = bAllow;
  job.ms += performance.now() - t0;
  if (done) job.active = false;
  return done;
}

// Shade one surfel. The normal is known analytically, so a lambert term plus a hemispheric sky term
// costs one dot product. Colour is hypsometric in height relative to the current view, invariant
// under zoom; the darkened bands are the true equipotentials, faded out near the boundary.
function emitTerr(i, slot) {
  const o9 = i * 9, o6 = i * 6, o3 = i * 3;
  const kind = pool.M[o9 + 5];
  const nx = pool.M[o9 + 6], ny = pool.M[o9 + 7], nz = pool.M[o9 + 8];
  let cr, cg, cb;
  if (kind === 1) {
    // The interior has zero distance estimate and zero potential, so nothing can colour it: flat
    // and unlit it measured 0.001 in linear light against a 0.0002 background, and the Feigenbaum
    // point is 100 percent interior past 1e7. It is a flat level surface, so shade it as water:
    // Schlick against the level normal, F0 = 0.02, so grazing lake reflects the sky.
    const vx = pool.rel[o3], vy = pool.rel[o3 + 1], vz = pool.rel[o3 + 2];
    const vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
    const ct = Math.abs(vy) / vl;                       // |cos| against world up
    const om = 1 - ct;
    const F = 0.02 + 0.98 * om * om * om * om * om;
    // Sun on water: mirror the view about the level surface and aim at the light. Exponent 260
    // sets the highlight width, 1.7 its strength.
    const gr = (vx / vl) * LX - (vy / vl) * LY + (vz / vl) * LZ;
    const g = gr > 0 ? Math.pow(gr, 260) * 1.7 : 0;
    cr = lakeCol[0] + (sheenCol[0] - lakeCol[0]) * F + g;
    cg = lakeCol[1] + (sheenCol[1] - lakeCol[1]) * F + g * 0.97;
    cb = lakeCol[2] + (sheenCol[2] - lakeCol[2]) * F + g * 0.88;
  }
  else {
    // Hypsometric, equalized in log height between two measured percentiles of the cut's own height
    // distribution. The square root is the fallback: deep in a valley most visible area is shore, so
    // a linear ramp puts most of the frame in the bottom eighth of the palette, and even the square
    // root over a span anchored at zero left 16 to 43 percent of the land in the darkest tenth.
    let t;
    if (job.eq) {
      const hr = pool.mu[o3 + 1] * job.invD;
      t = hr > 0 ? (Math.log2(hr) - job.hLo) * job.hInv : 0;
    } else {
      t = (pool.mu[o3 + 1] - job.hBase) / job.hSpan;
      t = t > 0 ? Math.sqrt(t) : 0;
    }
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    let pi = (t * (PAL - 1)) | 0;
    if (pi < 0) pi = 0; else if (pi > PAL - 1) pi = PAL - 1;
    const p3 = pi * 3;
    let sh = 0.36 * (0.5 + 0.5 * ny) + 0.95 * Math.max(0, nx * LX + ny * LY + nz * LZ);
    if (job.contour > 0 && kind === 0) {
      const de = pool.M[o9 + 3], r = pool.M[o9 + 2];
      const st = 1 - 2.5 * r / (de > 0 ? de : 1e-300);
      if (st > 0) {
        const nu = pool.M[o9 + 4];
        let f = nu - Math.floor(nu);
        if (f > 0.5) f = 1 - f;
        const line = 1 - 14 * f;
        if (line > 0) sh *= 1 - 0.5 * job.contour * st * (line > 1 ? 1 : line);
      }
    }
    cr = palette[p3] * sh; cg = palette[p3 + 1] * sh; cb = palette[p3 + 2] * sh;
  }
  const o = slot * FLOATS, d2 = job.invD * job.invD;
  emitted[slot] = i;
  instances[o] = pool.rel[o3]; instances[o + 1] = pool.rel[o3 + 1]; instances[o + 2] = pool.rel[o3 + 2];
  instances[o + 3] = pool.cov[o6] * d2; instances[o + 4] = pool.cov[o6 + 1] * d2;
  instances[o + 5] = pool.cov[o6 + 2] * d2; instances[o + 6] = pool.cov[o6 + 3] * d2;
  instances[o + 7] = pool.cov[o6 + 4] * d2; instances[o + 8] = pool.cov[o6 + 5] * d2;
  instances[o + 9] = cr; instances[o + 10] = cg; instances[o + 11] = cb;
  instances[o + 12] = pool.w[i];
  job.sumW += 1; job.sumWvis += 1;
  if (kind !== 1) {
    // Histogram of log2(h / dist), for a percentile. The distribution is heavy
    // tailed, so a mean is dragged around by a handful of far cells.
    const hr = pool.mu[o3 + 1] * job.invD;
    if (hr > 0) {
      let b = (Math.log2(hr) * 4 + 128) | 0;
      if (b < 0) b = 0; else if (b > 255) b = 255;
      hHist[b]++; job.hCount++;
    }
  }
}

/* ------------------------- level priority threshold --------------------- */
// Which nodes of the current level may split when the budget cannot take them all. A histogram over
// log2(priority) finds the threshold in one pass; sorting the level costs more than the refinement.
// Priorities are already written where the node is created, by `place` and by the IFS kernel.
let lastFocal = 1;
// The precision cost of the position subtraction in the kernel, in pixels, for the camera right
// now; with rebasing on every coordinate is order one however deep the zoom, so it stops growing.
// It must be live and not a by-product of a finished rebuild: a terrain rebuild past 1e6 takes tens
// of frames, the descent's park reads it, and a stale one let the camera fall from 1e14 to 1e29
// with the frame frozen at 1e14. It over-reports the true spacing 4.5x, so the park fires early.
function errPxNow() {
  // The per pixel GPU path has a different wall. WebGL 2 has no fp64, so its orbit runs in double
  // single, and what that delivers is a property of the driver: dsgl.html measures 38 to 43 bits
  // over the first thousand iterations against the same orbit in doubles. Take 40, eps 9.1e-13
  // against a double's 1.1e-16, so the descent turns a little past 1e9 where the CPU path reaches
  // 1e13. That is the arithmetic, not the representation, which dsprec.mjs puts at 2^-49.6.
  const eps = isDirect() ? 9.1e-13 : (cfg.precision === 'f32' ? 6e-8 : 1.1e-16);
  // The magnitude of world coordinate the rounding applies to: for an IFS the anchor holds
  // everything at order one, for a flat field it is the plane coordinate itself, since cells near
  // the aim carry the aim's magnitude. Using the framing distance there overstated the error 15x
  // and cost 1.2 decades of descent.
  const worldScale = isField()
    ? Math.max(Math.hypot(cam.target[0], cam.target[2]), 1e-4)
    : Math.max(Math.hypot(cam.target[0], cam.target[1], cam.target[2]) + cam.startDist, 1e-30);
  return eps * worldScale / Math.max(cam.dist, 1e-300) * lastFocal;
}

const SUBH = 32;                       // sub-buckets inside the edge bucket
const subHist = new Int32Array(SUBH);
function prepareLevel() {
  const nf = job.nf, cap = job.cap, nmaps = job.nmaps;
  const Ppr = pool.prio;
  job.bLow = -Infinity;
  // A cut wide floor under the per level threshold, the fix for shimmer under a smoothly moving
  // camera. The threshold derived below is a property of one level: it rations the frontier against
  // whatever the levels above left, which compounds. The Pythagoras tree's ratios are 0.809 and
  // 0.588, so a level synchronous frontier passes twenty five levels holding pieces whose sizes
  // differ by 1.38^25, and a small change at level nine reshuffles the bottom. No cross fade band
  // helps: they dissolve a node crossing its own threshold, and here the threshold itself jumps.
  if (job.bFloor > 0) job.bLow = job.bFloor;
  // A split costs nmaps + 1 slots: inside either cross fade band the parent is drawn alongside its
  // children. Reserving that slot keeps the per node backstop `cutSize + nmaps <= cap` from firing;
  // that backstop has no dissolve and is frontier order dependent, so it emits whole whatever the
  // walk reaches once the cut is full, 3 821 splats over 3 px at full weight on the icosahedral
  // flake, and flips an arbitrary subset of a level every rebuild.
  //
  // The node pool is the second ceiling: `cap` bounds the splats a cut may draw, MAXCAP the nodes
  // it may allocate, and a level synchronous walk that reclaims nothing allocates the sum of its
  // frontier over every level. The Pythagoras tree's long branch contracts by 0.848, so a pixel
  // takes about forty levels against the folded dragon's twenty four. `np >= MAXCAP` in the kernel
  // breaks the child loop mid node, so weight is not conserved; rationing by (MAXCAP - np)/nmaps
  // makes that unreachable and puts both ceilings through one level set of priority.
  const maxSplits = Math.min(Math.floor((cap - job.cutSize) / (nmaps + 1)),
                             Math.floor((MAXCAP - job.np) / nmaps));
  if (maxSplits < nf) {
    hist.fill(0);
    for (let q = 0; q < nf; q++) {
      const pr = Ppr[frontier[q]];
      let b = pr > 0 ? (Math.log2(pr) * 4 + 96) | 0 : 0;
      if (b < 0) b = 0; else if (b >= HB) b = HB - 1;
      hist[b]++;
    }
    let rem = maxSplits > 0 ? maxSplits : 0, edge = 0;
    for (let b = HB - 1; b >= 0; b--) {
      if (hist[b] <= rem) { rem -= hist[b]; edge = b; continue; }
      edge = b; break;
    }
    // Refine within the edge bucket, a factor 2^(1/4) wide, split 32 ways, so the threshold is a
    // number every node is compared against rather than a count handed out in walk order: the
    // boundary is then a level set of priority that sweeps smoothly instead of dissolving.
    const lo = Math.pow(2, (edge - 96) / 4);
    const sc = SUBH / (Math.LN2 * 0.25);
    subHist.fill(0);
    for (let q = 0; q < nf; q++) {
      const pr = Ppr[frontier[q]];
      if (!(pr >= lo)) continue;
      let sb = (Math.log(pr / lo) * sc) | 0;
      if (sb < 0) sb = 0; else if (sb >= SUBH) continue;   // above the edge bucket entirely
      subHist[sb]++;
    }
    let sub = 0, r2 = rem;
    for (let b = SUBH - 1; b >= 0; b--) {
      if (subHist[b] <= r2) { r2 -= subHist[b]; sub = b; continue; }
      sub = b + 1; break;
    }
    const lvl = lo * Math.exp(sub / sc);
    // The level's own threshold before the floor, and the tightest any level of this cut asked for.
    // The controller must track this and not the floored `bLow`, which is at least `bFloor` by
    // construction, so a floor smoothed toward it could only rise: feedback that runs away.
    if (lvl > job.bRaw) job.bRaw = lvl;
    if (lvl > job.bLow) job.bLow = lvl;         // whichever ceiling is tighter decides
  }
  job.bAllow = 0x7fffffff;
  job.q = 0; job.nn = 0; job.levelReady = true;
}

/* --------------------- the cut wide priority floor ---------------------- */
// One number carried between cuts: how small a splat this object may make at this budget. See
// prepareLevel for why a per level threshold alone shimmers.
//
// A first order filter, not a relay. Steering the fill fraction instead, up five percent over 94
// percent fill and down four under 80, is a relay in front of a plant with dead time, since a cut
// takes several frames to arrive and reports a floor several frames old: on the Pythagoras tree it
// hunted 89k, 83k, 110k, 103k, 136k, 127k, 168k, 157k, 208k, 194k splats a cut. `job.bRaw`, the
// tightest threshold any level of the last cut derived on its own, has the natural threshold as its
// fixed point. It must be the unfloored value, since `bLow` is at least `bFloor` by construction
// and smoothing toward it could only raise the floor. No raw threshold means the floor decays.
let bFloor = 0, bFloorKey = '';
const BF_LERP = 0.15;                  // how much of the gap the floor closes per cut
const BF_RELEASE = 0.85;               // and how fast it lets go when nothing needs rationing
function bFloorReset(key) {
  if (key === bFloorKey) return;
  bFloorKey = key; bFloor = 0;
}
function bFloorUpdate(raw) {
  if (raw > 0 && isFinite(raw)) {
    bFloor = bFloor > 0 ? bFloor + (raw - bFloor) * BF_LERP : raw;
  } else if (bFloor > 0) {
    bFloor *= BF_RELEASE;
    if (bFloor < 1e-7) bFloor = 0;
  }
  if (!(bFloor < 1e6)) bFloor = 1e6;
}

// Advance the current job by at most `budgetMs` of real work. Returns true when
// the cut is finished.
function stepJob(budgetMs) {
  if (job.plane) return stepPlane(budgetMs);
  return job.terrain ? stepTerr(budgetMs) : stepIFS(budgetMs);
}

function finishJob() {
  nEmit = job.nEmit;
  pool.n = job.np;
  // Track the threshold this cut actually needed. See bFloorUpdate.
  bFloorUpdate(job.bRaw);
  // Top of the hypsometric ramp: the 88th percentile of the height histogram times 1.15, which for
  // a roughly exponential distribution lands near the ninetieth, about 2.4 times the mean. Smoothed
  // at 0.4 per cut, in units of camera distance, so it holds still as the camera turns and closes.
  if (job.terrain && job.hCount > 256) {
    let want = Math.floor(job.hCount * 0.88), acc = 0, b = 0;
    for (; b < 256; b++) { acc += hHist[b]; if (acc >= want) break; }
    const rel = Math.pow(2, (b - 128) / 4) * 1.15;
    if (isFinite(rel) && rel > 0) {

  // The kernel bandwidth for this cell, as a fraction of its half size. See KERN_MIN.
  let kap;
  // An escaped cell clear of the set interpolates the field, and how wide a kernel it wants
  // follows from how badly it resolves the ramp; everything else is boundary layer and takes the
  // narrow one. The test is planeTangle rather than `kind === 0`, because an escaped cell with
  // the set running through it has a small span and would otherwise get the wide kernel.
  if (!planeTangle(kind, de, r)) {
    const sp = pool.cc[i];
    if (!(sp > job.spanTol)) kap = 1;
    else {
      let u = Math.log2(sp / job.spanTol) * (1 / KERN_OCT);
      if (u > 1) u = 1;
      u = u * u * (3 - 2 * u);
      kap = 1 + (KERN_MIN - 1) * u;
    }
  } else {
    // Interior, condemned and exhausted are all boundary layer: nothing to interpolate.
    kap = KERN_MIN;
  }
  // The bandwidth cannot go below what the kernel's own support can cover. The fragment shader
  // discards past exp(-6.91) and the quad is kern.extent standard deviations across, so a cell
  // corner, sqrt(2) half sizes from the centre, falls outside every neighbouring profile once
  // kappa drops under sqrt(2)/extent, 0.426 at beta 3: there it is empty rather than dim and no
  // peak can fill it. Measured, kappa 0.40 left the darkest pixel of a flat region at 0.0157 of
  // full range against a true 0.0510 whatever the peak was. Derived rather than written down,
  // because it moves with the kernel exponent. The shader's 0.5 px prefilter counts toward it in
  // quadrature, so what has to reach the corner is
  //
  //     extent^2 ((kappa r)^2 + 1/4)  >=  (1.05 sqrt2 r)^2,   r in pixels
  //
  // which any kappa satisfies for a cell near the split threshold and which is essentially the
  // old bound for a large one.
  const rpx = 0.5 * pool.fp[i];
  const k0 = 1.05 * Math.SQRT2 / (kern.extent * FLAT_EXT);
  const kFloor = rpx > 1e-6 ? Math.sqrt(Math.max(0, k0 * k0 - 0.25 / (rpx * rpx))) : k0;
  if (kap < kFloor) kap = kFloor;
  // The Gaussian view wants one bandwidth and the round number, a splat at one standard deviation
  // to its own half size having its one sigma contour inscribed in its cell. The per cell
  // narrowing would only make the primitives harder to see.
  if (cfg.gauss) kap = 1;
  // The compact flat instance: seven floats rather than thirteen, and see FLAT_FLOATS in
  // src/50_cut.js for why the other six carry nothing for a plane object. The vertex shader
  // reconstructs the y from a uniform and the whole covariance from `rad`, the cell's half width
  // in the cut's normalized frame, because pool.cov holds diag(r^2/3, (0.06 r)^2, r^2/3) and
  // every entry is a function of r alone. Scaling `rad` by kappa is therefore the whole of the
  // variable bandwidth, and `place` has already decided the split from the cell's true size.
  const o = slot * FLAT_FLOATS;
  emitted[slot] = i;
  instances[o] = pool.rel[o3]; instances[o + 1] = pool.rel[o3 + 2];
  instances[o + 2] = r * job.invD * kap;
  instances[o + 3] = cr; instances[o + 4] = cg; instances[o + 5] = cb;
  instances[o + 6] = kernPeak(kap) * bl;
  job.sumW += 1; job.sumWvis += 1;
}

/* ==== src/55_cut_ifs.js =============================================== */
/* --------------------------- the IFS hot kernel -------------------------- */
// stepIFS advances the job by at most `budgetMs` of wall clock, read every CHUNK
// node expansions. Flat typed arrays, loop invariants hoisted. The pushforward is
// exact:
//
//     M'     = M A_i                  (27 multiplies, or 3 when A_i = s I)
//     mu'    = mu + M d_i             (9)   d_i = w_i(mu_root) - mu_root
//     Sigma' = M' Sigma_root M'^T     (45,  or 6)
//
// Wall clock and not a node count fed back from the last rebuild's rate: one cold
// slice read 390 expansions/ms against a true 25 000 and starved every later
// rebuild to about 2 000 nodes a frame.
const CHUNK = 512;              // expansions per clock read, about 20 us at 25 000/ms
function stepIFS(budgetMs) {
  const t0 = performance.now();
  const tEnd = t0 + budgetMs;
  let chunk = CHUNK;
  const R = job.R;
  const r0 = R[0], r1 = R[1], r2 = R[2], r3 = R[3], r4 = R[4], r5 = R[5];
  const r6 = R[6], r7 = R[7], r8 = R[8];
  const invD = job.invD, d2 = invD * invD, focal = job.focal, sig = job.sig;
  const vw = job.vw, vh = job.vh, f32 = job.f32;
  const cpx = f32 ? Math.fround(job.pos[0]) : job.pos[0];
  const cpy = f32 ? Math.fround(job.pos[1]) : job.pos[1];
  const cpz = f32 ? Math.fround(job.pos[2]) : job.pos[2];
  const tanX = job.tanX, tanY = job.tanY, nrmX = job.nrmX, nrmY = job.nrmY;
  const NEAR = 1e-4, K = job.K, cap = job.cap, nmaps = job.nmaps, zFar = job.zFar;
  const splitPx = job.splitPx, fogK = job.fogK;
  const attFloor = job.attFloor;
  const huBase = job.huBase, fadeK = job.fadeK, budK = job.budK;
  const norm = job.norm;
  const PM = pool.M, Pmu = pool.mu, Pcov = pool.cov, Prel = pool.rel;
  const Pw = pool.w, Pcc = pool.cc, Pdep = pool.depth, Ppr = pool.prio;
  const Pfp = pool.fp, Psx = pool.sx, Psy = pool.sy;
  const Pls = pool.ls, Pbl = pool.bl;
  const Ppar = pool.par, Pmi = pool.mi;
  const rc0 = root.cov[0], rc1 = root.cov[1], rc2 = root.cov[2];
  const rc3 = root.cov[3], rc4 = root.cov[4], rc5 = root.cov[5];
  let np = job.np, nEmit = job.nEmit, cutSize = job.cutSize;
  let dmin = job.dmin, dmax = job.dmax, visited = job.visited, culled = job.culled;
  let sumW = job.sumW, sumWvis = job.sumWvis, bAllow = job.bAllow;
  const padX = vw * 0.1, padY = vh * 0.1;      // off screen margin of the sumWvis test
  // Per level, refreshed by prepareLevel below; a stale threshold stops refinement.
  let bLow = job.bLow, bHi = bLow * 1.19;
  let done = false;

  outer:
  for (;;) {
    if (job.nf === 0) { done = true; break; }
    if (!job.levelReady) {
      prepareLevel();
      bAllow = job.bAllow; bLow = job.bLow; bHi = bLow * 1.19;
    }
    let q = job.q, nn = job.nn;
    while (q < job.nf) {
      if (--chunk <= 0) {
        chunk = CHUNK;
        if (performance.now() >= tEnd) { job.q = q; job.nn = nn; break outer; }
      }
      visited++;
      const i = frontier[q++];
      // Split on visible error, footprint times the attenuation the shader applies,
      // att = exp(-fog (z-1)), not on footprint alone: footprint alone put 66 percent
      // of the budget where att < 0.05 and left the near field at 6.2 px on the folded
      // dragon three decades down. Reserves nmaps and not nmaps - 1, since a node in
      // the fade band is drawn as well as its children; that keeps cutSize <= cap exact.
      let split = Ppr[i] > splitPx && Pdep[i] < 240 && cutSize + nmaps <= cap;
      // Same dissolve as the size threshold, or a node crossing bLow swaps itself for
      // its children at full weight in one frame. Band width is BUD_BAND, 40_state.js.
      let tbud = 1;
      if (split && bLow !== -Infinity) {
        tbud = (Ppr[i] / bLow - 1) * budK;
        if (!(tbud > 0)) { split = false; tbud = 0; } else if (tbud > 1) tbud = 1;
      }
      let made = 0, full = false, fadeTf = 1, fadeBl = 1;
      if (split) {
        const po3 = i * 3, po6 = i * 6, po9 = i * 9;
        const p0 = PM[po9], p1 = PM[po9 + 1], p2 = PM[po9 + 2];
        const p3 = PM[po9 + 3], p4 = PM[po9 + 4], p5 = PM[po9 + 5];
        const p6 = PM[po9 + 6], p7 = PM[po9 + 7], p8 = PM[po9 + 8];
        const pmx = Pmu[po3], pmy = Pmu[po3 + 1], pmz = Pmu[po3 + 2];
        const pw = Pw[i], pd = Pdep[i] + 1;
        const pcc = Pcc[i], pls = Pls[i];
        // Position in the cross fade band: 0 at the split threshold, 1 at FADE_BAND
        // times it. Below 1 the parent is drawn too, at the complementary weight, so a
        // split dissolves rather than substitutes. Weight is conserved exactly,
        // w(1-t) + t*sum(w p_i) = w, because the p_i sum to one.
        let tf = (Ppr[i] / splitPx - 1) * fadeK;
        if (!(tf > 0)) tf = 0; else if (tf > 1) tf = 1;
        if (tbud < tf) tf = tbud;              // whichever threshold is nearer decides
        const pbl = Pbl[i], cbl = pbl * tf;
        fadeTf = tf; fadeBl = pbl;
        const ps0 = Pcov[po6], ps1 = Pcov[po6 + 1], ps2 = Pcov[po6 + 2];
        const ps3 = Pcov[po6 + 3], ps4 = Pcov[po6 + 4], ps5 = Pcov[po6 + 5];
        for (let mi = 0; mi < nmaps; mi++) {
          if (np >= MAXCAP) { full = true; break; }
          const n = np, no3 = n * 3, no6 = n * 6, no9 = n * 9;
          const ao = mi * 9, doff = mi * 3;
          let q0, q1, q2, q3, q4, q5, q6, q7, q8;
          if (mapSc[mi]) {
            const s = mapS[mi], g = s * s;
            q0 = p0 * s; q1 = p1 * s; q2 = p2 * s;
            q3 = p3 * s; q4 = p4 * s; q5 = p5 * s;
            q6 = p6 * s; q7 = p7 * s; q8 = p8 * s;
            Pcov[no6] = ps0 * g; Pcov[no6 + 1] = ps1 * g; Pcov[no6 + 2] = ps2 * g;
            Pcov[no6 + 3] = ps3 * g; Pcov[no6 + 4] = ps4 * g; Pcov[no6 + 5] = ps5 * g;
          } else {
            const a0 = mapA[ao], a1 = mapA[ao + 1], a2 = mapA[ao + 2];
            const a3 = mapA[ao + 3], a4 = mapA[ao + 4], a5 = mapA[ao + 5];
            const a6 = mapA[ao + 6], a7 = mapA[ao + 7], a8 = mapA[ao + 8];
            q0 = p0 * a0 + p1 * a3 + p2 * a6;      // M' = M A_i
            q1 = p0 * a1 + p1 * a4 + p2 * a7;
            q2 = p0 * a2 + p1 * a5 + p2 * a8;
            q3 = p3 * a0 + p4 * a3 + p5 * a6;
            q4 = p3 * a1 + p4 * a4 + p5 * a7;
            q5 = p3 * a2 + p4 * a5 + p5 * a8;
            q6 = p6 * a0 + p7 * a3 + p8 * a6;
            q7 = p6 * a1 + p7 * a4 + p8 * a7;
            q8 = p6 * a2 + p7 * a5 + p8 * a8;
            const t00 = q0 * rc0 + q1 * rc1 + q2 * rc2;   // Sigma' = M' Sigma M'^T
            const t01 = q0 * rc1 + q1 * rc3 + q2 * rc4;
            const t02 = q0 * rc2 + q1 * rc4 + q2 * rc5;
            const t10 = q3 * rc0 + q4 * rc1 + q5 * rc2;
            const t11 = q3 * rc1 + q4 * rc3 + q5 * rc4;
            const t12 = q3 * rc2 + q4 * rc4 + q5 * rc5;
            const t20 = q6 * rc0 + q7 * rc1 + q8 * rc2;
            const t21 = q6 * rc1 + q7 * rc3 + q8 * rc4;
            const t22 = q6 * rc2 + q7 * rc4 + q8 * rc5;
            Pcov[no6]     = t00 * q0 + t01 * q1 + t02 * q2;
            Pcov[no6 + 1] = t00 * q3 + t01 * q4 + t02 * q5;
            Pcov[no6 + 2] = t00 * q6 + t01 * q7 + t02 * q8;
            Pcov[no6 + 3] = t10 * q3 + t11 * q4 + t12 * q5;
            Pcov[no6 + 4] = t10 * q6 + t11 * q7 + t12 * q8;
            Pcov[no6 + 5] = t20 * q6 + t21 * q7 + t22 * q8;
          }
          const dd0 = mapD[doff], dd1 = mapD[doff + 1], dd2 = mapD[doff + 2];
          let mx = pmx + p0 * dd0 + p1 * dd1 + p2 * dd2;      // mu' = mu + M d_i
          let my = pmy + p3 * dd0 + p4 * dd1 + p5 * dd2;
          let mz = pmz + p6 * dd0 + p7 * dd1 + p8 * dd2;
          // Pre cull write; a culled child leaves slot n to the next map, so only PM waits.
          Pmu[no3] = mx; Pmu[no3 + 1] = my; Pmu[no3 + 2] = mz;

          if (f32) { mx = Math.fround(mx); my = Math.fround(my); mz = Math.fround(mz); }
          const dx = (mx - cpx) * invD, dy = (my - cpy) * invD, dz = (mz - cpz) * invD;
          const rad = Math.sqrt(Pcov[no6] + Pcov[no6 + 3] + Pcov[no6 + 5]) * invD * sig;
          const ex = r0 * dx + r1 * dy + r2 * dz;
          const ey = r3 * dx + r4 * dy + r5 * dz;
          const ez = -(r6 * dx + r7 * dy + r8 * dz);
          const rr = K * rad;
          if (ez + rr < NEAR || ez - rr > zFar ||
              (Math.abs(ex) - ez * tanX) * nrmX > rr ||
              (Math.abs(ey) - ez * tanY) * nrmY > rr) { culled++; continue; }

          PM[no9] = q0; PM[no9 + 1] = q1; PM[no9 + 2] = q2;
          PM[no9 + 3] = q3; PM[no9 + 4] = q4; PM[no9 + 5] = q5;
          PM[no9 + 6] = q6; PM[no9 + 7] = q7; PM[no9 + 8] = q8;
          Prel[no3] = dx; Prel[no3 + 1] = dy; Prel[no3 + 2] = dz;
          const z = ez > NEAR ? ez : NEAR;
          const iz = 1 / z;                  // one reciprocal, not three divisions
          Psx[n] = vw * 0.5 + focal * ex * iz;
          Psy[n] = vh * 0.5 - focal * ey * iz;
          const fpn = focal * rad * iz;
          Pfp[n] = fpn;                      // debug field, unread on the IFS path
          // Attenuation at the near face of the support, ez - rr, not at the centre,
          // and floored by attFloor so footprint alone splits an oversized node: see
          // `place` in src/50_cut.js for both. Table lookup inlined from attOf
          // (src/40_state.js) because Math.exp here was 21 percent of a dragon rebuild.
          const zn = ez - rr;
          const xa = fogK * (zn - 1);
          let att;
          if (!(xa > 0)) att = 1;
          else {
            const u = xa * ATT_SC;
            if (u >= ATT_N) att = 0;
            else { const j = u | 0, ff = u - j; att = ATT[j] + (ATT[j + 1] - ATT[j]) * ff; }
          }
          Ppr[n] = fpn * (att > attFloor ? att : attFloor);
          Pw[n] = pw * mapP[mi];
          // Hue is one increment per letter, summed down the address and wrapped into
          // [0,1) as it goes, so a Float32 carries it at a uniform 1e-7 and a 240 deep
          // address is no worse than a 2 deep one. Only frac is ever read.
          let hu = pcc + mapHue[mi];
          hu -= Math.floor(hu);
          Pcc[n] = hu;
          // log10 of the piece's own diameter, integrated down the branch. Anchor
          // relative and exactly compensated by anchor.logScale, so it names an
          // absolute size at any depth. Read by the headless tests.
          Pls[n] = pls + mapLS[mi];
          Pbl[n] = cbl;
          Pdep[n] = pd;
          Ppar[n] = i; Pmi[n] = mi;      // so a clicked node can name its word
          np++;
          nextF[nn++] = n;
          made++;
        }
      }
      // Which node is drawn for this visit and at what fraction of its weight: a leaf
      // whole, a node inside the fade band at 1-t alongside its children.
      let emitI = -1, emitBl = 0;
      if (made > 0) {
        cutSize += made - 1;
        if (fadeTf < 1) { emitI = i; emitBl = fadeBl * (1 - fadeTf); cutSize++; }
      } else if (split && !full) {
        // Every child was culled. The children partition the parent's support and each
        // child's bound contains its own, so the parent has nothing visible either.
        cutSize--;
        culled++;
      } else {
        emitI = i; emitBl = Pbl[i];
      }
      if (emitI >= 0 && nEmit < cap) {
        emitted[nEmit] = i;
        const o = nEmit * FLOATS, o3 = i * 3, o6 = i * 6;
        instances[o]      = Prel[o3];
        instances[o + 1]  = Prel[o3 + 1];
        instances[o + 2]  = Prel[o3 + 2];
        instances[o + 3]  = Pcov[o6] * d2;
        instances[o + 4]  = Pcov[o6 + 1] * d2;
        instances[o + 5]  = Pcov[o6 + 2] * d2;
        instances[o + 6]  = Pcov[o6 + 3] * d2;
        instances[o + 7]  = Pcov[o6 + 4] * d2;
        instances[o + 8]  = Pcov[o6 + 5] * d2;
        // Colour is the address sum. The per map hue increments have zero measure
        // weighted mean (buildMapHue, src/40_state.js), so a region's mean hue holds
        // exactly at every level while a spread opens inside it. Hue keyed on a piece's
        // size cannot: refining replaces its pieces with smaller ones, a new colour.
        let u = huBase + Pcc[i];
        u -= Math.floor(u);
        let pi = (u * PAL) | 0;
        if (pi > PAL - 1) pi = PAL - 1; else if (pi < 0) pi = 0;
        const p3 = pi * 3;
        instances[o + 9]  = palette[p3];
        instances[o + 10] = palette[p3 + 1];
        instances[o + 11] = palette[p3 + 2];
        const wi = Pw[i] * emitBl;
        instances[o + 12] = wi * norm;
        sumW += wi;
        if (Psx[i] > -padX && Psx[i] < vw + padX && Psy[i] > -padY && Psy[i] < vh + padY) {
          sumWvis += wi;
        }
        nEmit++;
        const d = Pdep[i];
        if (d < dmin) dmin = d;
        if (d > dmax) dmax = d;
      }
    }
    const t = frontier; frontier = nextF; nextF = t;
    job.nf = nn; job.levelReady = false; job.q = 0; job.nn = 0;
  }

  job.np = np; job.nEmit = nEmit; job.cutSize = cutSize;
  job.dmin = dmin; job.dmax = dmax; job.visited = visited; job.culled = culled;
  job.sumW = sumW; job.sumWvis = sumWvis; job.bAllow = bAllow;
  job.ms += performance.now() - t0;
  if (done) job.active = false;
  return done;
}

/* ==== src/60_gl.js ==================================================== */
/* ================================ WebGL ================================= */
// The rasterizer. Two vertex shaders over one instance buffer, general (13 floats an instance) and
// flat (7), a shared splat fragment shader, a tone map over the accumulation buffer, and the
// magnifier squares, which redraw the same splats at a larger focal length. Instances and the
// reprojection terms uK, uO, uRc come from the cut in src/50_cut.js. Pixel coordinates have their
// origin at the bottom left. The shaders are template literals, so no backtick may appear in one.
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aPos;
layout(location=2) in vec3 aCovA;   // xx xy xz
layout(location=3) in vec3 aCovB;   // yy yz zz
layout(location=4) in vec3 aCol;
layout(location=5) in float aW;
uniform mat3 uR;           // world to eye, current camera
uniform mat3 uRc;          // the CUT's own frame to eye. Equal to uR except in
                           // the two or three frames after a rebase, when the
                           // scene has been re-expressed in a child piece's
                           // coordinates and the cut on screen predates it.
uniform vec2 uFocal;
uniform vec2 uVp;
uniform float uGain;
uniform float uFilter;
uniform float uFog;
uniform vec3 uFogCol;
uniform float uK;          // rescale from the cut's camera to the current one
uniform vec3 uO;           // and offset
uniform float uSig2;       // splat size, squared
uniform float uKnorm;      // super Gaussian area normalization
uniform float uExtent;     // support radius, in sigma
uniform float uEnergy;     // 1 = emissive measure, 0 = opaque surface
uniform float uSlab;       // depth prepass: push depth back this many sigma_z
uniform float uFadePx;     // fade a measure's splat out above this screen sigma
uniform float uZFar;       // the depth of field limit, where the cut culls
uniform vec2 uDepth;       // 1/log(zf/zn), log(zn)
// A CONSTANT SCREEN OFFSET, in pixels, added after projection. Zero for every normal frame. The
// magnifier that once lived in the Gaussian view was one of these; it is kept because the flat
// and general paths must agree about the projection and a zero here costs nothing.
uniform vec2 uShift;
out vec3 vConic;
out vec2 vOff;
out vec3 vCol;
out float vPeak;
void main() {
  // The splat carries the cut's rotation, the camera offset carries the current
  // one. See reprojection() in src/50_cut.js for the derivation.
  vec3 pc = uRc * (aPos * uK) - uR * uO;
  float z = -pc.z;
  if (z < 1e-6) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    vConic = vec3(1.0, 0.0, 1.0); vOff = vec2(1e4); vCol = vec3(0.0); vPeak = 0.0;
    return;
  }
  float k2 = uK * uK * uSig2;
  mat3 S = mat3(aCovA.x, aCovA.y, aCovA.z,
                aCovA.y, aCovB.x, aCovB.y,
                aCovA.z, aCovB.y, aCovB.z) * k2;
  mat3 Sc = uRc * S * transpose(uRc);         // covariance in eye space
  float iz = 1.0 / z;
  vec3 j0 = vec3(uFocal.x * iz, 0.0, uFocal.x * pc.x * iz * iz);   // d(pixel u)/d(pc)
  vec3 j1 = vec3(0.0, uFocal.y * iz, uFocal.y * pc.y * iz * iz);   // d(pixel v)/d(pc)
  float c00 = dot(j0, Sc * j0);
  float c01 = dot(j0, Sc * j1);
  float c11 = dot(j1, Sc * j1);
  // Convolve with the pixel footprint. That is the whole anti-aliasing story
  // here: the sampling rate is known exactly, so clamp straight to it.
  float fr = uFilter * uFilter;
  c00 += fr; c11 += fr;
  float det = max(c00 * c11 - c01 * c01, 1e-14);
  float att = exp(-uFog * max(0.0, z - 1.0));
  // A measure is emissive, so distance dims it and the peak is set so the
  // integral over the image equals the branch weight, which makes brightness
  // independent of dilation and therefore of zoom. A surface is not: distance
  // must fade it toward the far colour without making it transparent, and its
  // peak is an opacity, independent of how large it lands on screen.
  if (uEnergy > 0.5) {
    // Refinement caps the footprint, but the budget and the depth limit can always
    // win, so whatever is left over has to LEAVE smoothly rather than pop. Fade over
    // one octave above the cap. This is the only place a splat's light is not
    // conserved, and it is deliberate: an oversized splat is a coarse stand-in for
    // structure that is not being drawn, and a faint wash covering half the screen is
    // worse than nothing there. Surfaces are exempt, see uEnergy.
    float sp = sqrt(max(c00, c11));
    float fade = 1.0 - smoothstep(uFadePx, uFadePx * 2.0, sp);
    // AND a taper to zero at the depth of field limit, which the surface path below has
    // always had and this one did not. The fog term alone is exp(-fog (z-1)), so at the
    // limit it is exp(-8) = 3.4e-4 of the near field and the cut then culls the splat
    // outright. That reads as a fade that goes soft and then stops, for a reason worth
    // writing down: the frame is shown through a 1/2.2 encode, so a factor of 3.4e-4 in
    // linear light is still 3.6 percent of full displayed brightness, and a step from 3.6
    // percent to nothing against a background that is itself only 2 percent is visible.
    //
    // Measured, both directions. Moving the cull twice and four times further out changes
    // the frame by 0.0000 of full range, so the light past the limit really is nothing and
    // the cull is not the problem. The light in the last half of the depth of field is NOT
    // nothing, and this is what lands it on zero smoothly, with zero slope, instead of
    // chopping it.
    fade *= 1.0 - smoothstep(uZFar * 0.55, uZFar, z);
    vPeak = aW * uGain * att * uKnorm * inversesqrt(det) * fade;
    vCol = aCol;
  } else {
    // A surface is culled at the depth of field limit, and an opaque surface that
    // simply STOPS leaves a hard edge across the frame wherever the fog colour does
    // not happen to equal the background gradient at that height. Fading the opacity
    // out over the last quarter of the range dissolves it into the background instead,
    // which is the same "leave smoothly rather than pop" the measure path gets above.
    vPeak = aW * uGain * (1.0 - smoothstep(uZFar * 0.72, uZFar, z));
    vCol = mix(uFogCol, aCol, att);
  }
  vConic = vec3(c11, -c01, c00) / det;
  float rx = min(uExtent * sqrt(c00), uVp.x);
  float ry = min(uExtent * sqrt(c11), uVp.y);
  vOff = aCorner * vec2(rx, ry);
  // The prepass writes the front surface pushed BACK, and the colour pass then keeps
  // everything in front of that. The push has to be at least a resolvable amount of
  // depth, or a surfel whose eye-space z variance is small rejects ITSELF: it writes
  // its own depth and then fails its own LESS test. A flat lake seen from above is
  // exactly that case, and it took the terrain to a completely black frame with 250 000
  // splats sitting in the buffer. The relative term guarantees the margin whatever the
  // covariance does; the slab is what actually sets the thickness.
  float zd = z * 1.002 + uSlab * sqrt(max(Sc[2][2], 0.0));
  float ndc = (log(max(zd, 1e-7)) - uDepth.y) * uDepth.x * 2.0 - 1.0;
  vec2 ctr = vec2(uFocal.x * pc.x * iz, uFocal.y * pc.y * iz) + uShift;
  gl_Position = vec4((ctr + vOff) / (0.5 * uVp), clamp(ndc, -1.0, 1.0), 1.0);
}`;

// The same projection for a flat cut, from seven floats an instance instead of thirteen. A plane
// cell is a disc at y = uPlaneY, so its covariance is diag(r^2/3, (0.06 r)^2, r^2/3) and the single
// scalar `aRad` determines it. The thin term across the plane must stay nonzero: a disc has zero
// variance normal to itself, and a degenerate covariance has no conic inverse. See FLAT_FLOATS.
const FLAT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec2 aPos2;    // x and z in the cut's own normalized frame
layout(location=2) in float aRad;    // the cell's half width, same frame
layout(location=3) in vec3 aCol;
layout(location=4) in float aW;
uniform mat3 uR;
uniform mat3 uRc;
uniform vec2 uFocal;
uniform vec2 uVp;
uniform float uFilter;
uniform float uFog;
uniform vec3 uFogCol;
uniform float uK;
uniform vec3 uO;
uniform float uSig2;
uniform float uExtent;
uniform float uZFar;
uniform vec2 uDepth;
uniform vec2 uShift;                 // see the note on uShift in VS
uniform float uPlaneY;               // the y every splat in this cut shares
out vec3 vConic;
out vec2 vOff;
out vec3 vCol;
out float vPeak;
void main() {
  vec3 aPos = vec3(aPos2.x, uPlaneY, aPos2.y);
  vec3 pc = uRc * (aPos * uK) - uR * uO;
  float z = -pc.z;
  if (z < 1e-6) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    vConic = vec3(1.0, 0.0, 1.0); vOff = vec2(1e4); vCol = vec3(0.0); vPeak = 0.0;
    return;
  }
  // THE COVARIANCE IS RANK ONE PLUS A MULTIPLE OF THE IDENTITY, and writing it that way removes
  // two 3x3 matrix products a vertex. This is the honest answer to "is this a 3D Gaussian with a
  // wasted third component": the STORAGE has been two dimensional for a while, seven floats an
  // instance, but the projection was still building a 3x3, rotating it into eye space with
  // uRc S uRc^T and contracting it twice, which is fifty four multiplies to express something
  // with two degrees of freedom.
  //
  //   S = r^2 (v I + (t2 - v) e_y e_y^T),  so  Sc = uRc S uRc^T = r^2 (v I + (t2 - v) n n^T)
  //
  // with n = uRc e_y, the plane's normal in eye space, which is the second COLUMN of uRc and is
  // therefore free. The identity part contracts to plain dot products of the Jacobian rows with
  // themselves, and those have structure too: with j0 = f/z (1, 0, sx) and j1 = f/z (0, 1, sy),
  // where sx and sy are the projected coordinates, every entry is two multiplies.
  float iz = 1.0 / z;
  float ex = uFocal.x * iz, ey = uFocal.y * iz;
  float sx = pc.x * iz, sy = pc.y * iz;
  vec3 nrm = uRc[1];                            // uRc * (0,1,0): the plane's normal in eye space
  float A = uK * uK * uSig2 * aRad * aRad;
  const float V = 1.0 / 3.0;                    // the cell's own second moment, over r^2
  const float DT = 0.0036 - V;                  // (0.06 r)^2 minus it: the thin axis across the plane
  float n0 = nrm.x + nrm.z * sx;
  float n1 = nrm.y + nrm.z * sy;
  float c00 = A * ex * ex * (V * (1.0 + sx * sx) + DT * n0 * n0);
  float c01 = A * ex * ey * (V * (sx * sy)       + DT * n0 * n1);
  float c11 = A * ey * ey * (V * (1.0 + sy * sy) + DT * n1 * n1);
  float fr = uFilter * uFilter;
  c00 += fr; c11 += fr;
  float det = max(c00 * c11 - c01 * c01, 1e-14);
  float att = exp(-uFog * max(0.0, z - 1.0));
  // A plane cut is drawn by the SURFACE model, not the emissive one, and getting this wrong is
  // invisible in code and glaring on screen. built.surface is true for a plane object, so the
  // general shader takes its uEnergy = 0 branch: the peak is an OPACITY, independent of how large
  // the splat lands, the gain is 1 rather than vw*vh*gain, the colour is mixed toward the far
  // colour by distance, and the screen size fade is deliberately not applied because a surface
  // that thins out with size stops covering. Only that branch is kept here; there is no uEnergy
  // because a plane cut is never the other kind.
  vPeak = aW * (1.0 - smoothstep(uZFar * 0.72, uZFar, z));
  vCol = mix(uFogCol, aCol, att);
  vConic = vec3(c11, -c01, c00) / det;
  float rx = min(uExtent * sqrt(c00), uVp.x);
  float ry = min(uExtent * sqrt(c11), uVp.y);
  vOff = aCorner * vec2(rx, ry);
  float ndc = (log(max(z * 1.002, 1e-7)) - uDepth.y) * uDepth.x * 2.0 - 1.0;
  vec2 ctr = vec2(uFocal.x * pc.x * iz, uFocal.y * pc.y * iz) + uShift;
  gl_Position = vec4((ctr + vOff) / (0.5 * uVp), clamp(ndc, -1.0, 1.0), 1.0);
}`;

// Footprint: a super Gaussian exp(-0.5 (s q)^(beta/2)) with q the Mahalanobis form. beta = 2 is the
// ordinary Gaussian, higher beta flattens the top and steepens the shoulder, and s holds the second
// moment equal to the covariance so the shape sharpens without the splat shrinking.
const FS = `#version 300 es
precision highp float;
in vec3 vConic;
in vec2 vOff;
in vec3 vCol;
in float vPeak;
uniform float uShape;
uniform float uBeta2;
uniform float uCore;
// SHOW THE GAUSSIANS. 0 is off and costs one compare. Above zero it is the half width of the
// contour line IN PIXELS, and pixels is the whole of the fix recorded below.
uniform float uRing;
uniform vec3 uRingCol;
out vec4 outColor;
void main() {
  float q = vConic.x * vOff.x * vOff.x + 2.0 * vConic.y * vOff.x * vOff.y
          + vConic.z * vOff.y * vOff.y;
  float e = 0.5 * pow(max(uShape * q, 1e-9), uBeta2);
  float k = exp(-e);
  // HOW FAST THE KERNEL CHANGES ACROSS ONE FRAGMENT. Taken here, at the top, and not down in the
  // branch that uses it: a derivative asked for after a discard is undefined by the spec, and this
  // shader discards twice below. The test is on a UNIFORM, which is the one kind of control flow a
  // derivative may be taken inside, so the ordinary render still pays nothing for it.
  float g = uRing > 0.0 ? max(fwidth(k), 1e-7) : 1.0;
  if (e > 6.91) discard;
  if (k < uCore) discard;
  float a = vPeak * k;
  vec3 c = vCol;
  if (uRing > 0.0) {
    // SHOW THE GAUSSIANS: each splat drawn as its own one sigma ellipse and nothing else.
    //
    // The contour is a level set of the KERNEL rather than of the Mahalanobis form, which is the
    // same ellipse and is the right way to say it: for a Gaussian the one sigma ellipse is
    // k = exp(-1/2) = 0.6065 whatever the covariance is, and that stays true for the super Gaussian
    // at any exponent, so this needs to know nothing about uShape or uBeta2.
    //
    // The OUTLINE is neutral and the INTERIOR carries the splat's own colour. The outline has to
    // be one colour everywhere or a splat is legible only where it happens to differ in hue from
    // whatever it lies on, and the outlines are what carry the geometry: how large each ellipse
    // is, which way it points, and how they overlap. The interior has no such constraint. It is
    // already being drawn so that overlaps read at all, and drawing it in the object's colour
    // costs nothing and says which piece each ellipse belongs to.
    //
    // The two are mixed by ALPHA rather than added, because the tone map divides accumulated
    // colour by accumulated alpha: emitting vCol*aFill + uRingCol*aRing against a total alpha of
    // aFill + aRing is what makes the ring read as white over a tinted body instead of the whole
    // splat washing to the average of the two.
    //
    // No backticks in this comment, and that is not a style rule. This whole shader is a JS
    // template literal, so one backtick here ends the string and the file stops parsing.
    //
    // THE LINE IS A WIDTH IN PIXELS, and it used to be a width in units of the kernel's own value.
    // That difference is the whole of the aliasing this mode had.
    //
    // A contour width stated in kernel units is a width that SCALES WITH THE SPLAT. Near the one
    // sigma contour the kernel falls by 0.6065 per sigma, so a line of w in kernel units is
    // w * R / 0.6065 pixels wide on a splat whose one sigma radius is R pixels. That was fine while
    // this mode drew ellipses twenty eight pixels across: at 1/26 kernel units the line came out
    // 0.9 px and looked like a line. The same constant on the six pixel ellipses this mode draws
    // now is 0.19 px, which is a line thinner than the grid it is being sampled on, so it turns
    // into a dotted crawl along every boundary. That is the pixelation, and no amount of tuning the
    // constant fixes it, because there is no one constant: the splats are not all the same size.
    //
    // fwidth(k) is how much the kernel changes between one fragment and the next, so (k - contour)
    // divided by it is the signed distance to the contour measured IN FRAGMENTS. A line of a fixed
    // number of those is the same width everywhere, on every splat, at every zoom, and inside the
    // magnified corner as well, which is why the caller no longer scales this by the magnification.
    // The falloff being smooth over that distance is what antialiases it: a fragment half a pixel
    // off the contour gets half the weight, which is exactly what a good line does.
    //
    // The INTERIOR fades out across one pixel at the contour for the same reason. It used to end at
    // a hard discard, and a hard edge on a tinted disc is a jagged silhouette however thin the tail
    // behind it is. The tail itself still has to go, or a few hundred overlapping Gaussians pile up
    // into a white fog with the ellipses buried in it; that is what the discard below does, three
    // line widths outside the contour, where there is nothing left to draw.
    //
    // AND THE LINE IS NEVER DRAWN NARROWER THAN THE GRID, it is drawn DIMMER instead. Below about
    // half a pixel a Gaussian line is narrower than the spacing of the samples taken from it, so
    // how bright it comes out depends on where the pixel centres happen to fall across it, which
    // is the speckle all over again in a subtler form. Widening it to the floor and scaling the
    // amplitude by the same ratio keeps the LIGHT the line carries the same, which is what the eye
    // integrates anyway, and makes every value of the width setting mean something.
    float dp = (k - 0.60653) / g;
    float w = max(uRing, 0.55);
    if (dp < -3.0 * w) discard;
    float t = dp / w;
    float ring = (uRing / w) * exp(-t * t);
    float fill = clamp(dp + 0.5, 0.0, 1.0);
    float aFill = vPeak * ${GAUSS_FILL} * k * fill;
    float aRing = vPeak * 2.4 * ring;
    a = aFill + aRing;
    c = (vCol * aFill + uRingCol * aRing) / max(a, 1e-6);
  }
  outColor = vec4(c * a, a);
}`;

const TONE_VS = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  vUv = p * 0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

// Two opacity models over the same accumulation buffer, both order independent, so there is no
// sort anywhere.
//
//   solid  a = 1 - exp(-T)         emission absorption at a uniform emission to extinction ratio,
//                                  for which the density weighted mean colour is exact. Saturating
//                                  past T of about three is what stops a two dimensional measure,
//                                  which projects to twice the density down its symmetry axes,
//                                  changing brightness with the viewing direction.
//
//   glow   b = log(1+T)/log(1+W)   Draves log density, for a measure whose density is unbounded.
