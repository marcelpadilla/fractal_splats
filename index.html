/* ===================== the escape time field, in the plane ================ */
// A second reading of the same mathematics, and the one that answers "make the normal
// Mandelbrot look good first". The terrain in 30_mandel.js turns the distance estimate into
// a height and lights it as a surface. This turns the ESCAPE COUNT into a colour and draws
// it flat, which is what a Mandelbrot image has always been.
//
// It is a much better fit for the colour requirement than anything the IFS objects can
// manage, and for a reason worth stating: the smooth escape count is a continuous function
// of position, defined by the mathematics alone. So a point's colour
//
//   - is a property OF THAT POINT and of nothing else, not of the camera, not of the cut;
//   - varies continuously across the plane, so neighbouring splats are neighbouring colours;
//   - grows without bound towards the boundary, so a periodic palette cycles forever as the
//     camera descends and new colours arrive from within.
//
// Which is the whole specification, satisfied by construction rather than by contrivance.
//
//   z -> z^p + c        Mandelbrot: z0 = 0, c = the point.   dz/dc starts at 0
//                       Julia:      z0 = the point, c fixed. dz/dz0 starts at 1
//
// One function for both, because they differ only in what is varied and what is held.

const PB = 1e6, PB2 = PB * PB;              // bailout radius and its square
const pfl = {
  nu: 0,        // smooth escape count
  de: 0,        // distance estimate to the set
  gnu: 0,       // |grad nu|, per unit length in the plane
  ux: 0, uz: 0, // unit gradient of log|z|, pointing AWAY from the set
  inside: 0,    // no escape: proven by a cycle, or assumed after maxIter
  iters: 0,
  // Why the orbit stopped. Not decoration: the cost of this object is entirely the mean
  // iteration count, and the only way to lower it is to know which exit is paying for it.
  // 0 analytic interior, 1 condemned by the derivative, 2 attracting cycle, 3 iterations
  // exhausted, 4 escaped, 5 the arithmetic gave up.
  why: 0,
};

// `rTol` is the cell's own half size, used for the derivative bailout: once |dz| passes
// 2 B log B / rTol the distance estimate is already proved smaller than the cell, so the
// cell straddles the boundary and no further iteration can change that verdict. It fires
// around iteration 100 instead of 3000 and it is the reason a deep zoom is affordable.
function planeField(px, py, p, c0x, c0y, julia, maxIter, rTol) {
  // The analytic interior test, for the two largest components of the Mandelbrot, and it is
  // not an optimization here so much as a correctness fix. Interior points are proven interior
  // only by the periodicity test, and near a component's boundary the multiplier is close to
  // one so convergence is slow: at a 228 iteration cap, measured, only 0.2 percent of the
  // drawn cells were proven interior and 51.6 percent came back merely unresolved, which is
  // drawn as the dark edge colour. The whole cardioid rendered as edge. Two lines of algebra
  // prove most of it instead, exactly, at zero cost.
  if (!julia && p === 2 && inMainBody(px, py)) {
    pfl.iters = 0; pfl.inside = 1; pfl.nu = 0; pfl.de = 0; pfl.gnu = 0; pfl.why = 0;
    return;
  }
  let zx, zz, cx, cz, dx, dz;
  if (julia) { zx = px; zz = py; cx = c0x; cz = c0y; dx = 1; dz = 0; }
  else { zx = 0; zz = 0; cx = px; cz = py; dx = 0; dz = 0; }
  // The condemnation test, exactly. See the loop below for why there is no constant in it any
  // more. rTol^2, because the test is squared to avoid a square root.
  const rt2 = rTol > 0 ? rTol * rTol : 0;
  const lnp = p === 2 ? Math.LN2 : Math.log(p);
  const LPB = Math.log(PB);
  let rx = 0, rz = 0, per = 8, chk = 8;
  let n = 0, esc = false, m = 0, cyc = false, tPrev = 0;
  // Two loops, because measured, the inner loop IS the object. At 16 ns an iteration the
  // general-p loop costs 2 microseconds for a near boundary cell at depth, which is 90 percent
  // of the whole build; the specialization below runs the same arithmetic at 5. Everything that
  // is constant for the whole call is out of it, the derivative test and the cycle test both
  // moved inside the one-in-eight branch, and z^(p-1) is folded away rather than computed by a
  // loop that runs zero times.
  //
  //   dz' = p z^(p-1) dz + (1 for the Mandelbrot, 0 for a Julia),  then z' = z^p + c
  //
  // In the p = 2 case the derivative test costs one multiply-add per eight iterations and the
  // cycle test two absolute values per eight, so the body really is six multiplies and a
  // compare. The general loop keeps the readable form for p up to 8.
  if (p === 2) {
    const one = julia ? 0 : 1;
    for (; n < maxIter; n++) {
      const ndx = 2 * (zx * dx - zz * dz) + one;
      const ndz = 2 * (zx * dz + zz * dx);
      dx = ndx; dz = ndz;
      const nzx = zx * zx - zz * zz + cx;
      zz = 2 * zx * zz + cz; zx = nzx;
      m = zx * zx + zz * zz;
      if (m > PB2) { n++; esc = true; break; }
      if ((n & 7) === 7) {
        // Condemned: closer to the set than the cell is wide, so no further iteration can
        // change the verdict and the cell is boundary. Written out EXACTLY, and the history of
        // this line is worth keeping because it has been wrong twice in opposite directions.
        //
        // The estimate is de = |z| log(m) / |dz| with m = |z|^2, so the test de < rTol squares
        // to m log(m)^2 < rTol^2 |dz|^2 with no square root and one logarithm per eight
        // iterations. It was first written with |z| replaced by the bailout radius 1e6, which
        // made it ten million times too LAX and cost a few hundred iterations a cell. It was
        // then replaced by a constant 48/rTol, on the argument that a non-escaped orbit has
        // |z| under about 2 so 2|z|log|z| is under 2.8. That argument is false: the test fires
        // in the middle of an orbit, where |z| has passed 2 and is on its way to the bailout
        // radius, and at |z| ~ 100 the constant condemns a cell whose distance to the set is
        // NINETEEN times its own radius. Measured against a supersampled reference, that turned
        // whole regions of smooth bright exterior into flat blobs of the unresolved colour: the
        // "sparse amounts of spots" in the review. A constant cannot express this test, because
        // the quantity being bounded moves by six orders of magnitude along the orbit.
        //
        // The exact form costs one Math.log per eight iterations and fires exactly when the
        // running distance estimate first drops below the cell size, which is the verdict that
        // was wanted all along.
        if (m > 1 && rt2 > 0) {
          const lm = Math.log(m);
          // t is the condemnation test as a ratio, so t > 1 is de < rTol. Kept as a ratio
          // rather than a comparison because its value at the two checks either side of the
          // crossing is what makes the colour continuous, below.
          const t = (dx * dx + dz * dz) * rt2 / (m * lm * lm);
          if (t > 1) {
            // A colour for a condemned cell, and it has to be a continuous function of the
            // point or it is worse than none. Four versions, all measured against a 3x3
            // supersampled reference of the same view at 1377x1592:
            //
            //   nu = 0. The whole tangle one flat colour, and it was the SET's colour, so
            //   unrefined exterior looked like set: 72 percent of the frame against a true 60.
            //   rms 0.224. A cell that has not been refined is evidence about the budget.
            //
            //   the ramp's own mean over the cell, which is the exactly correct antialiased
            //   answer. A grey halo along the whole boundary. rms 0.118. Correct and ugly: see
            //   FILT_MAX in src/52_cut_plane.js for why this renderer stopped being correct
            //   here on purpose.
            //
            //   nu = n, the iteration it was condemned at, which is a real and monotone
            //   measure of how deep into the boundary layer the cell sits. rms 0.063, the best
            //   of the four. But the test only runs one iteration in eight, so n jumps by 8
            //   between neighbours and between a cell and its own children, and eight
            //   iterations is a quarter turn of the ramp: hue noise, and worse, hue noise that
            //   changes as the camera refines.
            //
            //   this one: the crossing INTERPOLATED between the last two checks. t grows
            //   geometrically along the orbit, so the crossing of t = 1 is found by linear
            //   interpolation in log t, and nEff is continuous in the point and drifts by
            //   about one iteration per level of refinement instead of jumping by eight. Two
            //   logarithms, once per cell, on the path that ends the orbit anyway.
            let f = 1;
            if (tPrev > 0) {
              const b = Math.log(t / tPrev);
              f = b > 0 ? -Math.log(tPrev) / b : 1;
              if (!(f >= 0)) f = 0; else if (f > 1) f = 1;
            }
            pfl.iters = n; pfl.inside = 0;
            pfl.nu = n - 8 + 8 * f;
            pfl.de = 0; pfl.gnu = 1e30; pfl.why = 1;
            return;
          }
          tPrev = t;
        }
        // Brent's cycle detection, and the tolerance is a cost decision. At 1e-16 the orbit has
        // to converge to the last bit before the cycle is recognized, which for a multiplier
        // near one takes thousands of iterations. At 1e-10 the point is within 1e-10 of an
        // attracting cycle, which is interior for any purpose this renderer has. The risk is a
        // near boundary point whose orbit nearly closes being called interior, which paints one
        // cell as set instead of as exterior; every renderer makes this trade, and the honest
        // thing is to say where it is set. Checking one iteration in eight delays detection by
        // at most eight and takes the check off the critical path.
        if (n > 24) {
          if (Math.abs(zx - rx) + Math.abs(zz - rz) < 1e-10) { cyc = true; break; }
          if ((chk -= 8) <= 0) { rx = zx; rz = zz; per += per; chk = per; }
        }
      }
    }
  } else {
    const one = julia ? 0 : 1;
    for (; n < maxIter; n++) {
      let wx = 1, wz = 0;                 // z^(p-1) by repeated multiplication
      for (let k = 1; k < p; k++) { const t = wx * zx - wz * zz; wz = wx * zz + wz * zx; wx = t; }
      const mx = p * wx, mz = p * wz;
      const ndx = mx * dx - mz * dz + one;
      const ndz = mx * dz + mz * dx;
      dx = ndx; dz = ndz;
      const nzx = wx * zx - wz * zz + cx;
      zz = wx * zz + wz * zx + cz; zx = nzx;
      m = zx * zx + zz * zz;
      if (m > PB2) { n++; esc = true; break; }
      if ((n & 7) === 7) {
        if (m > 1 && rt2 > 0) {
          const lm = Math.log(m);
          // t is the condemnation test as a ratio, so t > 1 is de < rTol. Kept as a ratio
          // rather than a comparison because its value at the two checks either side of the
          // crossing is what makes the colour continuous, below.
          const t = (dx * dx + dz * dz) * rt2 / (m * lm * lm);
          if (t > 1) {
            // A colour for a condemned cell, and it has to be a continuous function of the
            // point or it is worse than none. Four versions, all measured against a 3x3
            // supersampled reference of the same view at 1377x1592:
            //
            //   nu = 0. The whole tangle one flat colour, and it was the SET's colour, so
            //   unrefined exterior looked like set: 72 percent of the frame against a true 60.
            //   rms 0.224. A cell that has not been refined is evidence about the budget.
            //
            //   the ramp's own mean over the cell, which is the exactly correct antialiased
            //   answer. A grey halo along the whole boundary. rms 0.118. Correct and ugly: see
            //   FILT_MAX in src/52_cut_plane.js for why this renderer stopped being correct
            //   here on purpose.
            //
            //   nu = n, the iteration it was condemned at, which is a real and monotone
            //   measure of how deep into the boundary layer the cell sits. rms 0.063, the best
            //   of the four. But the test only runs one iteration in eight, so n jumps by 8
            //   between neighbours and between a cell and its own children, and eight
            //   iterations is a quarter turn of the ramp: hue noise, and worse, hue noise that
            //   changes as the camera refines.
            //
            //   this one: the crossing INTERPOLATED between the last two checks. t grows
            //   geometrically along the orbit, so the crossing of t = 1 is found by linear
            //   interpolation in log t, and nEff is continuous in the point and drifts by
            //   about one iteration per level of refinement instead of jumping by eight. Two
            //   logarithms, once per cell, on the path that ends the orbit anyway.
            let f = 1;
            if (tPrev > 0) {
              const b = Math.log(t / tPrev);
              f = b > 0 ? -Math.log(tPrev) / b : 1;
              if (!(f >= 0)) f = 0; else if (f > 1) f = 1;
            }
            pfl.iters = n; pfl.inside = 0;
            pfl.nu = n - 8 + 8 * f;
            pfl.de = 0; pfl.gnu = 1e30; pfl.why = 1;
            return;
          }
          tPrev = t;
        }
        if (n > 24) {
          if (Math.abs(zx - rx) + Math.abs(zz - rz) < 1e-10) { cyc = true; break; }
          if ((chk -= 8) <= 0) { rx = zx; rz = zz; per += per; chk = per; }
        }
      }
    }
  }
  pfl.iters = n;
  if (!esc) {
    // A cycle proves interior. Running out of iterations proves nothing, and calling it
    // interior is the mistake that fills a deep frame with flat colour: see the same
    // argument in mandelField. An exhausted cell is unresolved and very close to the set.
    if (cyc || n < maxIter) { pfl.inside = 1; pfl.nu = 0; pfl.de = 0; pfl.gnu = 0; pfl.why = 2; return; }
    // OUT OF ITERATIONS, and this verdict has to be split in two because it means opposite
    // things at opposite depths. Measured, by taking every cell a cut called exhausted and
    // asking again at sixty times the cap:
    //
    //     zoom      exhausted cells really were
    //     10^0.4    68 % interior, 28 % exterior
    //     10^3      82 % interior, 18 % exterior
    //     10^6.2    17 % interior, 82 % exterior
    //     10^10     0 % interior, 100 % exterior
    //
    // So no constant set fraction can be right for it, and neither can a function of depth,
    // because which one it is depends on where in the plane the frame happens to be. The
    // discriminant is local and it is already in hand: an interior orbit converges to an
    // attracting cycle, so its derivative dz/dc stays BOUNDED, while an exterior orbit on its
    // way out has a derivative growing like the product of 2|z| along the orbit. The distance
    // estimate sqrt(m) log(m) / |dz| is therefore of order the size of the whole object for an
    // interior point and of order the cell for an exterior one, and those differ by the zoom
    // factor. 64 cell radii is a threshold with six orders of magnitude of daylight either
    // side of it at any depth past the opening view.
    //
    // THAT WAS TRIED AND IT IS FALSE. Implemented as `de > 64 rTol means interior` and checked
    // against the same sixty times cap truth: at ten to the six it called 1 339 cells interior
    // that were exterior and 318 correctly, and the frame went to 73 percent set, which is the
    // flooding bug back and worse. The premise is what is wrong. At depth an exterior point can
    // be hundreds of cell radii from the boundary and STILL exceed the cap, because the escape
    // count is set by the potential and the potential near a deep Misiurewicz point is minute
    // while the distance is not. That is the same fact that makes deep zooming need iteration
    // counts in the tens of thousands, and it means there is no local shortcut: the only honest
    // way to know what an exhausted cell is, is to iterate it further. Which is what the
    // stationary refinement ramp in planeRoot does, and why the base cap is what it is.
    pfl.inside = 0; pfl.nu = n; pfl.de = 0; pfl.gnu = 1e30; pfl.why = 3;
    return;
  }
  const dm = Math.sqrt(dx * dx + dz * dz);
  const lr = 0.5 * Math.log(m);                        // log|z|
  if (!(dm < 1e300) || !(m < 1e300) || !(dm > 1e-300)) {
    pfl.inside = 0; pfl.nu = 0; pfl.de = 0; pfl.gnu = 1e30; pfl.why = 5;
    return;
  }
  const az = Math.sqrt(m);
  // Smooth escape count: n minus log_p of log|z| over log B, which removes the integer
  // banding and makes nu a continuous function of the point. That continuity is the whole
  // reason the colour can be gradual.
  pfl.nu = n - Math.log(lr / LPB) / lnp;
  pfl.de = 2 * az * lr / dm;
  // |grad nu| = |dz| / (|z| log|z| ln p). This is the quantity refinement is driven by,
  // because |grad nu| times the cell size is exactly how much of the colour ramp the cell
  // spans, and a cell that spans less than a fraction of one ramp step is finished.
  pfl.gnu = dm / (az * (lr > 1e-12 ? lr : 1e-12) * lnp);
  // grad log|z| = (Re(dz/z), -Im(dz/z)), which points away from the set. With `de` this gives
  // a Newton step onto the boundary, which is how an aim point is named exactly at any depth.
  const wr = (dx * zx + dz * zz) / m, wi = (dz * zx - dx * zz) / m;
  const gm = Math.sqrt(wr * wr + wi * wi);
  if (gm > 1e-300) { pfl.ux = wr / gm; pfl.uz = -wi / gm; } else { pfl.ux = 0; pfl.uz = 0; }
  pfl.inside = 0; pfl.why = 4;
}

// A point exactly on the Julia set, constructed rather than looked up.
//
// The Julia set is the closure of the backward orbit of any repelling fixed point, so:
// solve z^p + c = z for a fixed point with |f'| = |p z^(p-1)| > 1, then apply inverse
// branches z <- (z - c)^(1/p), choosing the branch by index. Every iterate is on the set,
// exactly, to rounding, and the sequence equidistributes over it, so `seed` picks a
// different place on the same set. This is the chaos game, run backwards.
//
// It matters because a Julia set is a moving target: c is live, and a coordinate written
// down for one c is not on the set for another. Aiming at the origin, which is what the
// preset used to do, put the camera inside the filled set for the default c, and a descent
// into the interior is a descent into one flat colour. Constructing the aim from c cannot
// make that mistake for any c.
function juliaPoint(cx, cy, p, seed) {
  // Newton on f(z) = z^p + c - z, from a point off the real axis so the iteration does not
  // sit on a symmetry line, then reject an attracting root by trying the next start.
  let zx = 0.6, zy = 0.35;
  for (let attempt = 0; attempt < 6; attempt++) {
    for (let k = 0; k < 40; k++) {
      // w = z^(p-1), f = w z + c - z, f' = p w - 1
      let wx = 1, wy = 0;
      for (let j = 1; j < p; j++) { const t = wx * zx - wy * zy; wy = wx * zy + wy * zx; wx = t; }
      const fx = wx * zx - wy * zy + cx - zx, fy = wx * zy + wy * zx + cy - zy;
      const dx = p * wx - 1, dy = p * wy;
      const q = dx * dx + dy * dy;
      if (!(q > 1e-300)) break;
      zx -= (fx * dx + fy * dy) / q;
      zy -= (fy * dx - fx * dy) / q;
    }
    let wx = 1, wy = 0;
    for (let j = 1; j < p; j++) { const t = wx * zx - wy * zy; wy = wx * zy + wy * zx; wx = t; }
    const mult = p * Math.hypot(wx, wy);
    if (mult > 1.0000001 && isFinite(zx + zy)) break;
    zx = -0.7 + 0.31 * attempt; zy = 0.62 - 0.19 * attempt;
  }
  if (!isFinite(zx + zy)) return [0, 0];
  // Backward orbit. 48 steps is far more than enough: each one contracts by 1/|f'|, so the
  // point is on the set to full double precision long before the end.
  let st = (seed | 0) * 2654435761 + 1013904223;
  for (let k = 0; k < 48; k++) {
    st = (st * 1664525 + 1013904223) | 0;
    const br = ((st >>> 8) % p);
    const ax = zx - cx, ay = zy - cy;
    const rr = Math.hypot(ax, ay);
    if (!(rr > 1e-300)) return [zx, zy];
    const th = (Math.atan2(ay, ax) + 2 * Math.PI * br) / p;
    const rp = Math.pow(rr, 1 / p);
    zx = rp * Math.cos(th); zy = rp * Math.sin(th);
  }
  return [zx, zy];
}

// A point on the boundary of the exponent p Mandelbrot set, found by bisection along a ray.
//
// This exists because the preset's aim list is a set of NAMED coordinates, and a named
// coordinate belongs to one exponent. The seahorse valley point is on the boundary of the
// quadratic Mandelbrot to eighteen digits and is a long way inside the cubic one, so moving
// the exponent slider aimed the camera into solid interior and the whole frame came back one
// flat colour. Bisection needs no names: c = 0 is in the set for every p, because z = 0 is a
// fixed point of z -> z^p, and a large enough |c| escapes for every p, so a ray from the
// origin crosses the boundary and the crossing can be found to the last bit of a double.
//
// It is a boundary point of the real set for any p, which is all a descent needs. It is not a
// distinguished point the way a Misiurewicz point is, so the structure around it is whatever
// the set happens to have there, which is plenty.
function mandelBoundaryRay(theta, p, maxIter) {
  const ux = Math.cos(theta), uy = Math.sin(theta);
  const escapes = (r) => {
    planeField(ux * r, uy * r, p, 0, 0, false, maxIter, 0);
    return pfl.why === 4 || pfl.why === 5;
  };
  let lo = 0, hi = 2.5;
  for (let k = 0; k < 40 && !escapes(hi); k++) hi *= 1.6;   // out until it certainly leaves
  if (!escapes(hi)) return [0, 0];
  for (let k = 0; k < 200; k++) {
    const mid = 0.5 * (lo + hi);
    if (mid <= lo || mid >= hi) break;                      // the doubles have run out
    if (escapes(mid)) hi = mid; else lo = mid;
  }
  const r = 0.5 * (lo + hi);
  return [ux * r, uy * r];
}

// Push a point onto the boundary of whichever set this is. Same Newton step as
// projectToBoundary uses for the Mandelbrot, but it works for a Julia set too, which the
// Mandelbrot-only version cannot: a Julia aim left unprojected is not on its own boundary, the
// descent then flies into a region of uniform escape count, and a uniform region is a flat
// frame. Measured before this existed: 31 of 90 frames of a Julia descent came back dark.
function projectToPlane(px, py, p, c0x, c0y, julia, maxIter) {
  for (let k = 0; k < 8; k++) {
    planeField(px, py, p, c0x, c0y, julia, maxIter, 0);
    if (pfl.inside || !(pfl.de > 0)) break;
    const step = pfl.de;
    if (!isFinite(step) || step > 1) break;
    px -= step * pfl.ux;
    py -= step * pfl.uz;
  }
  return [px, py];
}

/* ------------------------- the field cache, for the plane ------------------ */
// The same device the terrain has, and for the same reason: a cell's field value does not
// depend on the camera at all, so it is cacheable across rebuilds, and the quadtree's cell
// centres are exact binary halvings of a fixed root, so the key is exact and a hit cannot be
// wrong. What makes it pay here is the descent rate against the cut rate: a cut lands every
// eleven frames and the camera moves 0.07 e-folds in that time, so the overwhelming majority
// of the cells in the next cut are cells that were just evaluated.
//
// The key is (cx, cz, r), three doubles, and r has to be in it: a corner sample of a cell is
// also the centre of a cell four levels down, and the two ask a different question about the
// same point, because rTol sets the derivative bailout.
//
// Four way by linear probing, exactly as the terrain's is, and for the measured reason
// recorded there: at load 0.15 a single slot per hash is collision limited rather than
// capacity limited, and four probes cost four integer compares on the miss path.
const PFC_BITS = 20, PFC_N = 1 << PFC_BITS, PFC_MASK = PFC_N - 1, PFC_WAYS = 4;
const pfcX = new Float64Array(PFC_N), pfcZ = new Float64Array(PFC_N), pfcR = new Float64Array(PFC_N);
const pfcNu = new Float64Array(PFC_N);
const pfcV = new Float32Array(PFC_N * 3);     // de, gnu, iters
const pfcWhy = new Int8Array(PFC_N);
const pfcGen = new Int32Array(PFC_N);
let pfcCur = 0, pfcHits = 0, pfcMiss = 0, pfcSaved = 0;
const pfcBuf = new Float64Array(3);
const pfcInt = new Int32Array(pfcBuf.buffer);

function pfcHash(cx, cz, r) {
  pfcBuf[0] = cx; pfcBuf[1] = cz; pfcBuf[2] = r;
  let h = Math.imul(pfcInt[0], 0x9e3779b1) ^ Math.imul(pfcInt[1], 0x85ebca6b) ^
          Math.imul(pfcInt[2], 0xc2b2ae35) ^ Math.imul(pfcInt[3], 0x27d4eb2f) ^
          Math.imul(pfcInt[4], 0x165667b1) ^ Math.imul(pfcInt[5], 0xd3a2646c);
  h ^= h >>> 15; h = Math.imul(h, 0x2545f491); h ^= h >>> 13;
  return h & PFC_MASK;
}

// Everything the answer depends on besides the cell: the quantized iteration cap, the
// exponent, the family parameter, and which set this is. Folded into one non zero generation
// stamp so a change invalidates the whole table without touching 26 MB of it.
function planeStamp(maxIter, p, c0x, c0y, julia) {
  let g = Math.imul(maxIter + 1, 1000003) ^ Math.imul(p, 0x5bd1e995) ^ (julia ? 0x1b873593 : 0);
  pfcBuf[0] = c0x; g = Math.imul(g ^ pfcInt[0], 0x85ebca6b) ^ pfcInt[1];
  pfcBuf[0] = c0y; g = Math.imul(g ^ pfcInt[0], 0xc2b2ae35) ^ pfcInt[1];
  return g | 1;
}

// Same contract as planeField, including writing `pfl`. Only the quadtree uses it;
// projectToPlane, juliaPoint and mandelBoundaryRay all call planeField directly, because
// they evaluate with rTol = 0 and that is a different question about the same point.
function planeFieldCached(px, py, p, c0x, c0y, julia, maxIter, rTol) {
  // The cache is not free and it is not always worth it. Measured on a CPU profile of the
  // opening view: this wrapper's own time was 29.8 percent of the whole cut against 24.3 for
  // the field it is caching, because a lookup is three float64 stores through a shared buffer,
  // six imuls, and a four way probe of three doubles each, and at 17 iterations a cell the
  // thing being avoided is cheaper than that. Deep down a cell costs hundreds of iterations
  // and the same cache is worth a factor of two. So it is gated on the measured cost per cell,
  // exactly as the terrain's is and for the same reason.
  if (!job.pfcOn) { planeField(px, py, p, c0x, c0y, julia, maxIter, rTol); return; }
  const h0 = pfcHash(px, py, rTol);
  for (let q = 0; q < PFC_WAYS; q++) {
    const s = (h0 + q) & PFC_MASK;
    if (pfcGen[s] === pfcCur && pfcX[s] === px && pfcZ[s] === py && pfcR[s] === rTol) {
      const v3 = s * 3;
      pfl.nu = pfcNu[s]; pfl.de = pfcV[v3]; pfl.gnu = pfcV[v3 + 1];
      pfl.iters = pfcV[v3 + 2];
      const w = pfcWhy[s];
      pfl.why = w; pfl.inside = (w === 0 || w === 2) ? 1 : 0;
      pfcHits++; pfcSaved += pfl.iters;
      return;
    }
  }
  planeField(px, py, p, c0x, c0y, julia, maxIter, rTol);
  pfcMiss++;
  let s = h0;
  for (let q = 0; q < PFC_WAYS; q++) {
    const t = (h0 + q) & PFC_MASK;
    if (pfcGen[t] !== pfcCur) { s = t; break; }
  }
  const v3 = s * 3;
  pfcX[s] = px; pfcZ[s] = py; pfcR[s] = rTol; pfcGen[s] = pfcCur;
  pfcNu[s] = pfl.nu; pfcV[v3] = pfl.de; pfcV[v3 + 1] = pfl.gnu; pfcV[v3 + 2] = pfl.iters;
  pfcWhy[s] = pfl.why;
}

/* ==== src/35_perf.js ================================================== */
/* ========================= the resource governor ========================= */
// EVERYTHING HERE EXISTS BECAUSE THIS PAGE IS PUBLIC. A demo that someone opens on a phone must
// not melt the phone, and a demo that opens on a laptop with the fan already going must not be
// the reason it screams. The renderer's own budgets are set for a 4090 and a desktop window and
// none of them ask what machine they are on.
//
// Three tiers, and each one moves the three quantities that actually cost:
//
//   dpr     the device pixel ratio the canvas is drawn at. A phone reports 3, so a 400 by 800
//           CSS canvas is 2.9 megapixels of real fragments, which is more than most desktops.
//   px      a hard ceiling on width times height, applied AFTER the ratio, so a maximized
//           4K window cannot ask for eight megapixels of splats either.
//   budget  a multiplier on the preset's splat budget, which is the cut's size and therefore
//           both the CPU time to build it and the vertex work to draw it.
//   work    the milliseconds of refinement a frame may spend. This is the one that decides
//           whether the page stays responsive while the cut catches up.
//
// The tiers are named for what they are FOR rather than for a quality: `low` is a phone, `high`
// is a desktop with a discrete GPU, `medium` is everything else.
const PERF_TIERS = [
  { name: 'low', dpr: 1.0, px: 640000, budget: 0.22, work: 2.5 },
  { name: 'medium', dpr: 1.25, px: 1500000, budget: 0.5, work: 5.0 },
  { name: 'high', dpr: 1.5, px: 2800000, budget: 1.0, work: 9.0 },
];
// Which tier is in force, and whether the governor is allowed to change it. `auto` starts from
// a guess about the device and then MEASURES; anything else is the viewer's decision and is
// left alone, because a setting that overrides itself is not a setting.
let perfAuto = true;
// Seeded from the guess, not from a literal. perfSet is only reached from the quality control and
// from a q= in the query, so a plain page load never called perfGuess and every device, phone
// included, opened at the top tier until the governor caught up.
let perfTier = perfGuess();

// The opening guess, before any frame has been timed. A coarse pointer with no hover is a
// touch device, and `deviceMemory` is the only number a browser will admit to about the
// machine. Neither is reliable and neither has to be: the governor corrects within a second.
function perfGuess() {
  if (typeof window === 'undefined' || typeof matchMedia !== 'function') return 2;
  const coarse = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-hover: hover)').matches;
  const small = Math.min(screen.width || 9999, screen.height || 9999) < 820;
  const mem = navigator.deviceMemory || 8;
  if (coarse && small) return 0;
  if (coarse || mem <= 4) return 1;
  return 2;
}

// An unknown name is treated as `auto` rather than silently leaving the tier where it was, because
// the only source of one is a q= in the query and a typo there should not pin the governor off.
// The measurement window is reset either way: perfFrame stops counting while perfAuto is false, so
// without this the first window after a return to auto is judged on frames from before the change.
function perfSet(name) {
  let tier = -1;
  for (let i = 0; i < PERF_TIERS.length; i++) if (PERF_TIERS[i].name === name) tier = i;
  perfAuto = (tier < 0);
  perfTier = perfAuto ? perfGuess() : tier;
  perfN = 0; perfBad = 0; perfGood = 0; perfWarm = 30;
}
function perfNow() { return PERF_TIERS[perfTier]; }
function perfName() { return PERF_TIERS[perfTier].name + (perfAuto ? ' (auto)' : ''); }

// THE GOVERNOR. Called once a frame with the frame's own duration.
//
// It watches a WINDOW of frames rather than an average, and that is the whole design. A mean
// frame time is dragged around by one stall, and the thing being protected against is not one
// stall, it is a machine that cannot hold the rate at all. So: count how many of the last
// PERF_WIN frames were slower than PERF_BAD, and step DOWN when most of them were. Step up only
// when a long run of them was comfortably fast, and never back into a tier that has already
// been stepped out of within this session, which is what stops the oscillation that an
// unqualified hysteresis always produces: drop, recover, drop, recover, once a second, forever.
const PERF_WIN = 45;             // about three quarters of a second at 60 Hz
const PERF_BAD = 1 / 26;         // slower than 26 fps
const PERF_GOOD = 1 / 54;        // faster than 54 fps
// perfCeil is the highest tier this session may still climb to. It starts at the top and drops to
// whatever a demotion left, so a tier that has once failed is never re-entered. It is a CEILING
// and not a floor: written as a floor the step up test could never be true, because the same
// demotion that lowered the tier also lowered the bound, and the governor could only ever descend.
let perfN = 0, perfBad = 0, perfGood = 0, perfCeil = PERF_TIERS.length - 1, perfWarm = 30;
function perfFrame(dt) {
  if (!perfAuto) return;
  // The first frames of a session include shader compilation and the first cut, and they are
  // always slow. Judging on them drops every machine to the bottom tier immediately.
  if (perfWarm > 0) { perfWarm--; return; }
  perfN++;
  if (dt > PERF_BAD) perfBad++;
  else if (dt < PERF_GOOD) perfGood++;
  if (perfN < PERF_WIN) return;
  const bad = perfBad / perfN, good = perfGood / perfN;
  perfN = 0; perfBad = 0; perfGood = 0;
  if (bad > 0.5 && perfTier > 0) {
    perfTier--;
    perfCeil = perfTier;         // this session never goes back above where it failed
    dirty = true;
  } else if (good > 0.9 && perfTier < perfCeil) {
    perfTier++;
    dirty = true;
  }
}

// Rotate the view. `ax` turns about the eye's own up axis and `ay` about its
// right axis, so R <- Q R with Q built in eye coordinates. With `level` set the
// turn goes about world up instead, which keeps a horizon.
function turnCamera(ax, ay) {
  const R = cam.R;
  if (cam.level) {
    const c = Math.cos(ax), s = Math.sin(ax);     // about world up: R <- R Ry
    for (let r = 0; r < 3; r++) {
      const x = R[r * 3], z = R[r * 3 + 2];
      R[r * 3] = x * c - z * s;
      R[r * 3 + 2] = x * s + z * c;
    }
  } else {
    const c = Math.cos(ax), s = Math.sin(ax);     // about eye up: rows 0 and 2
    for (let k = 0; k < 3; k++) {
      const a = R[k], b = R[6 + k];
      R[k] = a * c - b * s;
      R[6 + k] = a * s + b * c;
    }
  }
  const c2 = Math.cos(ay), s2 = Math.sin(ay);     // about eye right: rows 1 and 2
  for (let k = 0; k < 3; k++) {
    const a = R[3 + k], b = R[6 + k];
    R[3 + k] = a * c2 - b * s2;
    R[6 + k] = a * s2 + b * c2;
  }
  orthoBasis();
}

/* =========================== camera basis =============================== */
// One place only. The cull math and the render math must not be able to drift.
const basis = {
  R: new Float64Array(9),
  Rgl: new Float32Array(9),    // same matrix, column major, for GLSL
  fwd: new Float64Array(3),
  right: new Float64Array(3),
  up: new Float64Array(3),
  pos: new Float64Array(3),
};

function updateBasis() {
  const R = cam.R, B = basis.R;
  for (let i = 0; i < 9; i++) B[i] = R[i];
  const f = basis.fwd, r = basis.right, u = basis.up;
  r[0] = R[0]; r[1] = R[1]; r[2] = R[2];
  u[0] = R[3]; u[1] = R[4]; u[2] = R[5];
  f[0] = -R[6]; f[1] = -R[7]; f[2] = -R[8];
  const G = basis.Rgl;                                   // column major transpose
  G[0] = B[0]; G[1] = B[3]; G[2] = B[6];
  G[3] = B[1]; G[4] = B[4]; G[5] = B[7];
  G[6] = B[2]; G[7] = B[5]; G[8] = B[8];
  basis.pos[0] = cam.target[0] - f[0] * cam.dist;
  basis.pos[1] = cam.target[1] - f[1] * cam.dist;
  basis.pos[2] = cam.target[2] - f[2] * cam.dist;
}

/* ============================ loading =================================== */
function loadPreset(id, keepView) {
  cfg.preset = id;
  const P = PRESETS[id];
  anchor.M.set([1, 0, 0, 0, 1, 0, 0, 0, 1]);
  anchor.t.fill(0);
  anchor.logScale = 0; anchor.depth = 0; anchor.word = []; anchor.hue = 0;
  stats.rebases = 0;
  cam.level = P.kind !== 'ifs';        // a field is looked AT, not orbited
  // The screen space size cap, per object. It is a property of how well the budget can resolve
  // the object, not a global: an object whose cut is permanently budget limited leaves a tail
  // of oversized splats behind, and the cap is what fades them out. See the icosahedral flake.
  SIZE_CAP = (P.view && P.view.sizeCap) || 5.0;
  cam.fov = (P.fov || 45) * Math.PI / 180;
  loadPalette(P);
  targets = [];

  if (P.kind === 'plane') {
    // A flat field. No maps, no rebasing, no exposure law: the camera looks straight down at
    // a plane and the only thing that changes with distance is the scale.
    maps = null; root = null; conformal = false; mDim = 2;
    suppR = 2.6;
    // The square of side 2*radius, framed with a hair of margin. The narrow field of view is
    // deliberate: at 15 degrees the distance to the plane varies by 0.9 percent from the
    // centre of the frame to its corner, so the view is orthographic for all practical
    // purposes and the image is a picture of the plane rather than a picture of a plane seen
    // in perspective.
    suppE = P.radius;
    planeTargets(P);
    cam.goalWord = []; cam.goalPhase = 0;
  } else if (P.kind === 'terrain') {
    maps = null; root = null; conformal = false; mDim = 2;
    suppR = 2.6;
    const rel = (P.view && P.view.relief) || 0.42;
    const it = Math.round((P.view && P.view.iters) || 420);
    // Measure how tall the terrain actually gets, rather than guessing. A coarse
    // grid is enough: the height is capped and smooth away from the boundary.
    const hc = P.radius * 0.9;
    let hmax = 0;
    for (let i = 0; i < 28; i++) for (let j = 0; j < 28; j++) {
      const cx = P.center[0] + P.radius * (2 * (i + 0.5) / 28 - 1);
      const cz = P.center[1] + P.radius * (2 * (j + 0.5) / 28 - 1);
      mandelField(cx, cz, 240, 0, rel, 0, hc);
      if (fld.h > hmax) hmax = fld.h;
    }
    terrHMax = hmax;
    terrSpanRel = 0;      // remeasured from the first cut
    terrEq = false;
    suppE = Math.hypot(P.radius, P.radius, hmax * 0.5);
    for (const t of P.targets) targets.push(projectToBoundary(t[0], t[1], Math.max(it, 3000)));
    cam.goalWord = []; cam.goalPhase = 0;
  } else {
    maps = P.maps;
    root = rootMoments(maps);
    const sup = supportRadius(maps, root);
    suppR = sup.maha; suppE = sup.euclid;
    mDim = measureDimension(maps);
    conformal = maps.every(m => m.conformal && m.inv);
    // Flatten the maps. The refinement kernel touches these millions of times
    // per second and object property loads show up in the frame time.
    const k = maps.length;
    mapA = new Float64Array(k * 9);
    mapD = new Float64Array(k * 3);
    mapP = new Float64Array(k);
    mapS = new Float64Array(k);
    mapLS = new Float64Array(k);
    mapSc = new Uint8Array(k);
    mapCC = new Float64Array(k);
    for (let i = 0; i < k; i++) {
      const m = maps[i];
      mapA.set(m.A, i * 9);
      // mu_{u.i} = mu_u + M_u d_i, with d_i = w_i(mu_root) - mu_root.
      const q = mat3Vec(m.A, root.mu);
      mapD[i * 3] = q[0] + m.b[0] - root.mu[0];
      mapD[i * 3 + 1] = q[1] + m.b[1] - root.mu[1];
      mapD[i * 3 + 2] = q[2] + m.b[2] - root.mu[2];
      mapP[i] = m.p;
      mapS[i] = m.s;
      // log10 of the map's uniform scale factor. |det A|^(1/3) rather than A[0], because
      // that is the contraction of a general conformal map and A[0] is only its scale when
      // the map has no rotation. This is what the colour coordinate integrates.
      mapLS[i] = Math.log10(m.scale);
      mapSc[i] = m.scalar ? 1 : 0;
      mapCC[i] = m.cc === undefined ? (i + 0.5) / k : m.cc;
    }
    // Needs mapP and mapCC, so it happens here rather than with the palette.
    buildMapHue(P);
    // Descent targets. The fixed point of a map, or of a short word of maps, is
    // exactly on the attractor, so the camera can fall toward it forever without
    // ever leaving the set. A chaos game point is only approximately on it.
    for (let i = 0; i < maps.length; i++) {
      if (fixWord(maps, [i])) targets.push({ word: [i] });
    }
    for (let i = 0; i + 1 < maps.length; i++) {
      if (fixWord(maps, [i, i + 1])) targets.push({ word: [i, i + 1] });
    }
  }
  // Which target a descent starts on. The fixed point of a SINGLE map is a vertex or a
  // corner of most of these attractors, and zooming into a corner frames badly: the
  // piece hangs off one side of the aim and most of the frame stays empty. A two letter
  // word sits between two pieces, so the structure surrounds the aim and the visible
  // depth spread is wider, which the cyclic hue also needs to show more than one colour.
  // Named per object because the folded dragon's single map fixed point is INSIDE its
  // sheet, where the framing is already good.
  aimIdx = 0;
  if (P.aim !== undefined) {
    for (let i = 0; i < targets.length; i++) {
      if (targets[i].word && targets[i].word.join('.') === P.aim) { aimIdx = i; break; }
    }
  }

  if (!keepView) {
    // A 2D object opens STILL. The two kinds of object want opposite defaults and the reason is
    // what each one is for. An iterated function system is its own level of detail hierarchy, so
    // its cut rebuilds at tens of hertz forever and the descent is the thing worth watching; it
    // has nothing to show standing still. A flat escape time field is the opposite: its cut costs
    // hundreds of milliseconds, it goes on sharpening for several seconds while the camera holds,
    // and the first thing anyone wants of a Mandelbrot is to LOOK at it. Opening in flight means
    // the opening frame is a moving frame, which is the coarse one, and the object is judged on it.
    // Set before the view is applied, so a preset can still say otherwise.
    //
    // ON THE KIND AND NOT ON is2D, which is what the paragraph above actually says and what the
    // code did not do. `is2D` is true for a flat IFS as well as for a plane field, so the von Koch
    // curve opened paused, which is the one thing that object has nothing to offer: it rebuilds in
    // twenty milliseconds and a still frame of it converged before anyone looked. Only the escape
    // time fields open still.
    cfg.autopilot = P.kind !== 'plane';
    const v = P.view;
    if (v) for (const k in v) if (k in cfg) cfg[k] = v[k];
    const terr = P.kind === 'terrain';
    const yaw = (v && v.yaw !== undefined) ? v.yaw : (terr ? 0.22 : 0.6);
    // The terrain wants a steep view. A distance field terrain is locally a smooth
    // cone flank, so a low raking angle shows one featureless slope; its fractal
    // character is in the PLAN of the ridge network, which only reads from above.
    // Relief shading plus contours then does the rest, which is how a survey sheet
    // has always drawn a coastline.
    const pitch = (v && v.pitch !== undefined) ? v.pitch : (terr ? -0.98 : -0.24);
    if (!v || v.budget === undefined) cfg.budget = 250000;
    kern = kernelConst(cfg.kernel);
    // Frame the measured extent, not a guess in sigmas.
    // A sphere of this radius exactly fills the vertical field, so 0.98 leaves a
    // hair of margin instead of cropping the corners off a cube.
    // AND THE ASPECT RATIO, which had never come up because every window this was developed in
    // was wider than it was tall. The field of view is VERTICAL, so a portrait window sees less
    // of the object across than down, and a phone held upright cropped the Pythagoras tree in
    // half on the opening frame. Pulling back by the ratio frames the same sphere either way.
    cam.dist = 0.98 * suppE / Math.sin(0.5 * cam.fov) * frameAspect();
    cam.startDist = cam.dist;
    if (P.kind === 'terrain') {
      cam.target[0] = P.center[0];
      cam.target[1] = terrHMax * 0.22;
      cam.target[2] = P.center[1];
      camFromAngles(yaw, pitch);
    } else if (P.kind === 'plane') {
      cam.target.set([P.center[0], 0, P.center[1]]);
      // Straight at the plane, a hair off the pole, and from BELOW. The plane's two
      // coordinates are the real and imaginary parts of a complex number, and a complex
      // plane is drawn with the real axis to the right and the imaginary axis up. With a
      // right handed basis, forward = -y and up = +z forces right = -x, so looking down at
      // the card gives the set rotated by half a turn: measured against a per pixel
      // reference of the same view, the two images were each other's 180 degree rotation.
      // The set is symmetric about the real axis, so it reads as a mirror image, which is
      // why it survived this long unnoticed. Viewing from -y instead gives right = +x and
      // up = +z, and a splat is a Gaussian, so it looks the same from either side.
      camFromAngles(Math.PI, 1.5703);
    } else {
      cam.target.set(root.mu);
      camFromAngles(yaw, pitch);
    }
    setGoal(aimIdx);
  }
  orthoBasis();
  dirty = true;
  syncUI();
}

function setGoal(i) {
  if (!targets.length) { cam.goal.set(cam.target); return; }
  targetIdx = ((i % targets.length) + targets.length) % targets.length;
  const t = targets[targetIdx];
  if (isPlane()) {
    cam.goal[0] = t[0]; cam.goal[1] = 0; cam.goal[2] = t[1];
    cam.goalWord = []; cam.goalPhase = 0;
  } else if (isTerrain()) {
    cam.goal[0] = t[0]; cam.goal[2] = t[1];
    cam.goal[1] = terrainAimHeight();
    cam.goalWord = []; cam.goalPhase = 0;
  } else {
    cam.goalWord = t.word.slice(); cam.goalPhase = 0;
    refreshGoal();
  }
}

// How high above the boundary point to aim. The terrain's relief is proportional
// to the camera distance once the camera is down among it, so aiming at lake level
// buries the camera inside the surrounding cones: the frame fills with the
// underside of a few enormous surfels. Hovering at a fixed fraction of the camera
// distance keeps the clearance constant at every depth. This is an aim, not
// geometry, so letting it depend on the camera is legitimate.
// Measured: at a boundary point the tallest ridge inside the depth of field
// reaches about 2.1 * relief camera distances, so the aim has to sit above that
// or the camera ends up at the bottom of a canyon of the distance field looking at
// the underside of a few enormous surfels. 1.1 * relief * dist puts the eye at
// about 1.7 * relief * dist, which clears it with margin at every depth. Bounded
// by the object's own height so the opening view still aims at the object.
function terrainAimHeight() {
  return Math.min(terrHMax * 0.22, 1.1 * cfg.relief * cam.dist);
}

// Recompute the aim point from its word at the current phase. Exact at any depth.
function refreshGoal() {
  if (!maps || !cam.goalWord.length) return;
  const x = fixWord(maps, rotateWord(cam.goalWord, cam.goalPhase));
  if (x && isFinite(x[0] + x[1] + x[2])) cam.goal.set(x);
}

function pickTarget(i, snapOut) {
  if (!targets.length) return;
  if (snapOut) {
    loadPreset(cfg.preset, false);
    setGoal(i);
  } else setGoal(i);
  dirty = true;
}

/* ============================== rebasing ================================ */
// Why there is no zoom limit for a self similar object.
//
// A node's piece is an exact affine copy of the whole attractor: P_u = F_u(A).
// So the scene can be re-expressed in that node's own coordinates at any moment
// by applying F_u^-1 to the object and to the camera together. The object comes
// back identical, the camera comes back at a distance of order one, and the tree
// walk starts from the root again. Nothing about the numbers grew.
//
// That makes the descent a perfect loop rather than a ramp: one rebase per
// factor of 1/s of zoom, forever, with every coordinate in the renderer
// permanently of order one. The zoom itself lives in `anchor.logScale`, a sum of
// logarithms, which has no ceiling worth speaking of. There is no precision wall
// because there is no large number anywhere.
//
// Two conditions have to hold.
//
//  - Every map must be conformal, A = s R. A shearing map would shear the
//    camera as well as the object, and the view would distort at each step.
//
//  - The walk root has to stay far enough above the camera's own scale that
//    everything the frame can see is inside it. Content in the parent but
//    outside the new walk root is dropped, so the trigger keeps the walk root's
//    piece REBASE_MARGIN times larger than the depth of field the shader
//    already fades to nothing. The rebase then discards exactly what the depth
//    of field cull was discarding anyway, which is why it does not pop.
const REBASE_MARGIN = 4;

function rebaseNeeded() {
  if (!cfg.rebase || !conformal || isTerrain()) return false;
  const zFar = 1 + 8 / Math.max(cfg.fog, 0.02);
  return cam.dist * zFar * REBASE_MARGIN < suppE;
}

function rebaseStep() {
  // Which child piece holds the aim point. When the aim has a word, the word says
  // so exactly and there is nothing to decide: the aim point's address is that
  // word repeated, so its first letter names the child it lives in. Falling back
  // to geometry is only for an aim that arrived without a word.
  if (cam.goalWord.length) {
    return rebaseInto(cam.goalWord[cam.goalPhase % cam.goalWord.length]);
  }
  const inv6 = sym3Inv(root.cov);
  let best = -1, bestQ = Infinity;
  const x = new Float64Array(3);
  for (let i = 0; i < maps.length; i++) {
    const m = maps[i];
    if (!m.inv) continue;
    const g0 = cam.goal[0] - m.b[0], g1 = cam.goal[1] - m.b[1], g2 = cam.goal[2] - m.b[2];
    mat3Vec(m.inv, [g0, g1, g2], x);
    const dx = x[0] - root.mu[0], dy = x[1] - root.mu[1], dz = x[2] - root.mu[2];
    const q = inv6
      ? dx * (inv6[0] * dx + inv6[1] * dy + inv6[2] * dz) +
        dy * (inv6[1] * dx + inv6[3] * dy + inv6[4] * dz) +
        dz * (inv6[2] * dx + inv6[4] * dy + inv6[5] * dz)
      : dx * dx + dy * dy + dz * dz;
    if (q < bestQ) { bestQ = q; best = i; }
  }
  if (best < 0 || bestQ > suppR * suppR * 1.5) return false;
  return rebaseInto(best);
}

// Transport one cut's frame record into the new coordinates. `pos`, `R` and `dist`
// describe where the camera was when the cut was built, expressed in the CURRENT
// frame, so they move exactly the way the camera itself just did. `Rq` and `sSince`
// accumulate the residual rotation and scale, which is what the cut's own splat
// coordinates still carry and what `reprojection` has to undo.
function rebaseRecord(rec, m, s, iv) {
  const p = new Float64Array(3);
  mat3Vec(iv, [rec.pos[0] - m.b[0], rec.pos[1] - m.b[1], rec.pos[2] - m.b[2]], p);
  rec.pos.set(p);
  rec.dist /= s;
  const Rb = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    let acc = 0;
    for (let k = 0; k < 3; k++) acc += rec.R[r * 3 + k] * m.A[k * 3 + c];
    Rb[r * 3 + c] = acc / s;
  }
  rec.R.set(Rb);
  const As = new Float64Array(9);
  for (let i = 0; i < 9; i++) As[i] = m.A[i] / s;        // the map's rotation
  rec.Rq.set(mat3Mul(rec.Rq, As));
  rec.sSince *= s;
}

// Re-express the whole scene in child `best`'s own coordinates.
function rebaseInto(best) {
  const m = maps[best], s = m.scale, iv = m.inv;
  if (!iv) return false;
  // The two accumulators that make an unbounded descent look continuous: the zoom, and
  // the colour. Both are sums over the letters the anchor has swallowed, and both are
  // exactly compensated by every local value below restarting one letter shorter.

  // The aim point is recomputed from its word, never transported: the inverse map
  // expands, so transporting multiplies its error by 1/s every step. The camera
  // TARGET is transported, and that is safe, because the aim invariant holds it
  // within 0.4 camera distances of the aim and the map scales both sides by 1/s.
  // The invariant is therefore preserved exactly across a rebase, and the ease
  // pulls any residue back in.
  const t = new Float64Array(3);
  mat3Vec(iv, [cam.target[0] - m.b[0], cam.target[1] - m.b[1], cam.target[2] - m.b[2]], t);
  cam.target.set(t);
  if (cam.goalWord.length) {
    cam.goalPhase = (cam.goalPhase + 1) % cam.goalWord.length;
    refreshGoal();
  } else {
    const g = new Float64Array(3);
    mat3Vec(iv, [cam.goal[0] - m.b[0], cam.goal[1] - m.b[1], cam.goal[2] - m.b[2]], g);
    cam.goal.set(g);
  }
  cam.dist /= s;

  // The camera has to absorb the same map. A world vector v becomes
  // v' = A^-1 v, so the eye basis becomes R' = R A / s for R' v' = R v.
  const Rn = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    let acc = 0;
    for (let k = 0; k < 3; k++) acc += cam.R[r * 3 + k] * m.A[k * 3 + c];
    Rn[r * 3 + c] = acc / s;
  }
  cam.R.set(Rn);
  orthoBasis();

  // Two cuts have to come along as well, and for the same reason: both were built
  // in the frame that has just been superseded, and both stay perfectly valid
  // there, because the maps and the walk root are identical in every anchor frame.
  //
  //  - `built`, the cut on screen. It keeps being drawn for the few frames the next
  //    rebuild takes. Not transporting it drew it at scale s with the new frame's
  //    exposure: a measured 63 percent whole frame flash on the folded dragon, once
  //    every 0.35 decades of descent. That was "flickering, black and back".
  //
  //  - the record the job in flight will hand over. Its node data stays in the old
  //    frame by design, so nothing is wasted, but if `finishJob` then labels the
  //    result as current-frame the flash comes back one rebuild later instead:
  //    measured 53 percent, lasting eight frames, with k wrong by exactly s.
  if (built.valid) rebaseRecord(built, m, s, iv);
  if (job.active) rebaseRecord(job.out, m, s, iv);

  // Bookkeeping back to the original frame, for naming a view. anchor <- anchor o w.
  const t2 = new Float64Array(3);
  mat3Vec(anchor.M, m.b, t2);
  anchor.t[0] += t2[0]; anchor.t[1] += t2[1]; anchor.t[2] += t2[2];
  anchor.M.set(mat3Mul(anchor.M, m.A));
  anchor.logScale += Math.log10(s);
  anchor.hue += mapHue[best];
  anchor.depth++;
  anchor.word.push(best);
  stats.rebases++;
  return true;
}

function rebaseAll() {
  let n = 0;
  while (n < 64 && rebaseNeeded() && rebaseStep()) n++;
  if (n) dirty = true;
  return n;
}

// Total zoom, as log10. anchor.logScale is negative and unbounded below, so the
// readout keeps climbing long after a float would have run out of exponent.
function logZoom() {
  return Math.log10(cam.startDist / Math.max(cam.dist, 1e-300)) - anchor.logScale;
}

// Measure inside a ball of radius r about a point of the attractor scales as
// r^D with D the information dimension, so the light that lands in the frame
// scales as (dist)^D and the gain has to be its inverse. This is the whole
// exposure law, and the point of writing it in closed form is that it depends on
// the camera distance and on nothing else: rotating the camera cannot change it.
// The previous version normalized against the weight actually in view, which
// does change under rotation, and the image visibly breathed.
//
// Taking the distance as an argument rather than reading the camera is what lets
// the gain be evaluated at DRAW time instead of baked into the splat weights at
// BUILD time. Baking it in meant a cut two frames old carried a two frame old
// exposure, and across a rebase it carried the wrong frame's exposure entirely.
// The crossover is the object's own radius, not the framing distance. Above it the
// whole attractor is in frame and closing in adds no measure at all, it only
// magnifies, so the gain must stay flat; below it the visible mass really does scale
// as dist^D. Measuring from the framing distance instead started the gain climbing
// on the first frame of a descent, and over the first e-fold the frame brightened by
// (startDist/suppE)^D, a factor of 6.5 for these objects. It did not read as a
// runaway only because the saturating opacity absorbed most of it, which is exactly
// the kind of error that hides until someone says the thing looks too transparent.
function measureNormAt(dist) {
  if (isField()) return 1;
  const z = Math.max(1, suppE / Math.max(dist, 1e-300));
  return Math.pow(z, mDim);
}
function measureNorm() { return measureNormAt(cam.dist); }

/* ==== src/50_cut.js =================================================== */
/* ========================= refinement: the cut ========================== */
// Refinement is resumable. A rebuild is a job spread over several frames against
// a per frame work budget, so the frame rate belongs to the renderer and not to
// the tree walk. Meanwhile the last finished cut keeps being drawn, corrected
// exactly for wherever the camera has moved since, so staleness costs accuracy
// in the CHOICE of splats and never in where they are drawn.

const FLOATS = 13;                    // pos3 cov6 col3 w1
// A PLANE splat needs seven, not thirteen, and the six that go are not a compression: they carry
// no information at all for a flat object. Every cell of a plane cut sits at y = 0 and is a disc,
// so of the thirteen floats
//
//   pos.y      is the same number for every splat in the cut, namely -pos_y/dist. A uniform.
//   cov        is diag(r^2/3, (0.06 r)^2, r^2/3) for all of them, so the whole 3x3 is determined
//              by the single scalar r. Five of the six stored entries are zero and the sixth is a
//              function of the first.
//
// So: pos2, rad1, col3, w1. 28 bytes an instance against 52, 46 percent less to upload and 46
// percent less vertex fetch during rasterization, at 500 000 splats a cut that is 10 MB rather
// than 26. The covariance is reconstructed in the vertex shader, which is three multiplies.
//
// Half floats for the colour and the weight would take it to 20 bytes, and they are NOT used. The
// instance array is a Float32Array and JavaScript has no cheap float to half conversion, so it
// would cost four conversions per splat on the CPU: two million of them a cut, which is more CPU
// than the upload saves. The position has to stay fp32 in any case, because a half carries three
// decimal digits and a frame two units across needs four to place a splat inside a pixel.
const FLAT_FLOATS = 7;                // pos2 rad1 col3 w1
let instances = new Float32Array(65536 * FLOATS);
// How many floats the CURRENT cut writes per splat. One place, because the emit kernels, the
// allocation, and the upload all have to agree and a mismatch shows up as a frame of noise.
function cutFloats() { return built.flat ? FLAT_FLOATS : FLOATS; }
// The cut that is currently on screen, described in whatever coordinate frame it
// was built in. `Rq` and `sSince` say how that frame relates to the frame the
// camera is in NOW: a rebase re-expresses the whole scene in a child piece's
// coordinates, and the cut on screen was built before it and knows nothing about
// it. Without these the rebase frame drew the old cut at the wrong scale and the
// wrong exposure, which measured as a 63 percent whole frame flash on the folded
// dragon, once every 0.35 decades of descent. See `reprojection`.
const built = {
  pos: new Float64Array(3), R: new Float64Array(9), dist: 1,
  Rq: new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]),
  sSince: 1, norm: 1,
  valid: false, count: 0, surface: false, prepass: false,
  // A flat cut: seven floats an instance instead of thirteen, drawn by its own vertex shader.
  // `planeY` is the y every splat in the cut shares, in the cut's own normalized frame, which is
  // what lets the position drop to two components. See FLAT_FLOATS.
  flat: false, planeY: 0,
};
const HB = 192;                       // histogram buckets, 4 per octave
const hist = new Int32Array(HB);
const hHist = new Int32Array(256);      // log2 histogram of terrain height
const LX = -0.4243, LY = 0.7071, LZ = 0.5657;    // terrain light, world fixed

const job = {
  active: false, terrain: false, vw: 0, vh: 0, ms: 0,
  R: new Float64Array(9), pos: new Float64Array(3), dist: 1, invD: 1, focal: 1,
  tanX: 0, tanY: 0, nrmX: 0, nrmY: 0, K: 4, zFar: 15, fogK: 0.5, f32: false,
  cap: 0, nmaps: 0, splitPx: 2, sig: 1, norm: 1, attFloor: 0,
  huBase: 0, fadeK: 0, budK: 0,
  nf: 0, nn: 0, q: 0, cutSize: 0, np: 0, nEmit: 0,
  dmin: 0, dmax: 0, visited: 0, culled: 0, sumW: 0, sumWvis: 0,
  bLow: -Infinity, bAllow: 0, levelReady: false, usePrio: false, bFloor: 0, bRaw: 0,
  // The frame record this job will hand to `built` when it finishes. It starts as a
  // copy of the camera below and is transported by every rebase that lands while the
  // job is in flight; the camera below is deliberately NOT transported, because the
  // kernel must keep projecting every node with one single camera or the cut is
  // internally inconsistent. See `rebaseRecord`.
  out: {
    pos: new Float64Array(3), R: new Float64Array(9), dist: 1,
    Rq: new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]), sSince: 1,
  },
  maxIter: 400, relief: 1, hBase: 0, hSpan: 1, contour: 0, wSurf: 6, hmode: 0, hc: 1,
  eq: false, hLo: 0, hInv: 1, fcOn: false,
  plane: false, julia: 0, power: 2, c0x: 0, c0y: 0, nuCyc: 24, nuInv: 1, spanTol: 0.18,
  flat: false, planeY: 0,     // see FLAT_FLOATS: a plane cut's compact instance format
  maxPx: 24,        // plane: the coverage cap, a fraction of the frame height, see planeRoot
  pfcOn: false,     // plane: is the field cache worth its own cost at this depth
  // A ceiling on the CPU a single cut may spend, in milliseconds. This is a LATENCY budget,
  // and it is a different thing from the splat budget: the splat budget bounds what the GPU
  // draws, this bounds how long the camera has to wait. Past it the walk stops splitting and
  // drains what it has to leaves, so the cut that arrives is coarser than the one that was
  // asked for but it arrives on time. That is the right trade every time, because a cut that
  // lands an e-fold late is drawn at the wrong scale and reads as a blurry mess, which is
  // exactly what it was measured doing: on the Mandelbrot the slowest five percent of cuts
  // took 104 frames and the camera moved 1.4 e-folds while they were being built.
  msCap: 1e9, over: false,
  hCount: 0,
  evals: 0, iters: 0,
