    // its top, which for a plane object means a latency ceiling of twenty three seconds and
    // sixteen times the iteration cap. The first cut of a newly chosen object was therefore being
    // built at fully converged quality before anything at all was shown. It starts at the moving
    // quality now and the ramp refines it afterwards, which is what the ramp is for.
    job.active = false;
    stillT = 0; stillCuts = 0;
    // A NEW OBJECT INHERITS NOTHING. `buildLead` is derived from the last cut's build time, and
    // the last cut belonged to a different object that could be a hundred times cheaper or
    // dearer. Carrying it across means the first cuts of the new object are built for a camera
    // position that has nothing to do with this descent.
    //
    // This was once written down as the cause of "sometimes it starts zooming into the black" and
    // it was NOT: that was the aim being overwritten in applyURL, see the note there. Resetting the
    // lead is still right, and is still unmeasurable in any harness here, because virtual time
    // freezes performance.now() inside a call so the build time always reads zero.
    stats.buildMs = 0; buildLead = 0;
    // Nothing from the previous object may be drawn: it is a different set of splats in a
    // different frame, and `built` still describes it.
    built.valid = false; built.count = 0;
    startJob(vw, vh);
    if (stepJob(frameWork())) upload(finishJob());
    paramKey = sig; dirty = false;
  } else if (job.active) {
    if (stepJob(frameWork())) upload(finishJob());
  } else if (moving || wantStill !== stillCuts || rebuildAcc > (stillCuts > 0 ? 4 : 0.5)) {
    // The periodic refresh is a BACKSTOP, not the mechanism. Once the camera has been still long
    // enough for the ramp to stop climbing there is nothing for a rebuild to discover, and for a
    // plane object rebuilding anyway costs 450 ms of the 500 available: at 0.5 s that is ninety
    // percent of a core spent reproducing the frame that is already on screen, which is exactly
    // what "even when I pause, you can still see the compute happening" is. Four seconds while
    // still, half a second otherwise, and everything that genuinely changes sets `dirty` or shows
    // up as drift.
    stillCuts = wantStill;
    startJob(vw, vh);
    dirty = false;
    if (stepJob(frameWork())) upload(finishJob());
  }
  draw(vw, vh, built.count);
  // The batch field program, linked once a session, AFTER a frame has been drawn. See gfWarm.
  if (isPlane()) gfWarm();
  // The one place a harness can read the frame that actually reached the screen,
  // through the real rasterizer, the real 24 bit depth buffer and the real float16
  // accumulation. Everything measured on the CPU model is a model; this is not.
  if (typeof window !== 'undefined' && window.__probe) window.__probe(gl, vw, vh);

  fpsEma += (1 / Math.max(dt, 1e-4) - fpsEma) * 0.06;
  hudAcc += dt;
  if (hudAcc > 0.15) { hudAcc = 0; hud(vw, vh); }
  // Every frame, not on the readout's 150 ms tick: the bar is the one thing on screen whose
  // job is to move, and at 150 ms it steps rather than fills.
  progress();
  requestAnimationFrame(frame);
}

// Where the work happens, in words. Two different processors do two different jobs here and
// the split is the honest answer to "what is this running on":
//
//   the CUT, which decides which splats exist and evaluates the escape time field for the
//   plane objects, runs on the CPU in one JavaScript thread. There is no second thread and
//   no GPU compute path. That single thread is the whole cost of a plane object and the
//   reason its resolution is bounded: see knowledge/mandelbrot_speed.md.
//
//   the RASTER, which projects, blends and tone maps, runs on the GPU named below.
//
// The GPU string comes from WEBGL_debug_renderer_info and is usually an ANGLE wrapper around
// the real device, so the useful part is the middle. Trimmed rather than truncated, because a
// name cut off at 40 characters is not a report of the hardware.
function gpuName() {
  let s = String(stats.gpu || '?');
  const m = /^ANGLE \((.*)\)$/.exec(s);
  if (m) s = m[1];
  s = s.replace(/\s*(Direct3D\d+|OpenGL|Vulkan)[^,]*$/i, '');
  s = s.replace(/\s*\((\d+x)?[0-9a-f]{4}\)/gi, '');
  const parts = s.split(',').map(t => t.trim()).filter(Boolean);
  // ANGLE repeats the vendor inside the device name: "NVIDIA, NVIDIA GeForce RTX 3080".
  if (parts.length > 1 && parts[1].toLowerCase().startsWith(parts[0].toLowerCase())) parts.shift();
  return parts.join(', ') || '?';
}

/* --------------------------- the progress bar ---------------------------- */
// Two different waits, one bar, and it says which one it is showing.
//
// BUILDING. A cut is spread over frames against a millisecond ceiling, so `job.ms / job.msCap`
// is the fraction of the work this cut is ALLOWED that it has spent. It is honest, monotone
// within a cut and bounded, and a cut that converges early simply finishes and the bar goes away.
// The obvious alternative, splats emitted over the budget, is neither monotone nor an upper
// bound: a converged cut can be a tenth of the budget and would sit at ten percent forever.
//
// SHARPENING. Once the camera stops, the ceiling doubles per level of `stillCuts` and the level
// is reached by TIME: level k at STILL_T0 * 2^(k-1) seconds. So the honest progress is how far
// the accumulated stillness has come toward the last level, in the log of the time, which is what
// makes the eight steps look evenly spaced rather than one step and a very long wait.
//
// Neither number is drawn for an IFS object. A cut there is eight to fourteen milliseconds and a
// bar would flash once a frame, which is noise rather than information.
let progLast = -1, progWhat = '';
function progress() {
  const bar = el('prog');
  if (!bar) return;
  // The per pixel objects have no cut at all and their own band counter already reports their
  // progress in the readout, so they are not in this.
  if (!isField() || isDirect()) {
    if (!bar.hidden) { bar.hidden = true; progLast = -1; progWhat = ''; }
    return;
  }
  let u = -1, what = '';
  if (job.active && job.msCap > 0 && job.msCap < 1e8) {
    u = Math.min(1, job.ms / job.msCap);
    what = 'building';
  } else if (stillCuts < STILL_MAX && stillT > 0) {
    // the time the last level is reached at, and where this stillness sits in the log of it
    const tEnd = STILL_T0 * Math.pow(2, STILL_MAX - 1);
    u = Math.min(1, Math.log2(1 + stillT / STILL_T0) / Math.log2(1 + tEnd / STILL_T0));
    what = 'sharpening ' + (stillCuts + 1) + ' of ' + STILL_MAX;
  }
  if (u < 0) {
    if (!bar.hidden) { bar.hidden = true; progLast = -1; progWhat = ''; }
    return;
  }
  if (bar.hidden) bar.hidden = false;
  // Write to the DOM only when something moved. This runs every frame and a style write that
  // changes nothing still costs a style recalculation.
  if (Math.abs(u - progLast) > 0.004) {
    progLast = u;
    const b = el('prog-b');
    if (b) b.style.width = (u * 100).toFixed(1) + '%';
  }
  if (what !== progWhat) {
    progWhat = what;
    const l = el('prog-l');
    if (l) l.textContent = what;
  }
}

function hud(vw, vh) {
  if (!el('h-splats')) return;
  const set = (id, v) => { const e = el(id); if (e) e.textContent = v; };
  set('h-gpu', gpuName());
  // The cut, and what it costs. `evals` is field evaluations for a plane object and is
  // meaningless for an IFS, where the cost is the tree walk itself.
  if (isDirect()) {
    // Report the WORK, since there is no cut to report. Pixels times the iteration cap is the
    // honest upper bound on what the frame cost, and the rate it implies is the one number that
    // makes this object worth having in the menu.
    const work = vw * vh * dirIters;
    set('h-cut', 'GPU, per pixel, ' + fmt(vw * vh) + ' orbits x ' + fmt(dirIters) +
      ' iters = ' + fmt(work) + ', double single');
    set('l-splats', 'pixels');
    set('h-splats', fmt(vw * vh));
  } else {
    set('h-cut', 'CPU, 1 thread, ' + stats.buildMs.toFixed(0) + ' ms @ ' + hzEma.toFixed(0) + ' Hz' +
      (isField() ? ', ' + fmt(stats.evals) + ' cells, ' + fmt(stats.itersReal) + ' iters' : ''));
    // THE SPLAT COUNT SAYS WHY IT IS LOW. The caption under the magnified squares says this at
    // length, and on a phone the caption is suppressed and the squares are small, so the one
    // number a reader could take for a lie would be left standing alone. It belongs here anyway:
    // the confusion is about this number, and this is where this number is.
    set('l-splats', cfg.gauss ? 'splats (reduced)' : 'splats');
    set('h-splats', fmt(stats.splats));
  }
  set('h-object', PRESETS[cfg.preset].name);
  set('h-fps', fpsEma.toFixed(0));
  set('h-ms', (1000 / Math.max(fpsEma, 1e-3)).toFixed(1) + ' ms');
  set('h-build', stats.buildMs.toFixed(1) + ' ms @ ' + hzEma.toFixed(0) + ' Hz');
  set('h-res', vw + '×' + vh + ' ' + perfName());
  // The picker is written from the state rather than the other way round, so a tier that came
  // from the URL or from the governor is what the menu shows.
  const qsel = el('quality');
  if (qsel) qsel.value = perfAuto ? 'auto' : perfNow().name;
  const lz = stats.logZoom;
  set('h-zoom', '10^' + (lz > 999 ? lz.toFixed(0) : lz.toFixed(2)));
  set('h-depth', stats.dmin + '–' + stats.dmax);
  set('h-err', (stats.errPx < 0.001 ? '< 0.001 px' : stats.errPx.toFixed(3) + ' px') +
    (parked ? ' (parked)' : ''));
  const e = el('h-err'); if (e) e.dataset.warn = stats.errPx > 0.25 ? '1' : '0';
  set('h-fmt', stats.format);
  if (isTerrain()) {
    set('h-extra', fmt(stats.evals) + ' cells, ' + fmt(stats.iters) + ' iters, max ' + stats.maxIter);
  } else if (isDirect()) {
    set('h-extra', 'iteration cap ' + dirIters + ', still ' + stillCuts +
      ', band ' + dirBand + '/' + dirBands + (dirDone ? ' done' : '') +
      (dirSS > 1 ? ', ' + dirSS + 'x' + dirSS + ' AA' : ''));
  } else if (isPlane()) {
    // The iteration cap and the stationary ramp position. Both belong on screen: the cap is what
    // decides whether a region comes back resolved or as one flat colour, it moves by a factor of
    // sixteen when the camera stops, and a capture that does not report it cannot be compared with
    // another. Two rounds of this pass were spent on a difference between a headless capture and
    // the same cut in node that was ENTIRELY this number, and neither frame said what it was.
    set('h-extra', 'maxIter ' + stats.maxIter + ', still ' + stillCuts +
      ', cache ' + (stats.fieldHit * 100).toFixed(0) + '%' +
      // WHERE THE FIELD CAME FROM, on screen, because it is the difference between a cut that
      // costs 8 seconds and one that costs 0.9, and because past GF_MAX_DEC it turns itself off.
      (stats.gfQueries > 0
        ? ', field GPU ' + fmt(stats.gfQueries) + ' in ' + stats.gfBatches + ' @ ' +
          stats.gfMs.toFixed(0) + ' ms'
        : ', field CPU' + (gfWhy ? ' (' + gfWhy + ')' : '')));
  } else {
    set('h-extra', (maps ? maps.length : 0) + ' maps, D = ' + mDim.toFixed(3) +
      ', ' + stats.rebases + ' rebases');
  }
}

/* ============================ the page's theme =========================== */
// This viewer is normally an iframe inside a page on marcelpadilla.com, and it should not look
// like a different piece of software bolted into it. The site resolves light or dark once, before
// first paint, from localStorage['theme'] with the OS as the default, and writes the answer onto
// <html data-bs-theme>. Exactly that rule is repeated here.
//
// Reading localStorage rather than being told is deliberate: the iframe is same origin, so it can
// answer the question itself and is then correct on the first frame even if the parent never says
// anything. The message channel below is only for KEEPING it correct, because the site's toggle
// changes an attribute on a document this one cannot see. A page that does not post is not a
// broken page, it is a page whose theme never changes.
//
// localStorage throws rather than returning null in a sandboxed iframe or with cookies blocked,
// and touching the property itself can throw, so the whole read is inside the try.
function themeResolve() {
  let pref = 'system';
  try {
    const v = localStorage.getItem('theme');
    if (v === 'light' || v === 'dark') pref = v;
  } catch (e) { /* denied: follow the OS */ }
  if (pref !== 'system') return pref;
  return (typeof matchMedia !== 'undefined' &&
          matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function themeApply(t) {
  if (typeof document === 'undefined') return;
  document.documentElement.setAttribute('data-vp-theme', t === 'light' ? 'light' : 'dark');
}
function themeInit() {
  if (typeof window === 'undefined') return;
  themeApply(themeResolve());
  // The parent page's toggle. It writes localStorage in ITS document, and the storage event
  // deliberately never fires in the frame that wrote, so a same origin iframe hears nothing:
  // the parent has to say so. See the observer added to the project page.
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.fsTheme) themeApply(d.fsTheme);
  });
  // And the OS, for a viewer opened on its own with no stored choice.
  if (typeof matchMedia !== 'undefined') {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const on = () => themeApply(themeResolve());
    if (mq.addEventListener) mq.addEventListener('change', on);
    else if (mq.addListener) mq.addListener(on);
  }
}

/* ================================ boot ================================== */
function boot() {
  const cv = el('gl');
  if (!initGL(cv)) {
    const warn = el('nogl');
    if (warn) warn.hidden = false;
    return;
  }
  themeInit();
  // Before applyURL, so an explicit gs= in the query still wins over what was remembered.
  cfg.gauss = gaussRecall();
  bindUI();
  if (!applyURL()) loadPreset(cfg.preset, false);
  syncUI();
  attachInput(cv);
  requestAnimationFrame(frame);
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

</script>
