  float a = t - 0.5 * s;
  a -= floor(a);
  return (palIntAt(a + s) - palIntAt(a)) * (1.0 / s);

// ONE SAMPLE, in linear light, and the whole colour law lives here now.
//
// It used to be inline in main() and it had to move for anti-aliasing, but the move fixed two
// things on its own. The ramp's box filter width came from fwidth(t), the screen space derivative
// of the ramp coordinate, and that is the one place the two paths could not agree because the
// splat path computes the same width analytically from |grad nu|. Worse, fwidth is a difference
// against the NEIGHBOURING FRAGMENT, so at the boundary, where the neighbour is interior and its
// t is a constant standing in for nothing, the width was the difference between a real ramp
// coordinate and a placeholder: garbage exactly where the filter matters. It is now
//
//     span = |grad nu| * (one sample's width) * d t / d nu
//
// which is a property of the point, is what the quadtree already computes per cell, and needs no
// neighbour. And a sample whose distance estimate says the boundary is inside its own footprint
// gets the full width, the same rule and the same cap planeCell uses.
vec3 shadeAt(vec2 dc, float rTol) {
  Fld f = pertField(dc, rTol);
  if (f.why == 2) return uLake;                                   // proven interior
  if (f.why == 3) return mix(uPalMean, uLake, DEEP_SET);          // out of iterations

  // sample with de >= rTol sqrt(2) cannot contain any of it and gets no darkening at all.
  float k = (f.why == 4) ? 1.0 - f.de / (1.41421356 * rTol) : TANGLE_SET;
  if (k > 0.0) {
    k = min(k, 1.0);
    k = k * k * (3.0 - 2.0 * k);
    col = mix(col, uLake, k);

// ADAPTIVE SUPERSAMPLING, and adaptive is what makes it affordable.
//
// The escape time field is analytic in the exterior and the ramp is box filtered over the exact
// span the sample covers, so out there one sample is not an approximation, it is the answer: extra
// samples of a linear field average to the same number. Every jagged edge in this render is within
// one distance estimate of the set, and the distance estimate is already in hand from the first
// sample. So: shade the centre, and if it escaped with the boundary more than its own footprint
// away, stop. Otherwise lay down an uSS by uSS grid over the pixel, each sample carrying the
// SUB pixel footprint as its own rTol, and average in linear light.
//
// That last point is what makes it a real supersample rather than a blur: rTol drives the
// derivative bailout and the set fill, so a sub sample is asked the question at its own scale and
// resolves structure the whole pixel cannot. Cost is measured, not assumed; see the note in
// knowledge/plane_lod.md. Only the boundary pixels pay, but the boundary pixels are also the
// expensive ones, so this is switched off entirely while the camera moves.
vec3 shadePixel(vec2 dc, float pix) {

  if (uSS < 2 || (f.why == 4 && f.de >= 2.0 * rTol)) return shadeAt(dc, rTol);

    if (j >= n) break;

      if (i >= n) break;

      acc += shadeAt(dc + o, sub);

void main() {

  // homography, expressed as an OFFSET from the centre of the frame. The offset is of order the

  // that perturbation wants. That coincidence is the whole reason this path needs no extended
  // precision anywhere: the only quantity that ever needs fourteen digits is the reference point,
  // and that one lives on the CPU.

// the expensive pixels would come straight out of the iteration cap, which is the trade the wrong
// way round: while the camera moves, a coarse iteration cap shows as a grey wash over half the
// frame and a jagged edge shows as nothing at all.
let DIR_SS = 2;

function isDirect() { return !!PRESETS[cfg.preset].direct; }

// Started, not finished; see linkAsync in src/60_gl.js. This program carries the whole double
// single orbit and takes about a second through the HLSL compiler, and until this change that
// second was spent with the tab frozen, on the frame the viewer chose this object from the menu.
let dirLink = null;
function initDirect() {
  if (!dirLink) dirLink = linkAsync(DIRECT_VS, DIRECT_FS);
  if (!linkReady(dirLink)) return false;
  progDirect = dirLink.p;
  for (const k of DIRECT_UNI) dirUni[k] = gl.getUniformLocation(progDirect, k);
  progBlit = link(DIRECT_VS, BLIT_FS);
  blitUni.uTex = gl.getUniformLocation(progBlit, 'uTex');
  dirTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  dirFbo = gl.createFramebuffer();
  return true;
}

// The palette and its integral, on the GPU, as two one row RGBA32F textures.
//
// fp32 and not fp16, and that is not caution. `rampBox` reads the integral as a DIFFERENCE of two
// nearby values: over a span of a thousandth of a turn the difference is a thousandth of the
// integral itself, so a half float's eleven bit mantissa leaves one bit in the answer. The table
// is 257 texels. Uploading it in full precision costs three kilobytes and removes the question.
let palTex = null, palIntTex = null, palTexGen = -1;
const palBuf = new Float32Array(PAL * 4), palIntBuf = new Float32Array((PAL + 1) * 4);
function palUpload() {
  if (palTexGen === palGen) return;
  palTexGen = palGen;
  if (!palTex) {
    palTex = gl.createTexture(); palIntTex = gl.createTexture();
    for (const t of [palTex, palIntTex]) {
      gl.bindTexture(gl.TEXTURE_2D, t);
      // NEAREST throughout: every lookup in the shader is a texelFetch with the interpolation
      // written out, so no sampler state is ever consulted and no float filtering extension is
      // needed. See palAt and palIntAt.
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }
  }
  for (let i = 0; i < PAL; i++) {
    palBuf[i * 4] = palette[i * 3]; palBuf[i * 4 + 1] = palette[i * 3 + 1];
    palBuf[i * 4 + 2] = palette[i * 3 + 2]; palBuf[i * 4 + 3] = 1;
  }
  for (let i = 0; i <= PAL; i++) {
    palIntBuf[i * 4] = palInt[i * 3]; palIntBuf[i * 4 + 1] = palInt[i * 3 + 1];
    palIntBuf[i * 4 + 2] = palInt[i * 3 + 2]; palIntBuf[i * 4 + 3] = 1;
  }
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PAL, 1, 0, gl.RGBA, gl.FLOAT, palBuf);
  gl.bindTexture(gl.TEXTURE_2D, palIntTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, PAL + 1, 1, 0, gl.RGBA, gl.FLOAT, palIntBuf);
}

// The progressive target, at the size of the frame. RGBA8 is enough and is deliberate: this shader
// writes the FINISHED pixel, gamma encoded, so there is nothing left to accumulate and nothing that
// needs range.
function dirResize(vw, vh) {
  if (vw === dirTW && vh === dirTH) return true;
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, vw, vh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dirFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, dirTex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  dirTW = ok ? vw : 0; dirTH = ok ? vh : 0;
  dirHave = false; dirBand = 0;
  return ok;
}

// The image to plane map, in closed form, and the one piece of new geometry on this path.
//
// A pixel's ray is d = u*right + v*up + fwd, the plane is y = 0, so the hit is pos - pos_y * d / d_y,
// which is a homography. Written as an OFFSET from the centre of the frame it loses the large common
// part exactly:
//
//   hit_x - ctr_x = pos_y (u ax + v bx) / W,   ax = fwd_x r_y / fwd_y - r_x
//   W = u r_y + v up_y + fwd_y
//
// so everything the shader touches per pixel is of order one except pos_y, and the CENTRE is the
// only quantity that needs more than fp32. It gets it by being the perturbation reference point,
// computed on the CPU in doubles and never sent to the GPU at all.
//
// Computed here rather than inline in the draw so the headless suite can check it against place(),
// which is the forward direction of the same map. A hand derived inverse that is slightly wrong does
// not fail, it produces a correct looking image of the wrong region, and the only way to catch that
// is to compose the two and demand the identity.
function directMap(vw, vh) {
  updateBasis();
  const focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  const r = basis.right, up = basis.up, f = basis.fwd, pos = basis.pos;
  const fy = f[1];
  if (!(Math.abs(fy) > 1e-9)) return null;       // looking along the plane, nothing to draw
  const t0 = -pos[1] / fy;
  const m = {
    focal, vw, vh, posY: pos[1],
    ctrX: pos[0] + t0 * f[0],
    ctrZ: pos[2] + t0 * f[2],
    ax: f[0] * r[1] / fy - r[0], bx: f[0] * up[1] / fy - up[0],
    az: f[2] * r[1] / fy - r[2], bz: f[2] * up[1] / fy - up[2],
    wr: r[1], wu: up[1], wf: fy,
  };
  // One pixel, in plane units, at the centre of the frame. This is the rTol every bailout in the
  // shader is measured against, exactly as a cell's half size is on the CPU.
  m.pix = Math.abs(m.posY) * Math.hypot(m.ax, m.az) / (focal * Math.abs(fy));
  return m;
}

// The same map the shader applies, in doubles, for a pixel in the renderer's own screen coordinates:
// x to the right, y DOWN from the top, which is what place() writes into pool.sx and pool.sy. The
// shader flips y because gl_FragCoord counts from the bottom.
function directPlaneAt(m, sx, sy) {
  const u = (sx - 0.5 * m.vw) / m.focal, v = (0.5 * m.vh - sy) / m.focal;
  const W = m.wr * u + m.wu * v + m.wf;
  return [m.ctrX + m.posY * (m.ax * u + m.bx * v) / W,
          m.ctrZ + m.posY * (m.az * u + m.bz * v) / W];
}

// THE ANALYTIC INTERIOR TEST USED TO LIVE HERE, as a five point CPU verdict for the whole frame:
// the cardioid and period two tests need the plane coordinate to full precision and the shader was
// held to have only an fp32 offset from the centre, so the test was run in doubles at the centre
// and the four corners and switched off unless all five agreed.
//
// It is per pixel now, in double single, inside pertField, because the shader HAS the coordinate to
// full precision: see dsInMainBody in src/61_pert.js. The five point version was not merely coarse,
// it failed exactly where it was needed. A frame that straddles the cardioid's boundary, which is
// most interesting frames, disagrees at its corners, so the test switched itself off and left every
// interior pixel to the cycle test, which cannot prove interior near a component's boundary at any
// cap. That band is what the review saw as thick grey bands round the black blobs.

// The iteration cap for the next frame. Same two regimes as planeRoot, arrived at the same way.
//
// While the camera moves the cap is hill climbed against the MEASURED frame time, because there is
// no way to ask WebGL what a draw cost: EXT_disjoint_timer_query is off in Chrome by default. Under
// vsync the frame time is pinned at 16.7 ms and says nothing, so the climb is one sided: raise the
// cap until the frame time comes off the vsync floor, then back off. Stationary, the cap climbs to
// the converged target whatever it costs, which is the whole point of pausing.
function directCap(moving, lastMs, ss) {
  const lz = Math.max(0, logZoom());
  const want = Math.max(80, Math.min(200000, cfg.iters * (1 + 0.45 * lz) * 16));
  // The work ceiling is a bound on ORBITS, and a supersampled pixel runs ss*ss of them, so the
  // ceiling on the iteration cap has to come down by the same factor or the bound means nothing.
  const ceil = (moving ? DIR_WORK_MOVE : DIR_WORK)
    / Math.max(fboW * fboH * ss * ss, 1);
  dirWant = Math.min(want, ceil);
  if (moving) {
    if (lastMs > 26) dirCap = Math.max(200, dirCap * 0.72);
    else if (dirCap < dirWant) dirCap = Math.min(dirWant, dirCap * 1.3);
    else dirCap = dirWant;
  } else {
    // Still, the cap is asked for OUTRIGHT rather than climbed to. The climb existed because a
    // still frame was still one draw and a cap ten times too high was ten times a vsync; now a
    // still frame is a pass of as many bands as the work needs, so the frame rate is bounded by
    // the band and not by the cap, and climbing would only mean converging to the wrong answer
    // several times on the way to the right one.
    dirCap = dirWant;
  }
  return Math.round(dirCap);
}

function drawDirect(vw, vh, moving, lastMs) {
  // Nothing to draw with yet. The frame loop keeps running and the background is what is on
  // screen, which is a second of an empty frame instead of a second of an empty tab.
  if (!progDirect && !initDirect()) { dirClear(vw, vh); return; }
  const P = PRESETS[cfg.preset];
  const m = directMap(vw, vh);
  if (!m) return;
  const off = dirResize(vw, vh);
  // THE PASS. Moving, the frame is one draw at whatever cap keeps it inside a vsync, exactly as
  // before. Still, the frame is a PASS at the converged cap, laid down one horizontal band per
  // frame into the off screen target and presented every frame. A new pass starts whenever the
  // camera moves or the target cap changes, and until the first pass has completed once the moving
  // render is what is on screen, so nothing is ever blank.
  //
  // The bands are written into the same texture the screen is reading, so while a pass is in
  // flight the frame is part old pass and part new. That is deliberate and it is what a
  // progressive renderer looks like: the two halves differ only in iteration cap, so the seam is a
  // step in how much of the boundary layer has resolved, and it sweeps down the frame once.
  // Supersampling is a property of the PASS, not of the frame, so it is fixed here and used for
  // the cap, for the band count and for the shader alike. Moving frames never supersample.
  const ss = moving ? 1 : Math.max(1, Math.min(4, Math.round(DIR_SS)));
  dirSS = ss;
  const cap = directCap(moving, lastMs, ss);
  // The cap a WHOLE frame in one draw can afford. Used while moving, and used for the very first
  // still frame after a move so there is something on screen before the slow pass starts: at ten
  // to the six the pass cap is 88 800, which as one draw is over two seconds and is what a display
  // driver reset looks like.
  const cheap = Math.max(200, Math.round(DIR_WORK_MOVE / Math.max(vw * vh, 1)));
  // Work per pixel, in orbits, for the band arithmetic. ss*ss is the WORST case rather than the
  // mean, because only the boundary layer supersamples at all, and the worst case is the right
  // one here: too many bands costs frames, too few costs a display driver reset.
  const work = vw * vh * ss * ss;
  let whole, passCap;
  if (moving || !off) {
    whole = true; passCap = moving ? cap : cheap;
    dirBand = 0; dirDone = false; dirPassCap = 0;
  } else if (!dirHave) {
    // Nothing on the target yet, so lay down a whole frame before any banding, or the screen shows
    // one band of an otherwise undefined texture. At the cheap cap, UNLESS the whole pass fits in
    // one band anyway, in which case laying down a cheap frame first would only be a frame of the
    // wrong answer. The second case is what a capture uses, through `bw=`.
    whole = true;
    dirPassCap = cap;
    dirBands = Math.max(1, Math.min(DIR_BAND_MAX, Math.ceil(work * cap / DIR_BAND_WORK)));
    passCap = dirBands === 1 ? cap : cheap;
    dirDone = dirBands === 1;
  } else {
    whole = false;
    if (dirBand === 0 && (!dirDone || cap !== dirPassCap)) {
      dirPassCap = cap;
      dirBands = Math.max(1, Math.min(DIR_BAND_MAX,
        Math.ceil(work * dirPassCap / DIR_BAND_WORK)));
      dirDone = false;
    }
    passCap = dirPassCap;
    // Converged and nothing has changed: present what is there and do no work at all. Without this
    // the still frame runs the whole pass again, forever, at a fraction of a hertz.
    if (dirDone) { dirIters = passCap; dirPresent(vw, vh); return; }
  }
  dirIters = passCap;
  const pw = Math.max(2, Math.min(8, Math.round(cfg.power)));
  const julia = P.julia ? 1 : 0;
  const cX = splitDS(m.ctrX), cZ = splitDS(m.ctrZ);
  const jx = splitDS(cfg.cx), jy = splitDS(cfg.cy);

  // ALWAYS into the off screen target when there is one, and present from it. Drawing the moving
  // frame straight to the screen and copying it across with blitFramebuffer worked and was a
  // needless second path: a read from the default framebuffer is the one blit whose source format
  // is not under this file's control, and a whole extra failure mode for a copy that costs less
  // than the draw that produced it.
  gl.bindFramebuffer(gl.FRAMEBUFFER, off ? dirFbo : null);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progDirect);
  gl.uniform2f(dirUni.uCtrX, cX[0], cX[1]);
  gl.uniform2f(dirUni.uCtrY, cZ[0], cZ[1]);
  gl.uniform2f(dirUni.uCX, jx[0], jx[1]);
  gl.uniform2f(dirUni.uCY, jy[0], jy[1]);
  gl.uniform2f(dirUni.uVp, vw, vh);
  gl.uniform1f(dirUni.uFocal, m.focal);
  gl.uniform2f(dirUni.uA, m.ax, m.az);
  gl.uniform2f(dirUni.uB, m.bx, m.bz);
  gl.uniform3f(dirUni.uWrow, m.wr, m.wu, m.wf);
  gl.uniform1f(dirUni.uPosY, m.posY);
  gl.uniform1f(dirUni.uPix, m.pix);
  gl.uniform1i(dirUni.uJulia, julia);
  gl.uniform1i(dirUni.uPower, pw);
  gl.uniform1i(dirUni.uMaxIter, passCap);
  gl.uniform1i(dirUni.uSS, ss);
  gl.uniform1i(dirUni.uDbg, DIR_DBG);
  gl.uniform1f(dirUni.uNuInv, 1 / (P.nuCycle || 4.5));
  palUpload();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.uniform1i(dirUni.uPalTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palIntTex);
  gl.uniform1i(dirUni.uPalIntTex, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform3f(dirUni.uPalMean, palMean[0], palMean[1], palMean[2]);
  gl.uniform3f(dirUni.uLake, lakeCol[0], lakeCol[1], lakeCol[2]);
  // Which rows this call is responsible for. A whole frame while moving or while the off screen
  // target has never been filled; one band of it otherwise.
  const b0 = whole ? 0 : Math.floor(vh * dirBand / dirBands);
  const b1 = whole ? vh : Math.floor(vh * (dirBand + 1) / dirBands);
  gl.enable(gl.SCISSOR_TEST);
  const t1 = performance.now();
  for (let s = 0; s < DIR_STRIPS; s++) {
    const y0 = b0 + Math.floor((b1 - b0) * s / DIR_STRIPS);
    const y1 = b0 + Math.floor((b1 - b0) * (s + 1) / DIR_STRIPS);
    if (y1 <= y0) continue;
    gl.viewport(0, 0, vw, vh);
    gl.scissor(0, y0, vw, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.flush();
  }
  gl.disable(gl.SCISSOR_TEST);
  // Wall time of the SUBMISSION, not of the work. Recorded anyway, because it is the only signal
  // available without a timer query, and a submission that blocks is a submission that has filled
  // the driver's queue, which is itself a measurement.
  dirMs = performance.now() - t1;
  if (!off) return;                      // no target: that draw went straight to the screen
  if (whole) { dirHave = true; dirBand = 0; }
  else if (dirBand + 1 < dirBands) dirBand++;
  else { dirBand = 0; dirDone = true; }
  dirPresent(vw, vh);
}

// The background alone, for the frames before the orbit shader has finished linking.
function dirClear(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(Math.pow(bg0[0], 1 / 2.2), Math.pow(bg0[1], 1 / 2.2), Math.pow(bg0[2], 1 / 2.2), 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

// Everything the screen sees while the camera holds still comes from here.
function dirPresent(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(progBlit);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dirTex);
  gl.uniform1i(blitUni.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// CLICK TO DIVE had a version here too, and it is gone with the rest of it. There was no splat to
// name in a per pixel render, so the pixel named itself: invert the same homography for the clicked
// pixel and Newton the result onto the boundary along the distance estimate. See the note in the
// pointerup handler in src/70_ui.js for why none of it survives.

/* ==== src/63_gfield.js ================================================ */
/* ============ the escape time field, in batches, on the GPU =============== */
// The quadtree stays on the CPU and only the ARITHMETIC moves. That split is not a compromise, it
// is what the measurement says: a plane cut is 100 percent escape time iteration and the tree walk
// that decides which cells exist is below the noise floor, under one microsecond of the twenty five
// per cell. So there is nothing to gain from moving the walk and everything to gain from moving the
// field, and the walk is the part that is subtle.
//
// The shape of the thing is set by `stepPlane` being LEVEL SYNCHRONOUS. It holds a frontier of
// cells, decides which of them split, creates the children, and swaps. Within one level every cell
// is independent, so a level's worth of field evaluations is one batch:
//
//   1. walk the frontier and decide the splits, which needs nothing but what is already known
//   2. generate every child's centre and corners as QUERIES
//   3. one draw call evaluates all of them, one readPixels brings them back
//   4. finish the children on the CPU: span, place, priority, emit
//
// Levels grow about four times each, so the last four hold 99 percent of all cells, and the top ten
// levels are cheaper to evaluate on the CPU than to send anywhere. Hence GF_MIN: below it the batch
// would cost more in fixed overhead than the arithmetic it saves.
//
// The readback is SYNCHRONOUS and that is deliberate. An asynchronous readback through a fence would
// hide the latency of one level behind the dispatch of the next, but the next level's queries cannot
// be generated until this level's answers are in: the whole point of a quadtree is that the parent's
// answer decides whether the child exists. So the stall is inherent to adaptive refinement, and the
// only thing to do about it is to make the number of stalls small, which the level structure already
// does. Measured cost per round trip is in knowledge/mandelbrot_speed.md.

// Queries are (dcx, dcy, rTol) and answers are (nu, de, gnu, kind), both RGBA32F, both indexed by a
// linear slot. A power of two width so the split is two shifts.
const GF_W = 1024, GF_WSHIFT = 10, GF_WMASK = GF_W - 1;
// The most queries in one batch. 512k covers a whole level of a 500 000 splat cut; anything larger
// is split into several draws, which costs nothing because the readback dominates.
const GF_CAP = 1 << 19;
// Below this many queries, evaluate on the CPU instead. A batch pays a fixed cost in upload, draw
// setup and pipeline flush whatever its size, so a small level is not worth sending.
let GF_MIN = 4096;
let gfOn = true;                    // the master switch, so `gf=0` can measure without it

const GF_VS = `#version 300 es
precision highp float;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

const GF_FS = `#version 300 es
precision highp float;
precision highp int;
` + PERT_GLSL + `
uniform sampler2D uQ;        // the queries: dcx, dcy, rTol
uniform int uCount;
out vec4 outColor;
void main() {
  ivec2 t = ivec2(gl_FragCoord.xy);
  int slot = (t.y << ${GF_WSHIFT}) | t.x;
  if (slot >= uCount) { outColor = vec4(0.0); return; }
  vec3 q = texelFetch(uQ, t, 0).xyz;
  Fld f = pertField(q.xy, q.z);
  // kind, packed as a float, with the same numbering planeCell uses so the CPU side needs no
  // translation: 0 escaped, 1 proven interior, 2 condemned, 3 exhausted. See planeCell.
  float kind = f.why == 2 ? 1.0 : (f.why == 4 ? 0.0 : (f.why == 1 ? 2.0 : 3.0));
  outColor = vec4(f.nu, f.de, f.gnu, kind + 8.0 * float(f.iters));
}`;

let progGF = null, gfQTex = null, gfFbo = null, gfOutTex = null, gfH = 0;
const gfUni = {};
// The query and answer staging arrays. Grown on demand and never shrunk: a cut asks for the same
// order of magnitude every frame.
let gfQ = new Float32Array(GF_W * 4 * 4);
let gfA = new Float32Array(GF_W * 4 * 4);
let gfBatches = 0, gfQueries = 0, gfMs = 0;

// Room for `n` queries in the staging array, so the caller can fill it before the call. Grown to
// the same rectangle gfEvaluate will upload, never shrunk: a cut asks for the same order of
// magnitude every frame.
function gfReserve(n) {
  const need = GF_W * Math.max(1, Math.ceil(Math.min(n, GF_CAP) / GF_W)) * 4;
  if (gfQ.length < need) gfQ = new Float32Array(need);
}

// Started, not finished. See linkAsync: touching the program before it reports complete is what
// blocks, so this hands back a handle and gfReady below is what decides when it may be used.
let gfLink = null;
function initGField() {
  if (!gfLink) gfLink = linkAsync(GF_VS, GF_FS);
  if (!linkReady(gfLink)) return;
  progGF = gfLink.p;
  for (const k of ['uQ', 'uCount', 'uCtrX', 'uCtrY', 'uCX', 'uCY', 'uJulia', 'uPower',
                   'uMaxIter']) {
    gfUni[k] = gl.getUniformLocation(progGF, k);
  }
  gfQTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gfOutTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, gfOutTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gfFbo = gl.createFramebuffer();
}

// GROW ONLY, and to a power of two, and this is not tidiness. A batch's height follows its query
// count, so it changes every call, and reallocating a 1024 by h RGBA32F pair on every call was
// measured at more than a second of the build at the opening view: destroying a texture the
// previous draw still references makes the driver flush the pipeline, and it did that sixteen
// times. The draw and the readback both use `h`, so a taller target than the batch needs costs
// nothing at all.
function gfResize(h) {
  if (h <= gfH) return true;
  h = 1 << Math.ceil(Math.log2(h));
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, GF_W, h, 0, gl.RGBA, gl.FLOAT, null);
  gl.bindTexture(gl.TEXTURE_2D, gfOutTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, GF_W, h, 0, gl.RGBA, gl.FLOAT, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gfFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, gfOutTex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gfH = ok ? h : 0;
  return ok;
}

// Is the GPU field path available and armed for this job? Needs WebGL, a float render target, and a
// reference orbit that actually covers the iteration cap.
function gfReady() {
  return gfOn && typeof gl !== 'undefined' && gl && fboInternal !== 0;
}

// Evaluate `n` queries. gfQ holds (dcx, dcy, rTol, unused) per slot; gfA receives
// (nu, de, gnu, kind + 8*iters) per slot. One upload, one draw, one readback.
//
// The iteration count is folded into the fourth channel rather than given a fifth: kind is an
// integer 0 to 3 and iters is an integer, so kind + 8*iters is exact in fp32 up to two million
// iterations, which is ten times the cap's own ceiling. It is there because the cut reports its own
// cost honestly and would otherwise have to guess.
function gfEvaluate(n, maxIter, ctrX, ctrZ) {
  if (!progGF) initGField();
  if (n > GF_CAP) return false;
  const h = Math.max(1, Math.ceil(n / GF_W));
  if (!gfResize(h)) return false;
  if (gfA.length < GF_W * h * 4) gfA = new Float32Array(GF_W * h * 4);
  if (gfQ.length < GF_W * h * 4) return false;      // the caller did not gfReserve; see above
  const t0 = performance.now();
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GF_W, h, gl.RGBA, gl.FLOAT,
                   gfQ.subarray(0, GF_W * h * 4));
  gl.bindFramebuffer(gl.FRAMEBUFFER, gfFbo);
  gl.viewport(0, 0, GF_W, h);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.SCISSOR_TEST);
  gl.useProgram(progGF);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gfQTex);
  gl.uniform1i(gfUni.uQ, 0);
  // The coordinate every query offset is measured from, in double single. The caller supplies it and
  // the offsets together, so the pair is always consistent.
  const cX = splitDS(ctrX), cZ = splitDS(ctrZ);
  const jx = splitDS(job.c0x), jy = splitDS(job.c0y);
  gl.uniform2f(gfUni.uCtrX, cX[0], cX[1]);
  gl.uniform2f(gfUni.uCtrY, cZ[0], cZ[1]);
  gl.uniform2f(gfUni.uCX, jx[0], jx[1]);
  gl.uniform2f(gfUni.uCY, jy[0], jy[1]);
  gl.uniform1i(gfUni.uJulia, job.julia);
  gl.uniform1i(gfUni.uPower, job.power);
  gl.uniform1i(gfUni.uMaxIter, maxIter);
  gl.uniform1i(gfUni.uCount, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, GF_W, h, gl.RGBA, gl.FLOAT, gfA);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
  gfMs += performance.now() - t0;
  gfBatches++; gfQueries += n;
  return true;
}

/* ==== src/70_ui.js ==================================================== */
/* ============================== interaction ============================= */
let drag = null, moved = 0;

// Drag ROTATES a 3D object and does nothing at all to a 2D one.
//
// Rotating is the right verb for a measure in space: it is the only way to see that the
// object has three dimensions and that the cut does not depend on the viewing angle. It is
// meaningless for a plane object, where the camera looks straight at a card and a turn about
// the view axis only spins the picture, and it is worse than meaningless for a flat IFS,
// where it tilts the sheet out of the frame.
//
// PANNING is gone in both cases, and that one is not a matter of taste: the aim point is the
// only thing keeping the camera near the object at all, so one drag at depth translates the
// aim off the set and the camera flies into empty space with no way back. A CLICK does nothing
// either, for the same reason; see the note in the pointerup handler below.
// PINCH, on a touch screen, because there is no wheel there and the zoom is the whole object.
// Two live pointers, and the ratio of the distance between them from one move to the next is
// exactly the factor the camera distance should move by, which is the gesture people already
// expect. The map is kept rather than a single "start distance", so a pinch that starts, pauses
// and resumes does not jump.
const touches = new Map();
let pinch = 0;
function pinchSpan() {
  const p = [...touches.values()];
  if (p.length < 2) return 0;
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

function attachInput(cv) {
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) { pinch = pinchSpan(); drag = null; return; }
    drag = { x: e.clientX, y: e.clientY };
    moved = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size >= 2) {
      const s = pinchSpan();
      if (pinch > 4 && s > 4) {
        // Spreading the fingers means closer, so the camera distance goes DOWN by the ratio.
        cam.dist = Math.min(cam.dist * (pinch / s), cam.startDist * 40);
        rebaseAll();
        dirty = true;
      }
      pinch = s;
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (is2D(PRESETS[cfg.preset])) return;
    // A quarter turn across the width of the canvas, about the eye's own axes, so the
    // gesture means the same thing wherever the camera happens to be pointing.
    const k = Math.PI / Math.max(cv.clientWidth || 1, 1);
    turnCamera(-dx * k, -dy * k);
    dirty = true;
  });
  cv.addEventListener('pointerup', e => {
    const wasPinch = touches.size >= 2;
    touches.delete(e.pointerId);
    pinch = pinchSpan();
    const wasDrag = moved > 6;
    drag = null;
    // A TAP USED TO RE-AIM THE DESCENT at whatever was under it, and it does not any more.
    //
    // It was the most technically interesting control here: a click names a splat, a splat carries
    // the branch word that produced it, and the fixed point of that word repeated forever is a
    // point exactly on the attractor, so the camera could be aimed at a named piece to arbitrary
    // depth. What it is like to USE is the problem. Every object descends along one aim that was
    // chosen for it, and a tap replaces that aim with wherever the finger landed, which is usually
    // an edge of the piece rather than its middle; the descent then runs off toward a boundary and
    // the object slides out of frame with no way back, because panning is deliberately not
    // available. One mistaken tap and the viewer is looking at nothing.
    //
    // The zoom stays: the wheel and the pinch move the camera ALONG the existing aim, which cannot
    // leave the object. So every object behaves the same way and there is no way to get lost.
  });
  cv.addEventListener('pointercancel', e => {
    touches.delete(e.pointerId); pinch = pinchSpan(); drag = null;
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const step = Math.sign(e.deltaY) * Math.min(1, Math.abs(e.deltaY) / 320) * 0.3;
    cam.dist = Math.min(cam.dist * Math.exp(step), cam.startDist * 40);
    rebaseAll();
    dirty = true;
  }, { passive: false });
  window.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.target && e.target.isContentEditable) return;   // the typed speed, see #v-rate
    if (e.key === ' ') { cfg.autopilot = !cfg.autopilot; syncUI(); e.preventDefault(); }
    else if (e.key === 'x' || e.key === 'X') swapRepresentation();
    else if (e.key === 'g' || e.key === 'G') toggleGauss();
    else if (e.key === 'r' || e.key === 'R') loadPreset(cfg.preset, false);
  });
}

// CLICK TO DIVE WAS HERE and is deliberately gone; see the note in the pointerup handler above.
// What it did is worth recording because the mathematics was the good part: a click named a splat,
// a splat carries the branch word that produced it, and the fixed point of that word repeated
// forever lies exactly on the attractor, so the camera could be aimed at a named piece to
// arbitrary depth with no coordinate ever being transported. The terrain and the per pixel plane
// had their own exact versions, a Newton step along the distance estimate. None of it survives the
// interaction problem: re-aiming mid descent sends the camera off toward an edge and there is no
// panning to get back.

/* ================================= UI =================================== */
const el = id => (typeof document === 'undefined' ? null : document.getElementById(id));

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'G';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

// This is a demo. Everything that was a knob is now a settled value carried in the preset,
// except the two things a viewer actually wants while watching, plus the family parameter of
// the Julia set, which is the whole point of having a family.
// Slider position in [0, 1] to speed and back. Continuous at the knee by construction: the linear
// piece ends at SPD_KNEE and the geometric piece starts there. spdToPos saturates at 1 rather than
// running off the end, so a typed speed above the slider's top parks the handle at the right hand
// stop and the number says what is really in force.
function spdFromPos(x) {
  x = Math.max(0, Math.min(1, x));
  if (x <= SPD_KNEE_X) return SPD_MIN + (SPD_KNEE - SPD_MIN) * (x / SPD_KNEE_X);
  return SPD_KNEE * Math.pow(SPD_MAX / SPD_KNEE, (x - SPD_KNEE_X) / (1 - SPD_KNEE_X));
}
function spdToPos(v) {
  if (!(v > SPD_MIN)) return 0;
  if (v <= SPD_KNEE) return SPD_KNEE_X * (v - SPD_MIN) / (SPD_KNEE - SPD_MIN);
  return Math.min(1, SPD_KNEE_X + (1 - SPD_KNEE_X) *
    Math.log(v / SPD_KNEE) / Math.log(SPD_MAX / SPD_KNEE));
}
// Three significant figures at every magnitude, in a fixed width, because the number sits in a
// panel that must not reflow while it is being dragged.
function fmtSpeed(v) { return v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0); }

const SLIDERS = [
  // Speed is shown as a plain multiple of the default rather than in e-folds a second. The unit
  // was on screen and was unguessable, and the number itself is only ever compared with itself.
  ['s-rate', 'rate', v => spdFromPos(v) * RATE1, () => fmtSpeed(cfg.rate / RATE1)],
  ['s-cx', 'cx', v => v, () => cfg.cx.toFixed(3)],
  ['s-cy', 'cy', v => v, () => cfg.cy.toFixed(3)],
  ['s-power', 'power', v => Math.round(v), () => 'z^' + Math.round(cfg.power)],
];
const SLIDER_INV = {};
// The slider's own units, back from the state, so that a rate set by the query string or by a
// preset puts the handle in the right place.
SLIDER_INV.rate = r => spdToPos(r / RATE1);

function syncUI() {
  if (!el('s-rate')) return;
  const set = (id, v) => { const s = el(id); if (s && document.activeElement !== s) s.value = v; };
  for (const [id, key, , show] of SLIDERS) {
    const inv = SLIDER_INV[key];
    set(id, inv ? inv(cfg[key]) : cfg[key]);
    const v = el('v-' + id.slice(2));
    // Not while it is being edited. #v-rate is a text field, and rewriting its contents under a
    // caret moves the caret to the start and makes typing come out backwards.
    if (v && document.activeElement !== v) v.textContent = show();
  }
  const sel = el('preset');
  if (sel && sel.value !== menuValue()) sel.value = menuValue();   // a URL may override the default
  // The run control is a single square next to the speed slider rather than a labelled button on
  // its own row. It shows what pressing it WILL do, which is the convention every media control
  // uses and the opposite of the representation button below: there, the two states are two
  // renderings of one picture and a label naming the action is unreadable; here the two states
  // are running and not running and nobody needs to be told which one they are looking at.
  const b = el('btn-run');
  if (b) {
    b.innerHTML = cfg.autopilot ? '&#9208;' : '&#9654;';        // pause bars, play triangle
    b.dataset.on = cfg.autopilot ? '1' : '0';
    b.setAttribute('aria-label', cfg.autopilot ? 'pause' : 'play');
    b.setAttribute('title', cfg.autopilot ? 'Pause the descent' : 'Resume the descent');
  }
  // BOTH OF THESE ARE SLIDING SWITCHES, and neither label ever changes.
  //
  // They used to be buttons whose text carried the state, and the text was the problem. The
  // representation button said what you were LOOKING AT, which is the only labelling that can work
  // for one word on one button, and it still read as an offer: "Gaussian splats" while showing
  // Gaussian splats looks like the way to turn them on. The switch names BOTH states at once and
  // puts the knob under the live one, so there is nothing left to guess. All the state lives in
  // `data-on`, which drives the knob, the track colour and which label is dimmed, entirely in CSS.
  const rb = el('btn-rep');
  if (rb) {
    const on = isDirect();
    rb.dataset.on = on ? '1' : '0';
    rb.setAttribute('aria-checked', on ? 'true' : 'false');
    rb.disabled = !PIXEL_PAIR[cfg.preset];
  }
  const gb = el('btn-gauss');
  if (gb) {
    gb.dataset.on = cfg.gauss ? '1' : '0';
    gb.setAttribute('aria-checked', cfg.gauss ? 'true' : 'false');
    // The one label that does change, because this switch is between on and off rather than
    // between two named things, and "off"/"on" IS the right hand label.
    const lb = el('lb-gauss');
    if (lb) lb.textContent = cfg.gauss ? 'on' : 'off';
    // Nothing to show on the per pixel object, which has no splats in it at all. Saying so with a
    // disabled control is better than a switch that silently does nothing.
    gb.disabled = isDirect();
  }
  const wrap = el('controls');
  if (wrap) {
    wrap.dataset.kind = PRESETS[cfg.preset].kind;
    wrap.dataset.julia = PRESETS[cfg.preset].julia ? '1' : '0';
  }
  if (el('h-object')) el('h-object').textContent = PRESETS[cfg.preset].name;
}

function is2D(P) { return P.kind === 'plane' || !!P.flat; }

// What the object picker should READ as. The per pixel objects are not in the menu, because they
// are not separate objects: they are the same scene drawn the other way, and they live on the
// toggle at the bottom of the panel. So while one of them is loaded the picker still has to name
// the scene, or it goes blank and the panel says the viewer is showing nothing.
function menuValue() { return (PIXEL_PAIR[cfg.preset] && PRESETS[cfg.preset].direct) ? PIXEL_PAIR[cfg.preset] : cfg.preset; }

// THREE groups, not two, and the third one is the distinction that actually matters here.
//
// The first two are a statement about the AMBIENT SPACE: a 3D object is a measure in space with
// a free camera, a 2D one is a curve or a field in a plane seen flat. The third is a statement
// about the OBJECT, and it is the one this renderer is built around: everything in the first two
// groups is exactly self similar, so a piece is an affine copy of the whole, the recursion IS the
// level of detail hierarchy, and the zoom is unbounded. The escape time sets are not. They are
// quasi self similar at best, every level down is genuinely new structure, the cost per point
// GROWS with depth, and the zoom ends at a precision wall rather than continuing forever. Putting
// them in the same list as the Koch curve invites the reader to compare two things that are not
// alike, and the numbers behind that are in knowledge/flat_self_similar.md: a plane cut is 0.4 to
// 9 seconds against 1 to 140 milliseconds for a similarity IFS answering the same question.
//
// Inside a group the order is alphabetical by the name on screen. There is no editorial ordering
// to maintain and therefore none to fall out of date: adding an object puts it in the right place
// with no list to update. Which object the viewer OPENS on is a separate decision and lives in
// `cfg.preset`.
const MENU_GROUPS = [
  ['3D self similar',     P => !is2D(P)],
  ['2D self similar',     P => is2D(P) && P.kind !== 'plane'],
  ['2D not self similar', P => P.kind === 'plane'],
];

function fillPresetMenu(sel) {
  const keys = Object.keys(PRESETS);
  for (const [label, want] of MENU_GROUPS) {
    const g = document.createElement('optgroup');
    g.label = label;
    const mine = keys.filter(k => {
      const P = PRESETS[k];
      if (P.hidden) return false;
      if (!want(P)) return false;
      // The escape time sets are not offered on a device that cannot hold them. See perfHeavyOK:
      // their cut is hundreds of milliseconds to seconds against twenty for everything else, and
      // on a phone that is a hung tab rather than a slow demo.
      if (P.kind === 'plane' && !perfHeavyOK()) return false;
      return true;
    }).sort((a, b) => PRESETS[a].name.localeCompare(PRESETS[b].name));
    for (const k of mine) {
      const o = document.createElement('option');
      o.value = k; o.textContent = PRESETS[k].name;
      g.appendChild(o);
    }
    if (g.children.length) sel.appendChild(g);
  }
}

function bindUI() {
  const sel = el('preset');
  if (!sel) return;                       // canvas only page, e.g. the capture harness
  // The groups and why there are three of them are at MENU_GROUPS.
  //
  // `!!P.flat` in `is2D`, and it is not a nicety. `P.kind === 'plane' || P.flat` is `undefined`
  // for every object that has neither, `undefined !== false` is true, so the 3D pass skipped all
  // of them and the menu came back with the two plane objects in it and nothing else. That
  // is the entire "where did the Sierpinski and the dragon go".
  fillPresetMenu(sel);
  sel.value = menuValue();
  // Choosing a scene from the picker leaves the representation where it is: if the per pixel
  // toggle is on and you pick Julia, you get the per pixel Julia. Anything else makes the toggle
  // silently reset itself every time the scene changes.
  sel.addEventListener('change', () => {
    const want = (isDirect() && PIXEL_PAIR[sel.value]) ? PIXEL_PAIR[sel.value] : sel.value;
    loadPreset(want, false);
  });

  for (const [id, key, xf] of SLIDERS) {
    const s = el(id);
    if (!s) continue;
    const inv = SLIDER_INV[key];
    s.value = inv ? inv(cfg[key]) : cfg[key];
    s.addEventListener('input', () => {
      cfg[key] = xf(+s.value);
      if (key === 'kernel') kern = kernelConst(cfg.kernel);
      // The family parameter moves the SET, so whatever the camera was aiming at is not on it
      // any more. Rebuild the aim from the new c and re-aim, or the descent continues into a
      // region that is no longer there. `projDist` is reset so the next halving of the camera
      // distance re-projects again.
      if (key === 'cx' || key === 'cy' || key === 'power') {
        const P = PRESETS[cfg.preset];
        if (P.kind === 'plane') {
          planeTargets(P);
          setGoal(targetIdx);
          projDist = 1e300;
        }
      }
      dirty = true; syncUI();
    });
  }

  // WHERE THE TWO SPEED MARKS GO. Both come from the mapping above rather than from a number
  // typed into the stylesheet, so the tick is at the default and the shading starts at the knee
  // however the constants are set. Custom properties inherit, so setting them on the panel serves
  // the track pseudo element and the tick alike.
  const panel = el('controls');
  if (panel) {
    panel.style.setProperty('--spd-def', spdToPos(1).toFixed(4));
    panel.style.setProperty('--spd-knee', (SPD_KNEE_X * 100).toFixed(1) + '%');
  }

  // THE SPEED, TYPED. The slider stops at SPD_MAX and this does not, because the renderer does not
  // (see SPD_TYPED_MAX and speed_probe.mjs) and a control that cannot say 500 when 500 works is
  // the wrong control. Enter or clicking away commits, Escape puts back what was there, and
  // whatever is committed is clamped and then WRITTEN BACK, so the field always shows the speed
  // actually in force rather than the wish that was typed into it.
  const vr = el('v-rate');
  if (vr) {
    let cancelled = false;
    const commit = () => {
      if (!cancelled) {
        // textContent and not innerHTML: this is a contenteditable and a paste can carry markup.
        const n = parseFloat((vr.textContent || '').replace(',', '.').replace(/[^0-9.eE+-]/g, ''));
        if (isFinite(n)) cfg.rate = Math.max(0, Math.min(SPD_TYPED_MAX, n)) * RATE1;
      }
      cancelled = false;
      dirty = true;
      syncUI();                     // which rewrites the field, now that it is no longer focused
    };
    vr.addEventListener('focus', () => {
      // Select the whole number, so that typing replaces it rather than appending to it.
      const r = document.createRange(); r.selectNodeContents(vr);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    vr.addEventListener('blur', commit);
    vr.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); vr.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelled = true; vr.blur(); }
    });
  }

  const rn = el('btn-run');
  if (rn) rn.addEventListener('click', () => { cfg.autopilot = !cfg.autopilot; syncUI(); });
  // The readout's second half. Splats, frame time and resolution are always on screen because
  // reporting them is a rule of this project; the zoom, the depth range, the precision, the buffer
  // format, what the cut cost and what it ran on are all real and all answer a question nobody has
  // while watching a descent. One press, and the state lives on the panel so the CSS can do the
  // hiding without JavaScript touching a style.
  const ib = el('btn-info');
  if (ib) ib.addEventListener('click', () => {
    const w = el('controls');
    if (!w) return;
    const on = w.dataset.info === '1' ? '0' : '1';
    w.dataset.info = on;
    ib.dataset.on = on;
    ib.setAttribute('title', on === '1' ? 'Fewer numbers' : 'More numbers');
  });
  const rb = el('btn-rep');
  if (rb) rb.addEventListener('click', swapRepresentation);
  const gb = el('btn-gauss');
  if (gb) gb.addEventListener('click', toggleGauss);
  // Quality. Choosing anything but Auto turns the governor OFF, which is the point: a setting
  // that keeps overriding itself is not a setting. Rebuilding the menu is not optional, because
  // the bottom tier does not offer the escape time objects; if one of them is the object on
  // screen when the tier drops, it stays on screen and only leaves the list.
  const qs = el('quality');
  if (qs) {
    qs.addEventListener('change', () => {
      perfSet(qs.value);
      rebuildPresetMenu();
      dirty = true; syncUI();
    });
  }
}

// The object menu, rebuilt in place. Called when the resource tier changes.
function rebuildPresetMenu() {
  const sel = el('preset');
  if (!sel) return;
  sel.innerHTML = '';
  fillPresetMenu(sel);
  sel.value = menuValue();
}

// Swap between the splat render and the per pixel one WITHOUT moving the camera. loadPreset with
// keepView leaves the target, the distance, the orientation and the aim alone and changes only the
// object, which is exactly right here because the two objects are the same mathematics: same
// field, same palette, same colour law, same targets. `paramKey` is cleared so the next frame
// rebuilds rather than drawing the other object's cut through this object's shader.
function swapRepresentation() {
  const other = PIXEL_PAIR[cfg.preset];
  if (!other) return;
  loadPreset(other, true);
  paramKey = '';
  stillT = 0; stillCuts = 0;
  dirty = true;
  syncUI();
}

// The Gaussian view. It changes the split threshold, which is a structural property of the cut, so
// the current one is thrown away rather than left to drift: `dirty` alone would let the old cut
// stay on screen through the transition and the two disagree about splat size by a factor of nine.
// The stillness ramp is reset with it, because the sharpening it applies is now overridden and the
// level would otherwise carry over meaningless.
// The Gaussian view changes the split threshold, which is a structural property of the cut, so the
// current one is thrown away rather than left to drift: the two disagree about splat size by an
// order of magnitude and `dirty` alone would leave the old one on screen through the transition.
// THE GAUSSIAN VIEW IS REMEMBERED, across reloads and across every change of object.
//
// It survives an object change already, because nothing in loadPreset touches cfg.gauss. What it
// did not survive is a reload, and that is the case that matters: this view is how someone checks
// what the picture is made of, and having to switch it back on after every reload makes it read as
// a momentary effect rather than as a way of looking at the thing.
//
// localStorage throws rather than returning null in a sandboxed iframe or with cookies blocked,
// and touching the property itself can throw, so both sides are wrapped. The same rule the theme
// code here follows.
const GAUSS_KEY = 'fractalsplats.gauss';
function gaussRemember(v) {
  try { localStorage.setItem(GAUSS_KEY, v ? '1' : '0'); } catch (e) { /* private mode, no matter */ }
}
function gaussRecall() {
  try { return localStorage.getItem(GAUSS_KEY) === '1' ? 1 : 0; } catch (e) { return 0; }
}

function toggleGauss() {
  if (isDirect()) return;
  cfg.gauss = cfg.gauss ? 0 : 1;
  gaussRemember(cfg.gauss);
  paramKey = '';
  syncUI();
}

// A view is named in the ORIGINAL frame plus the anchor word, so replaying it is
// exact: set the original camera, then walk the same sequence of maps.
function applyURL() {
  const q = new URLSearchParams(location.search);
  // The resource tier is read BEFORE the preset, because it decides which objects are in the
  // menu at all and how large the first cut is allowed to be. `q=auto` is the default and is
  // what the embedded demo uses.
  if (q.has('q')) perfSet(q.get('q'));
  if (!q.has('p') || !PRESETS[q.get('p')]) return false;
  const num = (k, d) => (q.has(k) && isFinite(+q.get(k))) ? +q.get(k) : d;
  loadPreset(q.get('p'), false);
  cfg.budget = Math.max(1000, Math.min(MAXBUDGET, num('b', cfg.budget)));
  cfg.splitPx = num('sp', cfg.splitPx);
  // Show the individual Gaussians. In the query string so a capture of the mode is reproducible;
  // see GAUSS_PX in src/40_state.js.
  cfg.gauss = Math.max(0, Math.min(1, Math.round(num('gs', cfg.gauss))));
  cfg.density = num('dn', cfg.density);
  cfg.glow = num('gw', cfg.glow);
  cfg.fog = num('fg', cfg.fog);
  cfg.kernel = num('kn', cfg.kernel);
  cfg.sigma = num('sg', cfg.sigma);
  cfg.rate = Math.max(0, Math.min(SPD_TYPED_MAX * RATE1, num('rt', cfg.rate)));
  cfg.relief = num('rl', cfg.relief);
  cfg.iters = Math.round(num('it', cfg.iters));
  // The family parameters, so a capture can be taken at an exponent or a c that is not the
  // default. Applied before the targets are built, which is why loadPreset is called again.
  const pw0 = cfg.power, cx0 = cfg.cx, cy0 = cfg.cy;
  cfg.power = Math.round(num('pw', cfg.power));
  cfg.cx = num('cx', cfg.cx); cfg.cy = num('cy', cfg.cy);
  if (cfg.power !== pw0 || cfg.cx !== cx0 || cfg.cy !== cy0) loadPreset(q.get('p'), false);
  cfg.contour = num('cn', cfg.contour);
  cfg.height = num('hm', cfg.height) ? 1 : 0;
  kern = kernelConst(cfg.kernel);
  if (q.get('pr') === 'f32' || q.get('pr') === 'f64') cfg.precision = q.get('pr');
  fixedDt = Math.max(0, Math.min(0.5, num('dt', 0)));
  // Evaluation only: the screen space size cap, so the popping harness can measure what
  // capping it actually bought instead of asserting it.
  SIZE_CAP = Math.max(0.5, Math.min(400, num('sc', SIZE_CAP)));
  // Evaluation only: the plane's latency ceiling. Every comparison of a plane frame against a
  // reference needs this, because the ceiling is measured against the WALL CLOCK, so the same
  // query on a loaded machine drains earlier and produces a different cut. Measured: two
  // captures of one static view differed by a factor of two in rms against the same reference.
  // Set it high and the cut converges, which is the only way to see what a change to the
  // colour law did rather than what the machine was doing at the time.
  PLANE_MS = Math.max(5, Math.min(60000, num('mc', PLANE_MS)));
  // Evaluation only: how far past exp(-8) of attenuation the depth of field reaches. See ZF_MUL.
  ZF_MUL = Math.max(1, Math.min(8, num('zk', ZF_MUL)));
  // Evaluation only: the narrow end of the plane's per cell kernel bandwidth. 1 is the old
  // single global bandwidth, so `kb=1` is the A against which the shipped B is measured. See
  // KERN_MIN in src/52_cut_plane.js.
  KERN_MIN = Math.max(0.1, Math.min(1, num('kb', KERN_MIN)));
  // Evaluation only: the flat splat's quad size, in multiples of the kernel's support. See
  // FLAT_EXT in src/52_cut_plane.js; it is what lets `kb` go below 0.447 at all.
  FLAT_EXT = Math.max(1, Math.min(4, num('fx', FLAT_EXT)));
  // Evaluation only: the per pixel path's coordinate diagnostic, and its work ceiling.
  DIR_DBG = Math.max(0, Math.min(2, Math.round(num('dbg', 0))));
  DIR_WORK = Math.max(1e8, Math.min(1e13, num('dw', DIR_WORK)));
  // Evaluation only: the work one BAND of a still per pixel pass may do. `bw=1e12` collapses the
  // pass into a single band, which is the only way to capture this object: a headless page renders
  // about four frames before its virtual time budget expires, so a banded pass never finishes.
  DIR_BAND_WORK = Math.max(1e8, Math.min(1e13, num('bw', DIR_BAND_WORK)));
  // Evaluation only: the per pixel path's supersampling grid for a still frame. `ss=1` is the A
  // against which the shipped B is measured. See DIR_SS in src/62_direct.js.
  DIR_SS = Math.max(1, Math.min(4, Math.round(num('ss', DIR_SS))));
  // Evaluation only: the batched GPU field behind the quadtree. `gf=0` is the A against which the
  // shipped B is measured, and it is also the only way to get a plane cut whose every number came
  // from the same arithmetic the CPU has always used. See planeFlush in src/52_cut_plane.js.
  if (q.has('gf')) gfOn = q.get('gf') === '1';
  GF_MAX_DEC = Math.max(0, Math.min(14, num('gd', GF_MAX_DEC)));
  // Evaluation only: the Gaussian view's two shape numbers, so that "the outlines alias" can be
  // swept and looked at instead of rebuilt four times. `rw` is the outline's half width in pixels
  // and `gp` is the split threshold that decides how large the ellipses are. Both are the shipped
  // defaults unless a query says otherwise.
  GAUSS_RING = Math.max(0.05, Math.min(4, num('rw', GAUSS_RING)));
  GAUSS_PX = Math.max(1, Math.min(40, num('gp', GAUSS_PX)));
  // The plane objects have their own size in this mode and therefore their own query knob; see
  // GAUSS_PX_PLANE in src/40_state.js.
  GAUSS_PX_PLANE = Math.max(1, Math.min(60, num('gpp', GAUSS_PX_PLANE)));
  // Evaluation only: a constant added to every splat's hue, in turns. Zero everywhere except in
  // the frames of a looping zoom video. See HUE_OFF in src/40_state.js.
  HUE_OFF = num('hu', 0);
  // Evaluation only: the splat path's own anti-aliasing, five samples a tangle cell. `sa=0` is
  // the A. See planeNeedsAA in src/52_cut_plane.js.
  SPLAT_AA = Math.max(0, Math.min(1, Math.round(num('sa', SPLAT_AA))));
  // Evaluation only: PIN the stationary refinement level, so a capture shows the converged frame
  // without waiting for the ramp and without depending on how fast the page's clock runs. See
  // stillPin: seeding the level and letting the loop take over does not work in a headless page.
  if (q.has('st')) { stillPin = Math.max(0, Math.min(STILL_MAX, Math.round(num('st', 0)))); stillCuts = stillPin; }
  if (q.has('au')) cfg.autopilot = q.get('au') === '1';
  if (q.has('rb')) cfg.rebase = q.get('rb') === '1';
  // Order matters. The camera in the query string is already expressed in the
  // ANCHOR's coordinates, because that is the only frame the renderer ever works
  // in, so the anchor word has to be replayed FIRST and the camera written
  // afterwards. Replaying it second would put the camera through all those inverse
  // maps a second time: at 93 rebases that lands it about 1e28 away from the
  // object, which shows up as a single splat in an empty frame.
  const w = q.get('aw');
  if (w && maps) for (const part of w.split('.')) {
    const i = +part;
    if (i >= 0 && i < maps.length) rebaseInto(i);
  }
  cam.startDist = num('d0', cam.startDist);
  cam.dist = num('dz', cam.dist);
  if (q.has('tx')) cam.target.set([num('tx', 0), num('ty', 0), num('tz', 0)]);
  // THE AIM IS ONLY OVERWRITTEN WHEN THE QUERY IS A SAVED VIEW, and the `else if` is the fix for
  // "sometimes it starts zooming into the black".
  //
  // A saved view carries both the camera and the aim, and one without `gx` is a view that was
  // parked, so aiming at its own target is right. But the embedded demo is opened as
  // `?p=pythagoras&q=auto`, which has neither, and the old unconditional else then replaced the
  // preset's aim with `cam.target`, which at load is the object's CENTRE OF MASS. For the
  // Pythagoras canopy that point is in the empty region inside the arc, so the opening descent flew
  // into black; picking any object from the menu afterwards went through loadPreset and aimed
  // correctly, which is exactly why it only happened sometimes. The preset's own aim is a fixed
  // point of a branch word and is ON the attractor by construction.
  if (q.has('gx')) cam.goal.set([num('gx', 0), num('gy', 0), num('gz', 0)]);
  else if (q.has('tx')) cam.goal.set(cam.target);
  if (q.has('cr')) {
    const v = q.get('cr').split(',').map(Number);
    if (v.length === 9 && v.every(isFinite)) { cam.R.set(v); orthoBasis(); }
  }
  // The aim's word and phase, so that a replayed view can keep descending.
  const wd = q.get('wd');
  if (wd && maps) {
    const lw = wd.split('.').map(Number).filter(i => i >= 0 && i < maps.length);
    if (lw.length) { cam.goalWord = lw; cam.goalPhase = Math.round(num('wp', 0)) % lw.length; }
  }
  projDist = cam.dist;
  return true;
}

/* ================================ loop ================================== */
// One step of camera motion: the target ease, the aim invariant, the autopilot
// descent, and the rebase. Factored out so the headless tests drive the real
// descent rather than a copy of it.
let projDist = 1e300;
let parked = false;
let climbing = false;   // the flight has turned around at the precision wall
// The way out is quicker than the way in, but not by much. A stale cut UNDER covers the
// frame while climbing and OVER covers it while descending, and under covering shows the
// background while over covering only blurs, so the climb is the direction that has to be
// conservative. At 2.5 the frame grew seven times linearly during one cut.
const CLIMB_RATE = 1.5;
let fixedDt = 0;             // set by the dt= query parameter, for headless capture

function advanceCamera(dt) {
  // Ease onto the descent target, then enforce an invariant: the aim point is
  // never further than 0.4 camera distances from a point that is genuinely on
  // the object. An exponential ease alone is not enough, because the camera
  // distance shrinks at cfg.rate while the residual decays at the ease rate, so
  // whenever the descent is the faster of the two the aim drifts off in relative
  // terms and the camera flies into the void. Static frames never show this.
  const k = 1 - Math.exp(-Math.max(2, 3 * cfg.rate) * dt);
  let mv = 0;
  for (let i = 0; i < 3; i++) {
    const d = (cam.goal[i] - cam.target[i]) * k;
    cam.target[i] += d;
    mv += Math.abs(d);
  }
  const rx = cam.goal[0] - cam.target[0];
  const ry = cam.goal[1] - cam.target[1];
  const rz = cam.goal[2] - cam.target[2];
  const rem = Math.sqrt(rx * rx + ry * ry + rz * rz);
  const maxRem = cam.dist * 0.4;
  if (rem > maxRem) {
    const pull = 1 - maxRem / rem;
    cam.target[0] += rx * pull;
    cam.target[1] += ry * pull;
    cam.target[2] += rz * pull;
    mv += rem * pull;
  }
  if (mv > cam.dist * 1e-4) dirty = true;

  // The terrain aim rides at a fixed fraction of the camera distance, so it has to
  // be refreshed as the distance changes, autopilot or not.
  if (isTerrain()) cam.goal[1] = terrainAimHeight();
  else if (isPlane()) cam.goal[1] = 0;
  if (!cfg.autopilot) { zoomRate = 0; rebaseAll(); return; }
  // THE FLIGHT NEVER STOPS. An IFS never reaches a wall at all, because a rebase resets
  // the coordinates exactly and the descent is unbounded. A flat field has no self
  // similarity to rebase into, so its wall is real: the plane coordinate is a double, and
  // once a screen pixel is narrower than the spacing of doubles at the aim there is
  // nothing left to resolve. Measured, that is a little over thirteen decades from the
  // opening view.
  //
  // Three things have been tried at that wall. Fading the frame to black and jumping to
  // another target: the frame went completely dark for a third of a second with no
  // explanation. Parking, holding the zoom and keeping everything else live: honest, but
  // it stops, and a demo that stops looks broken. This one CLIMBS: the same exponential
  // run backwards, at two and a half times the speed, re-aimed at the next target on the
  // way up, and at the top it dives again. Nothing is ever still and nothing is ever
  // black, and going out is free because the cut only ever gets cheaper.
  //
  // Both readouts are live, not by-products of the last finished rebuild. A deep rebuild
  // takes tens of frames, and a readout that freezes for tens of frames while the camera
  // keeps moving is an instrument that lies.
  stats.errPx = errPxNow();
  stats.logZoom = logZoom();
  const wall = cfg.precision === 'f32' ? 2.5 : 0.35;
  if (!climbing && stats.errPx > wall) climbing = true;
  // Where the camera will be when the cut that is about to be started lands, expressed as a
  // rate and a lead time. A cut of `buildMs` CPU milliseconds takes that many 5 ms slices, one
  // per frame, so it arrives buildMs/WORK_MS frames from now. Set HERE rather than in the frame
  // loop, so that the headless harnesses, which drive advanceCamera directly, see the same
  // prediction the browser does.
  //
  // AND IT IS SMOOTHED, which is not tidiness: unsmoothed it is a two cycle oscillator and it was
  // the flicker. The loop is short and its gain is one. A large cut takes longer to build, so the
  // lead is longer, so the next cut is built for a point further down the descent, so it is
  // COARSER and smaller; a small cut then builds fast, the lead shortens, and the next one comes
  // back fine and large. Round it goes, every cut, forever.
  //
  // Measured on the Pythagoras tree, splats per cut over a descent: 89k, 83k, 110k, 103k, 136k,
  // 127k, 168k, 157k, 208k, 194k. A clean alternation of six to ten percent riding on the real
  // growth, which is a level of detail transition every single cut. The arithmetic agrees that
  // this is the whole of it: at 0.4 e-folds a second and a lead near 0.1 s the predicted distance
  // moves 4 percent, and for a dimension two attractor the cell count moves twice that.
  //
  // The review that found it was precise about where it showed, near the centre of the spiral
  // being descended into, which is exactly where the marginal splats of a saturated cut are. It
  // is also why `pop.mjs` never caught it: that harness freezes the camera, and with no descent
  // there is no lead to oscillate.
  //
  // A fifth of the gap per frame drops the loop gain to 0.2 and the oscillation with it. The lead
  // still tracks a genuine change in build cost, over about five frames instead of instantly.
  const leadWant = Math.min(0.8, stats.buildMs / frameWork() * Math.min(Math.max(dt, 1 / 240), 0.05));
  buildLead += (leadWant - buildLead) * 0.2;
  // The climb is rate limited by the renderer, not by taste. A cut covers the frame it was
  // built for; while it is on screen the frame keeps growing, and once the frame is wider than
  // the cut the background shows through at the edges and then everywhere. So cap the climb so
  // the frame grows by at most GROW e-folds during one cut. Measured at 2.4 e-folds a second
  // against a 0.55 second cut, the frame grew 3.7 times and the coverage fell to 2 percent: 126
  // of 900 frames dark. This is the honest statement of how fast a flat field can be flown
  // outwards, and it is the only place in the renderer where the camera is asked to wait for
  // the cut rather than the other way round.
  const GROW = 0.25;
  let cRate = CLIMB_RATE * cfg.rate;
  if (buildLead > 1e-3) cRate = Math.min(cRate, GROW / buildLead);
  zoomRate = climbing ? cRate : -cfg.rate;
  if (climbing) {
    cam.dist *= Math.exp(cRate * dt);
    if (cam.dist >= cam.startDist) {
      // Re-aim HERE, at the top, and not at the turnaround. Switching the aim while the
      // camera is still 1e-13 deep looks like this, measured: the aim invariant holds the
      // target within 0.4 camera distances of the goal, so a goal 0.03 away in world units
      // with cam.dist at 1e-13 snaps the target the whole way in one frame, and the camera
      // is then pointed at a piece of plane that is featureless at that magnification. 126
      // of 900 frames came back dark, with the frame coverage at 0.0 percent for a hundred
      // frames of the climb. From the top the same change is a pan of a fraction of the
      // frame, with the whole object in view the entire time.
      cam.dist = cam.startDist; climbing = false; projDist = 1e300;
      if (targets.length > 1) setGoal(targetIdx + 1);
    }
  } else {
    cam.dist *= Math.exp(-cfg.rate * dt);
  }
  parked = false;
  // NO automatic turn, on any object. The autopilot descends and does nothing else. A slow
  // orbit used to run on the 3D objects, to show that they have three dimensions and that the
  // cut does not depend on the viewing angle. Both are true and neither is worth it: the turn
  // competes with the descent for what the eye is following, and it fights a hand rotation
  // rather than yielding to it. Turning is on the drag now, where the viewer asks for it.
  rebaseAll();
  // The terrain has no exact self similarity to rebase into, so its aim has to
  // be re-projected onto the boundary as the resolution demands. One Newton step
  // on the distance estimate, whenever the camera distance has halved.
  if (isPlane() && !climbing && cam.dist < projDist * 0.5) {
    const P = PRESETS[cfg.preset];
    const c = projectToPlane(cam.goal[0], cam.goal[2], job.power, job.c0x, job.c0y,
                             !!P.julia, Math.max(job.maxIter, 4000));
    if (isFinite(c[0] + c[1])) { cam.goal[0] = c[0]; cam.goal[2] = c[1]; }
    projDist = cam.dist;
  }
  if (isTerrain() && !climbing && cam.dist < projDist * 0.5) {
    const c = projectToBoundary(cam.goal[0], cam.goal[2], Math.max(job.maxIter, 2000));
    if (isFinite(c[0] + c[1])) { cam.goal[0] = c[0]; cam.goal[2] = c[1]; }
    projDist = cam.dist;
  }
}

let last = 0, fpsEma = 60, hudAcc = 1, paramKey = '', rebuildAcc = 0, hzEma = 0;
let frameCount = 0;

// A fixed slice of refinement per frame, because the kernels take a time budget and honour it
// directly; the old version tried to convert a measured node rate into a node count and
// starved itself by a factor of ten when a single slice happened to be cold. See `stepIFS`.
// WORK_MS itself lives in src/40_state.js, because startJob needs it too.
//
// The plane objects get a bigger slice, and the reason is that their cost and their latency
// are the same number: a cut is bounded at msCap milliseconds of CPU and arrives msCap/slice
// frames later, so doubling the slice either halves the wait or doubles the detail. An IFS cut
// costs 20 to 30 ms and lands in five frames, which is already invisible; a field cut at a two
// megapixel window wants a hundred and would land in twenty at a 5 ms slice. The price is
// frame rate: 9 ms of refinement caps the loop near 45 fps on a machine that would otherwise
// hold 60. Sharper geometry at 45 is the better frame.
// AND a stationary plane object gets five times that again, for the same reason the latency
// ceiling doubles when nothing moves: the slice is a LATENCY budget and a still camera is not
// waiting for anything. Measured, a converged cut at the opening view is about 450 ms of CPU, so
// at 9 ms a frame the viewer waits fifty frames to see it and at 25 ms a frame, eighteen. The
// price is the frame rate of a frame that is not changing: 40 fps instead of 60, on a still image.
// A descent is untouched, because stillCuts is reset the moment anything moves.
// The three dimensional objects get a smaller version of the same allowance, because they now
// have something to spend it on: the split threshold halves over the stillness ramp, which is four
// times the cells, and a cut that is four times the size at the same slice takes four times as
// many frames to land. Three rather than the plane's five, since their cuts are tens of
// milliseconds rather than seconds and there is no latency ceiling behind them to soak up a
// mistake.
function frameWork() {
  // While there is nothing on screen yet, the smallest slice. The frame loop is the only thing
  // keeping the page responsive at that moment and a first cut is the one that runs for the most
  // frames, so this is where a fat slice is felt as a stutter rather than as progress.
  if (!built.valid) return WORK_MS;
  if (stillCuts <= 0) return isPlane() ? WORK_MS * 1.8 : WORK_MS;
  return WORK_MS * (isPlane() ? 5 : 3);
}
// isPlane, not isField. The terrain shares the field machinery and nothing else: its cuts run
// to 900 ms, so `buildLead = buildMs / frameWork() * dt` is large for it, and dividing that by
// a slice 1.8 times bigger cut its prediction by the same factor and put 41 of 900 frames dark.
// A wider slice is the right trade for an object whose cut is bounded at 90 ms and the wrong
// one for an object whose cut is bounded by nothing.

function paramSignature() {
  return cfg.preset + '|' + cfg.budget + '|' + cfg.splitPx + '|' + cfg.precision + '|' +
    cfg.sigma + '|' + cfg.fog + '|' + cfg.relief + '|' + cfg.iters + '|' +
    cfg.contour + '|' + cfg.height + '|' + cfg.power + '|' + cfg.cx + '|' + cfg.cy + '|' +
    cfg.gauss;
}

// HOW MANY CUTS HAVE REACHED THE SCREEN. Read by the probe, and it is the whole of the
// instrument that was missing.
//
// Every popping harness in this project either freezes the camera and moves the split threshold by
// hand, or differences consecutive frames of a descent. The second mixes two things that cannot be
// told apart afterwards: a bright edge moving one pixel and a whole new cut replacing the old one
// produce the same tail. And the case a viewer complains about is the second one. Counting the
// uploads lets the probe difference the LANDING frames separately from the rest, which turns
// "does this object flicker" from a judgement into a ratio.
let cutSerial = 0;
function upload(n) {
  cutSerial++;
  if (n > 0) {
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    // cutFloats(), not FLOATS: a plane cut writes seven floats an instance and uploading thirteen
    // times as many would send three quarters garbage and read it back as noise.
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instances.subarray(0, n * cutFloats()));
  }
  reprojection();
  hzEma = hzEma ? hzEma + (1 / Math.max(rebuildAcc, 1e-3) - hzEma) * 0.2
                : 1 / Math.max(rebuildAcc, 1e-3);
  rebuildAcc = 0;
}

function frame(t) {
  // A fixed step when one is asked for. Headless Chrome under a virtual time budget
  // advances rAF timestamps by almost nothing, so a wall clock dt freezes the camera
  // and no capture can show a descent at all. It also makes a captured descent
  // reproducible frame for frame, which is what an evaluation frame has to be.
  const dt = fixedDt > 0 ? fixedDt : (last ? Math.min(0.1, (t - last) / 1000) : 0.016);
  last = t;
  frameCount++;

  // The resource tier decides the pixel ratio, the pixel ceiling and the refinement slice, and
  // the governor moves the tier from the measured frame time. See src/35_perf.js.
  perfFrame(dt);
  WORK_MS = perfNow().work;
  const vp = perfViewport(canvas.clientWidth, canvas.clientHeight);
  const vw = vp[0], vh = vp[1];
  if (canvas.width !== vw || canvas.height !== vh) {
    canvas.width = vw; canvas.height = vh;
    resizeTargets(vw, vh);
    dirty = true;
  }

  advanceCamera(dt);
  updateBasis();
  // The per pixel path has no cut, so it skips all of it: no signature, no reprojection, no
  // stepping, no instance upload. It is the whole renderer in one draw call.
  if (isDirect()) {
    stats.logZoom = logZoom();
    stats.errPx = errPxNow();
    stillT = (dirty || Math.abs(zoomRate) > 1e-6) ? 0 : stillT + dt;
    stillCuts = stillPin >= 0 ? stillPin
      : (stillT < STILL_T0 ? 0
        : Math.min(STILL_MAX, 1 + Math.floor(Math.log2(stillT / STILL_T0))));
    dirty = false;
    // MOVING is the still LEVEL being zero, not the raw motion test, so that the evaluation pin
    // reaches this path as well. A headless page's timestamps barely advance, so the ramp never
    // leaves level zero there and every capture of this object was a capture of the moving frame:
    // at ten to the six that is an iteration cap of 3 647 against the 88 800 the view needs, and
    // half the frame comes back as the out-of-iterations colour. That is the whole of what was
    // recorded in this project as a tone bug in the per pixel path.
    drawDirect(vw, vh, stillCuts === 0, 1000 / Math.max(fpsEma, 1e-3));
    if (typeof window !== 'undefined' && window.__probe) window.__probe(gl, vw, vh);
    fpsEma += (1 / Math.max(dt, 1e-4) - fpsEma) * 0.06;
    hudAcc += dt;
    if (hudAcc > 0.15) { hudAcc = 0; hud(vw, vh); }
    progress();
    requestAnimationFrame(frame);
    return;
  }
  const sig = paramSignature();
  const drift = reprojection();
  rebuildAcc += dt;
  // HOW LONG THE CAMERA HAS BEEN STILL, in seconds, and the refinement level that follows from
  // it. This used to be a COUNT of consecutive cuts that finished with nothing moving, and that
  // was wrong in two ways that both hid the same thing.
  //
  //  - it could only advance when a rebuild happened to be triggered, and the trigger was a
  //    periodic 0.5 s refresh. A cut that takes longer than the period therefore never let the
  //    ramp advance past its first step, which is the case that matters, because the whole point
  //    of the ramp is objects whose cuts are slow.
  //  - a headless capture advances its timestamps by almost nothing, so the refresh never fired
  //    at all and the ramp stayed at zero for the whole run. Two full days of evaluation frames
  //    in this project were taken with `st=8` in the query and `still 0` in the readout, and
  //    every claim about a converged plane frame made from them was about the MOVING cut.
  //
  // Time is the quantity the ramp is really about, so the ramp reads a clock. Level k is reached
  // after STILL_T0 * 2^(k-1) seconds of stillness, and the level is what triggers the rebuild, so
  // every step of the ramp is actually built instead of being skipped by whichever one the
  // refresh happened to land on.
  const moving = dirty || !built.valid || drift > 0.04 || Math.abs(zoomRate) > 1e-6;
  stillT = moving ? 0 : stillT + dt;
  const wantStill = stillPin >= 0 ? stillPin
    : (stillT < STILL_T0 ? 0
      : Math.min(STILL_MAX, 1 + Math.floor(Math.log2(stillT / STILL_T0))));

  if (sig !== paramKey) {
    // A CHANGE OF OBJECT, AND IT MUST NOT BLOCK. This used to be `upload(buildCut(...))`, and
    // buildCut is `while (!stepJob(Infinity))`: the whole cut, synchronously, in the frame
    // callback. For an iterated function system that is twenty milliseconds and reads as a hitch.
    // For an escape time object it is seconds, because a plane cut is a hundred percent escape
    // time iteration, and seconds inside a frame callback freeze the TAB, not the viewer: the
    // page around this demo stops scrolling too. That is what "everything freezes and loads too
    // long" was, and on a page where the demo is one section among several it is the worst thing
    // this renderer can do.
    //
    // So the first cut of a new object is an ordinary job, stepped against the same millisecond
    // slice as every other cut, and what is on screen until it lands is the new object's
    // background. The object then appears over a handful of frames instead of after a freeze.
    //
    // THE STILLNESS RAMP IS RESET WITH IT, and that line matters as much as the rest. The ramp is
    // driven by a clock, so by the time anyone has read the page and reached for the menu it is at
