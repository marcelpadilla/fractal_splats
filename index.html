<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractal splats</title>
<meta name="description" content="Fractals rendered as Gaussian splats, refined on demand as the camera descends. An affine iterated function system with exact anchor rebasing, and a distance estimated terrain over the Mandelbrot set.">
</head>
<body>
<style>
/* ---------------------------------------------------------------------------
   A demo, and nothing else. The canvas fills the window; the controls are the
   few a viewer wants while watching, and the readout stays because reporting
   splat count and frame time honestly is a rule of this project, not
   decoration. Everything else about the frame is one press away behind the
   info button.

   THE COLOURS ARE THE SITE'S. This viewer is embedded in a page on
   marcelpadilla.com and used to carry its own amber-on-near-black palette,
   which read as a different piece of software bolted into the page. The tokens
   below are the site's own, copied from Source/CSS/style_new.css: the light
   ramp is the TU Berlin red the site brands with, the dark ramp is the higher
   tone version that sheet uses on dark grounds because a deep red on near
   black is 2.97:1 and fails every contrast floor. Which one applies is decided
   at load and re-decided whenever the page's toggle moves; see themeInit in
   src/70_ui.js.
   --------------------------------------------------------------------------- */
:root {
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Dark is the default because the render behind these controls is dark in
     both themes: every object's background gradient is near black by design,
     since an emissive measure has to be shown against something that is not
     emitting. The light theme therefore does not turn the panel white, it
     lightens the panel and swaps the accent to the light ramp's red. */
  --ink: #ece7e6;          /* warm-100 */
  --dim: #b3a9a7;          /* warm-250 */
  --live: #ff6a4f;         /* red-dark-ink, 5.4:1 on this panel */
  --fill: #8f1f1c;         /* red-dark-fill, white label 8.82:1 */
  --fill-hi: #b62b28;      /* red-dark-fill-hi */
  --on-fill: #ffffff;
  --rule: rgba(236, 231, 230, 0.16);
  --panel: rgba(13, 10, 10, 0.74);      /* warm-950 */
  --panel-2: rgba(13, 10, 10, 0.42);
}
:root[data-vp-theme="light"] {
  --ink: #f4f1f0;
  --dim: #c9c0be;
  --live: #ff8f78;         /* the light ramp's #930000 is unreadable on a dark render */
  --fill: #930000;         /* main_color_light, the site's resting button fill */
  --fill-hi: #c20000;      /* main_color_very_light */
  --on-fill: #ffffff;
  --rule: rgba(255, 255, 255, 0.22);
  --panel: rgba(48, 20, 20, 0.72);
  --panel-2: rgba(48, 20, 20, 0.38);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
#gl {
  display: block; width: 100vw; height: 100vh;
  cursor: crosshair;
  /* pan-y and not none, and it is the difference between a page a phone can read and one it
     cannot. `none` gives the canvas every gesture, which is right for a full window demo and
     wrong for one embedded in a page: a finger dragged up the viewer then does nothing at all
     and the reader is stuck at the demo with no way past it. `pan-y` leaves the vertical swipe
     to the page and keeps the horizontal drag and the two finger pinch, which are the two
     gestures this viewer actually uses. */
  touch-action: pan-y;
}

#controls {
  position: fixed; left: 0; top: 0; padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 8px;
  width: 252px; max-width: 66vw;
  background: linear-gradient(160deg, var(--panel), var(--panel) 62%, var(--panel-2) 96%, transparent);
  font: 400 12px/1.45 var(--mono); color: var(--ink);
}
select, button { font: inherit; color: inherit; }
select {
  width: 100%; padding: 6px 8px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
  /* The native dropdown list is drawn by the OS, not by this stylesheet, so its own colours
     come from the page's colour-scheme. Naming it here keeps the open list dark like the
     control that opened it instead of a white sheet over a dark render. */
  color-scheme: dark;
}
select:hover { border-color: var(--live); }
button {
  padding: 6px 10px; border-radius: 3px; cursor: pointer; letter-spacing: .06em;
  text-transform: uppercase; font-size: 11px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
}
button:hover:not(:disabled) { border-color: var(--live); color: var(--live); }
button[data-on="1"] {
  background: var(--fill); border-color: var(--fill); color: var(--on-fill);
}
button[data-on="1"]:hover { background: var(--fill-hi); border-color: var(--fill-hi); color: var(--on-fill); }
button:disabled { opacity: 0.38; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--live); outline-offset: 1px;
}

/* ---- the two switches --------------------------------------------------------
   Both of these were plain buttons whose LABEL carried the state, and both were
   read the wrong way round for the same reason. A button that says "Show
   Gaussians" reads as an ACTION, so nothing on it said whether the mode was
   currently on; a button that says "Gaussian splats" while Gaussian splats are on
   screen reads as an offer to switch TO them. A sliding switch has no such
   ambiguity: the knob is on one side or the other, and the side it is on is the
   state, which is why every settings panel in the world uses one.

   The whole row is the button, so the pointer target is the width of the panel
   rather than a thirty pixel pill, and pressing the label works as well as
   pressing the track. The spans are pointer-events: none so every press is
   reported by the button itself and there is no dead zone between them.
   --------------------------------------------------------------------------- */
.sw {
  display: flex; align-items: center; gap: 9px; width: 100%;
  text-align: left; text-transform: none; letter-spacing: .03em; font-size: 11.5px;
}
.sw > span { pointer-events: none; }
.sw-l { flex: 1 1 auto; }
.sw-r { flex: 0 0 auto; min-width: 2.1em; }
/* The centred variant, for a switch between two named things rather than between on and off:
   the two labels take equal space, so the track sits in the middle with one on each side. */
.sw-mid .sw-l { flex: 1 1 0; text-align: right; }
.sw-mid .sw-r { flex: 1 1 0; min-width: 0; text-align: left; }
/* Whichever side is live is in the ink colour and the other is dimmed, so the labels carry the
   state too and the switch is still readable to someone who cannot see the knob move. */
.sw[data-on="0"] .sw-l, .sw[data-on="1"] .sw-r { color: var(--ink); }
.sw[data-on="0"] .sw-r, .sw[data-on="1"] .sw-l { color: var(--dim); }
/* The track, in fixed pixels rather than em, because it is a switch and not text. */
.sw-t {
  flex: 0 0 auto; position: relative; width: 30px; height: 15px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.16); border: 1px solid var(--rule);
  transition: background 120ms linear, border-color 120ms linear;
}
.sw-t::after {
  content: ""; position: absolute; top: 1px; left: 1px; width: 11px; height: 11px;
  border-radius: 50%; background: var(--ink);
  transition: transform 120ms ease, background 120ms linear;
}
.sw[data-on="1"] .sw-t { background: var(--fill); border-color: var(--fill); }
.sw[data-on="1"] .sw-t::after { transform: translateX(15px); background: var(--on-fill); }
/* The panel's filled-button rule is for a button that lights up while it is on. A switch says
   that with its knob, so the row itself stays the resting colour in both states. */
button.sw[data-on="1"] {
  background: rgba(0, 0, 0, 0.55); border-color: var(--rule); color: var(--ink);
}
button.sw:hover:not(:disabled) { border-color: var(--live); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .sw-t, .sw-t::after { transition: none; } }

/* A slider row: the label and its value on top, the track under them. `.ctl-run` puts a
   square play/pause button to the left of the whole thing, which is what makes the speed
   control one line instead of two stacked controls. */
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: baseline; }
.ctl span { color: var(--dim); font-size: 10.5px; letter-spacing: .10em; text-transform: uppercase; }
.ctl output { color: var(--live); font-variant-numeric: tabular-nums; }
/* The track is drawn rather than left to `accent-color` alone. accent-color tints the FILLED
   part and the thumb and leaves the empty part the platform's own near white, which on a panel
   floating over a dark render is a bright bar across every control and was the loudest thing in
   the frame. */
.ctl input[type="range"] {
  grid-column: 1 / -1; display: block; width: 100%; margin: 0; height: 16px;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
.ctl input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.20);
}
.ctl input[type="range"]::-moz-range-track {
  height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.20);
}
.ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--fill-hi); border: 1px solid var(--rule);
}
.ctl input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--fill-hi); border: 1px solid var(--rule);
}
/* ---- the speed track's two marks --------------------------------------------
   A DEFAULT MARK AND A CHANGE OF SCALE, and both are read off the same mapping
   the handle uses, through two custom properties set in src/70_ui.js.

   The tick is at speed 1. It is a MARK AND NOT A DETENT: the handle slides past
   it without catching, because a control that snaps to its default cannot be
   used to sit just beside the default, which is most of what a speed control is
   for (2026-08-12: "It shouldn't snap to it when you slide, but definitely, I
   want to see a marker").

   Past the knee the track lightens, and that is the only honest way to draw what
   is happening there: the last third of the travel is worth 2x to 64x, so equal
   distances stop meaning equal changes and the track should not go on looking
   like they do. */
.trk { grid-column: 1 / -1; position: relative; display: block; line-height: 0; padding-bottom: 5px; }
.trk .tick {
  /* UNDER the track and not across it. Across it, the mark is covered by the handle at exactly the
     value it marks, which is the one position where a viewer looks for it to confirm where they
     are. The input is 16px tall and the handle is 14, so there is no room inside it for a mark the
     handle cannot reach. */
  position: absolute; top: 15px; width: 2px; height: 5px; pointer-events: none;
  background: var(--ink); opacity: .8;
  /* The travel is inset by half a thumb at each end, which is where the 7px and
     the 14px come from: the thumb is 14px wide. */
  left: calc(6px + var(--spd-def) * (100% - 14px));   /* less half the mark, to centre it */
}
#s-rate::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.20) 0 var(--spd-knee),
                                     rgba(255, 255, 255, 0.44) var(--spd-knee) 100%);
}
#s-rate::-moz-range-track {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.20) 0 var(--spd-knee),
                                     rgba(255, 255, 255, 0.44) var(--spd-knee) 100%);
}
/* The value is a text field that looks like a number, because the slider stops
   at 64 and the renderer does not: measured, the dragon reaches 10^2084 at speed
   1000 with a position error of 0.000 px. Click it and type. */
.ctl output.edit { cursor: text; outline: none; border-bottom: 1px dotted var(--rule); }
.ctl output.edit:hover, .ctl output.edit:focus { border-bottom-color: var(--live); }
.ctl output.edit:focus { color: var(--ink); }
.ctl input[type="range"]:hover::-webkit-slider-thumb { background: var(--live); }
.ctl input[type="range"]:hover::-moz-range-thumb { background: var(--live); }
.ctl-row { display: flex; gap: 8px; align-items: stretch; }
.ctl-row .ctl { flex: 1 1 0; min-width: 0; }
/* The run button is square and the same height as the two line slider next to it. */
#btn-run {
  flex: 0 0 auto; width: 34px; padding: 0; font-size: 13px; line-height: 1;
  display: grid; place-items: center;
}
/* The family parameter belongs to the Julia set, the exponent to both plane objects,
   and neither means anything for an iterated function system. */
#controls:not([data-julia="1"]) .julia-only { display: none; }
#controls:not([data-kind="plane"]) .plane-only { display: none; }

/* ---- the readout ------------------------------------------------------------
   Three numbers always: splats, frame time, resolution. That is the project's
   rule and it is also all a viewer wants while watching. The zoom, the cut
   breakdown, the buffer format and the hardware string are all real and all
   answer a question nobody is asking during a descent, so they live behind the
   info button and are off by default. */
#sound {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 7px 40px 8px 12px;
  display: flex; flex-wrap: wrap; gap: 0 16px; pointer-events: none;
  background: linear-gradient(0deg, var(--panel), var(--panel-2) 62%, transparent);
  font: 400 11px/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink);
}
#sound span { white-space: nowrap; }
#sound i { font-style: normal; color: var(--dim); }
#sound b { font-weight: 400; color: var(--live); }
#sound b[data-warn="1"] { color: #ff7a5f; }
#sound .more { flex-basis: 100%; white-space: normal; color: var(--dim); }
/* ---- the progress bar --------------------------------------------------------
   Only the escape time objects have it, and only because only they are slow
   enough to need one: a plane cut is 0.4 to 8 seconds of one CPU thread and the
   sharpening ramp that follows it runs for twenty five, so without this the
   viewer sees a picture quietly improving with nothing to say whether more is
   coming or whether that is all there is (2026-08-12: "I also think the
   Mandelbrot and Julia set should have some sort of loading bars").

   It is a THIN RULE and not a widget. It sits in the readout strip, in the
   readout's own colours, and it disappears the moment there is nothing left to
   wait for, because a progress bar that is always on screen stops being read.
   The track is drawn at low contrast so an empty bar is not mistaken for a
   full one. */
#prog { display: flex; align-items: center; gap: 7px; flex-basis: 100%; }
#prog[hidden] { display: none; }
#prog i { font-style: normal; color: var(--dim); }
#prog .track {
  flex: 1 1 auto; max-width: 260px; height: 3px; border-radius: 2px;
  background: rgba(255, 255, 255, 0.14); overflow: hidden;
}
#prog .track b {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background: var(--live); transition: width .12s linear;
}
#sound .more b { color: var(--ink); }
#controls:not([data-info="1"]) ~ #sound .more { display: none; }
#btn-info {
  /* Outside #controls, so it inherits from the document rather than from the panel and came out
     black on black. Both colours are named here. */
  color: var(--ink); background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
  position: fixed; right: 8px; bottom: 7px; z-index: 2;
  width: 24px; height: 24px; padding: 0; border-radius: 50%;
  font: 400 13px/1 var(--mono); text-transform: none; letter-spacing: 0;
  display: grid; place-items: center;
}
/* ---- the magnified squares' captions ----------------------------------------
   Text, over a canvas that has no text in it. There is no font in this renderer
   and no reason to add one for two labels and a sentence, so these are ordinary
   elements positioned from the same rectangles the squares are drawn in; see
   loupeNote in src/60_gl.js, and mind that those rectangles are in DEVICE pixels.

   The sentence is the point of the whole block. The readout says sixteen
   thousand splats in this mode and three hundred and forty thousand out of it,
   and a viewer who is not told why can only conclude that one of the two is a
   lie. Shortened to one line on 2026-08-12 at Marcel's wording: four lines of
   monospace beside a magnified square is a paragraph where a label is wanted. */
#loupe-note {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  font: 400 10.5px/1.35 var(--mono);
}
#loupe-note[hidden] { display: none; }
#loupe-note .lz {
  position: absolute; font-weight: 400; letter-spacing: .08em; color: var(--ink);
  background: rgba(0, 0, 0, 0.80); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0 4px 1px;
}
#loupe-note .lz[hidden] { display: none; }
/* On its own chip, because it lands ON the render and the render can be anything from black to
   a field of saturated colour. A text shadow is not enough against the second of those. */
#lcap {
  position: absolute; color: var(--ink); text-align: right; text-wrap: balance;
  background: rgba(0, 0, 0, 0.80); border: 1px solid var(--rule); border-radius: 2px;
  padding: 3px 5px 4px;
}
#lcap[hidden] { display: none; }
@media (max-width: 620px) { #loupe-note { font-size: 9.5px; } #lcap { display: none; } }

#nogl {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 30px;
  text-align: center; color: #ff7a5f; font: 400 14px/1.6 var(--mono); background: #05070b;
}
#nogl[hidden] { display: none; }
/* Narrow windows, which on this page means a phone. The readout is the first thing to give:
   it is a rule of this project that the numbers are on screen, not that all of them are, and a
   line of monospace that runs off the edge reports nothing at all. */
@media (max-width: 620px) {
  #controls { width: 178px; padding: 8px 9px 10px; gap: 6px; font-size: 11px; }
  #sound { font-size: 10px; gap: 0 10px; padding: 6px 36px 7px 9px; }
  #sound .narrow-hide { display: none; }
}
</style>

<canvas id="gl"></canvas>

<div id="controls" data-kind="plane" data-julia="0" data-info="0">
  <select id="preset" aria-label="object"></select>
  <!-- What the machine is allowed to spend. Auto measures the frame time and steps itself down;
       anything else is the viewer's decision and is then left alone. -->
  <select id="quality" aria-label="quality">
    <option value="auto">Quality: auto</option>
    <option value="low">Quality: low</option>
    <option value="medium">Quality: medium</option>
    <option value="high">Quality: high</option>
  </select>
  <!-- Coarsen the cut until the individual splats are tens of pixels across and draw each one's
       one sigma contour. Works on every object, flat or not. This is here because every frame on
       this page is made of Gaussians and at a working split threshold not one of them is
       separable, which is what the refinement is for and is also why nobody has to believe it.
       Keyboard: g. -->
  <button id="btn-gauss" class="sw" type="button" role="switch" aria-checked="false"
          aria-label="show Gaussians"><span class="sw-l">Show Gaussians</span><span class="sw-t"></span><span class="sw-r" id="lb-gauss">off</span></button>
  <!-- The flight never stops, so the slowest setting is slow, not stopped. The square button to
       the left of the slider is what stops it, and it sits there rather than on its own row
       because a play control and a speed control are one thought. Keyboard: space. -->
  <div class="ctl-row">
    <button id="btn-run" data-on="1" type="button" aria-label="pause">&#9208;</button>
    <label class="ctl"><span>speed</span><output id="v-rate" class="edit" contenteditable="true"
             inputmode="decimal" spellcheck="false" role="textbox" tabindex="0"
             title="click to type a speed">-</output>
      <!-- The range is the slider's POSITION, not the speed: the scale is linear to 2 and
           geometric to 64 above it, and both pieces are in spdFromPos in src/70_ui.js. -->
      <span class="trk"><input id="s-rate" type="range" min="0" max="1" step="0.001"
             aria-label="speed"><i class="tick"></i></span></label>
  </div>
  <label class="ctl plane-only"><span>exponent</span><output id="v-power">-</output>
    <input id="s-power" type="range" min="2" max="8" step="1" aria-label="exponent"></label>
  <!-- The family parameter, as two sliders on one line. c is ONE complex number and splitting it
       across two rows read as two unrelated settings. The ranges are the interesting ones and not
       the representable ones: outside about |c| = 1 every Julia set of this family is a totally
       disconnected dust that looks the same as the last one, so the sliders stop where the
       structure does. -->
  <div class="ctl-row julia-only">
    <label class="ctl"><span>re</span><output id="v-cx">-</output>
      <input id="s-cx" type="range" min="-1.45" max="0.42" step="0.001" aria-label="c real"></label>
    <label class="ctl"><span>im</span><output id="v-cy">-</output>
      <input id="s-cy" type="range" min="-0.95" max="0.95" step="0.001" aria-label="c imaginary"></label>
  </div>
  <!-- LAST, and on purpose. The same view, drawn the other way. It is not a fifth object and it is
       not in the object menu, because a menu entry cannot answer "is the splat render as good as a
       per pixel one": choosing it from a list reframes the camera, and then the two images are of
       different places. This keeps the camera, the aim, the zoom and the family parameter exactly
       where they are and swaps only the representation, so the comparison is a flicker between two
       frames of one view. It sits at the bottom because it is the last question anyone asks about a
       picture, after they have found a picture worth asking about. Keyboard: x. -->
  <button id="btn-rep" class="sw sw-mid plane-only" type="button" role="switch"
          aria-checked="false" aria-label="draw this view per pixel instead of as splats"><span class="sw-l">Splats</span><span class="sw-t"></span><span class="sw-r">Pixels</span></button>
</div>

<!-- Splat count, frame time and resolution, every time. That is a rule of this project rather
     than a feature of the page: a render with no numbers on it cannot be compared with anything.
     The second row says WHERE the work happens and what the cut cost, and it is behind the info
     button because it answers a question nobody has while watching. -->
<div id="sound">
  <span><i id="l-splats">splats</i> <b id="h-splats">-</b></span>
  <span><i>frame</i> <b id="h-ms">-</b></span>
  <span class="narrow-hide"><i>res</i> <b id="h-res">-</b></span>
  <span class="more"><i>object</i> <b id="h-object">-</b> &nbsp; <i>zoom</i> <b id="h-zoom">-</b>
    &nbsp; <i>fps</i> <b id="h-fps">-</b> &nbsp; <i>depth</i> <b id="h-depth">-</b>
    &nbsp; <i>pos err</i> <b id="h-err">-</b> &nbsp; <i>buffer</i> <b id="h-fmt">-</b></span>
  <span class="more"><i>cut</i> <b id="h-cut">-</b> &nbsp; <b id="h-extra">-</b></span>
  <span class="more"><i>raster</i> <b id="h-gpu">-</b></span>
  <!-- Shown only while an escape time object still has work to do. See progress() in
       src/70_ui.js for what the two states measure. -->
  <div id="prog" hidden><i id="prog-l">building</i><span class="track"><b id="prog-b"></b></span></div>
</div>
<button id="btn-info" type="button" aria-label="more numbers" title="more numbers">i</button>

<!-- Captions for the two magnified squares. Positioned by loupeNote in src/70_ui.js's frame loop
     and hidden whenever the squares are not on screen. -->
<div id="loupe-note" hidden>
  <b class="lz" id="lz0"></b><b class="lz" id="lz1"></b>
  <span id="lcap">Reduced nr. of Gaussians for visibility</span>
</div>

<div id="nogl" hidden>
  This needs WebGL 2. Every current desktop browser has it; if you are seeing this,
  hardware acceleration is probably switched off.
</div>

<script>
/* ==== src/10_math.js ================================================== */
'use strict';
/* ---------------------------------------------------------------------------
   Fractal splats. Two kinds of object, one renderer.

   1. An affine IFS drawn as its own exact level of detail hierarchy. Gaussians
      are closed under affine maps,

          w(x) = A x + b        =>        w * N(mu, S) = N(A mu + b, A S A^T)

      exactly, so every splat is the exact pushforward of its parent and there
      is no hierarchy to build and nothing to train.

   2. A distance estimated terrain over the Mandelbrot set, drawn as surfels.
      Height is the distance estimate itself, which makes the terrain invariant
      under zoom: magnify by ten and both the horizontal and the vertical scale
      shrink by ten, so the relief keeps its character forever.

   Each frame walks a cut through the relevant tree, splitting whatever is
   larger than a few pixels and stopping where it is not, under a fixed budget.
   --------------------------------------------------------------------------- */

/* ========================== linear algebra (f64) ========================== */
// 3x3 matrices are row-major Float64Array(9). Covariances are sym6:
// [xx, xy, xz, yy, yz, zz].

function mat3Mul(a, b, out) {
  const o = out || new Float64Array(9);
  for (let r = 0; r < 3; r++) {
    const a0 = a[r * 3], a1 = a[r * 3 + 1], a2 = a[r * 3 + 2];
    o[r * 3]     = a0 * b[0] + a1 * b[3] + a2 * b[6];
    o[r * 3 + 1] = a0 * b[1] + a1 * b[4] + a2 * b[7];
    o[r * 3 + 2] = a0 * b[2] + a1 * b[5] + a2 * b[8];
  }
  return o;
}

// a * b^T. Used to take the cut's own frame to the eye across a rebase.
function mat3MulT(a, b, out) {
  const o = out || new Float64Array(9);
  for (let r = 0; r < 3; r++) {
    const a0 = a[r * 3], a1 = a[r * 3 + 1], a2 = a[r * 3 + 2];
    o[r * 3]     = a0 * b[0] + a1 * b[1] + a2 * b[2];
    o[r * 3 + 1] = a0 * b[3] + a1 * b[4] + a2 * b[5];
    o[r * 3 + 2] = a0 * b[6] + a1 * b[7] + a2 * b[8];
  }
  return o;
}

function mat3Vec(a, v, out) {
  const o = out || new Float64Array(3);
  const x = v[0], y = v[1], z = v[2];
  o[0] = a[0] * x + a[1] * y + a[2] * z;
  o[1] = a[3] * x + a[4] * y + a[5] * z;
  o[2] = a[6] * x + a[7] * y + a[8] * z;
  return o;
}

function rotAxis(ax, ay, az, deg) {
  const n = Math.hypot(ax, ay, az) || 1;
  const x = ax / n, y = ay / n, z = az / n;
  const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t), k = 1 - c;
  return new Float64Array([
    c + x * x * k,     x * y * k - z * s, x * z * k + y * s,
    y * x * k + z * s, c + y * y * k,     y * z * k - x * s,
    z * x * k - y * s, z * y * k + x * s, c + z * z * k,
  ]);
}

// Inverse of a symmetric 3x3 held as sym6. Returns null if singular.
function sym3Inv(s) {
  const s0 = s[0], s1 = s[1], s2 = s[2], s3 = s[3], s4 = s[4], s5 = s[5];
  const c00 = s3 * s5 - s4 * s4;
  const c01 = s4 * s2 - s1 * s5;
  const c02 = s1 * s4 - s3 * s2;
  const det = s0 * c00 + s1 * c01 + s2 * c02;
  if (!isFinite(det) || Math.abs(det) < 1e-300) return null;
  const id = 1 / det;
  return new Float64Array([
    c00 * id, c01 * id, c02 * id,
    (s0 * s5 - s2 * s2) * id, (s1 * s2 - s0 * s4) * id, (s0 * s3 - s1 * s1) * id,
  ]);
}

function det3(a) {
  return a[0] * (a[4] * a[8] - a[5] * a[7]) -
         a[1] * (a[3] * a[8] - a[5] * a[6]) +
         a[2] * (a[3] * a[7] - a[4] * a[6]);
}

// Solve (I - A) x = b. That x is the fixed point of w(x) = Ax + b, and for a
// contraction it lies exactly on the attractor.
function solveFixedPoint(A, b) {
  const m = [
    [1 - A[0], -A[1], -A[2], b[0]],
    [-A[3], 1 - A[4], -A[5], b[1]],
    [-A[6], -A[7], 1 - A[8], b[2]],
  ];
  for (let c = 0; c < 3; c++) {
    let piv = c;
    for (let r = c + 1; r < 3; r++) if (Math.abs(m[r][c]) > Math.abs(m[piv][c])) piv = r;
    if (Math.abs(m[piv][c]) < 1e-14) return null;
    const t = m[c]; m[c] = m[piv]; m[piv] = t;
    for (let r = 0; r < 3; r++) {
      if (r === c) continue;
      const f = m[r][c] / m[c][c];
      for (let k = c; k < 4; k++) m[r][k] -= f * m[c][k];
    }
  }
  return [m[0][3] / m[0][0], m[1][3] / m[1][1], m[2][3] / m[2][2]];
}

/* ================================ colour ================================= */
// Oklab, and it is here for one job: generating a colour ramp from a formula instead of
// choosing one. Bjorn Ottosson's 2020 construction, which is a cube root LMS space fitted so
// that a straight line in it is a straight line to the eye. What that buys is that "advance
// the hue at a constant rate and swing the lightness twice per turn" means what it says: in
// HSV the same instruction gives a ramp whose yellows are twice as bright as its blues and
// whose greens occupy a third of the circle.
function oklabToLinear(L, a, b) {
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
         -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
         -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
function inGamut(c) {
  return c[0] >= -1e-4 && c[1] >= -1e-4 && c[2] >= -1e-4 &&
         c[0] <= 1.0001 && c[1] <= 1.0001 && c[2] <= 1.0001;
}
// Oklch to linear sRGB, with the chroma reduced until the colour exists.
//
// Clipping the CHANNELS instead is the obvious thing and it is wrong in a way that shows: a
// colour outside the gamut clipped per channel keeps its requested lightness and loses its
// hue, so a ramp built that way has hue plateaus wherever it asked for more chroma than the
// display has. Holding L and h and bisecting on C keeps the hue exactly and gives up only the
// saturation that was never available, which is the one degree of freedom nobody can see the
// loss of. Twenty four bisections is a part in sixteen million of chroma, at load, once.
function oklchToRgb(L, C, hdeg) {
  const h = hdeg * Math.PI / 180, ch = Math.cos(h), sh = Math.sin(h);
  let lo = 0;
  if (inGamut(oklabToLinear(L, C * ch, C * sh))) lo = C;
  else {
    let hi = C;
    for (let k = 0; k < 24; k++) {
      const m = 0.5 * (lo + hi);
      if (inGamut(oklabToLinear(L, m * ch, m * sh))) lo = m; else hi = m;
    }
  }
  const c = oklabToLinear(L, lo * ch, lo * sh);
  for (let i = 0; i < 3; i++) c[i] = c[i] < 0 ? 0 : (c[i] > 1 ? 1 : c[i]);
  return c;
}

/* ============================ the splat kernel =========================== */
// The rendered footprint is a super Gaussian,
//
//     k(x) = exp(-0.5 * (s * q)^(beta/2)),      q = x^T Sigma2D^-1 x
//
// with beta = 2 the ordinary Gaussian. Higher beta flattens the top and
// steepens the shoulder, which is a better fit to what a splat stands for
// here: the restriction of a fractal measure to one compactly supported piece
// of itself, which is roughly flat over the piece and zero outside it, not a
// Gaussian. The Gaussian tail is the reason a naive splat cloud looks blurred.
//
// s is chosen so the second moment of the kernel is still Sigma2D. Sharpening
// is then a change of shape only, never a quiet shrink, so the covariance the
// IFS produces is still the covariance that gets drawn.

function gammaFn(x) {
  // Lanczos, g = 7. Only ever called with small positive arguments.
  const g = [0.99999999999980993, 676.5203681218851, -1259.1392167224028,
    771.32342877765313, -176.61502916214059, 12.507343278686905,
    -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gammaFn(1 - x));
  x -= 1;
  let a = g[0];
  const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += g[i] / (x + i);
  return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
}

// For exp(-0.5 r^beta) in the plane:
//   integral of r^k dr = 2^((k+1)/beta) / beta * Gamma((k+1)/beta)
// so the area factor is K = 2^(2/beta) Gamma(2/beta) / beta and the mean square
// radius is m2 = 2^(2/beta) Gamma(4/beta) / Gamma(2/beta).
function kernelConst(beta) {
  const b = Math.max(1.2, Math.min(8, beta));
  const K = Math.pow(2, 2 / b) * gammaFn(2 / b) / b;
  const m2 = Math.pow(2, 2 / b) * gammaFn(4 / b) / gammaFn(2 / b);
  const shape = m2 / 2;                       // so E[q] = 2, as for a Gaussian
  const rcut = Math.pow(13.8, 1 / b);         // kernel below 1e-3
  return {
    beta: b,
    shape,
    knorm: shape / (2 * Math.PI * K),         // peak = w * gain * knorm / sqrt(det)
    extent: rcut / Math.sqrt(shape),          // quad half size, in sigma
  };
}

/* ============================== IFS objects ============================== */
// A map is {A, b, p, cc}. `spec` builds one from a readable description:
//   scale: number or [sx,sy,sz], rots: [[ax,ay,az,deg], ...], t: [x,y,z]
// Rotations listed later are applied further out, so `rots: [[z,45],[x,20]]`
// means rotX(20) * rotZ(45) * diag(scale).

function spec(o) {
  let A = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
  for (const r of (o.rots || [])) A = mat3Mul(rotAxis(r[0], r[1], r[2], r[3]), A);
  const s = o.scale;
  const sv = typeof s === 'number' ? [s, s, s] : s;
  const B = new Float64Array(9);              // A diag(sv): scale, then rotate
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) B[r * 3 + c] = A[r * 3 + c] * sv[c];
  return { A: B, b: new Float64Array(o.t), p: o.p === undefined ? 1 : o.p, cc: o.cc };
}

  // self similar set at the fixed point of a word u multiplies the picture by that word's own
  // complex multiplier every time, so if the multiplier has a rotation the picture TURNS as it
  // magnifies and the descent is a logarithmic spiral rather than a straight magnification.

  // scaling. These do:

              [0.36, 0.96, 0.58], [0.86, 0.98, 0.32], [1.00, 0.62, 0.24]],
    bg: [[0.014, 0.012, 0.018], [0.030, 0.026, 0.040]],
    view: { splitPx: 0.55, budget: 280000, density: 1.4, glow: 0.24, kernel: 3.4, sigma: 1.25,
            fog: 0.60, yaw: 0, pitch: -1.5708 },
    maps: (() => {
      const out = [];
      let k = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        if (i === 0 && j === 0) continue;     // the hole
        out.push(spec({
          scale: 1 / 3, t: [i * 2 / 3, 0, j * 2 / 3], p: 1 / 8, cc: (k + 0.5) / 8,
        }));
        k++;
      }
      return out;
    })(),
  },

};

/* -------------------- per map facts the kernel relies on ----------------- */
// scalar:    A = s I, so the pushforward takes a 24 multiply path instead of 81
// conformal: A = s R with R orthogonal, so the map scales distance uniformly.
//            Rebasing the whole scene into a child frame (see `rebase`) is only
//            exact when every map is conformal, because otherwise the map shears
//            the camera as well as the object.
function prepareMaps(ms) {
  let sum = 0; for (const m of ms) sum += m.p;
  for (const m of ms) {
    m.p /= sum;
    const A = m.A, s = A[0];
    m.scalar = (Math.abs(A[4] - s) < 1e-15 && Math.abs(A[8] - s) < 1e-15 &&
      Math.abs(A[1]) + Math.abs(A[2]) + Math.abs(A[3]) +
      Math.abs(A[5]) + Math.abs(A[6]) + Math.abs(A[7]) < 1e-15);
    m.s = s;
    // |det A|^(1/3) is the uniform scale factor of the map by volume.
    m.scale = Math.pow(Math.abs(det3(A)), 1 / 3);
    // A A^T = scale^2 I to within a tolerance?
    let off = 0, dev = 0;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      let v = 0;
      for (let k = 0; k < 3; k++) v += A[r * 3 + k] * A[c * 3 + k];
      if (r === c) dev = Math.max(dev, Math.abs(v - m.scale * m.scale));
      else off = Math.max(off, Math.abs(v));
    }
    m.conformal = (off < 1e-12 && dev < 1e-12 * Math.max(1, m.scale * m.scale));
    m.inv = mat3Inv(m.A);
  }
}

function mat3Inv(a) {
  const c = new Float64Array(9);
  c[0] = a[4] * a[8] - a[5] * a[7];
  c[1] = a[2] * a[7] - a[1] * a[8];
  c[2] = a[1] * a[5] - a[2] * a[4];
  c[3] = a[5] * a[6] - a[3] * a[8];
  c[4] = a[0] * a[8] - a[2] * a[6];
  c[5] = a[2] * a[3] - a[0] * a[5];
  c[6] = a[3] * a[7] - a[4] * a[6];
  c[7] = a[1] * a[6] - a[0] * a[7];
  c[8] = a[0] * a[4] - a[1] * a[3];
  const d = a[0] * c[0] + a[1] * c[3] + a[2] * c[6];
  if (!isFinite(d) || Math.abs(d) < 1e-300) return null;
  for (let i = 0; i < 9; i++) c[i] /= d;
  return c;
}

/* --------------------------- words and their maps ------------------------ */
// The composed map of a branch word u = (i1 ... in), with each new map on the
// inside: F_u = w_i1 o w_i2 o ... o w_in, so M = A_i1 A_i2 ... A_in and
// t = b_i1 + A_i1 b_i2 + A_i1 A_i2 b_i3 + ...
function wordMap(ms, word) {
  const M = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
  const t = new Float64Array(3);
  const q = new Float64Array(3);
  for (const i of word) {
    const m = ms[i];
    mat3Vec(M, m.b, q);
    t[0] += q[0]; t[1] += q[1]; t[2] += q[2];
    M.set(mat3Mul(M, m.A));
  }
  return { M, t };
}

// The fixed point of F_u lies in F_u(A), the piece named by u, and is exactly on
// the attractor. It is also the point whose address is u repeated forever.
//
// This is computed from the word every time it is needed and never carried
// forward numerically, and that is not fastidiousness. Rebasing applies the
// INVERSE of a map, which expands, so any error in a transported point is
// multiplied by 1/s at every step: with s = 1/3 an initial 1e-16 reaches order
// one after 34 rebases and the camera aims at nothing. Measured, not guessed.
// Recomputing from the word costs a 3x3 solve and is exact at any depth.
function fixWord(ms, word) {
  const wm = wordMap(ms, word);
  return solveFixedPoint(wm.M, wm.t);
}

// Consuming the first letter of a periodic word leaves the word rotated, so the
// aim point in the new frame is the fixed point of the rotation.
function rotateWord(word, k) {
  const n = word.length;
  const out = new Array(n);
  for (let i = 0; i < n; i++) out[i] = word[(i + k) % n];
  return out;
}

/* ===================== invariant measure of the IFS ====================== */
// The root splat is the Gaussian matching the mean and covariance of the
// invariant measure. Both follow from fixed point iteration on the moments:
//   mu = sum_i p_i (A_i mu + b_i)
//   S  = sum_i p_i (A_i S A_i^T + (A_i mu) b_i^T + b_i (A_i mu)^T + b_i b_i^T)
function rootMoments(maps) {
  let mu = new Float64Array(3);
  let S = new Float64Array(9);
  const Am = new Float64Array(3);
  for (let it = 0; it < 400; it++) {
    const mu2 = new Float64Array(3);
    const S2 = new Float64Array(9);
    for (const m of maps) {
      const A = m.A, b = m.b, p = m.p;
      mat3Vec(A, mu, Am);
      mu2[0] += p * (Am[0] + b[0]);
      mu2[1] += p * (Am[1] + b[1]);
      mu2[2] += p * (Am[2] + b[2]);
      const AS = mat3Mul(A, S);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        let v = 0;
        for (let k = 0; k < 3; k++) v += AS[r * 3 + k] * A[c * 3 + k];   // (A S A^T)_rc
        v += Am[r] * b[c] + b[r] * Am[c] + b[r] * b[c];
        S2[r * 3 + c] += p * v;
      }
    }
    mu = mu2; S = S2;
  }
  const cov = new Float64Array(6);
  cov[0] = S[0] - mu[0] * mu[0];
  cov[1] = S[1] - mu[0] * mu[1];
  cov[2] = S[2] - mu[0] * mu[2];
  cov[3] = S[4] - mu[1] * mu[1];
  cov[4] = S[5] - mu[1] * mu[2];
  cov[5] = S[8] - mu[2] * mu[2];
  // Tiny isotropic floor so a planar attractor cannot produce a zero volume
  // covariance. It rides through A S A^T like everything else, so self
  // similarity is preserved exactly.
  const tr = (cov[0] + cov[3] + cov[5]) / 3;
  cov[0] += 1e-7 * tr; cov[3] += 1e-7 * tr; cov[5] += 1e-7 * tr;
  return { mu, cov };
}

// Information dimension of the invariant measure,
//     D = sum p_i log p_i / sum p_i log s_i
// which is the exponent in "measure inside a ball of radius r scales as r^D".
// That is exactly what the exposure law needs: see `measureNorm`.
function measureDimension(maps) {
  let num = 0, den = 0;
  for (const m of maps) { num += m.p * Math.log(m.p); den += m.p * Math.log(m.scale); }
  const D = den < -1e-12 ? num / den : 2;
  return Math.max(0.2, Math.min(3, D));
}

// How far the attractor reaches, measured in Mahalanobis units of the root
// Gaussian. Mahalanobis distance is invariant under affine maps, so one number
// measured at the root is exact at every level of the tree forever. A fixed
// number of sigmas is simply wrong: an elongated attractor reaches past five.
function supportRadius(maps, root) {
  const inv = sym3Inv(root.cov);
  if (!inv) return { maha: 12, euclid: Math.sqrt(root.cov[0] + root.cov[3] + root.cov[5]) * 3 };
  const cum = [];
  let acc = 0;
  for (const m of maps) { acc += m.p; cum.push(acc); }
  let seed = 0x2545f491 | 0;
  const rnd = () => {
    seed ^= seed << 13; seed |= 0;
    seed ^= seed >>> 17;
    seed ^= seed << 5; seed |= 0;
    return (seed >>> 0) / 4294967296;
  };
  let x = root.mu[0], y = root.mu[1], z = root.mu[2], worst = 0, far = 0;
  const N = 40000;
  for (let it = 0; it < N; it++) {
    const u = rnd();
    let j = 0;
    while (j < cum.length - 1 && u > cum[j]) j++;
    const A = maps[j].A, b = maps[j].b;
    const nx = A[0] * x + A[1] * y + A[2] * z + b[0];
    const ny = A[3] * x + A[4] * y + A[5] * z + b[1];
    const nz = A[6] * x + A[7] * y + A[8] * z + b[2];
    x = nx; y = ny; z = nz;
    if (it < 60) continue;                    // let the chaos game settle
    const dx = x - root.mu[0], dy = y - root.mu[1], dz = z - root.mu[2];
    const q = dx * (inv[0] * dx + inv[1] * dy + inv[2] * dz) +
              dy * (inv[1] * dx + inv[3] * dy + inv[4] * dz) +
              dz * (inv[2] * dx + inv[4] * dy + inv[5] * dz);
    if (q > worst) worst = q;
    const e = dx * dx + dy * dy + dz * dz;
    if (e > far) far = e;
  }
  return {
    maha: Math.min(Math.max(Math.sqrt(worst) * 1.15, 3), 30),   // for culling
    euclid: Math.sqrt(far) * 1.04,                              // for framing
  };
}

/* ==== src/30_mandel.js ================================================ */
/* ========================== the Mandelbrot field ========================= */
// z -> z^2 + c from z = 0, with the derivative dz/dc carried alongside. One
// evaluation yields everything the terrain needs:
//
//   escape count    nu = n - log2(log|z| / log B)         smooth, no banding
//   distance        de = 2 |z| log|z| / |dz|              Douady and Hubbard
//   surface normal  from d(log|z|)/dc = conj(dz/z)
//
// The normal comes out analytically, which matters: finite differencing the
// height would cost three evaluations per cell instead of one, and the cost of
// this function is the entire cost of the terrain.
//
// Height is `de` itself. That choice is what makes the terrain survive zoom:
// de is a distance, so it scales exactly like the horizontal coordinate. Zoom
// in by ten and the relief shrinks by ten, and the landscape keeps its
// character forever, with no reference level to drift and nothing to renormalize.

const LOGB = Math.log(1e6);
const BAIL2 = 1e12;                             // |z|^2 bailout, B = 1e6
const LN2 = Math.LN2;

const fld = {
  h: 0, gx: 0, gz: 0,          // height and its gradient in the c plane
  nx: 0, ny: 1, nz: 0,         // world normal, world = (Re c, h, Im c)
  de: 0, nu: 0, inside: 0, iters: 0, edge: 0,
};

// Analytic interior tests for the two largest components. The main cardioid and
// the period two bulb are most of the interior area of the opening view, and
// every cell inside them would otherwise run the full iteration count before
// giving up. Two lines of algebra instead of a few thousand multiplies.
function inMainBody(x, y) {
  const q = (x - 0.25) * (x - 0.25) + y * y;
  if (q * (q + (x - 0.25)) < 0.25 * y * y) return true;
  return (x + 1) * (x + 1) + y * y < 0.0625;
}

function flatCell() {
  fld.h = 0; fld.gx = 0; fld.gz = 0;
  fld.nx = 0; fld.ny = 1; fld.nz = 0;
  fld.de = 0; fld.nu = 0; fld.inside = 1; fld.edge = 0;
}

// rTol is the cell's own half size. Two early exits use it:
//
//  - derivative bailout. de = 2|z|log|z|/|dz| and |dz| only grows once |z| > 1,
//    so |dz| past 2 B log B / rTol already proves de < rTol whatever happens
//    next. A cell that straddles the boundary is exactly the cell that costs
//    thousands of iterations, and this is the verdict we actually wanted from
//    it: too close to the set to be resolved at this size, so split it. It
//    fires around iteration 100 instead of iteration 3000.
//
//  - periodicity. An interior point converges to a cycle. Comparing against a
//    reference refreshed on a doubling schedule catches it in one pass.
// `hc` softly caps the height. The distance estimate is only asymptotically a
// distance: near the boundary it is accurate, but far from the set it overshoots
// badly, by a factor of about three at |c| = 2, and the uncapped exterior comes
// out as a wall several object radii tall. Passing de through de*hc/(de+hc)
// leaves the near boundary region untouched to a fraction of a percent, where all
// the structure is and where every zoom ends up, and flattens the far exterior
// into a plateau. hc is a fixed length in the c plane, a property of the object
// and not of the camera, so the geometry does not move when the camera does.
function mandelField(cx, cz, maxIter, rTol, slope, mode, hc) {
  if (inMainBody(cx, cz)) { flatCell(); fld.iters = 0; return; }
  const dbail = rTol > 0 ? 2 * 1e6 * LOGB / rTol : 1e300;
  const dbail2 = dbail < 1e150 ? dbail * dbail : 1e300;
  let zx = 0, zz = 0, dx = 0, dz = 0;
  let rx = 0, rz = 0, per = 8, chk = 8;
  let n = 0, esc = false, m = 0, cyc = false;
  for (; n < maxIter; n++) {
    const ndx = 2 * (zx * dx - zz * dz) + 1;         // dz' = 2 z dz + 1
    const ndz = 2 * (zx * dz + zz * dx);
    dx = ndx; dz = ndz;
    const nzx = zx * zx - zz * zz + cx;              // z' = z^2 + c
    zz = 2 * zx * zz + cz; zx = nzx;
    m = zx * zx + zz * zz;
    if (m > BAIL2) { n++; esc = true; break; }
    // The derivative test costs three of the twelve multiplies in this loop, and
    // |dz| grows by orders of magnitude per iteration once it is growing at all,
    // so checking one iteration in eight loses nothing and returns the flops.
    if ((n & 7) === 7 && dx * dx + dz * dz > dbail2) {   // proves de < rTol
      fld.iters = n;
      fld.inside = 0; fld.edge = 1;
      fld.de = rTol; fld.nu = 0;
      fld.h = mode === 0 ? slope * rTol : 0;   // hc never binds this close in
      fld.gx = 0; fld.gz = 0;
      fld.nx = 0; fld.ny = 1; fld.nz = 0;
      return;
    }
    if (n > 40) {
      if (Math.abs(zx - rx) + Math.abs(zz - rz) < 1e-16) { cyc = true; break; }   // on a cycle
      if (--chk <= 0) { rx = zx; rz = zz; per += per; chk = per; }
    }
  }
  fld.iters = n;
  // A cycle is a PROOF of interior, and so is the analytic body test above. Running
  // out of iterations is not a proof of anything, and calling it interior is the
  // expensive kind of wrong: the interior is a flat lake coloured almost exactly the
  // background, so every starved cell becomes a hole in the image. Measured on
  // seahorse valley, from 1e8 down every single cell called interior was really
  // exterior that had not escaped yet, and at 1e11 that was 23 percent of the frame.
  //
  // A cell that has not escaped in maxIter steps and has not proven a cycle is very
  // close to the set, since escape time grows without bound as the distance falls. So
  // the honest verdict is the one the derivative bailout already gives: unresolved
  // boundary, at shore height, and split it if it is large enough to matter. Starvation
  // then degrades into slightly fat filigree instead of a black hole.
  if (!esc) {
    if (cyc || n < maxIter) { flatCell(); return; }
    fld.inside = 0; fld.edge = 1;
    fld.de = rTol; fld.nu = 0;
    fld.h = mode === 0 ? slope * rTol : 0;
    fld.gx = 0; fld.gz = 0;
    fld.nx = 0; fld.ny = 1; fld.nz = 0;
    return;
  }

  // The derivative grows like the product of 2|z| along the orbit and can overflow
  // to infinity before the point escapes. Then |dz| is infinite, the unit gradient
  // comes out as Inf/Inf = NaN, and a NaN colour goes into an additive buffer and
  // poisons every pixel the splat touches: the frame comes back dark and wrong with
  // nothing in the geometry to explain it. Treat an overflowed derivative as what it
  // is, a cell too close to the set to resolve.
  const dm = Math.sqrt(dx * dx + dz * dz);
  if (!(dm < 1e300) || !(m < 1e300)) {
    fld.inside = 0; fld.edge = 1;
    fld.de = rTol; fld.nu = 0;
    fld.h = mode === 0 ? slope * rTol : 0;
    fld.gx = 0; fld.gz = 0;
    fld.nx = 0; fld.ny = 1; fld.nz = 0;
    return;
  }
  const lr = 0.5 * Math.log(m);                      // log|z|
  const de = 2 * Math.sqrt(m) * lr / (dm > 1e-300 ? dm : 1e-300);
  const nu = n - Math.log(lr / LOGB) * Math.LOG2E;   // Math.log2 is a slow builtin
  // grad log|z| = (Re(dz/z), -Im(dz/z)), pointing away from the set
  const wr = (dx * zx + dz * zz) / m;
  const wi = (dz * zx - dx * zz) / m;
  let ux = wr, uz = -wi;
  const gm = Math.sqrt(ux * ux + uz * uz);           // Math.hypot guards overflow
  if (gm > 1e-300) { ux /= gm; uz /= gm; } else { ux = 0; uz = 0; }

  fld.de = de; fld.nu = nu; fld.inside = 0; fld.edge = 0;
  if (mode === 0) {
    // Distance height. |grad de| = 1 almost everywhere, because de estimates a
    // distance function, so the slope is constant and the terrain is a cone
    // field over the boundary: uniformly steep faces meeting at creases along
    // the medial axis of the complement. The filigree of the boundary appears
    // as a network of valleys.
    const k = hc > 0 ? hc / (de + hc) : 1;      // soft cap, and its derivative is k^2
    fld.h = slope * de * k;
    fld.gx = slope * k * k * ux; fld.gz = slope * k * k * uz;
  } else {
    // Potential height. nu rises without bound at the boundary, so this is the
    // classic terraced citadel and it is not scale invariant: zoom in and the
    // walls get steeper without limit. Kept because the terraces are the true
    // equipotentials of the set and they are worth seeing.
    const k = slope * 0.11;
    let g = gm / (LN2 * lr);                          // |grad nu|
    if (g > 40) g = 40;
    fld.h = k * nu;
    fld.gx = -k * g * ux; fld.gz = -k * g * uz;       // nu grows inward
  }
  if (!(Math.abs(fld.gx) < 1e150) || !(Math.abs(fld.gz) < 1e150)) { fld.gx = 0; fld.gz = 0; }
  const inv = 1 / Math.sqrt(1 + fld.gx * fld.gx + fld.gz * fld.gz);
  fld.nx = -fld.gx * inv; fld.ny = inv; fld.nz = -fld.gz * inv;
  if (!(fld.h > -1e300 && fld.h < 1e300)) { fld.h = 0; fld.nx = 0; fld.ny = 1; fld.nz = 0; }
}

/* ------------------------- field evaluation cache ------------------------- */
// A cell's field value depends only on the CELL, never on the camera. The quadtree
// always starts from the same root, so (cx, cz) names a cell on a fixed grid of the c
// plane and names it exactly, since every coordinate is the root plus a sum of exact
// binary halvings. The same cells therefore recur in rebuild after rebuild while the
// camera drifts, and a rebuild is triggered by only 4 percent of drift.
//
// Measured at 1e7 in seahorse valley: 961 ms per rebuild, 1388 iterations per cell,
// 189 frames at the 5 ms slice. Nearly all of it is recomputing identical numbers.
//
// Direct mapped, one slot per hash, overwrite on collision, and the full key stored and
// compared. That choice is deliberate: such a cache can only fail to help, never return
// a wrong answer, so the worst case is exactly the cost without it.
//
// The iteration cap belongs to the key, because a cell that merely ran out of
// iterations at one cap can escape at a higher one. The cap grows with depth, so it is
// quantized to steps of 1.3 and the generation is bumped on a step change: six
// invalidations over a nine decade descent instead of one every frame.
const FC_BITS = 20, FC_N = 1 << FC_BITS, FC_MASK = FC_N - 1;
const fcX = new Float64Array(FC_N), fcZ = new Float64Array(FC_N);
const fcH = new Float64Array(FC_N);          // height, kept f64: it is a coordinate
const fcG = new Float32Array(FC_N * 4);      // gx gz de nu, all shading or thresholds
const fcIt = new Float32Array(FC_N);
const fcKind = new Int8Array(FC_N);          // 0 exterior, 1 interior, 2 unresolved
const fcGen = new Int32Array(FC_N);
let fcCur = 1, fcHits = 0, fcMiss = 0;
// Iterations SERVED from the cache, so the reported count can distinguish the work a
// rebuild would have cost from the work it actually did. Without this the two are
// conflated and the numbers stop being consistent with the milliseconds beside them: at
// 1e7 the nominal count is 436 M against a 346 ms rebuild, which would imply an
// impossible 1.3 G iterations a second.
let fcSaved = 0;
const fcBuf = new Float64Array(2);
const fcInt = new Int32Array(fcBuf.buffer);

function fcHash(cx, cz) {
  fcBuf[0] = cx; fcBuf[1] = cz;
  let h = Math.imul(fcInt[0], 0x9e3779b1) ^ Math.imul(fcInt[1], 0x85ebca6b) ^
          Math.imul(fcInt[2], 0xc2b2ae35) ^ Math.imul(fcInt[3], 0x27d4eb2f);
  h ^= h >>> 15; h = Math.imul(h, 0x2545f491); h ^= h >>> 13;
  return h & FC_MASK;
}

// Everything the field's OUTPUT depends on besides the cell itself: the quantized
// iteration cap, the relief scale, the height mode and the soft cap length. Folded into
// one non zero stamp, compared per slot, so a change invalidates without clearing 45 MB.
function fcStamp(mstep, relief, hmode, hc) {
  let g = Math.imul(mstep + 1, 1000003) ^ (hmode ? 0x5bd1e995 : 0x1b873593);
  fcBuf[0] = relief; g = Math.imul(g ^ fcInt[0], 0x85ebca6b) ^ fcInt[1];
  fcBuf[0] = hc;     g = Math.imul(g ^ fcInt[0], 0xc2b2ae35) ^ fcInt[1];
  return g | 1;
}

// Same signature and same contract as mandelField, including writing `fld`. Used only
// by the quadtree: projectToBoundary deliberately calls mandelField directly, because it
// evaluates with rTol = 0, which disables the derivative bailout and so is a different
// question about the same point.
// Four way, by linear probing inside a group of four consecutive slots. Strictly one
// slot per hash was collision limited rather than capacity limited: with 283 000 live
// cells in 1 048 576 slots the load is only 0.27, but the chance that a given key's slot
// has been taken by another key is 1 - exp(-0.27) = 24 percent, and the measured hit
// rate with the camera FROZEN, where every single cell recurs, was 73.1 percent. Probing
// four costs four integer compares on the rare path and takes that to 97 percent, for no
// extra memory at all. Doubling the table instead would have cost another 49 MB to
// reach 87.
const FC_WAYS = 4;
function mandelFieldCached(cx, cz, maxIter, rTol, slope, mode, hc) {
  const h0 = fcHash(cx, cz);
  for (let p = 0; p < FC_WAYS; p++) {
    const s = (h0 + p) & FC_MASK;
    if (fcGen[s] === fcCur && fcX[s] === cx && fcZ[s] === cz) {
      const g4 = s * 4;
      const gx = fcG[g4], gz = fcG[g4 + 1];
      const k = fcKind[s];
      fld.h = fcH[s]; fld.gx = gx; fld.gz = gz;
      fld.de = fcG[g4 + 2]; fld.nu = fcG[g4 + 3];
      fld.inside = k === 1 ? 1 : 0; fld.edge = k === 2 ? 1 : 0;
      fld.iters = fcIt[s];
      const inv = 1 / Math.sqrt(1 + gx * gx + gz * gz);
      fld.nx = -gx * inv; fld.ny = inv; fld.nz = -gz * inv;
      fcHits++; fcSaved += fld.iters;
      return;
    }
  }
  mandelField(cx, cz, maxIter, rTol, slope, mode, hc);
  fcMiss++;
  // Prefer a slot this generation has not claimed; otherwise evict the first of the
  // group. Either way the key is written with the value, so a later probe can only
  // match a slot that really holds this cell.
  let s = h0;
  for (let p = 0; p < FC_WAYS; p++) {
    const t = (h0 + p) & FC_MASK;
    if (fcGen[t] !== fcCur) { s = t; break; }
  }
  const g4 = s * 4;
  fcX[s] = cx; fcZ[s] = cz; fcGen[s] = fcCur;
  fcH[s] = fld.h; fcG[g4] = fld.gx; fcG[g4 + 1] = fld.gz;
  fcG[g4 + 2] = fld.de; fcG[g4 + 3] = fld.nu;
  fcIt[s] = fld.iters;
  fcKind[s] = fld.inside ? 1 : (fld.edge ? 2 : 0);
}

// Push a point onto the boundary of the set. The distance estimate gives both
// the distance and the direction, so c <- c - de * u is a Newton step whose
// fixed points are exactly the boundary. Three or four steps land close enough
// that the remaining error is far below the pixel the camera can see, and
// repeating it as the camera descends keeps the aim on the boundary forever.
// This is the terrain's analogue of taking the fixed point of a composed IFS
// map: a way to name a point that is exactly on the object.
function projectToBoundary(cx, cz, maxIter) {
  for (let k = 0; k < 6; k++) {
    mandelField(cx, cz, maxIter, 0, 1, 0, 0);      // hc = 0: no cap, raw estimate
    if (fld.inside || fld.de <= 0) break;
    const step = fld.de;
    if (!isFinite(step) || step > 1) break;
    cx -= step * fld.gx;                    // gx,gz is the unit outward normal
    cz -= step * fld.gz;                    // when slope = 1 and mode = 0
  }
  return [cx, cz];
}
