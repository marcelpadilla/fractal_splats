        const po3 = i * 3, po6 = i * 6, po9 = i * 9;
        const p0 = PM[po9], p1 = PM[po9 + 1], p2 = PM[po9 + 2];
        const p3 = PM[po9 + 3], p4 = PM[po9 + 4], p5 = PM[po9 + 5];
        const p6 = PM[po9 + 6], p7 = PM[po9 + 7], p8 = PM[po9 + 8];
        const pmx = Pmu[po3], pmy = Pmu[po3 + 1], pmz = Pmu[po3 + 2];
        const pw = Pw[i], pd = Pdep[i] + 1;
        const pcc = Pcc[i], pls = Pls[i];
        // How far this node is into the cross fade band. 0 at the split threshold, 1 at
        // FADE_BAND times it. Below 1 the parent is drawn as well, at the complementary
        // weight, so a split is a dissolve rather than a substitution. Weight is conserved
        // exactly: w(1-t) + t*sum(w p_i) = w, because the p_i sum to one. That is what makes
        // it free of any brightness artefact, and it is only possible because the
        // pushforward is exact and the children really do partition the parent's measure.
        let tf = (Ppr[i] / splitPx - 1) * fadeK;
        if (!(tf > 0)) tf = 0; else if (tf > 1) tf = 1;
        if (tbud < tf) tf = tbud;              // whichever threshold is nearer decides
        const pbl = Pbl[i], cbl = pbl * tf;
        fadeTf = tf; fadeBl = pbl;
        const ps0 = Pcov[po6], ps1 = Pcov[po6 + 1], ps2 = Pcov[po6 + 2];
        const ps3 = Pcov[po6 + 3], ps4 = Pcov[po6 + 4], ps5 = Pcov[po6 + 5];
        for (let mi = 0; mi < nmaps; mi++) {
          if (np >= MAXCAP) { full = true; break; }
          const n = np, no3 = n * 3, no6 = n * 6, no9 = n * 9;
          const ao = mi * 9, doff = mi * 3;
          let q0, q1, q2, q3, q4, q5, q6, q7, q8;
          if (mapSc[mi]) {
            const s = mapS[mi], g = s * s;
            q0 = p0 * s; q1 = p1 * s; q2 = p2 * s;
            q3 = p3 * s; q4 = p4 * s; q5 = p5 * s;
            q6 = p6 * s; q7 = p7 * s; q8 = p8 * s;
            Pcov[no6] = ps0 * g; Pcov[no6 + 1] = ps1 * g; Pcov[no6 + 2] = ps2 * g;
            Pcov[no6 + 3] = ps3 * g; Pcov[no6 + 4] = ps4 * g; Pcov[no6 + 5] = ps5 * g;
          } else {
            const a0 = mapA[ao], a1 = mapA[ao + 1], a2 = mapA[ao + 2];
            const a3 = mapA[ao + 3], a4 = mapA[ao + 4], a5 = mapA[ao + 5];
            const a6 = mapA[ao + 6], a7 = mapA[ao + 7], a8 = mapA[ao + 8];
            q0 = p0 * a0 + p1 * a3 + p2 * a6;      // M' = M A_i
            q1 = p0 * a1 + p1 * a4 + p2 * a7;
            q2 = p0 * a2 + p1 * a5 + p2 * a8;
            q3 = p3 * a0 + p4 * a3 + p5 * a6;
            q4 = p3 * a1 + p4 * a4 + p5 * a7;
            q5 = p3 * a2 + p4 * a5 + p5 * a8;
            q6 = p6 * a0 + p7 * a3 + p8 * a6;
            q7 = p6 * a1 + p7 * a4 + p8 * a7;
            q8 = p6 * a2 + p7 * a5 + p8 * a8;
            const t00 = q0 * rc0 + q1 * rc1 + q2 * rc2;   // Sigma' = M' Sigma M'^T
            const t01 = q0 * rc1 + q1 * rc3 + q2 * rc4;
            const t02 = q0 * rc2 + q1 * rc4 + q2 * rc5;
            const t10 = q3 * rc0 + q4 * rc1 + q5 * rc2;
            const t11 = q3 * rc1 + q4 * rc3 + q5 * rc4;
            const t12 = q3 * rc2 + q4 * rc4 + q5 * rc5;
            const t20 = q6 * rc0 + q7 * rc1 + q8 * rc2;
            const t21 = q6 * rc1 + q7 * rc3 + q8 * rc4;
            const t22 = q6 * rc2 + q7 * rc4 + q8 * rc5;
            Pcov[no6]     = t00 * q0 + t01 * q1 + t02 * q2;
            Pcov[no6 + 1] = t00 * q3 + t01 * q4 + t02 * q5;
            Pcov[no6 + 2] = t00 * q6 + t01 * q7 + t02 * q8;
            Pcov[no6 + 3] = t10 * q3 + t11 * q4 + t12 * q5;
            Pcov[no6 + 4] = t10 * q6 + t11 * q7 + t12 * q8;
            Pcov[no6 + 5] = t20 * q6 + t21 * q7 + t22 * q8;
          }
          const dd0 = mapD[doff], dd1 = mapD[doff + 1], dd2 = mapD[doff + 2];
          let mx = pmx + p0 * dd0 + p1 * dd1 + p2 * dd2;      // mu' = mu + M d_i
          let my = pmy + p3 * dd0 + p4 * dd1 + p5 * dd2;
          let mz = pmz + p6 * dd0 + p7 * dd1 + p8 * dd2;
          Pmu[no3] = mx; Pmu[no3 + 1] = my; Pmu[no3 + 2] = mz;

          if (f32) { mx = Math.fround(mx); my = Math.fround(my); mz = Math.fround(mz); }
          const dx = (mx - cpx) * invD, dy = (my - cpy) * invD, dz = (mz - cpz) * invD;
          const rad = Math.sqrt(Pcov[no6] + Pcov[no6 + 3] + Pcov[no6 + 5]) * invD * sig;
          const ex = r0 * dx + r1 * dy + r2 * dz;
          const ey = r3 * dx + r4 * dy + r5 * dz;
          const ez = -(r6 * dx + r7 * dy + r8 * dz);
          const rr = K * rad;
          if (ez + rr < NEAR || ez - rr > zFar ||
              (Math.abs(ex) - ez * tanX) * nrmX > rr ||
              (Math.abs(ey) - ez * tanY) * nrmY > rr) { culled++; continue; }

          PM[no9] = q0; PM[no9 + 1] = q1; PM[no9 + 2] = q2;
          PM[no9 + 3] = q3; PM[no9 + 4] = q4; PM[no9 + 5] = q5;
          PM[no9 + 6] = q6; PM[no9 + 7] = q7; PM[no9 + 8] = q8;
          Prel[no3] = dx; Prel[no3 + 1] = dy; Prel[no3 + 2] = dz;
          const z = ez > NEAR ? ez : NEAR;
          const iz = 1 / z;                  // one reciprocal, not three divisions
          Psx[n] = vw * 0.5 + focal * ex * iz;
          Psy[n] = vh * 0.5 - focal * ey * iz;
          const fpn = focal * rad * iz;
          Pfp[n] = fpn;
          // Attenuation at the near face of the support, not at the centre, and floored
          // so that footprint alone splits an oversized node: see `place` in
          // src/50_cut.js for both.
          // Table lookup, not Math.exp: this line alone was 21 percent of a dragon
          // rebuild. See attOf in src/40_state.js. Inlined rather than calling attOf,
          // because this is the one loop where a call per node shows.
          const zn = ez - rr;
          const xa = fogK * (zn - 1);
          let att;
          if (!(xa > 0)) att = 1;
          else {
            const u = xa * ATT_SC;
            if (u >= ATT_N) att = 0;
            else { const j = u | 0, ff = u - j; att = ATT[j] + (ATT[j + 1] - ATT[j]) * ff; }
          }
          Ppr[n] = fpn * (att > attFloor ? att : attFloor);
          Pw[n] = pw * mapP[mi];
          // The colour, and the whole of it: one increment per letter, summed down the
          // address, wrapped into [0,1) as it goes so that a Float32 carries it at a
          // uniform 1e-7 and a 240 deep address is no worse than a 2 deep one. Wrapping
          // costs nothing, because only frac of the total is ever read.
          let hu = pcc + mapHue[mi];
          hu -= Math.floor(hu);
          Pcc[n] = hu;
          // The piece's own diameter, as a log, integrated down the branch. Anchor
          // relative, and exactly compensated by anchor.logScale, so it names an absolute
          // size at any depth. Kept because it is the one honest measure of how far down
          // a piece is in a mixed ratio system, which the tests read.
          Pls[n] = pls + mapLS[mi];
          Pbl[n] = cbl;
          Pdep[n] = pd;
          Ppar[n] = i; Pmi[n] = mi;      // so a clicked node can name its word
          np++;
          nextF[nn++] = n;
          made++;
        }
      }
      // Which node, if any, gets drawn for this visit, and at what fraction of its
      // weight. A leaf is drawn whole. A node inside the fade band is drawn as well as its
      // children, at 1-t, which is the only case where both happen.
      let emitI = -1, emitBl = 0;
      if (made > 0) {
        cutSize += made - 1;
        if (fadeTf < 1) { emitI = i; emitBl = fadeBl * (1 - fadeTf); cutSize++; }
      } else if (split && !full) {
        // Every child was culled. Children partition the parent's support and
        // each child's bound contains its own support, so the parent has nothing
        // visible either: drop it rather than emit a screen filling splat that
        // carries coarse weight.
        cutSize--;
        culled++;
      } else {
        emitI = i; emitBl = Pbl[i];
      }
      if (emitI >= 0 && nEmit < cap) {
        emitted[nEmit] = i;
        const o = nEmit * FLOATS, o3 = i * 3, o6 = i * 6;
        instances[o]      = Prel[o3];
        instances[o + 1]  = Prel[o3 + 1];
        instances[o + 2]  = Prel[o3 + 2];
        instances[o + 3]  = Pcov[o6] * d2;
        instances[o + 4]  = Pcov[o6 + 1] * d2;
        instances[o + 5]  = Pcov[o6 + 2] * d2;
        instances[o + 6]  = Pcov[o6 + 3] * d2;
        instances[o + 7]  = Pcov[o6 + 4] * d2;
        instances[o + 8]  = Pcov[o6 + 5] * d2;
        // Colour is the address sum, and nothing else. See buildMapHue in
        // src/40_state.js for why this and not the two schemes before it. The short of
        // it: colour keyed on the piece's SIZE cannot leave a region's colour alone as
        // you descend into it, because refining a region replaces its pieces with
        // smaller ones and smaller means a different colour, necessarily. An address
        // sum with zero measure weighted mean increment preserves the region's mean hue
        // exactly at every level while opening a spread of new hue inside it.
        let u = huBase + Pcc[i];
        u -= Math.floor(u);
        let pi = (u * PAL) | 0;
        if (pi > PAL - 1) pi = PAL - 1; else if (pi < 0) pi = 0;
        const p3 = pi * 3;
        instances[o + 9]  = palette[p3];
        instances[o + 10] = palette[p3 + 1];
        instances[o + 11] = palette[p3 + 2];
        const wi = Pw[i] * emitBl;
        instances[o + 12] = wi * norm;
        sumW += wi;
        if (Psx[i] > -padX && Psx[i] < vw + padX && Psy[i] > -padY && Psy[i] < vh + padY) {
          sumWvis += wi;
        }
        nEmit++;
        const d = Pdep[i];
        if (d < dmin) dmin = d;
        if (d > dmax) dmax = d;
      }
    }
    const t = frontier; frontier = nextF; nextF = t;
    job.nf = nn; job.levelReady = false; job.q = 0; job.nn = 0;
  }

  job.np = np; job.nEmit = nEmit; job.cutSize = cutSize;
  job.dmin = dmin; job.dmax = dmax; job.visited = visited; job.culled = culled;
  job.sumW = sumW; job.sumWvis = sumWvis; job.bAllow = bAllow;
  job.ms += performance.now() - t0;
  if (done) job.active = false;
  return done;
}

/* ==== src/60_gl.js ==================================================== */
/* ================================ WebGL ================================= */
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aPos;
layout(location=2) in vec3 aCovA;   // xx xy xz
layout(location=3) in vec3 aCovB;   // yy yz zz
layout(location=4) in vec3 aCol;
layout(location=5) in float aW;
uniform mat3 uR;           // world to eye, current camera
uniform mat3 uRc;          // the CUT's own frame to eye. Equal to uR except in
                           // the two or three frames after a rebase, when the
                           // scene has been re-expressed in a child piece's
                           // coordinates and the cut on screen predates it.
uniform vec2 uFocal;
uniform vec2 uVp;
uniform float uGain;
uniform float uFilter;
uniform float uFog;
uniform vec3 uFogCol;
uniform float uK;          // rescale from the cut's camera to the current one
uniform vec3 uO;           // and offset
uniform float uSig2;       // splat size, squared
uniform float uKnorm;      // super Gaussian area normalization
uniform float uExtent;     // support radius, in sigma
uniform float uEnergy;     // 1 = emissive measure, 0 = opaque surface
uniform float uSlab;       // depth prepass: push depth back this many sigma_z
uniform float uFadePx;     // fade a measure's splat out above this screen sigma
uniform float uZFar;       // the depth of field limit, where the cut culls
uniform vec2 uDepth;       // 1/log(zf/zn), log(zn)
// A CONSTANT SCREEN OFFSET, in pixels, added after projection. Zero for every normal frame. The
// magnifier that once lived in the Gaussian view was one of these; it is kept because the flat
// and general paths must agree about the projection and a zero here costs nothing.
uniform vec2 uShift;
out vec3 vConic;
out vec2 vOff;
out vec3 vCol;
out float vPeak;
void main() {
  // The splat carries the cut's rotation, the camera offset carries the current
  // one. See reprojection() in src/50_cut.js for the derivation.
  vec3 pc = uRc * (aPos * uK) - uR * uO;
  float z = -pc.z;
  if (z < 1e-6) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    vConic = vec3(1.0, 0.0, 1.0); vOff = vec2(1e4); vCol = vec3(0.0); vPeak = 0.0;
    return;
  }
  float k2 = uK * uK * uSig2;
  mat3 S = mat3(aCovA.x, aCovA.y, aCovA.z,
                aCovA.y, aCovB.x, aCovB.y,
                aCovA.z, aCovB.y, aCovB.z) * k2;
  mat3 Sc = uRc * S * transpose(uRc);         // covariance in eye space
  float iz = 1.0 / z;
  vec3 j0 = vec3(uFocal.x * iz, 0.0, uFocal.x * pc.x * iz * iz);   // d(pixel u)/d(pc)
  vec3 j1 = vec3(0.0, uFocal.y * iz, uFocal.y * pc.y * iz * iz);   // d(pixel v)/d(pc)
  float c00 = dot(j0, Sc * j0);
  float c01 = dot(j0, Sc * j1);
  float c11 = dot(j1, Sc * j1);
  // Convolve with the pixel footprint. That is the whole anti-aliasing story
  // here: the sampling rate is known exactly, so clamp straight to it.
  float fr = uFilter * uFilter;
  c00 += fr; c11 += fr;
  float det = max(c00 * c11 - c01 * c01, 1e-14);
  float att = exp(-uFog * max(0.0, z - 1.0));
  // A measure is emissive, so distance dims it and the peak is set so the
  // integral over the image equals the branch weight, which makes brightness
  // independent of dilation and therefore of zoom. A surface is not: distance
  // must fade it toward the far colour without making it transparent, and its
  // peak is an opacity, independent of how large it lands on screen.
  if (uEnergy > 0.5) {
    // Refinement caps the footprint, but the budget and the depth limit can always
    // win, so whatever is left over has to LEAVE smoothly rather than pop. Fade over
    // one octave above the cap. This is the only place a splat's light is not
    // conserved, and it is deliberate: an oversized splat is a coarse stand-in for
    // structure that is not being drawn, and a faint wash covering half the screen is
    // worse than nothing there. Surfaces are exempt, see uEnergy.
    float sp = sqrt(max(c00, c11));
    float fade = 1.0 - smoothstep(uFadePx, uFadePx * 2.0, sp);
    // AND a taper to zero at the depth of field limit, which the surface path below has
    // always had and this one did not. The fog term alone is exp(-fog (z-1)), so at the
    // limit it is exp(-8) = 3.4e-4 of the near field and the cut then culls the splat
    // outright. That reads as a fade that goes soft and then stops, for a reason worth
    // writing down: the frame is shown through a 1/2.2 encode, so a factor of 3.4e-4 in
    // linear light is still 3.6 percent of full displayed brightness, and a step from 3.6
    // percent to nothing against a background that is itself only 2 percent is visible.
    //
    // Measured, both directions. Moving the cull twice and four times further out changes
    // the frame by 0.0000 of full range, so the light past the limit really is nothing and
    // the cull is not the problem. The light in the last half of the depth of field is NOT
    // nothing, and this is what lands it on zero smoothly, with zero slope, instead of
    // chopping it.
    fade *= 1.0 - smoothstep(uZFar * 0.55, uZFar, z);
    vPeak = aW * uGain * att * uKnorm * inversesqrt(det) * fade;
    vCol = aCol;
  } else {
    // A surface is culled at the depth of field limit, and an opaque surface that
    // simply STOPS leaves a hard edge across the frame wherever the fog colour does
    // not happen to equal the background gradient at that height. Fading the opacity
    // out over the last quarter of the range dissolves it into the background instead,
    // which is the same "leave smoothly rather than pop" the measure path gets above.
    vPeak = aW * uGain * (1.0 - smoothstep(uZFar * 0.72, uZFar, z));
    vCol = mix(uFogCol, aCol, att);
  }
  vConic = vec3(c11, -c01, c00) / det;
  float rx = min(uExtent * sqrt(c00), uVp.x);
  float ry = min(uExtent * sqrt(c11), uVp.y);
  vOff = aCorner * vec2(rx, ry);
  // The prepass writes the front surface pushed BACK, and the colour pass then keeps
  // everything in front of that. The push has to be at least a resolvable amount of
  // depth, or a surfel whose eye-space z variance is small rejects ITSELF: it writes
  // its own depth and then fails its own LESS test. A flat lake seen from above is
  // exactly that case, and it took the terrain to a completely black frame with 250 000
  // splats sitting in the buffer. The relative term guarantees the margin whatever the
  // covariance does; the slab is what actually sets the thickness.
  float zd = z * 1.002 + uSlab * sqrt(max(Sc[2][2], 0.0));
  float ndc = (log(max(zd, 1e-7)) - uDepth.y) * uDepth.x * 2.0 - 1.0;
  vec2 ctr = vec2(uFocal.x * pc.x * iz, uFocal.y * pc.y * iz) + uShift;
  gl_Position = vec4((ctr + vOff) / (0.5 * uVp), clamp(ndc, -1.0, 1.0), 1.0);
}`;

// The same projection for a FLAT cut, from seven floats an instance instead of thirteen.
//
// Nothing about the mathematics changes: the position and the covariance are reconstructed and then
// go through exactly the code above. What changes is what crosses the bus. A plane cell is a disc
// at y = 0, so its y is one number shared by the whole cut and its covariance is
// diag(r^2/3, (0.06 r)^2, r^2/3), which the single scalar `aRad` determines completely. Six floats
// of zeros and duplicates stop being uploaded and stop being fetched per vertex. See FLAT_FLOATS.
//
// The thin term across the plane is not decoration: the covariance has to be non-degenerate or it
// cannot be inverted to a conic, and a disc in a plane has zero variance normal to it.
const FLAT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec2 aPos2;    // x and z in the cut's own normalized frame
layout(location=2) in float aRad;    // the cell's half width, same frame
layout(location=3) in vec3 aCol;
layout(location=4) in float aW;
uniform mat3 uR;
uniform mat3 uRc;
uniform vec2 uFocal;
uniform vec2 uVp;
uniform float uFilter;
uniform float uFog;
uniform vec3 uFogCol;
uniform float uK;
uniform vec3 uO;
uniform float uSig2;
uniform float uExtent;
uniform float uZFar;
uniform vec2 uDepth;
uniform vec2 uShift;                 // see the note on uShift in VS
uniform float uPlaneY;               // the y every splat in this cut shares
out vec3 vConic;
out vec2 vOff;
out vec3 vCol;
out float vPeak;
void main() {
  vec3 aPos = vec3(aPos2.x, uPlaneY, aPos2.y);
  vec3 pc = uRc * (aPos * uK) - uR * uO;
  float z = -pc.z;
  if (z < 1e-6) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    vConic = vec3(1.0, 0.0, 1.0); vOff = vec2(1e4); vCol = vec3(0.0); vPeak = 0.0;
    return;
  }
  // THE COVARIANCE IS RANK ONE PLUS A MULTIPLE OF THE IDENTITY, and writing it that way removes
  // two 3x3 matrix products a vertex. This is the honest answer to "is this a 3D Gaussian with a
  // wasted third component": the STORAGE has been two dimensional for a while, seven floats an
  // instance, but the projection was still building a 3x3, rotating it into eye space with
  // uRc S uRc^T and contracting it twice, which is fifty four multiplies to express something
  // with two degrees of freedom.
  //
  //   S = r^2 (v I + (t2 - v) e_y e_y^T),  so  Sc = uRc S uRc^T = r^2 (v I + (t2 - v) n n^T)
  //
  // with n = uRc e_y, the plane's normal in eye space, which is the second COLUMN of uRc and is
  // therefore free. The identity part contracts to plain dot products of the Jacobian rows with
  // themselves, and those have structure too: with j0 = f/z (1, 0, sx) and j1 = f/z (0, 1, sy),
  // where sx and sy are the projected coordinates, every entry is two multiplies.
  float iz = 1.0 / z;
  float ex = uFocal.x * iz, ey = uFocal.y * iz;
  float sx = pc.x * iz, sy = pc.y * iz;
  vec3 nrm = uRc[1];                            // uRc * (0,1,0): the plane's normal in eye space
  float A = uK * uK * uSig2 * aRad * aRad;
  const float V = 1.0 / 3.0;                    // the cell's own second moment, over r^2
  const float DT = 0.0036 - V;                  // (0.06 r)^2 minus it: the thin axis across the plane
  float n0 = nrm.x + nrm.z * sx;
  float n1 = nrm.y + nrm.z * sy;
  float c00 = A * ex * ex * (V * (1.0 + sx * sx) + DT * n0 * n0);
  float c01 = A * ex * ey * (V * (sx * sy)       + DT * n0 * n1);
  float c11 = A * ey * ey * (V * (1.0 + sy * sy) + DT * n1 * n1);
  float fr = uFilter * uFilter;
  c00 += fr; c11 += fr;
  float det = max(c00 * c11 - c01 * c01, 1e-14);
  float att = exp(-uFog * max(0.0, z - 1.0));
  // A plane cut is drawn by the SURFACE model, not the emissive one, and getting this wrong is
  // invisible in code and glaring on screen. built.surface is true for a plane object, so the
  // general shader takes its uEnergy = 0 branch: the peak is an OPACITY, independent of how large
  // the splat lands, the gain is 1 rather than vw*vh*gain, the colour is mixed toward the far
  // colour by distance, and the screen size fade is deliberately not applied because a surface
  // that thins out with size stops covering. Only that branch is kept here; there is no uEnergy
  // because a plane cut is never the other kind.
  vPeak = aW * (1.0 - smoothstep(uZFar * 0.72, uZFar, z));
  vCol = mix(uFogCol, aCol, att);
  vConic = vec3(c11, -c01, c00) / det;
  float rx = min(uExtent * sqrt(c00), uVp.x);
  float ry = min(uExtent * sqrt(c11), uVp.y);
  vOff = aCorner * vec2(rx, ry);
  float ndc = (log(max(z * 1.002, 1e-7)) - uDepth.y) * uDepth.x * 2.0 - 1.0;
  vec2 ctr = vec2(uFocal.x * pc.x * iz, uFocal.y * pc.y * iz) + uShift;
  gl_Position = vec4((ctr + vOff) / (0.5 * uVp), clamp(ndc, -1.0, 1.0), 1.0);
}`;

// The footprint is a super Gaussian: exp(-0.5 (s q)^(beta/2)) with q the
// Mahalanobis form. beta = 2 is the ordinary Gaussian; higher beta flattens the
// top and steepens the shoulder. s keeps the second moment equal to the
// covariance, so this sharpens the shape without quietly shrinking the splat.
const FS = `#version 300 es
precision highp float;
in vec3 vConic;
in vec2 vOff;
in vec3 vCol;
in float vPeak;
uniform float uShape;
uniform float uBeta2;
uniform float uCore;
// SHOW THE GAUSSIANS. 0 is off and costs one compare. Above zero it is the half width of the
// contour line IN PIXELS, and pixels is the whole of the fix recorded below.
uniform float uRing;
uniform vec3 uRingCol;
out vec4 outColor;
void main() {
  float q = vConic.x * vOff.x * vOff.x + 2.0 * vConic.y * vOff.x * vOff.y
          + vConic.z * vOff.y * vOff.y;
  float e = 0.5 * pow(max(uShape * q, 1e-9), uBeta2);
  float k = exp(-e);
  // HOW FAST THE KERNEL CHANGES ACROSS ONE FRAGMENT. Taken here, at the top, and not down in the
  // branch that uses it: a derivative asked for after a discard is undefined by the spec, and this
  // shader discards twice below. The test is on a UNIFORM, which is the one kind of control flow a
  // derivative may be taken inside, so the ordinary render still pays nothing for it.
  float g = uRing > 0.0 ? max(fwidth(k), 1e-7) : 1.0;
  if (e > 6.91) discard;
  if (k < uCore) discard;
  float a = vPeak * k;
  vec3 c = vCol;
  if (uRing > 0.0) {
    // SHOW THE GAUSSIANS: each splat drawn as its own one sigma ellipse and nothing else.
    //
    // The contour is a level set of the KERNEL rather than of the Mahalanobis form, which is the
    // same ellipse and is the right way to say it: for a Gaussian the one sigma ellipse is
    // k = exp(-1/2) = 0.6065 whatever the covariance is, and that stays true for the super Gaussian
    // at any exponent, so this needs to know nothing about uShape or uBeta2.
    //
    // The OUTLINE is neutral and the INTERIOR carries the splat's own colour. The outline has to
    // be one colour everywhere or a splat is legible only where it happens to differ in hue from
    // whatever it lies on, and the outlines are what carry the geometry: how large each ellipse
    // is, which way it points, and how they overlap. The interior has no such constraint. It is
    // already being drawn so that overlaps read at all, and drawing it in the object's colour
    // costs nothing and says which piece each ellipse belongs to.
    //
    // The two are mixed by ALPHA rather than added, because the tone map divides accumulated
    // colour by accumulated alpha: emitting vCol*aFill + uRingCol*aRing against a total alpha of
    // aFill + aRing is what makes the ring read as white over a tinted body instead of the whole
    // splat washing to the average of the two.
    //
    // No backticks in this comment, and that is not a style rule. This whole shader is a JS
    // template literal, so one backtick here ends the string and the file stops parsing.
    //
    // THE LINE IS A WIDTH IN PIXELS, and it used to be a width in units of the kernel's own value.
    // That difference is the whole of the aliasing this mode had.
    //
    // A contour width stated in kernel units is a width that SCALES WITH THE SPLAT. Near the one
    // sigma contour the kernel falls by 0.6065 per sigma, so a line of w in kernel units is
    // w * R / 0.6065 pixels wide on a splat whose one sigma radius is R pixels. That was fine while
    // this mode drew ellipses twenty eight pixels across: at 1/26 kernel units the line came out
    // 0.9 px and looked like a line. The same constant on the six pixel ellipses this mode draws
    // now is 0.19 px, which is a line thinner than the grid it is being sampled on, so it turns
    // into a dotted crawl along every boundary. That is the pixelation, and no amount of tuning the
    // constant fixes it, because there is no one constant: the splats are not all the same size.
    //
    // fwidth(k) is how much the kernel changes between one fragment and the next, so (k - contour)
    // divided by it is the signed distance to the contour measured IN FRAGMENTS. A line of a fixed
    // number of those is the same width everywhere, on every splat, at every zoom, and inside the
    // magnified corner as well, which is why the caller no longer scales this by the magnification.
    // The falloff being smooth over that distance is what antialiases it: a fragment half a pixel
    // off the contour gets half the weight, which is exactly what a good line does.
    //
    // The INTERIOR fades out across one pixel at the contour for the same reason. It used to end at
    // a hard discard, and a hard edge on a tinted disc is a jagged silhouette however thin the tail
    // behind it is. The tail itself still has to go, or a few hundred overlapping Gaussians pile up
    // into a white fog with the ellipses buried in it; that is what the discard below does, three
    // line widths outside the contour, where there is nothing left to draw.
    //
    // AND THE LINE IS NEVER DRAWN NARROWER THAN THE GRID, it is drawn DIMMER instead. Below about
    // half a pixel a Gaussian line is narrower than the spacing of the samples taken from it, so
    // how bright it comes out depends on where the pixel centres happen to fall across it, which
    // is the speckle all over again in a subtler form. Widening it to the floor and scaling the
    // amplitude by the same ratio keeps the LIGHT the line carries the same, which is what the eye
    // integrates anyway, and makes every value of the width setting mean something.
    float dp = (k - 0.60653) / g;
    float w = max(uRing, 0.55);
    if (dp < -3.0 * w) discard;
    float t = dp / w;
    float ring = (uRing / w) * exp(-t * t);
    float fill = clamp(dp + 0.5, 0.0, 1.0);
    float aFill = vPeak * ${GAUSS_FILL} * k * fill;
    float aRing = vPeak * 2.4 * ring;
    a = aFill + aRing;
    c = (vCol * aFill + uRingCol * aRing) / max(a, 1e-6);
  }
  outColor = vec4(c * a, a);
}`;

const TONE_VS = `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  vUv = p * 0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

// Two opacity models over the same accumulation buffer, both order independent,
// so there is still no sort anywhere.
//
//   solid  a = 1 - exp(-T)      emission absorption with a uniform ratio of
//                               emission to extinction. Colour is the density
//                               weighted mean, which is the exact answer when
//                               that ratio is uniform along the ray. Once T is
//                               past about three this saturates, so the body of
//                               the object stops caring how many splats happened
//                               to line up along the ray. That is what kills the
//                               transparency that used to swing with the viewing
//                               direction: a two dimensional measure really does
//                               project to twice the density down its symmetry
//                               axes, and under a logarithm that showed up as a
//                               brightness change over the whole frame.
//
//   glow   b = log(1+T)/log(1+W)   Draves log density, kept because a fractal
//                               measure genuinely has unbounded density and the
//                               logarithm is the honest way to show it.
const TONE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uOptical;
uniform float uGlow;
uniform float uWhite;
uniform vec3 uBg0;
uniform vec3 uBg1;
out vec4 outColor;
void main() {
  vec4 acc = texture(uTex, vUv);
  float T = max(acc.a, 0.0) * uOptical;
  vec3 mean = acc.rgb / max(acc.a, 1e-12);
  float a = 1.0 - exp(-T);
  float g = min(log(1.0 + T) / log(1.0 + uWhite), 6.0);
  float b = mix(a, g, uGlow);
  vec3 c = mean * b;
  c += mix(uBg0, uBg1, vUv.y) * (1.0 - clamp(a, 0.0, 1.0));
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = max(mix(vec3(l), c, 1.14), vec3(0.0));      // hold saturation in the cores
  outColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
}`;

let gl, canvas, progSplat, progTone, progFlat, progRect, vao, vaoFlat, instBuf, fbo, fboTex, fboDepth;
let fboW = 0, fboH = 0, fboInternal = 0;
const uni = {};

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* ------------------------- linking without stalling ---------------------- */
// TWO OF THE PROGRAMS HERE TAKE ABOUT A SECOND TO LINK, and a second of linking is a second of
// frozen tab. Not frozen viewer: frozen TAB. `linkProgram` and every query about its result are
// synchronous, so the driver's HLSL compiler runs on the main thread and the page around this
// demo stops scrolling with it. On a page where the demo is one section among several that is the
// worst thing the renderer can do, and it is what "everything freezes" was.
//
// The two are the batched escape time field and the per pixel object, and neither is small: both
// carry the whole double single orbit, which is a few hundred lines of dependent arithmetic that
// the compiler unrolls.
//
// KHR_parallel_shader_compile exists for exactly this. `linkProgram` already returns immediately;
// what blocks is the first QUERY of the result. With the extension there is a completion flag that
// can be polled without blocking, so the work happens on a driver thread and the frame loop keeps
// running. The one rule is that nothing may touch the program until the flag is true: not
// LINK_STATUS, not getUniformLocation, not useProgram. Any of them blocks and the extension has
// bought nothing.
//
// Without the extension this degrades to the old behaviour, deliberately and in one place.
let parExt;
function linkAsync(vs, fs) {
  if (parExt === undefined) parExt = gl.getExtension('KHR_parallel_shader_compile') || null;
  const p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  return { p, ext: parExt };
}
// True once the program may be used. Costs one non blocking query a frame while it is false.
function linkReady(h) {
  if (!h) return false;
  if (h.done) return true;
  if (h.ext && !gl.getProgramParameter(h.p, h.ext.COMPLETION_STATUS_KHR)) return false;
  if (!gl.getProgramParameter(h.p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(h.p));
  h.done = true;
  return true;
}

// Solid rectangles in pixel coordinates, for the crosshair, the box around the magnified region
// and the frame around the magnified square. Four vertices from gl_VertexID and no buffer at all; a
// mark is two or three pixels wide, so anything more structured than this would be more code than
// the thing it draws. The origin is the bottom left, like every other pixel coordinate here.
const RECT_VS = `#version 300 es
precision highp float;
uniform vec4 uRect;                  // x0, y0, x1, y1 in pixels
uniform vec2 uVp;
void main() {
  vec2 c = vec2((gl_VertexID == 1 || gl_VertexID == 3) ? uRect.z : uRect.x,
                (gl_VertexID >= 2) ? uRect.w : uRect.y);
  gl_Position = vec4(c / uVp * 2.0 - 1.0, 0.0, 1.0);
}`;

const RECT_FS = `#version 300 es
precision highp float;
uniform vec4 uCol;
out vec4 outColor;
void main() { outColor = uCol; }`;

const SPLAT_UNI = ['uR', 'uRc', 'uFocal', 'uVp', 'uGain', 'uFilter', 'uFog', 'uFogCol', 'uK', 'uO',
  'uSig2', 'uKnorm', 'uExtent', 'uEnergy', 'uSlab', 'uDepth', 'uShape', 'uBeta2', 'uCore', 'uFadePx',
  'uZFar', 'uRing', 'uRingCol', 'uShift'];
// The flat program's own set. No uFogCol, uEnergy, uSlab or uCore: a plane cut is always an
// emissive measure with no depth prepass, so those four are constants here rather than uniforms.
const FLAT_UNI = ['uR', 'uRc', 'uFocal', 'uVp', 'uFilter', 'uFog', 'uFogCol', 'uK', 'uO', 'uSig2',
  'uExtent', 'uDepth', 'uZFar', 'uPlaneY', 'uShift'];
const flatUni = {};
const rectUni = {};

function initGL(cv) {
  canvas = cv;
  gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
  if (!gl) return false;
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  stats.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'not reported';
  progSplat = link(VS, FS);
  progFlat = link(FLAT_VS, FS);            // same fragment shader: the footprint is unchanged
  progTone = link(TONE_VS, TONE_FS);
  progRect = link(RECT_VS, RECT_FS);
  for (const k of ['uRect', 'uVp', 'uCol']) rectUni[k] = gl.getUniformLocation(progRect, k);
  for (const k of SPLAT_UNI) uni[k] = gl.getUniformLocation(progSplat, k);
  for (const k of FLAT_UNI) flatUni[k] = gl.getUniformLocation(progFlat, k);
  for (const k of ['uShape', 'uBeta2', 'uCore', 'uRing', 'uRingCol']) {
    flatUni[k] = gl.getUniformLocation(progFlat, k);
  }
  for (const k of ['uTex', 'uOptical', 'uGlow', 'uWhite', 'uBg0', 'uBg1']) {
    uni[k] = gl.getUniformLocation(progTone, k);
  }

  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  instBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAXBUDGET * FLOATS * 4, gl.DYNAMIC_DRAW);
  const stride = FLOATS * 4;
  for (const [loc, size, off] of [[1, 3, 0], [2, 3, 12], [3, 3, 24], [4, 3, 36], [5, 1, 48]]) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, off);
    gl.vertexAttribDivisor(loc, 1);
  }
  gl.bindVertexArray(null);

  // A second VAO over the SAME instance buffer, describing it with the compact layout. The buffer
  // is sized for the larger format, so a flat cut simply uses less of it; nothing is reallocated
  // when the object changes.
  vaoFlat = gl.createVertexArray();
  gl.bindVertexArray(vaoFlat);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  {
    const fs = FLAT_FLOATS * 4;
    for (const [loc, size, off] of [[1, 2, 0], [2, 1, 8], [3, 3, 12], [4, 1, 24]]) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, fs, off);
      gl.vertexAttribDivisor(loc, 1);
    }
  }
  gl.bindVertexArray(null);

  // Accumulation needs range far past 1.0, so a float target if one is available.
  if (gl.getExtension('EXT_color_buffer_float')) { fboInternal = gl.RGBA16F; stats.format = 'RGBA16F'; }
  else if (gl.getExtension('EXT_color_buffer_half_float')) { fboInternal = gl.RGBA16F; stats.format = 'RGBA16F'; }
  else { fboInternal = gl.RGBA8; stats.format = 'RGBA8, clamped'; }

function resizeTargets(w, h) {
  if (w === fboW && h === fboH) return;
  fboW = w; fboH = h;
  for (let attempt = 0; attempt < 2; attempt++) {
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fboInternal, w, h, 0, gl.RGBA,
      fboInternal === gl.RGBA8 ? gl.UNSIGNED_BYTE : gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;

// A surface needs the front layer only, or a hill behind a ridge blends into it
// and the terrain reads as a fog bank. One depth prepass writes the front
// surface pushed back by its own thickness, and the colour pass then accepts
// everything inside that slab and rejects everything behind it. Order
// independent, no sort, and the accumulation stays additive.
// ONE SPLAT PASS, into the accumulation buffer.
// `mag` is null for a normal frame. For the magnified corner it is {m, x, y}: scale the focal
// length by m, which magnifies the projection about the eye axis and takes the splats' projected
// covariance with it, then shift the result by (x, y) pixels to put the chosen point in the middle
// of the square. Nothing else in the pipeline knows this is happening, which is the point: the
// corner shows the SAME cut and the same splats as the frame, seen closer.
function splatPass(vw, vh, count, mag) {
  const m = mag ? mag.m : 1, shx = mag ? mag.x : 0, shy = mag ? mag.y : 0;
  const focal = m * 0.5 * vh / Math.tan(0.5 * cam.fov);
  // NOT scaled by the magnification any more. The outline's width is now stated in pixels and the
  // shader measures pixels with a screen space derivative, so the magnified corner gets the same
  // line as the frame does without being told anything. It used to be a width in kernel units,
  // which scales with the splat, and this was multiplied by m to cancel that.
  const ring = ringWidth();
  const surface = built.surface, prepass = built.prepass;
  const zf = Math.max(2, 1 + ZF_MUL * 8 / Math.max(cfg.fog, 0.02));
  const zn = 1e-4;
  if (count > 0 && built.flat) {
    // The flat path: a plane cut, seven floats an instance, no prepass, always emissive. Written
    // out rather than folded into the general path below because the two disagree about the vertex
    // layout, and a shared code path that switches layout is exactly where a stride bug hides.
    gl.useProgram(progFlat);
    gl.uniformMatrix3fv(flatUni.uR, false, basis.Rgl);
    gl.uniformMatrix3fv(flatUni.uRc, false, repro.Rc);
    gl.uniform2f(flatUni.uFocal, focal, focal);
    gl.uniform2f(flatUni.uVp, vw, vh);
    gl.uniform1f(flatUni.uFilter, 0.5);
    gl.uniform1f(flatUni.uFog, cfg.fog);
    gl.uniform3f(flatUni.uFogCol, bg1[0], bg1[1], bg1[2]);
    gl.uniform1f(flatUni.uK, repro.k);
    gl.uniform3fv(flatUni.uO, repro.o);
    gl.uniform1f(flatUni.uSig2, cfg.sigma * cfg.sigma);
    gl.uniform1f(flatUni.uExtent, kern.extent * FLAT_EXT);
    gl.uniform1f(flatUni.uZFar, zf);
    gl.uniform2f(flatUni.uDepth, 1 / Math.log(zf / zn), Math.log(zn));
    gl.uniform1f(flatUni.uPlaneY, built.planeY);
    gl.uniform1f(flatUni.uShape, kern.shape);
    gl.uniform1f(flatUni.uBeta2, kern.beta * 0.5);
    gl.uniform1f(flatUni.uCore, 0.0);
    gl.uniform1f(flatUni.uRing, ring);
    gl.uniform3f(flatUni.uRingCol, RING_COL[0], RING_COL[1], RING_COL[2]);
    gl.uniform2f(flatUni.uShift, shx, shy);
    gl.bindVertexArray(vaoFlat);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.enable(gl.BLEND);
    gl.blendEquation(gl.FUNC_ADD);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(null);

    gl.useProgram(progSplat);
    gl.uniformMatrix3fv(uni.uR, false, basis.Rgl);
    gl.uniformMatrix3fv(uni.uRc, false, repro.Rc);
    gl.uniform2f(uni.uFocal, focal, focal);
    gl.uniform2f(uni.uVp, vw, vh);
    // A magnified measure spreads the same weight over m^2 more pixels, and the vertex shader
    // divides by the square root of the projected determinant, so its peak falls by m^2 on its own.
    // That is correct physics and wrong here: the corner is a diagram of the primitives and has to
    // be as legible as the frame. Put the m^2 back.
    gl.uniform1f(uni.uGain, surface ? 1 : vw * vh * repro.gain * m * m);
    gl.uniform1f(uni.uFilter, 0.5);
    gl.uniform1f(uni.uFog, cfg.fog);
    gl.uniform3f(uni.uFogCol, bg1[0], bg1[1], bg1[2]);
    gl.uniform1f(uni.uK, repro.k);
    gl.uniform3fv(uni.uO, repro.o);
    gl.uniform1f(uni.uSig2, cfg.sigma * cfg.sigma);
    gl.uniform1f(uni.uKnorm, kern.knorm);
    gl.uniform1f(uni.uExtent, kern.extent);
    gl.uniform1f(uni.uEnergy, surface ? 0 : 1);
    // A measure's splat fades out above this screen size, because an oversized splat is a coarse
    // stand-in for structure that is not being drawn. In the Gaussian view every splat is oversized
    // on purpose and none of them stands in for anything, so the cap goes up with the threshold.
    gl.uniform1f(uni.uFadePx, (cfg.gauss ? GAUSS_CAP : SIZE_CAP) * m);
    gl.uniform1f(uni.uZFar, zf);
    gl.uniform1f(uni.uShape, kern.shape);
    gl.uniform1f(uni.uBeta2, kern.beta * 0.5);
    gl.uniform1f(uni.uRing, ring);
    gl.uniform3f(uni.uRingCol, RING_COL[0], RING_COL[1], RING_COL[2]);
    gl.uniform2f(uni.uShift, shx, shy);
    gl.uniform2f(uni.uDepth, 1 / Math.log(zf / zn), Math.log(zn));
    gl.bindVertexArray(vao);
    if (prepass) {
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.colorMask(false, false, false, false);
      gl.uniform1f(uni.uSlab, 4.0);
      gl.uniform1f(uni.uCore, 0.22);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
      gl.colorMask(true, true, true, true);
      gl.depthMask(false);
      gl.uniform1f(uni.uSlab, 0.0);
      gl.uniform1f(uni.uCore, 0.0);
    } else {
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.uniform1f(uni.uSlab, 0.0);
      gl.uniform1f(uni.uCore, 0.0);
    }
    gl.enable(gl.BLEND);
    gl.blendEquation(gl.FUNC_ADD);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.bindVertexArray(null);
  }
}

// The tone map, from the accumulation buffer to the screen.
function tonePass(vw, vh) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, vw, vh);
  gl.useProgram(progTone);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(uni.uTex, 0);
  gl.uniform1f(uni.uOptical, cfg.density);
  gl.uniform1f(uni.uGlow, cfg.glow);
  gl.uniform1f(uni.uWhite, 12);
  gl.uniform3f(uni.uBg0, bg0[0], bg0[1], bg0[2]);
  gl.uniform3f(uni.uBg1, bg1[0], bg1[1], bg1[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}


// A surface needs the front layer only, or a hill behind a ridge blends into it
// and the terrain reads as a fog bank. One depth prepass writes the front
// surface pushed back by its own thickness, and the colour pass then accepts
// everything inside that slab and rejects everything behind it. Order
// independent, no sort, and the accumulation stays additive.
// Where the magnified square sits, in device pixels, origin bottom left. Null if the frame is too
// small to give a third of its short side to a diagram, which is a phone held upright.
// The i-th square, top down the right hand edge, or null if there is no room for it. Null on the
// SECOND one is the ordinary case on a short window, and the frame then shows one square rather
// than a cramped pair: a magnified view that has been squeezed says less than no magnified view.
function loupeRect(vw, vh, i) {
  const short = Math.min(vw, vh);
  const s = Math.round(Math.max(LOUPE_MIN, Math.min(LOUPE_MAX, LOUPE_FRAC * short)));
  const pad = Math.round(LOUPE_PAD * short);
  const gap = Math.round(LOUPE_GAP * short);
  // WORTH DRAWING: enough ellipses across to read as a field rather than as two blobs. This is
  // what decides that a phone gets one square and a tablet gets two; see LOUPE_ROOM.
  if (s < LOUPE_ROOM * LOUPE_MAG[i] * GAUSS_PX) return null;
  // AND NOT A LAND GRAB. LOUPE_MIN is a floor in absolute pixels, and on a small enough frame a
  // floor stops being a floor and becomes most of the picture. Past this the square is refused
  // outright rather than shrunk further, because a square below the floor shows too few ellipses
  // to be a demonstration of anything. It puts the smallest frame that gets one at about 263 px,
  // and the narrowest the project page ever gives the iframe is 296.
  if (s > short * 0.38) return null;
  // AND IT HAS TO CLEAR THE PANEL. The capture harness has no layout, and there are no controls
  // there to run into, so a missing clientWidth means the frame's own width.
  if (((canvas && canvas.clientWidth) || vw) < LOUPE_CLEAR) return null;
  // AND IT HAS TO FIT: room for the whole column, and never more than about three quarters of the
  // frame's height in squares, or the corner has stopped being a corner.
  if ((i + 1) * s + i * gap + 2 * pad > vh * 0.72) return null;
  return { x: vw - pad - s, y: vh - pad - s - i * (s + gap), s };
}

// ONE SOLID RECTANGLE in pixel coordinates, alpha blended over whatever is there. Premultiplied,
// so the blend is ONE, ONE_MINUS_SRC_ALPHA. There used to be a second version of this fixed to the
// mark colour; every mark in the frame now names its own colour, so there is one.
//
// `ring` is a rectangular OUTLINE of thickness t drawn just inside the given box. Four rects, with
// the left and right ones shortened so the corners are not drawn twice: at alpha below one, a
// doubled corner is a visibly brighter dot.
function rectCol(x0, y0, x1, y1, c, a) {
  gl.uniform4f(rectUni.uRect, x0, y0, x1, y1);
  gl.uniform4f(rectUni.uCol, c[0] * a, c[1] * a, c[2] * a, a);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function ring(x0, y0, x1, y1, t, c, a) {
  rectCol(x0, y0, x1, y0 + t, c, a);
  rectCol(x0, y1 - t, x1, y1, c, a);
  rectCol(x0, y0 + t, x0 + t, y1 - t, c, a);
  rectCol(x1 - t, y0 + t, x1, y1 - t, c, a);
}

// THE MAGNIFIED CORNER. Drawn only in the Gaussian view, where the subject is the primitives.
//
// It is the same cut, projected with the focal length multiplied by LOUPE_MAG about the middle of
// the view, written into a square in the top right corner and tone mapped through the same pass as
// the frame. Nothing is resampled: this is not a zoom of the finished image, it is the splats drawn
// again larger, so an ellipse in the corner is exactly as sharp as one in the frame. That matters
// for what the mode is claiming. A magnified screenshot would show pixels; this shows that the
// primitive really is an ellipse with a smooth falloff, at whatever size it is asked for.
//
// Why 3.5 and not ten. The split threshold in this view is an absolute 14 pixels, so a square of
// about a third of the frame holds roughly four ellipses across at 3.5 and barely one at ten. One
// ellipse says nothing. What is worth seeing is that they are DIFFERENT ellipses, of different
// sizes and orientations, overlapping, and that needs a dozen of them in the square at once.
// The aim point, projected, as an offset in pixels from the middle of the frame. Exactly the
// projection the vertex shader does, on one point, in world coordinates rather than the cut's:
// `cam.goal` and `basis.pos` are both in the current frame, so no reprojection is involved.
//
// Clamped so the marked box stays inside the frame with a margin. Early in a descent the aim can
// be well outside the frame, and a crosshair drawn off screen marks nothing; sliding it to the
// edge at least points the right way. `pad` is the half side of the box plus a little.
function loupeAim(vw, vh, pad) {
  const out = [0, 0];
  const R = basis.R, p = basis.pos, g = cam.goal;
  const d0 = g[0] - p[0], d1 = g[1] - p[1], d2 = g[2] - p[2];
  const z = -(R[6] * d0 + R[7] * d1 + R[8] * d2);          // see updateBasis: row 2 is -forward
  if (!(z > 1e-9)) return out;
  const focal = 0.5 * vh / Math.tan(0.5 * cam.fov);
  const x = focal * (R[0] * d0 + R[1] * d1 + R[2] * d2) / z;
  const y = focal * (R[3] * d0 + R[4] * d1 + R[5] * d2) / z;
  if (!isFinite(x) || !isFinite(y)) return out;
  const lx = Math.max(0, vw * 0.5 - pad), ly = Math.max(0, vh * 0.5 - pad);
  out[0] = Math.max(-lx, Math.min(lx, x));
  out[1] = Math.max(-ly, Math.min(ly, y));
  return out;
}

function drawInset(vw, vh, count) {
  const rects = [];
  for (let i = 0; i < LOUPE_MAG.length; i++) {
    const r = loupeRect(vw, vh, i);
    if (!r) break;
    rects.push(r);
  }
  if (!rects.length) return;
  // The point being magnified, as an offset in pixels from the middle of the frame. Both squares
  // show the SAME point, so there is one of these; the clamp is against the largest marked region,
  // which is the one belonging to the weakest magnification.
  const aim = loupeAim(vw, vh, rects[0].s / (2 * LOUPE_MAG[0]) + 8);
  const px = aim[0], py = aim[1];

  gl.enable(gl.SCISSOR_TEST);
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i], m = LOUPE_MAG[i];
    // Put the aim in the middle of the square. The projection scales about the eye axis, so the
    // point lands at m*(px, py) and the shift is whatever moves that to the middle of the square.
    const cx = r.x + r.s * 0.5 - vw * 0.5, cy = r.y + r.s * 0.5 - vh * 0.5;
    const mag = { m, x: cx - m * px, y: cy - m * py };
    gl.scissor(r.x, r.y, r.s, r.s);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, vw, vh);
    gl.clearColor(0, 0, 0, 0);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    splatPass(vw, vh, count, mag);
    tonePass(vw, vh);                 // still scissored, so it writes the square and nothing else
  }
  gl.disable(gl.SCISSOR_TEST);

  // The marks. A frame around the square, then the region it came from.
  //
  // BOTH ARE DRAWN THE SAME WAY: a white line with a black one on either side of it. That is what
  // every map and every measuring instrument does, and for the same reason. A single translucent
  // light mark needs a dark ground to be seen against, and half the objects here do not provide
  // one: an escape time frame is a dense field of saturated colour edge to edge, and the frame
  // around the corner square was as good as invisible on it at 0.42 alpha. Three rings need no
  // alpha at all and cannot be washed out by a bright frame, whatever colour it happens to be.
  //
  // All three sit OUTSIDE the square. The innermost one could be drawn just inside instead, which
  // would cost nothing in pixels, but it would cover the outermost splats of the very thing the
  // square exists to show.
  gl.useProgram(progRect);
  gl.uniform2f(rectUni.uVp, vw, vh);
  gl.enable(gl.BLEND);
  gl.blendEquation(gl.FUNC_ADD);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const w = Math.max(1, Math.round(vh / 720));
  for (const r of rects) {
    const x1 = r.x + r.s, y1 = r.y + r.s;
    ring(r.x - 3 * w, r.y - 3 * w, x1 + 3 * w, y1 + 3 * w, w, BLACK_COL, 0.85);
    ring(r.x - 2 * w, r.y - 2 * w, x1 + 2 * w, y1 + 2 * w, w, MARK_COL, 1.0);
    ring(r.x - w, r.y - w, x1 + w, y1 + w, w, BLACK_COL, 0.85);
  }
  // THE REGION MARKER: a plain box, white, with a black outline on BOTH sides of it.
  //
  // It was a translucent box with a crosshair in the middle, and on the escape time sets it was
  // close to invisible. Two separate reasons, and the crosshair was the worse of them. The
  // Mandelbrot and Julia frames are a dense field of saturated colour with no dark background to
  // sit on, so a single translucent light mark at 0.42 alpha has nothing to contrast against, and
  // the crosshair, being thin lines over the busiest part of the frame, disappeared entirely while
  // also covering the middle of the very region it was pointing at.
  //
  // A white line between two black ones is legible on ANY background, which is why every map and
  // every measuring instrument draws its marks that way. It costs three rings instead of one and
  // needs no alpha at all, so it cannot be washed out by a bright frame.
  //
  // ONE MARKER PER SQUARE, and they nest, which is the point. The second magnification is the
  // square of the first, so the smaller marked region sits inside the larger one in exactly the
  // proportion the larger one sits inside the frame. Read outwards, the three views are one
  // continued zoom, and the two markers say where each of them came from.
  const mx = vw * 0.5 + px, my = vh * 0.5 + py;
  for (let i = 0; i < rects.length; i++) {
    const h = rects[i].s / (2 * LOUPE_MAG[i]);   // half the side of the region that square shows
    ring(mx - h - 2 * w, my - h - 2 * w, mx + h + 2 * w, my + h + 2 * w, w, BLACK_COL, 0.85);
    ring(mx - h - w, my - h - w, mx + h + w, my + h + w, w, MARK_COL, 1.0);
    ring(mx - h, my - h, mx + h, my + h, w, BLACK_COL, 0.85);
  }
  gl.disable(gl.BLEND);
}

// THE CAPTIONS ON THE SQUARES, and they are HTML rather than drawn.
//
// Nothing else in this frame is text, and that is deliberate: there is no font in this renderer,
// no glyph atlas, and no reason to add one for two labels and a sentence. They are positioned over
// the canvas from the same rectangles the squares are drawn in. The one thing that has to be right
// is the unit: those rectangles are in DEVICE pixels and a CSS position is in CSS pixels, and on
// this page the two differ by the resource tier's pixel ratio, so a frame 989 device pixels wide
// sits inside an element 659 pixels wide.
//
// The sentence exists because of a fair complaint. The readout says thirty thousand splats in this
// mode and three hundred and forty thousand out of it, and a viewer who is not told why can only
// conclude that one of those two numbers is a lie. The mode COARSENS the cut on purpose, so that
// the primitives are large enough to be seen at all, and saying so costs one line.
let noteKey = '';
function loupeNote(vw, vh, count) {
  const box = el('loupe-note');
  if (!box) return;                                  // canvas only page, e.g. the capture harness
  const on = !!cfg.gauss && !isDirect() && count > 0 && !!loupeRect(vw, vh, 0);
  const key = on ? vw + 'x' + vh + '/' + canvas.clientWidth + 'x' + canvas.clientHeight : '';
  if (key === noteKey) return;                       // only on a resize, not every frame
  noteKey = key;
  box.hidden = !on;
  if (!on) return;
  const sx = canvas.clientWidth / Math.max(vw, 1);
  const sy = canvas.clientHeight / Math.max(vh, 1);
  let last = null;
  for (let i = 0; i < LOUPE_MAG.length; i++) {
    const lab = el('lz' + i);
    if (!lab) continue;
    const r = loupeRect(vw, vh, i);
    lab.hidden = !r;
    if (!r) continue;
    const m = LOUPE_MAG[i];
    lab.textContent = MULT + (m < 10 ? m.toFixed(1) : String(Math.round(m)));
    lab.style.left = (r.x * sx + 4) + 'px';
    lab.style.top = ((vh - r.y - r.s) * sy + 4) + 'px';
    last = r;
  }
  // The sentence is set to the square's own width, and dropped when that is too narrow to read it
  // in: at 120 CSS pixels it wraps to seven lines of three words and is a column of text rather
  // than a caption. The squares still carry their magnification, which is the part that has to be
  // there, and the panel's own note covers the rest.
  const cap = el('lcap');
  if (cap) {
    const wide = last && last.s * sx >= 150;
    cap.hidden = !wide;
    if (wide) {
      cap.style.left = (last.x * sx) + 'px';
      cap.style.top = ((vh - last.y) * sy + 5) + 'px';
      cap.style.width = (last.s * sx) + 'px';
    }
  }
}

function draw(vw, vh, count) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, vw, vh);
  gl.clearColor(0, 0, 0, 0);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  splatPass(vw, vh, count);
  tonePass(vw, vh);
  if (cfg.gauss && count > 0) drawInset(vw, vh, count);
  loupeNote(vw, vh, count);
}

/* ==== src/61_pert.js ================================================== */
/* =========== the escape time field on the GPU, in double single =========== */
// WebGL 2 has no fp64, and the plane coordinate at a deep zoom needs fourteen digits. This file is
// the arithmetic that gets them, written once and used by both GPU paths: the per pixel renderer in
// src/62_direct.js and the quadtree's field evaluator in src/63_gfield.js. It reports exactly what
// planeField reports, in the same terms, so a GPU answer and a CPU answer are interchangeable.
//
// PERTURBATION WAS TRIED FIRST AND DOES NOT WORK HERE. It is the textbook answer, it is what every
// deep zoomer uses, and the reasons it fails for this renderer are specific and measured; the full
// account is in knowledge/mandelbrot_speed.md. In short: one reference orbit in doubles on the CPU and
// every pixel as a small fp32 offset from it gets the escape VERDICT right on 99.9 percent of sampled
// points and the escape COUNT wrong by a mean of 397 iterations. The cause is that this object's
// frames are not the ones perturbation is designed for. A deep zoomer's frame is entirely close to the
// set, so every point's orbit shadows the reference for thousands of iterations; a frame centred on a
// Misiurewicz point at ten to the six is mostly FAR field, and a far field point rebases within a few
// dozen iterations, after which its perturbation IS the whole value, of order one, and adding a frame
// sized offset to an order one number in fp32 loses which pixel it was. On screen that showed as the
// smooth exterior flooding with the ramp's mean colour, because nu went noisy at the pixel scale and
// the box filter's own width, fwidth(nu), then saturated.
//
// The derivative fails separately and worse, and that one matters for any future attempt: dz/dc is a
// chaotically amplified functional of the orbit, and perturbation reconstructs the orbit's VALUE well
// while reconstructing that functional badly. Emulated in JavaScript with Math.fround, log2|dz| drifts
// 1.2 to 1.8 high near the end of a deep orbit, and three variants drift identically, including one
// with the reference orbit stored in f64 and one with the derivative arithmetic done exactly. So it is
// neither rounding nor storage.
//
// What ships instead is DOUBLE SINGLE: a pair of floats standing in for one real number, about 43 bits
// measured on this driver against a double's 53. It reaches ten to the nine, against the CPU path's
// ten to the thirteen, and it runs at 87 to 95 G iterations a second against one CPU thread's 310 M.
// Read exactAdd before touching any of it.

const PERT_GLSL = `
uniform vec2 uCtrX, uCtrY;   // the plane coordinate the query offsets are measured from, ds
uniform vec2 uCX, uCY;       // the family parameter, ds
uniform int uJulia;
uniform int uPower;
uniform int uMaxIter;

const float PB2 = 1e12;
const float LPB = 13.8155106;            // log(1e6)
const float NU_MIN = 1.5;
// |dz| passes ten to the twelve at a deep bailout and its square overflows fp32, so the derivative is
// carried as a mantissa and a separate binary exponent. Rescaling by a power of two is exact, and the
// bailout test then runs in log space, where it is also cheaper.
//
// This replaced a CAP on |dz|^2 at 1e24, which was written as an overflow guard and used as a bailout.
// The real condemnation fires at |dz| = 2|z|log|z|/rTol, which at ten to the six and a half is 2.2e12,
// so |dz|^2 is 4.8e24 and the guard fired FIRST, on most of the frame, in a branch that never assigned
// nu. Two thirds of a deep frame came out one flat colour.
const float DM_SCALE = 1e18, DM_DOWN = 2.3283064e-10, DM_DOWN2 = 5.4210109e-20;

// ---- double single ---------------------------------------------------------
// A value is a vec2 (hi, lo) standing for hi + lo.
//
// EVERY TEXTBOOK EXACT ADDITION FAILS ON THIS DRIVER, and it fails silently. The classical two sum
// recovers the rounding error after the fact:
//
//     s = a + b;  v = s - a;  e = (b - v) + (a - (s - v));
//
// which is exact in IEEE arithmetic and is ALGEBRAICALLY ZERO. A compiler that assumes addition is
// associative folds it to nothing, and then the shader keeps running and quietly delivers fp32: a
// correct looking image that has gone blocky, with no error anywhere. Measured on ANGLE over D3D11,
// with every operand arriving through a uniform so nothing could be constant folded, three
// formulations return exactly zero: the plain two sum, Dekker's magnitude ordered version, and the
// same with every intermediate forced through uintBitsToFloat(floatBitsToUint(x)), which the HLSL
// compiler sees straight through.
//
// What survives is not recovering the error at all. Split the addends by MASKING mantissa bits so the
// high halves add with nothing to lose and the remainder is exactly the masked off tail: an exponent
// compare, a shift, a mask, and subtractions of exactly representable numbers. No cancelling
// expression anywhere in it, so nothing to reassociate.
float dsSplitHi(float a) { return uintBitsToFloat(floatBitsToUint(a) & 0xfffff000u); }

// s + e = a + b, exactly. Both addends are truncated so their sum lands on a grid coarse enough that a
// carry into the next exponent cannot round it: the larger loses its lowest mantissa bit and the
// smaller is masked down to a multiple of twice the larger's ulp.
//
// The guard is 24 and NOT 25, and that off by one was worth eighteen bits. An fp32 mantissa is bits 0
// to 22, so the mask only touches mantissa bits while sh is at most 23; at sh = 24 it clears the low
// bit of the EXPONENT, which does not lose precision, it changes the value by a factor of two. sh = 24
// is the case where the small addend sits exactly at the ulp of the large one, which happens
// constantly. Measured on the GPU, the orbit carried 22 bits at sixteen iterations and nothing at all
// by a thousand; with the guard at 24, 43.2 bits at sixteen and 33.9 at a thousand.
void exactAdd(float a, float b, out float s, out float e) {
  bool aBig = abs(a) >= abs(b);
  float x = aBig ? a : b;
  float y = aBig ? b : a;
  int ex = (floatBitsToInt(x) >> 23) & 0xff;
  int ey = (floatBitsToInt(y) >> 23) & 0xff;
  int sh = ex - ey + 1;
  if (sh >= 24 || ey == 0 || ex == 0) { s = x; e = y; return; }
  float yh = uintBitsToFloat(floatBitsToUint(y) & (0xffffffffu << uint(sh)));
  float xh = uintBitsToFloat(floatBitsToUint(x) & 0xfffffffeu);
  s = xh + yh;
  e = (x - xh) + (y - yh);
}
vec2 dsAdd(vec2 a, vec2 b) {
  float s, e;
  exactAdd(a.x, b.x, s, e);
  // e, a.y and b.y all sit at or below the ulp of s, so an ordinary sum of them rounds at the 2^-48
  // level, which is this representation's own floor. One more exact addition then moves whatever
  // belongs in the high word up into it.
  float lo = e + (a.y + b.y);
  float s2, e2;
  exactAdd(s, lo, s2, e2);
  return vec2(s2, e2);
}
vec2 dsSub(vec2 a, vec2 b) { return dsAdd(a, vec2(-b.x, -b.y)); }
vec2 dsMul(vec2 a, vec2 b) {
  float ah = dsSplitHi(a.x), al = a.x - ah;      // exact, both halves
  float bh = dsSplitHi(b.x), bl = b.x - bh;
  float p = a.x * b.x;                            // rounded product
  // ... and its exact error, from the four cross terms. ah*bh, ah*bl, al*bh, al*bl each fit in 24
  // bits, so every one is exact, and ah*bh - p is exact by Sterbenz. This one DOES survive: the
  // compiler cannot prove ah*bh equals a.x*b.x, because ah came out of a bit mask, so there is no
  // algebraic identity for it to cancel.
  float e = ((ah * bh - p) + ah * bl + al * bh) + al * bl;
  e += a.x * b.y + a.y * b.x;
  float s, r;
  exactAdd(p, e, s, r);
  return vec2(s, r);
}
// Multiplying by two is exact in binary, so it needs no renormalization at all.
vec2 dsTwice(vec2 a) { return vec2(a.x + a.x, a.y + a.y); }

// The result. why uses the same numbering as pfl in src/32_plane.js: 4 escaped, 2 an attracting cycle,
// 1 condemned by the derivative, 3 out of iterations.
struct Fld { float nu; float de; float gnu; int why; int iters; };

// THE ANALYTIC INTERIOR TEST, IN DOUBLE SINGLE, and it used to be a uniform computed on the CPU at
// the frame's centre and four corners because "it needs the coordinate to full precision, and the
// shader has only an fp32 offset". That was true before this file existed. The shader has the
// coordinate to full precision now: px and py below ARE the point, as a pair, to about 43 bits, so
// the same two lines of algebra run here and answer per pixel.
//
// Not an optimization. Measured at ten to the two and a bit on a 1100x1280 frame of the seahorse
// valley, with the frame straddling the cardioid's boundary so the five point CPU test returned
// "mixed" and switched itself off: a band 25 px wide along the inside of the cardioid, and a ring
// round every bulb in the frame, came back OUT OF ITERATIONS and was painted the flat light grey
// that verdict gets. That band is the "weird thick gray bands especially around the black blobs".
// It is not a colour bug and it is not a cap that is too low: an interior point is proven interior
// only when its orbit closes, the multiplier of a component goes to one at that component's own
// boundary, so the number of iterations needed goes to infinity there no matter what the cap is.
// The cardioid and the period two bulb are the two cases where no orbit is needed at all.
//
//   cardioid:  q = (x - 1/4)^2 + y^2,  inside iff q (q + x - 1/4) < y^2 / 4
//   period 2:  (x + 1)^2 + y^2 < 1/16
//
// Both comparisons are made by subtracting in double single and testing the sign of the HIGH word,
// which is the whole point: near the boundary the two sides cancel to many digits, and in fp32 the
// difference would be noise.
bool dsInMainBody(vec2 x, vec2 y) {
  vec2 y2 = dsMul(y, y);
  vec2 xm = dsSub(x, vec2(0.25, 0.0));
  vec2 q = dsAdd(dsMul(xm, xm), y2);
  // 0.25 * y2 is exact: a power of two scales both words with no rounding.
  if (dsSub(dsMul(q, dsAdd(q, xm)), vec2(0.25 * y2.x, 0.25 * y2.y)).x < 0.0) return true;
  vec2 xp = dsAdd(x, vec2(1.0, 0.0));
  return dsSub(dsAdd(dsMul(xp, xp), y2), vec2(0.0625, 0.0)).x < 0.0;
}

// dc is the offset of this point from uCtr, in plane units, added in double single so the sum keeps
// its digits. rTol is the half size of the cell or half a pixel, whichever the caller means; it drives
// the derivative bailout.
Fld pertField(vec2 dc, float rTol) {
  Fld o;
  o.nu = 0.0; o.de = 0.0; o.gnu = 1e30; o.why = 3; o.iters = 0;
  vec2 px = dsAdd(uCtrX, vec2(dc.x, 0.0));
  vec2 py = dsAdd(uCtrY, vec2(dc.y, 0.0));
  // Proven interior, exactly, in about sixty flops instead of an orbit. See dsInMainBody.
  if (uJulia == 0 && uPower == 2 && dsInMainBody(px, py)) { o.why = 2; return o; }
  vec2 zx, zy, cx, cy;
  float dzx, dzy;
  if (uJulia == 1) { zx = px; zy = py; cx = uCX; cy = uCY; dzx = 1.0; dzy = 0.0; }
  else { zx = vec2(0.0); zy = vec2(0.0); cx = px; cy = py; dzx = 0.0; dzy = 0.0; }

  float lrt2 = 2.0 * log2(max(rTol, 1e-38));
  float one = (uJulia == 1) ? 0.0 : 1.0;
  float fp = float(uPower);
  float lnp = log(fp);
  float m2 = 0.0, dlog2 = 0.0, ltPrev = -1e30;
  int n = 0;
  int per = 8, chk = 8;
  // Brent's reference point, kept as the FULL double single pair rather than as the high words.
  // See the cycle test below; this is the difference between an interior that is proven and an
  // interior that comes back as the out-of-iterations colour over half a deep frame.
  vec2 rrx = vec2(0.0), rry = vec2(0.0);

  for (int it = 0; it < 1000000; it++) {
    if (it >= uMaxIter) break;
    // z^(p-1), with a separate branch for the square. The same split the CPU kernel makes and for the
    // same reason: this loop IS the object. The general form costs four double single multiplies on
    // the p = 2 case that the square needs three of in total. uPower is a uniform, so the branch is
    // coherent across the whole draw and costs nothing in divergence.
    vec2 wx, wy;
    if (uPower == 2) { wx = zx; wy = zy; }
    else {
      wx = vec2(1.0, 0.0); wy = vec2(0.0);
      for (int k = 1; k < 8; k++) {
        if (k >= uPower) break;
        vec2 t = dsSub(dsMul(wx, zx), dsMul(wy, zy));
        wy = dsAdd(dsMul(wx, zy), dsMul(wy, zx));
        wx = t;
      }
    }
    // dz' = p z^(p-1) dz + 1. The derivative is fp32: it only ever feeds a distance estimate and a
    // bailout test, both of which want three digits, not fourteen.
    float mxr = fp * wx.x, myr = fp * wy.x;
    float ndzx = mxr * dzx - myr * dzy + one;
    float ndzy = mxr * dzy + myr * dzx;
    dzx = ndzx; dzy = ndzy;
    vec2 nzx, nzy;
    if (uPower == 2) {
      nzx = dsAdd(dsSub(dsMul(zx, zx), dsMul(zy, zy)), cx);
      nzy = dsAdd(dsTwice(dsMul(zx, zy)), cy);
    } else {
      nzx = dsAdd(dsSub(dsMul(wx, zx), dsMul(wy, zy)), cx);
      nzy = dsAdd(dsAdd(dsMul(wx, zy), dsMul(wy, zx)), cy);
    }
    zx = nzx; zy = nzy;
    n = it + 1;
    m2 = zx.x * zx.x + zy.x * zy.x;
    if (m2 > PB2) { o.why = 4; break; }
    float dm = dzx * dzx + dzy * dzy;
    if (dm > DM_SCALE) { dzx *= DM_DOWN; dzy *= DM_DOWN; dm *= DM_DOWN2; dlog2 += 32.0; }
    if ((it & 7) == 7) {
      // Condemned: the running distance estimate has dropped below rTol, so the boundary is inside
      // this cell or pixel and no further iteration can change the verdict. Written exactly, as
      // m log(m)^2 < rTol^2 |dz|^2, in log2 because the ratio itself passes ten to the twenty five.
      if (m2 > 1.0) {
        float lm = log(m2);
        float lt = log2(dm / (m2 * lm * lm)) + 2.0 * dlog2 + lrt2;
        if (lt > 0.0) {
          // Interpolate the crossing between the last two checks, so the escape count is continuous
          // in the point instead of jumping by eight. In log space that is a division, not two logs.
          float fr = 1.0;
          if (ltPrev > -1e29 && lt > ltPrev) fr = clamp(-ltPrev / (lt - ltPrev), 0.0, 1.0);
          o.nu = float(n) - 8.0 + 8.0 * fr;
          o.why = 1; break;
        }
        ltPrev = lt;
      }
      // BRENT'S CYCLE TEST, ON THE PAIR AND NOT ON THE HIGH WORD, and this one line was most of
      // what looked like a tone bug in this path.
      //
      // An interior point's orbit converges to an attracting cycle, and that convergence is the
      // only thing that ever PROVES interior; running out of iterations proves nothing and is drawn
      // as its own flat colour, which is light. The test used to compare high words with a
      // tolerance of 1e-10, and the note beside it argued that this was the conservative direction
      // because at |z| of order one an fp32 ulp is 1.2e-7, so only bitwise equality could meet it.
      // That is true and it is exactly the problem: a cycle whose multiplier is near one converges
      // geometrically and reaches 1.2e-7 in a few hundred iterations and bitwise equality never,
      // because the low word keeps moving. So at depth NOTHING was ever proven interior. Measured
      // at ten to the six on a 1377x1592 frame, against the CPU path which proves it in doubles:
      // whole interior regions came back as the out-of-iterations grey, about 40 percent of the
      // frame, and the mean displayed luminance was 0.33 against the splat path's 0.26.
      //
      // The pair carries about 43 bits, so the same 1e-10 IS reachable against the pair. The
      // difference of the high words is exact by Sterbenz once they are within a factor of two of
      // each other, which they are long before this fires, so adding the difference of the low
      // words recovers the full precision residual. Same tolerance, same conservatism, and it now
      // fires when the orbit really has closed.
      if (n > 24) {
        float ex = (zx.x - rrx.x) + (zx.y - rrx.y);
        float ey = (zy.x - rry.x) + (zy.y - rry.y);
        if (abs(ex) + abs(ey) < 1e-10) { o.why = 2; break; }
        chk -= 8;
        if (chk <= 0) { rrx = zx; rry = zy; per += per; chk = per; }
      }
    }
  }
  o.iters = n;
  if (o.why == 4) {
    float az = sqrt(m2);
    float lr = 0.5 * log(m2);
    // Smooth escape count: n minus log_p of log|z| over log B, which removes the integer banding and
    // makes nu a continuous function of the point. That continuity is the whole reason the colour can
    // be gradual.
    o.nu = float(n) - log(lr / LPB) / lnp;
    // de = 2|z|log|z| / |dz|, with |dz| carried as a mantissa and an exponent, so recovered through
    // exp2. A point whose derivative has run away underflows to zero, which is the right answer for a
    // point that is on the boundary as far as this cell can tell.
    float ldz = 0.5 * log2(dzx * dzx + dzy * dzy) + dlog2;
    float num = 2.0 * az * lr;
    o.de = num > 0.0 ? exp2(log2(num) - ldz) : 0.0;
    // |grad nu| = |dz| / (|z| log|z| ln p), which the quadtree's split criterion needs.
    o.gnu = exp2(min(ldz - log2(az * max(lr, 1e-12) * lnp), 100.0));
  }
  return o;
}
`;

// The high and low halves of a double, for the uniforms above. The high part is what an fp32 can
// hold; the low part is the rest, exactly.
function splitDS(x) {
  const hi = Math.fround(x);
  return [hi, Math.fround(x - hi)];
}

/* ==== src/62_direct.js ================================================ */
/* ================== the escape time field, per pixel, on the GPU ========== */
// The same mathematics as src/32_plane.js, evaluated once per PIXEL in a fragment shader instead of
// once per quadtree cell on the CPU. No splats, no refinement, no budget: every pixel gets its own
// orbit and the answer is exact at the sampling rate of the screen.
//
// This exists to answer one question honestly, and the answer belongs in the menu rather than in a
// document: how much of the plane objects' softness is the SPLAT REPRESENTATION and how much is the
// COMPUTE. Measured, the split is unambiguous. A plane cut is 100 percent escape time iteration: at
// ten to the six a converged cut executes 3.48 billion iterations in 11.2 seconds, 310 million a
// second, and the quadtree walk that decides which cells exist measures below the noise floor. So
// the CPU is not slow at deciding; it is slow at arithmetic, because it does it one number at a
// time. A fragment shader does not: the same frame is 2.2 million independent orbits.
//
// It is worth being clear that this path is the DUMBEST possible algorithm. No adaptivity, no

// than the splat path for the same frame; see the work comparison in knowledge/mandelbrot_speed.md.
// It wins on wall clock because of the processor and for no other reason.
//

const DIRECT_VS = `#version 300 es
precision highp float;
void main() {

precision highp float;
precision highp int;

uniform vec2 uVp;            // viewport, pixels
uniform float uFocal;
uniform vec2 uA, uB;         // the homography's two numerators, see directMap
uniform vec3 uWrow;          // and its denominator
uniform float uPosY;         // camera height above the plane
uniform float uPix;          // one pixel, in plane units, at the centre of the frame
// ---- appearance ------------------------------------------------------------
uniform float uNuInv;        // 1 / nuCycle
uniform sampler2D uPalTex;   // the colour ramp: PAL x 1, linear light, a closed loop
uniform sampler2D uPalIntTex;// and its integral, (PAL+1) x 1. See rampBox
uniform vec3 uPalMean;

uniform int uSS;             // supersampling grid, uSS by uSS, and 1 is off. See shadePixel

const float TANGLE_SET = 0.45;           // see emitPlane in src/52_cut_plane.js
const float DEEP_SET = 0.60;
const float FILT_MAX = 0.30;
const int PAL_I = ` + PAL + `;           // the palette table's length, shared with src/40_state.js

// false until this was written.
//
// This path used to carry the preset's NINE STOPS as a uniform array and interpolate between them
// in linear light. The splat path builds a 256 entry table by interpolating the same stops in
// DISPLAY space and linearizing afterwards. Those are different curves: a lerp between two stops
// lands at the same triple either way, but read as display that triple is darker than read as
// linear light, so the two renderers disagreed about every colour that was not a stop.
//
// MEASURED, over the whole of the old nine stop ramp, and the number is worth writing down
// because the guess was wrong. This path came out 1.4 percent lighter in Oklab L and 2.7 percent
// LESS colourful, with a worst case gap of 0.021 in L, about two percent of the ramp's range. So
// the disagreement was real and it was small, and it is not what the two objects looked different
// by. The answer to that was the anti-aliasing, in planeNeedsAA over in src/52_cut_plane.js, which
// was averaging shaded colours and cost eleven points of saturation and half the detail.
//
// It is fixed anyway, and the reason is not the size of the error. The whole point of having both
// objects in the menu is that the button between them changes the REPRESENTATION and nothing else;
// a difference of any size that comes from the palette rather than from the representation makes
// the comparison say something it does not mean.
//
// So the table crosses as a texture and there are no stops here at all. texelFetch and an explicit
// mix rather than hardware LINEAR filtering, because the integral below needs fp32 and filtering a
// float texture needs an extension this does not otherwise want. No back quotes anywhere in this
// comment, either: it lives inside a JavaScript template literal, and one closed the shader.
vec3 palAt(int i) { return texelFetch(uPalTex, ivec2(i, 0), 0).rgb; }
vec3 ramp(float t) {
  float x = fract(t) * PAL_F;
  int i = int(x);
  return mix(palAt(i), palAt(i + 1 == PAL_I ? 0 : i + 1), x - float(i));
}
// F(v), the integral of the ramp from 0 to v, extended past one period by adding whole period
// integrals: that is exactly palMean per turn. b < 2 always here, so one wrap is enough.
vec3 palIntAt(float t) {
  vec3 add = vec3(0.0);
  if (t >= 1.0) { t -= 1.0; add = uPalMean; }
  float x = t * PAL_F;
  int i = int(x);
  if (i > PAL_I) i = PAL_I;
  vec3 a = texelFetch(uPalIntTex, ivec2(i, 0), 0).rgb;
  vec3 b = texelFetch(uPalIntTex, ivec2(i + 1, 0), 0).rgb;
  return mix(a, b, x - float(i)) + add;
}
// The exact average of the periodic ramp over an interval of width s turns centred on t. Two
// lookups and a subtraction, and it is the SAME arithmetic as rampBox in src/40_state.js, line for
// line. What was here before was twelve stratified samples of the nine stop ramp, which was an
// approximation to a different function.
vec3 rampBox(float t, float s) {
  if (s < 1e-4) return ramp(t);
