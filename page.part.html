<style>
/* ---------------------------------------------------------------------------
   A demo, and nothing else. The canvas fills the window; the controls are the
   few a viewer wants while watching, and the readout stays because reporting
   splat count and frame time honestly is a rule of this project, not
   decoration. Everything else about the frame is one press away behind the
   info button.

   THE COLOURS ARE THE SITE'S. This viewer is embedded in a page on
   marcelpadilla.com and used to carry its own amber-on-near-black palette,
   which read as a different piece of software bolted into the page. The tokens
   below are the site's own, copied from Source/CSS/style_new.css: the light
   ramp is the TU Berlin red the site brands with, the dark ramp is the higher
   tone version that sheet uses on dark grounds because a deep red on near
   black is 2.97:1 and fails every contrast floor. Which one applies is decided
   at load and re-decided whenever the page's toggle moves; see themeInit in
   src/70_ui.js.
   --------------------------------------------------------------------------- */
:root {
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Dark is the default because the render behind these controls is dark in
     both themes: every object's background gradient is near black by design,
     since an emissive measure has to be shown against something that is not
     emitting. The light theme therefore does not turn the panel white, it
     lightens the panel and swaps the accent to the light ramp's red. */
  --ink: #ece7e6;          /* warm-100 */
  --dim: #b3a9a7;          /* warm-250 */
  --live: #ff6a4f;         /* red-dark-ink, 5.4:1 on this panel */
  --fill: #8f1f1c;         /* red-dark-fill, white label 8.82:1 */
  --fill-hi: #b62b28;      /* red-dark-fill-hi */
  --on-fill: #ffffff;
  --rule: rgba(236, 231, 230, 0.16);
  --panel: rgba(13, 10, 10, 0.74);      /* warm-950 */
  --panel-2: rgba(13, 10, 10, 0.42);
}
:root[data-vp-theme="light"] {
  --ink: #f4f1f0;
  --dim: #c9c0be;
  --live: #ff8f78;         /* the light ramp's #930000 is unreadable on a dark render */
  --fill: #930000;         /* main_color_light, the site's resting button fill */
  --fill-hi: #c20000;      /* main_color_very_light */
  --on-fill: #ffffff;
  --rule: rgba(255, 255, 255, 0.22);
  --panel: rgba(48, 20, 20, 0.72);
  --panel-2: rgba(48, 20, 20, 0.38);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
#gl {
  display: block; width: 100vw; height: 100vh;
  cursor: crosshair;
  /* pan-y and not none, and it is the difference between a page a phone can read and one it
     cannot. `none` gives the canvas every gesture, which is right for a full window demo and
     wrong for one embedded in a page: a finger dragged up the viewer then does nothing at all
     and the reader is stuck at the demo with no way past it. `pan-y` leaves the vertical swipe
     to the page and keeps the horizontal drag and the two finger pinch, which are the two
     gestures this viewer actually uses. */
  touch-action: pan-y;
}

#controls {
  position: fixed; left: 0; top: 0; padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 8px;
  width: 252px; max-width: 66vw;
  background: linear-gradient(160deg, var(--panel), var(--panel) 62%, var(--panel-2) 96%, transparent);
  font: 400 12px/1.45 var(--mono); color: var(--ink);
}
select, button { font: inherit; color: inherit; }
select {
  width: 100%; padding: 6px 8px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
  /* The native dropdown list is drawn by the OS, not by this stylesheet, so its own colours
     come from the page's colour-scheme. Naming it here keeps the open list dark like the
     control that opened it instead of a white sheet over a dark render. */
  color-scheme: dark;
}
select:hover { border-color: var(--live); }
button {
  padding: 6px 10px; border-radius: 3px; cursor: pointer; letter-spacing: .06em;
  text-transform: uppercase; font-size: 11px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
}
button:hover:not(:disabled) { border-color: var(--live); color: var(--live); }
button[data-on="1"] {
  background: var(--fill); border-color: var(--fill); color: var(--on-fill);
}
button[data-on="1"]:hover { background: var(--fill-hi); border-color: var(--fill-hi); color: var(--on-fill); }
button:disabled { opacity: 0.38; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--live); outline-offset: 1px;
}

/* ---- the two switches --------------------------------------------------------
   Both of these were plain buttons whose LABEL carried the state, and both were
   read the wrong way round for the same reason. A button that says "Show
   Gaussians" reads as an ACTION, so nothing on it said whether the mode was
   currently on; a button that says "Gaussian splats" while Gaussian splats are on
   screen reads as an offer to switch TO them. A sliding switch has no such
   ambiguity: the knob is on one side or the other, and the side it is on is the
   state, which is why every settings panel in the world uses one.

   The whole row is the button, so the pointer target is the width of the panel
   rather than a thirty pixel pill, and pressing the label works as well as
   pressing the track. The spans are pointer-events: none so every press is
   reported by the button itself and there is no dead zone between them.
   --------------------------------------------------------------------------- */
.sw {
  display: flex; align-items: center; gap: 9px; width: 100%;
  text-align: left; text-transform: none; letter-spacing: .03em; font-size: 11.5px;
}
.sw > span { pointer-events: none; }
.sw-l { flex: 1 1 auto; }
.sw-r { flex: 0 0 auto; min-width: 2.1em; }
/* The centred variant, for a switch between two named things rather than between on and off:
   the two labels take equal space, so the track sits in the middle with one on each side. */
.sw-mid .sw-l { flex: 1 1 0; text-align: right; }
.sw-mid .sw-r { flex: 1 1 0; min-width: 0; text-align: left; }
/* Whichever side is live is in the ink colour and the other is dimmed, so the labels carry the
   state too and the switch is still readable to someone who cannot see the knob move. */
.sw[data-on="0"] .sw-l, .sw[data-on="1"] .sw-r { color: var(--ink); }
.sw[data-on="0"] .sw-r, .sw[data-on="1"] .sw-l { color: var(--dim); }
/* The track, in fixed pixels rather than em, because it is a switch and not text. */
.sw-t {
  flex: 0 0 auto; position: relative; width: 30px; height: 15px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.16); border: 1px solid var(--rule);
  transition: background 120ms linear, border-color 120ms linear;
}
.sw-t::after {
  content: ""; position: absolute; top: 1px; left: 1px; width: 11px; height: 11px;
  border-radius: 50%; background: var(--ink);
  transition: transform 120ms ease, background 120ms linear;
}
.sw[data-on="1"] .sw-t { background: var(--fill); border-color: var(--fill); }
.sw[data-on="1"] .sw-t::after { transform: translateX(15px); background: var(--on-fill); }
/* The panel's filled-button rule is for a button that lights up while it is on. A switch says
   that with its knob, so the row itself stays the resting colour in both states. */
button.sw[data-on="1"] {
  background: rgba(0, 0, 0, 0.55); border-color: var(--rule); color: var(--ink);
}
button.sw:hover:not(:disabled) { border-color: var(--live); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .sw-t, .sw-t::after { transition: none; } }

/* A slider row: the label and its value on top, the track under them. `.ctl-run` puts a
   square play/pause button to the left of the whole thing, which is what makes the speed
   control one line instead of two stacked controls. */
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: baseline; }
.ctl span { color: var(--dim); font-size: 10.5px; letter-spacing: .10em; text-transform: uppercase; }
.ctl output { color: var(--live); font-variant-numeric: tabular-nums; }
/* The track is drawn rather than left to `accent-color` alone. accent-color tints the FILLED
   part and the thumb and leaves the empty part the platform's own near white, which on a panel
   floating over a dark render is a bright bar across every control and was the loudest thing in
   the frame. */
.ctl input[type="range"] {
  grid-column: 1 / -1; display: block; width: 100%; margin: 0; height: 16px;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
.ctl input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.20);
}
.ctl input[type="range"]::-moz-range-track {
  height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.20);
}
.ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--fill-hi); border: 1px solid var(--rule);
}
.ctl input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--fill-hi); border: 1px solid var(--rule);
}
/* ---- the speed track's two marks --------------------------------------------
   A DEFAULT MARK AND A CHANGE OF SCALE, and both are read off the same mapping
   the handle uses, through two custom properties set in src/70_ui.js.

   The tick is at speed 1. It is a MARK AND NOT A DETENT: the handle slides past
   it without catching, because a control that snaps to its default cannot be
   used to sit just beside the default, which is most of what a speed control is
   for (2026-08-12: "It shouldn't snap to it when you slide, but definitely, I
   want to see a marker").

   Past the knee the track lightens, and that is the only honest way to draw what
   is happening there: the last third of the travel is worth 2x to 64x, so equal
   distances stop meaning equal changes and the track should not go on looking
   like they do. */
.trk { grid-column: 1 / -1; position: relative; display: block; line-height: 0; padding-bottom: 5px; }
.trk .tick {
  /* UNDER the track and not across it. Across it, the mark is covered by the handle at exactly the
     value it marks, which is the one position where a viewer looks for it to confirm where they
     are. The input is 16px tall and the handle is 14, so there is no room inside it for a mark the
     handle cannot reach. */
  position: absolute; top: 15px; width: 2px; height: 5px; pointer-events: none;
  background: var(--ink); opacity: .8;
  /* The travel is inset by half a thumb at each end, which is where the 7px and
     the 14px come from: the thumb is 14px wide. */
  left: calc(6px + var(--spd-def) * (100% - 14px));   /* less half the mark, to centre it */
}
#s-rate::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.20) 0 var(--spd-knee),
                                     rgba(255, 255, 255, 0.44) var(--spd-knee) 100%);
}
#s-rate::-moz-range-track {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.20) 0 var(--spd-knee),
                                     rgba(255, 255, 255, 0.44) var(--spd-knee) 100%);
}
/* The value is a text field that looks like a number, because the slider stops
   at 64 and the renderer does not: measured, the dragon reaches 10^2084 at speed
   1000 with a position error of 0.000 px. Click it and type. */
.ctl output.edit { cursor: text; outline: none; border-bottom: 1px dotted var(--rule); }
.ctl output.edit:hover, .ctl output.edit:focus { border-bottom-color: var(--live); }
.ctl output.edit:focus { color: var(--ink); }
.ctl input[type="range"]:hover::-webkit-slider-thumb { background: var(--live); }
.ctl input[type="range"]:hover::-moz-range-thumb { background: var(--live); }
.ctl-row { display: flex; gap: 8px; align-items: stretch; }
.ctl-row .ctl { flex: 1 1 0; min-width: 0; }
/* The run button is square and the same height as the two line slider next to it. */
#btn-run, #btn-reset {
  flex: 0 0 auto; width: 34px; padding: 0; font-size: 13px; line-height: 1;
  display: grid; place-items: center;
}
/* Narrower than the play control and never filled, because it is not a state: reset is an action
   that happens once and leaves nothing switched on behind it. */
#btn-reset { width: 26px; font-size: 14px; }
/* The family parameter belongs to the Julia set, the exponent to both plane objects,
   and neither means anything for an iterated function system. */
#controls:not([data-julia="1"]) .julia-only { display: none; }
#controls:not([data-kind="plane"]) .plane-only { display: none; }

/* Tiny, and only on the objects that name more than one aim: a second thought about a choice
   already made, sitting right under the transport row it belongs with. Not uppercase like the
   panel's other buttons, since a jump cut is closer to a sentence than a switch. */
#btn-aim {
  align-self: flex-start; margin-top: -1px; text-transform: none;
  padding: 3px 7px; font-size: 9.5px; letter-spacing: .03em;
}
#controls:not([data-aims="1"]) #btn-aim { display: none; }

/* ---- the readout ------------------------------------------------------------
   Three numbers always: splats, frame time, resolution. That is the project's
   rule and it is also all a viewer wants while watching. The zoom, the cut
   breakdown, the buffer format and the hardware string are all real and all
   answer a question nobody is asking during a descent, so they live behind the
   info button and are off by default. */
#sound {
  /* The right reserve is the tool bar's width and the left is the info button's, both measured
     rather than guessed: the bar is 268 px at this font and the button is 24 px on an 8 px inset. */
  position: fixed; left: 0; right: 0; bottom: 0; padding: 7px 284px 8px 40px;
  display: flex; flex-wrap: wrap; gap: 0 16px; pointer-events: none;
  background: linear-gradient(0deg, var(--panel), var(--panel-2) 62%, transparent);
  font: 400 11px/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink);
}
#sound span { white-space: nowrap; }
#sound i { font-style: normal; color: var(--dim); }
#sound b { font-weight: 400; color: var(--live); }
#sound b[data-warn="1"] { color: #ff7a5f; }
#sound .more { flex-basis: 100%; white-space: normal; color: var(--dim); }
/* ---- the progress bar --------------------------------------------------------
   Only the escape time objects have it, and only because only they are slow
   enough to need one: a plane cut is 0.4 to 8 seconds of one CPU thread and the
   sharpening ramp that follows it runs for twenty five, so without this the
   viewer sees a picture quietly improving with nothing to say whether more is
   coming or whether that is all there is (2026-08-12: "I also think the
   Mandelbrot and Julia set should have some sort of loading bars").

   It is a THIN RULE and not a widget. It sits in the readout strip, in the
   readout's own colours, and it disappears the moment there is nothing left to
   wait for, because a progress bar that is always on screen stops being read.
   The track is drawn at low contrast so an empty bar is not mistaken for a
   full one. */
#prog { display: flex; align-items: center; gap: 7px; flex-basis: 100%; }
#prog[hidden] { display: none; }
#prog i { font-style: normal; color: var(--dim); }
#prog .track {
  flex: 1 1 auto; max-width: 260px; height: 3px; border-radius: 2px;
  background: rgba(255, 255, 255, 0.14); overflow: hidden;
}
#prog .track b {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background: var(--live); transition: width .12s linear;
}
#sound .more b { color: var(--ink); }
#controls:not([data-info="1"]) ~ #sound .more { display: none; }
#btn-info {
  /* Outside #controls, so it inherits from the document rather than from the panel and came out
     black on black. Both colours are named here. */
  color: var(--ink); background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
  /* Bottom LEFT, at the head of the readout it opens, rather than at the far end of the strip
     from it. The bottom right is the tool bar's now. */
  position: fixed; left: 8px; bottom: 7px; z-index: 2;
  width: 24px; height: 24px; padding: 0; border-radius: 50%;
  font: 400 13px/1 var(--mono); text-transform: none; letter-spacing: 0;
  display: grid; place-items: center;
}
/* ---- the tool bar -------------------------------------------------------------
   Three controls that are about the ROOM rather than about the object, which is why
   they are not in the panel: whether the viewer moves on by itself, what fills the
   screen, and whether there is anything on screen but the render. The panel above is
   the object's settings and this row is everything around it, so they are at opposite
   corners and nothing has to be read to tell them apart.

   The buttons are the document's and not the panel's, so like #btn-info they name
   their own colours: `color: inherit` outside #controls is the document's black.
   --------------------------------------------------------------------------- */
#tools {
  position: fixed; right: 8px; bottom: 7px; z-index: 2;
  display: flex; align-items: stretch; gap: 6px;
  font: 400 12px/1.45 var(--mono); color: var(--ink);
}
#tools button { color: var(--ink); background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule); }
/* SPECIFICITY, and it is not a detail here: `#tools button` carries an id and outranks the
   panel's own `button[data-on="1"]` and `button:hover`, so without these three lines the auto
   switch would have no visible on state at all and nothing in the bar would answer the pointer.
   A switch whose state cannot be seen reads as an action, which is the whole argument in the
   note on the two sliding switches above. */
#tools button[data-on="1"] { background: var(--fill); border-color: var(--fill); color: var(--on-fill); }
#tools button[data-on="1"]:hover { background: var(--fill-hi); border-color: var(--fill-hi); color: var(--on-fill); }
#tools button:not([data-on="1"]):hover:not(:disabled) { border-color: var(--live); color: var(--live); }
/* The period, beside its switch rather than inside it: a field that takes a caret cannot live in
   a button, where every click would toggle the thing it is trying to edit. Same chip as the
   button next to it so the two read as one control. */
#tools .num {
  display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid var(--rule);
  font-size: 11px; letter-spacing: .06em;
}
#tools .num i { font-style: normal; color: var(--dim); }
#tools .num output {
  color: var(--live); font-variant-numeric: tabular-nums;
  min-width: 2ch; text-align: right; cursor: text; outline: none;
  border-bottom: 1px dotted var(--rule);
}
#tools .num output:hover, #tools .num output:focus { border-bottom-color: var(--live); }
#tools .num output:focus { color: var(--ink); }
/* The full screen icon is the four corner brackets every player and map uses, drawn rather than
   set in a font: there is no font in this viewer and two glyphs are not a reason to load one.
   Both states are in the markup and the attribute chooses; `data-fs` and not `data-on`, so the
   panel's filled-button rule does not paint "you are in full screen" in the accent red. */
#btn-full { padding: 0; width: 30px; display: grid; place-items: center; }
#btn-full svg { display: block; width: 15px; height: 15px; }
#btn-full .fs-out, #btn-full[data-fs="1"] .fs-in { display: none; }
#btn-full[data-fs="1"] .fs-out { display: block; }
/* Nothing to offer when the API is missing or the frame was embedded without allowfullscreen. */
#btn-full[hidden] { display: none; }

/* ---- the hidden interface ----------------------------------------------------
   Everything goes except the control that undoes it, which stays exactly where it
   was at low opacity. A control that vanished with the rest would leave a viewer
   with a full screen render and no way back but the keyboard, and someone who has
   just hidden the interface is the last person who should have to guess a key.
   Hovering or focusing it brings it back to full strength, so it is a ghost to the
   room and an ordinary button to the hand. Escape restores as well; see the keydown
   handler in src/70_ui.js.
   --------------------------------------------------------------------------- */
:root[data-ui="0"] #controls,
:root[data-ui="0"] #sound,
:root[data-ui="0"] #btn-info,
:root[data-ui="0"] #btn-auto,
:root[data-ui="0"] #tools .num,
:root[data-ui="0"] #btn-full,
:root[data-ui="0"] #loupe-note { display: none; }
:root[data-ui="0"] #btn-hide { opacity: .45; }
:root[data-ui="0"] #btn-hide:hover, :root[data-ui="0"] #btn-hide:focus-visible { opacity: 1; }

/* ---- the magnified squares' captions ----------------------------------------
   Text, over a canvas that has no text in it. There is no font in this renderer
   and no reason to add one for two labels and a sentence, so these are ordinary
   elements positioned from the same rectangles the squares are drawn in; see
   loupeNote in src/60_gl.js, and mind that those rectangles are in DEVICE pixels.

   The sentence is the point of the whole block. The readout says sixteen
   thousand splats in this mode and three hundred and forty thousand out of it,
   and a viewer who is not told why can only conclude that one of the two is a
   lie. Shortened to one line on 2026-08-12 at Marcel's wording: four lines of
   monospace beside a magnified square is a paragraph where a label is wanted. */
#loupe-note {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  font: 400 10.5px/1.35 var(--mono);
}
#loupe-note[hidden] { display: none; }
#loupe-note .lz {
  position: absolute; font-weight: 400; letter-spacing: .08em; color: var(--ink);
  background: rgba(0, 0, 0, 0.80); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0 4px 1px;
}
#loupe-note .lz[hidden] { display: none; }
/* On its own chip, because it lands ON the render and the render can be anything from black to
   a field of saturated colour. A text shadow is not enough against the second of those. */
#lcap {
  position: absolute; color: var(--ink); text-align: right; text-wrap: balance;
  background: rgba(0, 0, 0, 0.80); border: 1px solid var(--rule); border-radius: 2px;
  padding: 3px 5px 4px;
}
#lcap[hidden] { display: none; }
@media (max-width: 620px) { #loupe-note { font-size: 9.5px; } #lcap { display: none; } }

#nogl {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 30px;
  text-align: center; color: #ff7a5f; font: 400 14px/1.6 var(--mono); background: #05070b;
}
#nogl[hidden] { display: none; }
/* Narrow windows, which on this page means a phone. The readout is the first thing to give:
   it is a rule of this project that the numbers are on screen, not that all of them are, and a
   line of monospace that runs off the edge reports nothing at all. */
@media (max-width: 620px) {
  #controls { width: 178px; padding: 8px 9px 10px; gap: 6px; font-size: 11px; }
  /* Reserving 284 px beside the bar leaves nothing on a phone, so the readout goes ABOVE it
     instead and the strip grows a bar's height of bottom padding. The gradient still runs to the
     bottom of the window, so the bar and the info button sit on the dark end of it. */
  #sound { font-size: 10px; gap: 0 10px; padding: 6px 10px 38px 36px; }
  #sound .narrow-hide { display: none; }
  #tools { gap: 4px; }
  #tools button, #tools .num { padding: 5px 7px; font-size: 10px; }
  #btn-full { width: 26px; padding: 0; }
}
</style>

<canvas id="gl"></canvas>

<div id="controls" data-kind="plane" data-julia="0" data-info="0" data-aims="0">
  <select id="preset" aria-label="object"></select>
  <!-- What the machine is allowed to spend. Auto measures the frame time and steps itself down;
       anything else is the viewer's decision and is then left alone. -->
  <select id="quality" aria-label="quality">
    <option value="auto">Quality: auto</option>
    <option value="low">Quality: low</option>
    <option value="medium">Quality: medium</option>
    <option value="high">Quality: high</option>
  </select>
  <!-- Coarsen the cut until the individual splats are tens of pixels across and draw each one's
       one sigma contour. Works on every object, flat or not. This is here because every frame on
       this page is made of Gaussians and at a working split threshold not one of them is
       separable, which is what the refinement is for and is also why nobody has to believe it.
       Keyboard: g. -->
  <button id="btn-gauss" class="sw" type="button" role="switch" aria-checked="false"
          aria-label="show Gaussians"><span class="sw-l">Show Gaussians</span><span class="sw-t"></span><span class="sw-r" id="lb-gauss">off</span></button>
  <!-- The flight never stops, so the slowest setting is slow, not stopped. The square button to
       the left of the slider is what stops it, and it sits there rather than on its own row
       because a play control and a speed control are one thought. Keyboard: space. -->
  <div class="ctl-row">
    <button id="btn-run" data-on="1" type="button" aria-label="pause">&#9208;</button>
    <!-- Back to how this object opened: its own camera, its own rendering parameters, the default
         speed, the descent running. It sits with the play control because both are transport, and
         because after a long descent the way back is otherwise a page reload, which also loses the
         object. Keyboard: r. -->
    <button id="btn-reset" type="button" aria-label="reset the view"
            title="Reset this object's view and settings">&#8635;</button>
    <label class="ctl"><span>speed</span><output id="v-rate" class="edit" contenteditable="true"
             inputmode="decimal" spellcheck="false" role="textbox" tabindex="0"
             title="click to type a speed">-</output>
      <!-- The range is the slider's POSITION, not the speed: the scale is linear to 2 and
           geometric to 64 above it, and both pieces are in spdFromPos in src/70_ui.js. -->
      <span class="trk"><input id="s-rate" type="range" min="0" max="1" step="0.001"
             aria-label="speed"><i class="tick"></i></span></label>
  </div>
  <!-- Where the descent aims, for the objects that name more than one place worth falling into.
       The order is interior, boundary, tip: the default is the one that keeps structure on every
       side of the frame, and this walks out to the ones that do not, which is the whole point of
       offering it. Measured, not chosen by eye; see the note above IFS in src/20_ifs.js. Hangs
       under the transport row rather than the object picker: it is a jump cut in the same camera,
       so it reads as one more thing play/pause and reset do, not as a property of the object. -->
  <button id="btn-aim" type="button">New target</button>
  <label class="ctl plane-only"><span>exponent</span><output id="v-power">-</output>
    <input id="s-power" type="range" min="2" max="8" step="1" aria-label="exponent"></label>
  <!-- The family parameter, as two sliders on one line. c is ONE complex number and splitting it
       across two rows read as two unrelated settings. The ranges are the interesting ones and not
       the representable ones: outside about |c| = 1 every Julia set of this family is a totally
       disconnected dust that looks the same as the last one, so the sliders stop where the
       structure does. -->
  <div class="ctl-row julia-only">
    <label class="ctl"><span>re</span><output id="v-cx">-</output>
      <input id="s-cx" type="range" min="-1.45" max="0.42" step="0.001" aria-label="c real"></label>
    <label class="ctl"><span>im</span><output id="v-cy">-</output>
      <input id="s-cy" type="range" min="-0.95" max="0.95" step="0.001" aria-label="c imaginary"></label>
  </div>
  <!-- LAST, and on purpose. The same view, drawn the other way. It is not a fifth object and it is
       not in the object menu, because a menu entry cannot answer "is the splat render as good as a
       per pixel one": choosing it from a list reframes the camera, and then the two images are of
       different places. This keeps the camera, the aim, the zoom and the family parameter exactly
       where they are and swaps only the representation, so the comparison is a flicker between two
       frames of one view. It sits at the bottom because it is the last question anyone asks about a
       picture, after they have found a picture worth asking about. Keyboard: x. -->
  <button id="btn-rep" class="sw sw-mid plane-only" type="button" role="switch"
          aria-checked="false" aria-label="draw this view per pixel instead of as splats"><span class="sw-l">Splats</span><span class="sw-t"></span><span class="sw-r">Pixels</span></button>
</div>

<!-- Splat count, frame time and resolution, every time. That is a rule of this project rather
     than a feature of the page: a render with no numbers on it cannot be compared with anything.
     The second row says WHERE the work happens and what the cut cost, and it is behind the info
     button because it answers a question nobody has while watching. -->
<div id="sound">
  <span><i id="l-splats">splats</i> <b id="h-splats">-</b></span>
  <span><i>frame</i> <b id="h-ms">-</b></span>
  <span class="narrow-hide"><i>res</i> <b id="h-res">-</b></span>
  <span class="more"><i>object</i> <b id="h-object">-</b> &nbsp; <i>zoom</i> <b id="h-zoom">-</b>
    &nbsp; <i>fps</i> <b id="h-fps">-</b> &nbsp; <i>depth</i> <b id="h-depth">-</b>
    &nbsp; <i>pos err</i> <b id="h-err">-</b> &nbsp; <i>buffer</i> <b id="h-fmt">-</b></span>
  <span class="more"><i>cut</i> <b id="h-cut">-</b> &nbsp; <b id="h-extra">-</b></span>
  <span class="more"><i>raster</i> <b id="h-gpu">-</b></span>
  <!-- Shown only while an escape time object still has work to do. See progress() in
       src/70_ui.js for what the two states measure. -->
  <div id="prog" hidden><i id="prog-l">building</i><span class="track"><b id="prog-b"></b></span></div>
</div>
<button id="btn-info" type="button" aria-label="more numbers" title="more numbers">i</button>

<!-- The room's controls, at the corner opposite the object's panel. Auto switch walks a random
     order of the objects so the viewer can be left running on a projector; the escape time fields
     are not in that order, since a plane cut is hundreds of milliseconds to seconds against 8 to
     14 ms for an iterated function system and a timed switch would land on a frame still
     sharpening. Full screen is the browser's, not the project page's overlay. Hide UI leaves
     nothing but the render and itself. -->
<div id="tools">
  <button id="btn-auto" type="button" role="switch" aria-checked="false"
          title="Walk the objects in a random order, one every so many seconds">Auto switch</button>
  <span class="num"><output id="v-auto" contenteditable="true" inputmode="numeric"
        spellcheck="false" role="textbox" tabindex="0"
        title="Seconds on each object; click to type">60</output><i>s</i></span>
  <button id="btn-full" type="button" aria-label="full screen" title="Full screen">
    <svg class="fs-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <svg class="fs-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
    </svg>
  </button>
  <button id="btn-hide" type="button" aria-pressed="false"
          title="Hide everything but the render. Escape brings it back">Hide UI</button>
</div>

<!-- Captions for the two magnified squares. Positioned by loupeNote in src/70_ui.js's frame loop
     and hidden whenever the squares are not on screen. -->
<div id="loupe-note" hidden>
  <b class="lz" id="lz0"></b><b class="lz" id="lz1"></b>
  <span id="lcap">Reduced nr. of Gaussians for visibility</span>
</div>

<div id="nogl" hidden>
  This needs WebGL 2. Every current desktop browser has it; if you are seeing this,
  hardware acceleration is probably switched off.
</div>
